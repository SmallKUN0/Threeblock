<!DOCTYPE html>
<html lang="zh-CN">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
   <title>坤坤的 Sodium 方块 启动器</title>
   <style>
       /* ========== 全局重置 ========== */
       * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }

       html, body {
           width: 100%;
           height: 100%;
           background-color: #90EE90;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
           overflow: hidden;
           -webkit-tap-highlight-color: transparent;
       }

       /* ========== 主屏幕 ========== */
       #main-screen {
           width: 100%;
           height: 100%;
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: flex-start;
           padding-top: 18vh;
           position: relative;
       }

       .title {
           color: #FFFFFF;
           font-size: 2.2rem;
           font-weight: bold;
           text-align: center;
           margin-bottom: 40px;
           text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 40px rgba(255,255,255,0.6);
           line-height: 1.3;
           user-select: none;
           -webkit-user-select: none;
       }

       .title .emoji-fire {
           filter: brightness(3) saturate(0) drop-shadow(0 0 8px #FFFFFF) drop-shadow(0 0 16px #FFFFFF);
           display: inline-block;
       }

       /* ========== 通用按钮 ========== */
       .version-select-btn,
       .plugin-select-btn,
       .launch-btn {
           background: rgba(255,255,255,0.1);
           border: 2px solid #FFFFFF;
           color: #FFFFFF;
           border-radius: 10px;
           cursor: pointer;
           outline: none;
           height: 48px;
           line-height: 1;
           text-align: center;
           transition: all 0.15s ease;
           touch-action: manipulation;
           user-select: none;
           -webkit-user-select: none;
       }
       .version-select-btn:hover,
       .plugin-select-btn:hover,
       .launch-btn:hover {
           background: rgba(255,255,255,0.25);
       }
       .version-select-btn:active,
       .plugin-select-btn:active,
       .launch-btn:active {
           background: rgba(255,255,255,0.4);
           transform: scale(0.96);
       }

       .version-select-btn {
           font-size: 1.1rem;
           padding: 12px 24px;
           margin-bottom: 12px;
           min-width: 220px;
       }

       .plugin-select-btn {
           font-size: 1.1rem;
           padding: 12px 24px;
           margin-bottom: 25px;
           min-width: 220px;
       }

       .launch-btn {
           font-size: 1.2rem;
           font-weight: 600;
           padding: 12px 50px;
       }

       .copyright-text {
           color: #FFFFFF;
           font-size: 0.85rem;
           text-align: center;
           margin-top: 16px;
           text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px rgba(255,255,255,0.5);
           user-select: none;
           -webkit-user-select: none;
           opacity: 0.9;
       }

       /* ========== 右上角工具按钮 ========== */
       .top-right-btn {
           position: absolute;
           top: 16px;
           right: 16px;
           background: rgba(255,255,255,0.15);
           border: 2px solid #FFFFFF;
           color: #FFFFFF;
           font-size: 0.85rem;
           font-weight: 600;
           padding: 8px 16px;
           border-radius: 8px;
           cursor: pointer;
           transition: all 0.15s ease;
           user-select: none;
           -webkit-user-select: none;
           touch-action: manipulation;
           z-index: 10;
       }
       .top-right-btn:hover {
           background: rgba(255,255,255,0.3);
       }
       .top-right-btn:active {
           background: rgba(255,255,255,0.45);
           transform: scale(0.95);
       }

       .load-resource-btn {
           position: absolute;
           top: 60px;
           right: 16px;
           background: rgba(255,255,255,0.15);
           border: 2px solid #FFFFFF;
           color: #FFFFFF;
           font-size: 0.85rem;
           font-weight: 600;
           padding: 8px 16px;
           border-radius: 8px;
           cursor: pointer;
           transition: all 0.15s ease;
           user-select: none;
           -webkit-user-select: none;
           touch-action: manipulation;
           z-index: 10;
       }
       .load-resource-btn:hover {
           background: rgba(255,255,255,0.3);
       }
       .load-resource-btn:active {
           background: rgba(255,255,255,0.45);
           transform: scale(0.95);
       }

       /* ========== 加载遮罩 ========== */
       #loading-screen {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background-color: #90EE90;
           display: none;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           opacity: 0;
           transition: opacity 0.3s ease;
           z-index: 100;
       }
       #loading-screen.show {
           opacity: 1;
       }

       .studio-name {
           color: #FFFFFF;
           font-size: 2.8rem;
           font-weight: bold;
           text-shadow: 0 0 30px rgba(255,255,255,1), 0 0 60px rgba(255,255,255,0.7);
           margin-bottom: 25px;
           text-align: center;
           user-select: none;
           -webkit-user-select: none;
       }

       .loading-text {
           color: #FFFFFF;
           font-size: 1.15rem;
           text-shadow: 0 0 12px rgba(255,255,255,0.9);
           text-align: center;
           user-select: none;
           -webkit-user-select: none;
       }

       /* ========== 游戏容器（iframe 嵌入） ========== */
       #game-container {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           display: none;
           z-index: 50;
           background: #000;
       }
       #game-frame {
           width: 100%;
           height: 100%;
           border: none;
       }

       /* ========== 悬浮退出球 ========== */
       #float-ball {
           position: fixed;
           left: 50%;
           top: 50%;
           transform: translate(-50%, -50%);
           width: 80px;
           height: 80px;
           border-radius: 50%;
           background: rgba(255,255,255,0.15);
           border: 2px solid #FFFFFF;
           color: #FFFFFF;
           font-size: 0.85rem;
           font-weight: bold;
           display: none;
           align-items: center;
           justify-content: center;
           text-align: center;
           cursor: pointer;
           z-index: 200;
           user-select: none;
           -webkit-user-select: none;
           touch-action: none;
           box-shadow: 0 0 15px rgba(255,255,255,0.3);
           backdrop-filter: blur(4px);
           -webkit-backdrop-filter: blur(4px);
           line-height: 1.2;
           padding: 4px;
       }
       #float-ball.dragging {
           opacity: 0.8;
           cursor: grabbing;
       }

       /* ========== 退出确认弹窗 ========== */
       #confirm-modal {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background: rgba(0,0,0,0.5);
           display: none;
           align-items: center;
           justify-content: center;
           z-index: 300;
       }
       .modal-content {
           background: rgba(255,255,255,0.95);
           border-radius: 16px;
           padding: 30px 40px;
           text-align: center;
           min-width: 260px;
           box-shadow: 0 10px 40px rgba(0,0,0,0.3);
       }
       .modal-text {
           color: #333;
           font-size: 1.2rem;
           font-weight: 600;
           margin-bottom: 25px;
       }
       .modal-btns {
           display: flex;
           gap: 15px;
           justify-content: center;
       }
       .modal-btn {
           padding: 10px 30px;
           border-radius: 8px;
           border: none;
           font-size: 1rem;
           font-weight: 600;
           cursor: pointer;
           transition: all 0.15s;
           height: 42px;
           line-height: 1;
           user-select: none;
           -webkit-user-select: none;
           touch-action: manipulation;
       }
       .btn-yes {
           background: #ff4444;
           color: #FFFFFF;
       }
       .btn-yes:hover { background: #ff2222; }
       .btn-no {
           background: #e0e0e0;
           color: #333;
       }
       .btn-no:hover { background: #d0d0d0; }

       /* ========== 通用信息弹窗（白底黑框） ========== */
       .info-modal {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background: rgba(0,0,0,0.5);
           display: none;
           align-items: center;
           justify-content: center;
           z-index: 350;
       }
       .info-modal-content {
           background: #FFFFFF;
           border: 2px solid #000000;
           border-radius: 12px;
           padding: 28px 32px;
           text-align: center;
           max-width: 320px;
           width: 85%;
           box-shadow: 0 8px 32px rgba(0,0,0,0.25);
       }
       .info-modal-text {
           color: #000000;
           font-size: 1.05rem;
           font-weight: 500;
           margin-bottom: 24px;
           line-height: 1.6;
       }
       .info-modal-btn {
           background: #000000;
           color: #FFFFFF;
           font-size: 1rem;
           font-weight: 600;
           padding: 10px 36px;
           border-radius: 8px;
           border: none;
           cursor: pointer;
           transition: all 0.15s;
           user-select: none;
           -webkit-user-select: none;
           touch-action: manipulation;
       }
       .info-modal-btn:hover { background: #333333; }
       .info-modal-btn:active { transform: scale(0.96); }

       /* ========== 版本选择界面 ========== */
       #version-picker {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background-color: #90EE90;
           display: none;
           flex-direction: column;
           z-index: 400;
           overflow: hidden;
       }

       /* ========== 插件选择界面 ========== */
       #plugin-picker {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background-color: #90EE90;
           display: none;
           flex-direction: column;
           z-index: 400;
           overflow: hidden;
       }

       .picker-header {
           padding: 16px;
           text-align: center;
           border-bottom: 1px solid rgba(255,255,255,0.3);
           flex-shrink: 0;
       }
       .picker-cancel-btn {
           background: rgba(255,255,255,0.15);
           border: 2px solid #FFFFFF;
           color: #FFFFFF;
           font-size: 1rem;
           font-weight: 600;
           padding: 10px 32px;
           border-radius: 10px;
           cursor: pointer;
           transition: all 0.15s ease;
           user-select: none;
           -webkit-user-select: none;
           touch-action: manipulation;
       }
       .picker-cancel-btn:hover { background: rgba(255,255,255,0.3); }
       .picker-cancel-btn:active {
           background: rgba(255,255,255,0.45);
           transform: scale(0.95);
       }

       .picker-list {
           flex: 1;
           overflow-y: auto;
           -webkit-overflow-scrolling: touch;
           padding: 8px 0;
       }
       .picker-item {
           color: #FFFFFF;
           font-size: 1.15rem;
           font-weight: 500;
           text-align: center;
           padding: 16px 20px;
           cursor: pointer;
           user-select: none;
           -webkit-user-select: none;
           touch-action: manipulation;
           position: relative;
           transition: background 0.1s;
       }
       .picker-item:hover { background: rgba(255,255,255,0.1); }
       .picker-item:active { background: rgba(255,255,255,0.2); }
       .picker-item::after {
           content: "";
           position: absolute;
           bottom: 0;
           left: 15%;
           width: 70%;
           height: 1px;
           background: rgba(255,255,255,0.6);
       }
       .picker-item:last-child::after { display: none; }
       .picker-item.selected { background: rgba(255,255,255,0.2); }

       /* ========== 资源加载界面 ========== */
       #resource-loader {
           position: fixed;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           background-color: #90EE90;
           display: none;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           z-index: 400;
       }
       .loader-cancel-btn {
           position: absolute;
           top: 16px;
           right: 16px;
           background: rgba(255,255,255,0.15);
           border: 2px solid #FFFFFF;
           color: #FFFFFF;
           font-size: 0.9rem;
           font-weight: 600;
           padding: 8px 20px;
           border-radius: 8px;
           cursor: pointer;
           transition: all 0.15s ease;
           user-select: none;
           -webkit-user-select: none;
           touch-action: manipulation;
           z-index: 10;
       }
       .loader-cancel-btn:hover { background: rgba(255,255,255,0.3); }
       .loader-cancel-btn:active {
           background: rgba(255,255,255,0.45);
           transform: scale(0.95);
       }
       .loader-title {
           color: #FFFFFF;
           font-size: 1.3rem;
           font-weight: bold;
           text-shadow: 0 0 15px rgba(255,255,255,0.8);
           margin-bottom: 30px;
           text-align: center;
           user-select: none;
           -webkit-user-select: none;
       }
       .progress-bar-container {
           width: 70%;
           max-width: 320px;
           height: 12px;
           background: rgba(255,255,255,0.2);
           border-radius: 6px;
           overflow: hidden;
           margin-bottom: 20px;
           border: 1px solid rgba(255,255,255,0.4);
       }
       .progress-bar-fill {
           height: 100%;
           background: #FFFFFF;
           border-radius: 6px;
           width: 0%;
           transition: width 0.2s ease;
           box-shadow: 0 0 10px rgba(255,255,255,0.6);
       }
       .loader-current-file {
           color: #FFFFFF;
           font-size: 1rem;
           text-shadow: 0 0 10px rgba(255,255,255,0.7);
           text-align: center;
           min-height: 1.5rem;
           user-select: none;
           -webkit-user-select: none;
       }
       .loader-status {
           color: #FFFFFF;
           font-size: 0.9rem;
           text-shadow: 0 0 8px rgba(255,255,255,0.6);
           text-align: center;
           margin-top: 12px;
           opacity: 0.8;
           user-select: none;
           -webkit-user-select: none;
       }
   </style>
</head>
<body>

   <!-- ========== 主屏幕 ========== -->
   <div id="main-screen">
       <!-- 右上角工具按钮 -->
       <button class="top-right-btn" id="clearCacheBtn">清理缓存</button>
       <button class="load-resource-btn" id="loadResourceBtn">加载资源</button>

       <!-- 标题 -->
       <div class="title">Sodium <span class="emoji-fire">🔥</span> 方块 启动器 2.0</div>

       <!-- 版本选择按钮（点击弹出列表） -->
       <button class="version-select-btn" id="versionSelectBtn">1.5.5</button>

       <!-- 插件选择按钮（点击弹出列表） -->
       <button class="plugin-select-btn" id="pluginSelectBtn">插件</button>

       <!-- 启动按钮 -->
       <button class="launch-btn" id="launchBtn">启动</button>

       <!-- 版权信息 -->
       <div class="copyright-text">版权所有：坤坤工作室/团体   禁止二次分发</div>
   </div>

   <!-- ========== 加载遮罩 ========== -->
   <div id="loading-screen">
       <div class="studio-name">🏀坤坤工作室</div>
       <div class="loading-text" id="loadingText">检查依赖……</div>
   </div>

   <!-- ========== 游戏容器（嵌入 iframe） ========== -->
   <div id="game-container">
       <iframe id="game-frame" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe>
   </div>

   <!-- ========== 悬浮退出球 ========== -->
   <div id="float-ball">长按<br>退出</div>

   <!-- ========== 退出确认弹窗 ========== -->
   <div id="confirm-modal">
       <div class="modal-content">
           <div class="modal-text">是否退出</div>
           <div class="modal-btns">
               <button class="modal-btn btn-yes" id="btnYes">是</button>
               <button class="modal-btn btn-no" id="btnNo">否</button>
           </div>
       </div>
   </div>

   <!-- ========== 2.0 更新提示弹窗 ========== -->
   <div class="info-modal" id="updateModal">
       <div class="info-modal-content">
           <div class="info-modal-text">欢迎，本次的2.3版本更新了末地世界和第4个维度，祝你们玩得开心</div>
           <button class="info-modal-btn" id="updateModalBtn">开始体验</button>
       </div>
   </div>

   <!-- ========== 清理缓存成功弹窗 ========== -->
   <div class="info-modal" id="clearSuccessModal">
       <div class="info-modal-content">
           <div class="info-modal-text">缓存清理成功！</div>
           <button class="info-modal-btn" id="clearSuccessModalBtn">确定</button>
       </div>
   </div>

   <!-- ========== 版本选择界面 ========== -->
   <div id="version-picker">
       <div class="picker-header">
           <button class="picker-cancel-btn" id="pickerCancelBtn">取消</button>
       </div>
       <div class="picker-list" id="pickerList"></div>
   </div>

   <!-- ========== 插件选择界面 ========== -->
   <div id="plugin-picker">
       <div class="picker-header">
           <button class="picker-cancel-btn" id="pluginPickerCancelBtn">完成</button>
       </div>
       <div class="picker-list" id="pluginPickerList"></div>
   </div>

   <!-- ========== 资源加载界面 ========== -->
   <div id="resource-loader">
       <button class="loader-cancel-btn" id="loaderCancelBtn">取消</button>
       <div class="loader-title">正在加载PNG资源……</div>
       <div class="progress-bar-container">
           <div class="progress-bar-fill" id="progressBarFill"></div>
       </div>
       <div class="loader-current-file" id="loaderCurrentFile"></div>
       <div class="loader-status" id="loaderStatus"></div>
   </div>

   <!-- ========== JavaScript 脚本 ========== -->
   <script>
       // ====================================================================
       //  1. DOM 元素引用
       // ====================================================================
       const versionSelectBtn = document.getElementById('versionSelectBtn');
       const launchBtn = document.getElementById('launchBtn');
       const mainScreen = document.getElementById('main-screen');
       const loadingScreen = document.getElementById('loading-screen');
       const loadingText = document.getElementById('loadingText');
       const gameContainer = document.getElementById('game-container');
       const gameFrame = document.getElementById('game-frame');
       const floatBall = document.getElementById('float-ball');
       const confirmModal = document.getElementById('confirm-modal');
       const btnYes = document.getElementById('btnYes');
       const btnNo = document.getElementById('btnNo');
       const clearCacheBtn = document.getElementById('clearCacheBtn');
       const loadResourceBtn = document.getElementById('loadResourceBtn');
       const updateModal = document.getElementById('updateModal');
       const updateModalBtn = document.getElementById('updateModalBtn');
       const clearSuccessModal = document.getElementById('clearSuccessModal');
       const clearSuccessModalBtn = document.getElementById('clearSuccessModalBtn');
       const versionPicker = document.getElementById('version-picker');
       const pickerList = document.getElementById('pickerList');
       const pickerCancelBtn = document.getElementById('pickerCancelBtn');
       const resourceLoader = document.getElementById('resource-loader');
       const progressBarFill = document.getElementById('progressBarFill');
       const loaderCurrentFile = document.getElementById('loaderCurrentFile');
       const loaderStatus = document.getElementById('loaderStatus');
       const loaderCancelBtn = document.getElementById('loaderCancelBtn');

       // 插件相关 DOM
       const pluginSelectBtn = document.getElementById('pluginSelectBtn');
       const pluginPicker = document.getElementById('plugin-picker');
       const pluginPickerList = document.getElementById('pluginPickerList');
       const pluginPickerCancelBtn = document.getElementById('pluginPickerCancelBtn');

       // ====================================================================
       //  2. 版本数据
       // ====================================================================
       // 所有可启动的游戏版本列表，每个对象包含显示名称和对应的 HTML 文件名
       const versionData = [
           { name: '2.3', file: 'Three2.3.html' },
           { name: '1.5.6', file: 'Three1.5.6.html' },
           { name: '1.5.5', file: 'Three1.5.5.html' },
           { name: '1.5', file: 'Three1.5.html' },
           { name: '1.4', file: 'Three1.4.html' },
           { name: '1.2', file: 'Three1.2.html' },
           { name: 'Sodium1.5.5区块渲染器', file: 'Sodium1.5.5.html' },
           { name: '番外-溶洞2.0', file: 'Cave2.0.html' },
           { name: '番外-后室1.4', file: 'backrooms1.4.html' },
           { name: '后室0', file: 'Level0.html' },
           { name: '后室1', file: 'Level1.html' },
           { name: '后室2', file: 'Level2.html' },
           { name: '后室3', file: 'Level3.html' },
           { name: '番外-解压打击球', file: 'hurtkimi3.0.html' },
           { name: '坤坤大战 2.0', file: 'FightChicken.html' },
           { name: '开放激战1.0', file: 'FightPlayer.html' },
           { name: '八番列车 1.0', file: 'EightTrain.html' },
           { name: '台球 1.0', file: 'TableBall1.0.html' }
       ];

       // ====================================================================
       //  3. 插件系统
       // ====================================================================
       // 插件定义：id 作为唯一标识，name 显示名称，desc 描述
       const pluginData = [
           { id: 'landscape', name: '横屏插件', desc: '将所有可启动文件的容器旋转90度' },
           { id: 'fullscreen', name: '撑满全屏', desc: '将所有可启动文件的容器检测设备比例并调整自身比例' }
       ];
       let activePlugins = new Set();          // 当前激活的插件 ID 集合

       let currentVersionIndex = 0;            // 当前选中的版本在 versionData 中的索引
       let isLaunching = false;               // 防止重复点击启动
       let isLoadingResources = false;        // 资源加载状态
       let resourceAbortController = null;    // 用于取消资源加载的 AbortController

       // ====================================================================
       //  4. 纹理资源预缓存（用于游戏内贴图，提高加载速度）
       // ====================================================================
       const TEXTURE_BASE_URL = 'https://cdn.jsdmirror.com/gh/Faithful-Pack/Default-Java@1.21.11/assets/minecraft/textures/block/';
       const textureList = [
           { display: '土块', file: 'dirt.png' },
           { display: '石头', file: 'stone.png' },
           { display: '基岩', file: 'bedrock.png' },
           { display: '橡木原木顶面', file: 'oak_log_top.png' },
           { display: '橡木原木侧面', file: 'oak_log.png' },
           { display: '下界岩', file: 'netherrack.png' },
           { display: '诡异菌柄顶面', file: 'warped_stem_top.png' },
           { display: '诡异菌柄侧面', file: 'warped_stem.png' },
           { display: '绯红菌柄顶面', file: 'crimson_stem_top.png' },
           { display: '绯红菌柄侧面', file: 'crimson_stem.png' },
           { display: '诡异树叶', file: 'warped_wart_block.png' },
           { display: '绯红树叶', file: 'nether_wart_block.png' },
           { display: '诡异菌岩顶面', file: 'warped_nylium_top.png' },
           { display: '诡异菌岩侧面', file: 'warped_nylium_side.png' },
           { display: '绯红菌岩顶面', file: 'crimson_nylium_top.png' },
           { display: '绯红菌岩侧面', file: 'crimson_nylium_side.png' },
           { display: '黑曜石', file: 'obsidian.png' },
           { display: 'TNT顶面', file: 'tnt_top.png' },
           { display: 'TNT底面', file: 'tnt_bottom.png' },
           { display: 'TNT侧面', file: 'tnt_side.png' },
           { display: '橡树树叶', file: 'oak_leaves.png' },
           { display: '草方块顶面', file: 'grass_block_top.png' },
           { display: '草方块侧面', file: 'grass_block_side.png' }
       ];

       // ====================================================================
       //  5. 初始化界面状态
       // ====================================================================
       versionSelectBtn.textContent = versionData[currentVersionIndex].name;
       updatePluginBtnText();   // 更新插件按钮文字（显示激活数量）

       // ====================================================================
       //  6. 更新提示（首次打开显示 2.0 更新内容）
       // ====================================================================
       function checkUpdateNotice() {
           try {
               const notified = localStorage.getItem('2.0更新提示已通知');
               if (!notified) {
                   updateModal.style.display = 'flex';
               }
           } catch (e) {
               console.warn('localStorage不可用');
           }
       }
       window.addEventListener('load', checkUpdateNotice);

       // 更新提示弹窗按钮事件
       function onUpdateModalBtnClick(e) {
           if (e && e.type === 'touchstart') e.preventDefault();
           try {
               localStorage.setItem('2.0更新提示已通知', 'true');
           } catch (e) {
               console.warn('localStorage写入失败');
           }
           updateModal.style.display = 'none';
       }
       updateModalBtn.addEventListener('click', onUpdateModalBtnClick);
       updateModalBtn.addEventListener('touchstart', onUpdateModalBtnClick, { passive: false });

       // ====================================================================
       //  7. 清理缓存（清空 localStorage）
       // ====================================================================
       function onClearSuccessBtnClick(e) {
           if (e && e.type === 'touchstart') e.preventDefault();
           clearSuccessModal.style.display = 'none';
       }
       clearSuccessModalBtn.addEventListener('click', onClearSuccessBtnClick);
       clearSuccessModalBtn.addEventListener('touchstart', onClearSuccessBtnClick, { passive: false });

       function clearAllCache(e) {
           if (e && e.type === 'touchstart') e.preventDefault();
           try {
               localStorage.clear();
               clearSuccessModal.style.display = 'flex';
           } catch (err) {
               alert('清理缓存失败: ' + err.message);
           }
       }
       clearCacheBtn.addEventListener('click', clearAllCache);
       clearCacheBtn.addEventListener('touchstart', clearAllCache, { passive: false });

       // ====================================================================
       //  8. 版本选择器（点击弹出列表）
       // ====================================================================
       function openVersionPicker() {
           pickerList.innerHTML = '';
           versionData.forEach((v, idx) => {
               const item = document.createElement('div');
               item.className = 'picker-item';
               item.textContent = v.name;
               if (idx === currentVersionIndex) {
                   item.classList.add('selected');
               }

               // 处理点击/触摸选择
               let startTime = 0, startY = 0, hasMoved = false;
               function onPointerDown(ev) {
                   const pos = getClientPos(ev);
                   startTime = Date.now();
                   startY = pos.y;
                   hasMoved = false;
               }
               function onPointerMove(ev) {
                   const pos = getClientPos(ev);
                   if (Math.abs(pos.y - startY) > 10) hasMoved = true;
               }
               function onPointerUp(ev) {
                   const dt = Date.now() - startTime;
                   if (!hasMoved && dt < 200) {
                       ev.preventDefault && ev.preventDefault();
                       ev.stopPropagation && ev.stopPropagation();
                       selectVersion(idx);
                   }
               }
               item.addEventListener('mousedown', onPointerDown);
               item.addEventListener('mousemove', onPointerMove);
               item.addEventListener('mouseup', onPointerUp);
               item.addEventListener('touchstart', onPointerDown, { passive: true });
               item.addEventListener('touchmove', onPointerMove, { passive: true });
               item.addEventListener('touchend', (ev) => {
                   ev.preventDefault();
                   onPointerUp(ev);
               }, { passive: false });

               pickerList.appendChild(item);
           });
           versionPicker.style.display = 'flex';
       }

       function selectVersion(index) {
           currentVersionIndex = index;
           versionSelectBtn.textContent = versionData[index].name;
           versionPicker.style.display = 'none';
       }

       function closeVersionPicker() {
           versionPicker.style.display = 'none';
       }

       versionSelectBtn.addEventListener('click', openVersionPicker);
       versionSelectBtn.addEventListener('touchstart', (e) => { e.preventDefault(); openVersionPicker(); }, { passive: false });
       pickerCancelBtn.addEventListener('click', closeVersionPicker);
       pickerCancelBtn.addEventListener('touchstart', (e) => { e.preventDefault(); closeVersionPicker(); }, { passive: false });

       // ====================================================================
       //  9. 插件选择器
       // ====================================================================
       function updatePluginBtnText() {
           const count = activePlugins.size;
           pluginSelectBtn.textContent = count > 0 ? '插件 (' + count + ')' : '插件';
       }

       function openPluginPicker() {
           pluginPickerList.innerHTML = '';
           pluginData.forEach((p) => {
               const item = document.createElement('div');
               item.className = 'picker-item';
               item.style.display = 'flex';
               item.style.justifyContent = 'space-between';
               item.style.alignItems = 'center';
               item.style.paddingLeft = '24px';
               item.style.paddingRight = '24px';

               const left = document.createElement('div');
               left.style.display = 'flex';
               left.style.flexDirection = 'column';
               left.style.alignItems = 'flex-start';

               const nameSpan = document.createElement('span');
               nameSpan.textContent = p.name;
               nameSpan.style.fontSize = '1.15rem';
               nameSpan.style.fontWeight = '500';

               const descSpan = document.createElement('span');
               descSpan.textContent = p.desc;
               descSpan.style.fontSize = '0.8rem';
               descSpan.style.opacity = '0.8';
               descSpan.style.marginTop = '4px';

               left.appendChild(nameSpan);
               left.appendChild(descSpan);

               const checkSpan = document.createElement('span');
               checkSpan.textContent = activePlugins.has(p.id) ? '✓' : '';
               checkSpan.style.fontSize = '1.4rem';
               checkSpan.style.fontWeight = 'bold';
               checkSpan.style.minWidth = '30px';
               checkSpan.style.textAlign = 'center';

               item.appendChild(left);
               item.appendChild(checkSpan);

               // 点击切换激活状态
               let startTime = 0, startY = 0, hasMoved = false;
               function onPointerDown(ev) {
                   const pos = getClientPos(ev);
                   startTime = Date.now();
                   startY = pos.y;
                   hasMoved = false;
               }
               function onPointerMove(ev) {
                   const pos = getClientPos(ev);
                   if (Math.abs(pos.y - startY) > 10) hasMoved = true;
               }
               function onPointerUp(ev) {
                   const dt = Date.now() - startTime;
                   if (!hasMoved && dt < 200) {
                       ev.preventDefault && ev.preventDefault();
                       ev.stopPropagation && ev.stopPropagation();
                       if (activePlugins.has(p.id)) {
                           activePlugins.delete(p.id);
                           checkSpan.textContent = '';
                       } else {
                           activePlugins.add(p.id);
                           checkSpan.textContent = '✓';
                       }
                       updatePluginBtnText();
                   }
               }
               item.addEventListener('mousedown', onPointerDown);
               item.addEventListener('mousemove', onPointerMove);
               item.addEventListener('mouseup', onPointerUp);
               item.addEventListener('touchstart', onPointerDown, { passive: true });
               item.addEventListener('touchmove', onPointerMove, { passive: true });
               item.addEventListener('touchend', (ev) => {
                   ev.preventDefault();
                   onPointerUp(ev);
               }, { passive: false });

               pluginPickerList.appendChild(item);
           });
           pluginPicker.style.display = 'flex';
       }

       function closePluginPicker() {
           pluginPicker.style.display = 'none';
       }

       pluginSelectBtn.addEventListener('click', openPluginPicker);
       pluginSelectBtn.addEventListener('touchstart', (e) => { e.preventDefault(); openPluginPicker(); }, { passive: false });
       pluginPickerCancelBtn.addEventListener('click', closePluginPicker);
       pluginPickerCancelBtn.addEventListener('touchstart', (e) => { e.preventDefault(); closePluginPicker(); }, { passive: false });

       // ====================================================================
       //  10. 插件效果应用（修改 iframe 容器样式）
       // ====================================================================
       function applyPlugins() {
           const isLandscape = activePlugins.has('landscape');
           const isFullscreen = activePlugins.has('fullscreen');

           // 重置所有样式
           gameContainer.style.width = '';
           gameContainer.style.height = '';
           gameContainer.style.left = '';
           gameContainer.style.top = '';
           gameContainer.style.transform = '';
           gameContainer.style.overflow = '';
           gameFrame.style.width = '';
           gameFrame.style.height = '';

           if (isLandscape) {
               // 横屏：容器宽高互换，旋转 90°
               const w = window.innerWidth;
               const h = window.innerHeight;
               gameContainer.style.width = h + 'px';
               gameContainer.style.height = w + 'px';
               gameContainer.style.left = ((w - h) / 2) + 'px';
               gameContainer.style.top = ((h - w) / 2) + 'px';
               gameContainer.style.transform = 'rotate(90deg)';
           }

           if (isFullscreen) {
               // 撑满全屏：强制容器和 iframe 填满视口
               gameContainer.style.overflow = 'hidden';
               if (!isLandscape) {
                   gameContainer.style.width = '100vw';
                   gameContainer.style.height = '100vh';
                   gameContainer.style.left = '0';
                   gameContainer.style.top = '0';
               }
               gameFrame.style.width = '100%';
               gameFrame.style.height = '100%';
           }
       }

       // ====================================================================
       //  11. 资源预加载（将纹理图片转为 base64 缓存到 localStorage）
       // ====================================================================
       function blobToBase64(blob) {
           return new Promise((resolve, reject) => {
               const reader = new FileReader();
               reader.onloadend = () => resolve(reader.result);
               reader.onerror = reject;
               reader.readAsDataURL(blob);
           });
       }

       async function loadResources() {
           if (isLoadingResources) return;
           isLoadingResources = true;
           resourceAbortController = new AbortController();
           const signal = resourceAbortController.signal;

           resourceLoader.style.display = 'flex';
           progressBarFill.style.width = '0%';
           loaderCurrentFile.textContent = '';
           loaderStatus.textContent = '';

           const total = textureList.length;
           const cachedData = {};
           let successCount = 0, failCount = 0;

           for (let i = 0; i < total; i++) {
               if (signal.aborted) {
                   loaderStatus.textContent = '已取消';
                   isLoadingResources = false;
                   return;
               }

               const tex = textureList[i];
               loaderCurrentFile.textContent = '正在缓存：' + tex.display;
               progressBarFill.style.width = Math.round(((i) / total) * 100) + '%';

               try {
                   const url = TEXTURE_BASE_URL + tex.file;
                   const response = await fetch(url, { signal });
                   if (!response.ok) throw new Error('HTTP ' + response.status);
                   const blob = await response.blob();
                   const base64 = await blobToBase64(blob);
                   cachedData[tex.file] = base64;
                   successCount++;
               } catch (err) {
                   if (signal.aborted) {
                       loaderStatus.textContent = '已取消';
                       isLoadingResources = false;
                       return;
                   }
                   failCount++;
                   console.warn('加载失败:', tex.file, err.message);
               }
           }

           progressBarFill.style.width = '100%';
           loaderCurrentFile.textContent = '';

           try {
               localStorage.setItem('kk_textures', JSON.stringify(cachedData));
               loaderStatus.textContent = '加载完成！成功 ' + successCount + ' 个' + (failCount > 0 ? '，失败 ' + failCount + ' 个' : '');
           } catch (err) {
               loaderStatus.textContent = '缓存保存失败: ' + err.message;
           }

           setTimeout(() => {
               resourceLoader.style.display = 'none';
               isLoadingResources = false;
               resourceAbortController = null;
           }, 1500);
       }

       function cancelLoadResources() {
           if (resourceAbortController) {
               resourceAbortController.abort();
           }
           resourceLoader.style.display = 'none';
           isLoadingResources = false;
           resourceAbortController = null;
       }

       loadResourceBtn.addEventListener('click', loadResources);
       loadResourceBtn.addEventListener('touchstart', (e) => { e.preventDefault(); loadResources(); }, { passive: false });
       loaderCancelBtn.addEventListener('click', cancelLoadResources);
       loaderCancelBtn.addEventListener('touchstart', (e) => { e.preventDefault(); cancelLoadResources(); }, { passive: false });

       // ====================================================================
       //  12. 启动 / 退出核心逻辑
       // ====================================================================

       // 重置到主屏幕（关闭游戏，清理 iframe）
       function resetToMain() {
           gameFrame.src = '';                     // 清空 iframe，释放资源
           gameContainer.style.display = 'none';
           floatBall.style.display = 'none';
           loadingScreen.style.display = 'none';
           loadingScreen.classList.remove('show');
           mainScreen.style.display = 'flex';
           isLaunching = false;
           // 清除插件样式
           gameContainer.style.width = '';
           gameContainer.style.height = '';
           gameContainer.style.left = '';
           gameContainer.style.top = '';
           gameContainer.style.transform = '';
           gameContainer.style.overflow = '';
           gameFrame.style.width = '';
           gameFrame.style.height = '';
       }

       // 启动按钮处理
       function handleLaunch(e) {
           if (isLaunching) return;
           isLaunching = true;
           if (e && e.type === 'touchstart') e.preventDefault();

           // 隐藏主屏，显示加载动画
           mainScreen.style.display = 'none';
           loadingScreen.style.display = 'flex';
           void loadingScreen.offsetWidth;          // 强制回流，确保过渡生效
           loadingScreen.classList.add('show');

           const version = versionData[currentVersionIndex];

           // 模拟依赖检查，延迟后加载游戏
           setTimeout(() => {
               loadingText.textContent = '检查依赖……（随后3s后开始正转）';
               setTimeout(() => {
                   loadingScreen.style.display = 'none';
                   loadingScreen.classList.remove('show');

                   if (version && version.file) {
                       // 在 iframe 中加载对应的游戏 HTML
                       gameFrame.src = 'game/' + version.file;
                       gameContainer.style.display = 'block';
                       floatBall.style.display = 'flex';
                       applyPlugins();              // 应用当前激活的插件
                   }
               }, 3000);
           }, 50);
       }

       launchBtn.addEventListener('click', handleLaunch);
       launchBtn.addEventListener('mousedown', handleLaunch);
       launchBtn.addEventListener('touchstart', handleLaunch, { passive: false });

       // ====================================================================
       //  13. 悬浮球（长按退出 & 拖动）
       // ====================================================================
       let dragState = {
           isDragging: false,
           startX: 0, startY: 0,
           ballLeft: 0, ballTop: 0,
           startTime: 0,
           hasMoved: false,
           longPressTimer: null
       };

       const LONG_PRESS_TIME = 800;     // 长按触发退出（毫秒）
       const MOVE_THRESHOLD = 10;       // 拖动阈值（像素）

       function getClientPos(e) {
           if (e.touches && e.touches.length > 0) {
               return { x: e.touches[0].clientX, y: e.touches[0].clientY };
           }
           return { x: e.clientX, y: e.clientY };
       }

       // 按下悬浮球
       function onBallDown(e) {
           e.preventDefault();
           e.stopPropagation();
           const pos = getClientPos(e);
           const rect = floatBall.getBoundingClientRect();

           dragState.isDragging = true;
           dragState.hasMoved = false;
           dragState.startX = pos.x;
           dragState.startY = pos.y;
           dragState.ballLeft = rect.left;
           dragState.ballTop = rect.top;
           dragState.startTime = Date.now();

           floatBall.classList.add('dragging');

           // 启动长按定时器（若未移动则触发退出）
           dragState.longPressTimer = setTimeout(() => {
               if (dragState.isDragging && !dragState.hasMoved) {
                   dragState.isDragging = false;
                   floatBall.classList.remove('dragging');
                   resetToMain();
               }
           }, LONG_PRESS_TIME);
       }

       // 移动悬浮球
       function onBallMove(e) {
           if (!dragState.isDragging) return;
           const pos = getClientPos(e);
           const dx = pos.x - dragState.startX;
           const dy = pos.y - dragState.startY;

           if (Math.abs(dx) > MOVE_THRESHOLD || Math.abs(dy) > MOVE_THRESHOLD) {
               dragState.hasMoved = true;
               if (dragState.longPressTimer) {
                   clearTimeout(dragState.longPressTimer);
                   dragState.longPressTimer = null;
               }
           }

           floatBall.style.left = (dragState.ballLeft + dx) + 'px';
           floatBall.style.top = (dragState.ballTop + dy) + 'px';
           floatBall.style.transform = 'none';
       }

       // 释放悬浮球
       function onBallUp(e) {
           if (!dragState.isDragging) return;

           if (dragState.longPressTimer) {
               clearTimeout(dragState.longPressTimer);
               dragState.longPressTimer = null;
           }

           const wasDragging = dragState.isDragging;
           dragState.isDragging = false;
           floatBall.classList.remove('dragging');

           // 如果只是轻触（未移动且时间小于长按阈值），弹出确认框
           if (wasDragging && !dragState.hasMoved && (Date.now() - dragState.startTime < LONG_PRESS_TIME)) {
               confirmModal.style.display = 'flex';
           }
       }

       floatBall.addEventListener('mousedown', onBallDown);
       floatBall.addEventListener('touchstart', onBallDown, { passive: false });

       document.addEventListener('mousemove', onBallMove);
       document.addEventListener('touchmove', onBallMove, { passive: false });

       document.addEventListener('mouseup', onBallUp);
       document.addEventListener('touchend', onBallUp);

       // ====================================================================
       //  14. 确认弹窗按钮（是否退出）
       // ====================================================================
       function onYes(e) {
           if (e && e.type === 'touchstart') e.preventDefault();
           confirmModal.style.display = 'none';
           resetToMain();
       }

       function onNo(e) {
           if (e && e.type === 'touchstart') e.preventDefault();
           confirmModal.style.display = 'none';
       }

       btnYes.addEventListener('click', onYes);
       btnYes.addEventListener('mousedown', onYes);
       btnYes.addEventListener('touchstart', onYes, { passive: false });

       btnNo.addEventListener('click', onNo);
       btnNo.addEventListener('mousedown', onNo);
       btnNo.addEventListener('touchstart', onNo, { passive: false });

       // ====================================================================
       //  注意：本启动器已移除 Three GS 测试功能（原本位于右上角的测试按钮）
       //  所有相关代码（界面、样式、逻辑）均已被清理。
       // ====================================================================
   </script>
