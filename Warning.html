<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>警告</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .warning-title {
            color: #ff0000;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .warning-text {
            color: #ffffff;
            font-size: 1rem;
            line-height: 1.8;
            max-width: 700px;
            margin-bottom: 30px;
        }
        .warning-danger {
            color: #ff0000;
            font-size: 1.1rem;
            font-weight: bold;
            max-width: 700px;
            margin-bottom: 40px;
            line-height: 1.8;
        }
        .exit-text {
            color: #ffffff;
            font-size: 1.2rem;
            max-width: 700px;
            line-height: 1.8;
        }
        .author-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0000ff;
            color: #00aaff;
            padding: 10px 20px;
            text-decoration: none;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .author-link:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="warning-title">光/声敏性癫痫警告</div>
    
    <div class="warning-text">
        部分人群在听到特定频率的声音、共振声音，或看到特定的频闪、图像、光影时可能会癫痫发作。即使这个人没有癫痫病史或癫痫发作史
    </div>
    
    <div class="warning-danger">
        此网页可能对你造成不适，胆小者、心脑血管或神经或心理疾病患者慎重游玩
    </div>
    
    <div class="exit-text">
        如果你阅读完成并且慎重对待我们的提醒，那么你现在可以退出此网页
    </div>
    
    <a href="https://smallkun0.github.io/Threeblock/XiaoKunKun.jpg" target="_blank" class="author-link">作者详情</a>
</body>
</html>
