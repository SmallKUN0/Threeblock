<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1667ff">
<title>简单的社区</title>
<style>
  /* ===== 全局：禁用一切圆角 ===== */
  *, *::before, *::after {
    box-sizing: border-box;
    border-radius: 0 !important;
  }

  :root {
    --blue: #1667ff;
    --blue-deep: #0a44b8;
    --blue-soft: #eaf1ff;
    --blue-line: #bcd3ff;
    --text: #0d2244;
    --text-sub: #5b7194;
    --white: #ffffff;
  }

  html, body { margin: 0; padding: 0; height: 100%; }

  body {
    background: var(--white);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  /* ==================== 首页 ==================== */
  .home {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: linear-gradient(180deg, #ffffff 0%, #f2f7ff 55%, #e6efff 100%);
  }

  .home::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--blue-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--blue-soft) 1px, transparent 1px);
    background-size: 44px 44px;
    opacity: .75;
    pointer-events: none;
  }

  .card {
    position: relative;
    width: min(520px, 100%);
    background: var(--white);
    border: 1px solid var(--blue-line);
    border-top: 6px solid var(--blue);
    padding: 40px 32px 34px;
    text-align: center;
    box-shadow: 0 18px 40px -24px rgba(13, 60, 150, .45);
  }

  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: .16em;
    color: var(--blue);
    background: var(--blue-soft);
    border: 1px solid var(--blue-line);
    padding: 6px 12px;
    margin-bottom: 22px;
  }

  .title {
    margin: 0 0 14px;
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 800;
    letter-spacing: .04em;
  }

  .title em { font-style: normal; color: var(--blue); }

  .subtitle {
    margin: 0 auto 32px;
    max-width: 32em;
    font-size: 14px;
    line-height: 1.8;
    color: var(--text-sub);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: 200px;
    padding: 16px 40px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--white);
    background: var(--blue);
    border: 2px solid var(--blue);
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease, transform .12s ease;
  }

  .btn:hover  { background: var(--blue-deep); border-color: var(--blue-deep); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid #9cc0ff; outline-offset: 3px; }
  .btn .arrow { font-size: 15px; }

  .hint {
    margin: 22px 0 0;
    font-size: 12px;
    letter-spacing: .04em;
    color: #8ba1c2;
  }

  /* ==================== 沙箱层 ==================== */
  .sandbox-view {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    background: #f2f7ff;
    z-index: 50;
  }

  .sandbox-view.is-open { display: flex; }

  /* 顶栏 */
  .sb-bar {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 54px;
    padding: 0 16px;
    background: var(--blue);
    color: var(--white);
    border-bottom: 1px solid var(--blue-deep);
  }

  .sb-dot {
    flex: none;
    width: 10px; height: 10px;
    background: var(--white);
  }

  .sb-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .06em;
    white-space: nowrap;
  }

  .sb-url {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: #d5e4ff;
    background: rgba(255, 255, 255, .14);
    border: 1px solid rgba(255, 255, 255, .3);
    padding: 6px 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sb-link,
  .sb-close {
    flex: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .08em;
    padding: 9px 16px;
    cursor: pointer;
    text-decoration: none;
    transition: background .18s ease, color .18s ease;
  }

  .sb-link {
    color: #ffffff;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, .55);
  }
  .sb-link:hover { background: rgba(255, 255, 255, .16); }

  .sb-close {
    color: var(--blue);
    background: var(--white);
    border: 1px solid var(--white);
  }
  .sb-close:hover { background: #d9e6ff; }

  /* 舞台 */
  .sb-stage {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  /* 沙箱容器：尺寸由 JS 按 1.5 : 1 计算 */
  .sb-frame {
    position: relative;
    background: var(--white);
    border: 2px solid var(--blue);
    box-shadow: 0 24px 50px -30px rgba(13, 60, 150, .6);
    overflow: hidden;
  }

  .sb-frame iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: var(--white);
  }

  /* 载入提示 */
  .sb-loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--white);
    font-size: 13px;
    letter-spacing: .1em;
    color: var(--text-sub);
    transition: opacity .3s ease;
  }

  .sb-loading.is-hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 30px; height: 30px;
    border: 3px solid var(--blue-soft);
    border-top-color: var(--blue);
    animation: spin .9s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ==================== 手机端样式微调 ==================== */
  @media (max-width: 767px) {
    .home { padding: 18px; }
    .card { padding: 32px 22px 28px; border-top-width: 5px; }
    .btn  { width: 100%; min-width: 0; }
    .sb-bar { gap: 8px; padding: 0 10px; }
    .sb-url { display: none; }
  }
</style>
</head>
<body>

  <!-- ========== 首页 ========== -->
  <main class="home" id="home">
    <section class="card">
      <span class="badge">Sandbox · 双端适配</span>
      <h1 class="title">简单的<em>社区</em></h1>
      <p class="subtitle">
        手机端点击后直接跳转；平板与电脑端点击后，
        会在 1.5 : 1 的沙箱窗口中打开。
      </p>
      <button class="btn" id="enterBtn" type="button">
        进入<span class="arrow">→</span>
      </button>
      <p class="hint">手机：直接打开 &nbsp;·&nbsp; 平板 / 电脑：沙箱预览</p>
    </section>
  </main>

  <!-- ========== 沙箱层（平板 / 电脑） ========== -->
  <section class="sandbox-view" id="sandboxView">
    <header class="sb-bar">
      <span class="sb-dot"></span>
      <span class="sb-title">简单的社区</span>
      <span class="sb-url">https://app-ex12387lfcw1.miaoda.online</span>
      <a class="sb-link" href="https://app-ex12387lfcw1.miaoda.online"
         target="_blank" rel="noopener">新窗口打开</a>
      <button class="sb-close" id="closeBtn" type="button">关闭</button>
    </header>

    <div class="sb-stage">
      <div class="sb-frame" id="sandbox">
        <iframe id="sbIframe"
                title="简单的社区 - 沙箱"
                allow="clipboard-write; fullscreen; geolocation; microphone; camera"
                referrerpolicy="no-referrer"></iframe>
        <div class="sb-loading" id="sbLoading">
          <span class="spinner"></span>
          <span>正在载入…</span>
        </div>
      </div>
    </div>
  </section>

<script>
(function () {
  'use strict';

  var TARGET_URL   = 'https://app-ex12387lfcw1.miaoda.online';
  var RATIO        = 1.5;   // 长 : 宽 = 1.5 : 1（即 宽 : 高 = 1.5 : 1）
  var MOBILE_MAX   = 767;   // < 768px 视为手机屏幕

  var view      = document.getElementById('sandboxView');
  var stage     = view.querySelector('.sb-stage');
  var frame     = document.getElementById('sandbox');
  var iframe    = document.getElementById('sbIframe');
  var loading   = document.getElementById('sbLoading');
  var enterBtn  = document.getElementById('enterBtn');
  var closeBtn  = document.getElementById('closeBtn');

  var iframeLoaded = false;

  /* ---------- 判定是否为手机屏幕 ---------- */
  function isMobileScreen() {
    return window.innerWidth < 768;
  }

  /* ---------- 按 1.5 : 1 计算沙箱尺寸并居中 ---------- */
  function fitSandbox() {
    if (!view.classList.contains('is-open')) return;

    var cs   = window.getComputedStyle(stage);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);

    var availW = Math.max(160, stage.clientWidth  - padX);
    var availH = Math.max(107, stage.clientHeight - padY);

    var w = availW;
    var h = w / RATIO;          // 长 : 宽 = 1.5 : 1

    if (h > availH) {           // 高度超出则以高度为准反推宽度
      h = availH;
      w = h * RATIO;
    }

    frame.style.width  = Math.floor(w) + 'px';
    frame.style.height = Math.floor(h) + 'px';
  }

  /* ---------- 打开沙箱 ---------- */
  function openSandbox() {
    if (!iframeLoaded) {
      iframeLoaded = true;
      iframe.src = TARGET_URL;

      iframe.addEventListener('load', function () {
        loading.classList.add('is-hidden');
      }, { once: true });

      // 兜底：8 秒后无论如何隐藏 loading
      setTimeout(function () {
        loading.classList.add('is-hidden');
      }, 8000);
    }

    view.classList.add('is-open');
    document.body.style.overflow = 'hidden';

    // 等布局完成后再量尺寸
    requestAnimationFrame(function () {
      requestAnimationFrame(fitSandbox);
    });
  }

  /* ---------- 关闭沙箱 ---------- */
  function closeSandbox() {
    view.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  /* ---------- "进入"按钮 ---------- */
  enterBtn.addEventListener('click', function () {
    if (isMobileScreen()) {
      // 手机屏幕：正常跳转
      window.location.href = TARGET_URL;
    } else {
      // 平板 / 电脑：沙箱打开
      openSandbox();
    }
  });

  /* ---------- 事件绑定 ---------- */
  closeBtn.addEventListener('click', closeSandbox);

  window.addEventListener('resize', fitSandbox);
  window.addEventListener('orientationchange', function () {
    setTimeout(fitSandbox, 150);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && view.classList.contains('is-open')) {
      closeSandbox();
    }
  });
})();
</script>
</body>
</html>
