<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快手/Bilibili 视频浏览 · bugpk API</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f0f14;
            color: #e8e8ed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ff6b35, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1e1e2a;
            color: #9a9ab0;
            border: 1px solid #2a2a3a;
        }

        .card {
            background: #181820;
            border: 1px solid #2a2a35;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .row label {
            font-size: 13px;
            color: #9a9ab0;
            white-space: nowrap;
            min-width: 70px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #2e2e3e;
            background: #101018;
            color: #e8e8ed;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #ff6b35;
        }

        input[type="text"]::placeholder {
            color: #555568;
        }

        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: #ff6b35;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover:not(:disabled) {
            background: #e85a28;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.ghost {
            background: transparent;
            border: 1px solid #2e2e3e;
            color: #9a9ab0;
        }

        button.ghost:hover:not(:disabled) {
            border-color: #ff6b35;
            color: #ff6b35;
        }

        .video-wrap {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #2a2a35;
        }

        .video-wrap video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .video-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #555568;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        .video-placeholder svg {
            width: 48px;
            height: 48px;
            opacity: 0.4;
        }

        /* 图集网格 */
        .atlas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            width: 100%;
            padding: 8px;
            max-height: 70vh;
            overflow-y: auto;
        }

        .atlas-grid .atlas-item {
            position: relative;
            background: #0a0a10;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 3 / 4;
        }

        .atlas-grid .atlas-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .atlas-grid .atlas-item .idx {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 10px;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .meta-item {
            background: #101018;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid #22222e;
            min-width: 0;
        }

        .meta-item .meta-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            gap: 8px;
        }

        .meta-item .k {
            font-size: 11px;
            color: #66667a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .meta-item .meta-header .k {
            margin-bottom: 0;
        }

        .meta-item .v {
            font-size: 13px;
            color: #d0d0e0;
            word-break: break-all;
            line-height: 1.5;
            max-height: 200px;
            overflow-y: auto;
        }

        .meta-item .v a {
            color: #ff8c5a;
            text-decoration: none;
        }

        .meta-item .v a:hover {
            text-decoration: underline;
        }

        .copy-btn {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid #2e2e3e;
            background: #1a1a24;
            color: #9a9ab0;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
            line-height: 1.6;
        }

        .copy-btn:hover:not(:disabled) {
            border-color: #ff6b35;
            color: #ff6b35;
        }

        .copy-btn.copied {
            border-color: #4ade80;
            color: #4ade80;
            background: #0f1f18;
        }

        .copy-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .status-bar {
            font-size: 12px;
            color: #9a9ab0;
            padding: 8px 12px;
            background: #101018;
            border-radius: 8px;
            border: 1px solid #1e1e2a;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
        }

        .status-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #555568;
        }

        .status-bar .dot.loading {
            background: #ffb347;
            animation: pulse 1s infinite;
        }

        .status-bar .dot.success {
            background: #4ade80;
        }

        .status-bar .dot.error {
            background: #ef4444;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #555568;
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .api-hint {
            font-size: 11px;
            color: #555568;
            margin-top: 2px;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #3a3a4e;
            padding: 8px 0;
        }

        .error-box {
            background: #1f1015;
            border: 1px solid #4a1a2a;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            color: #f87171;
            line-height: 1.6;
            word-break: break-all;
        }

        .error-box .label {
            color: #9a6a7a;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        /* 图集图片列表的复制按钮 */
        .img-list-item {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 4px 0;
            border-bottom: 1px solid #1a1a24;
        }

        .img-list-item:last-child {
            border-bottom: none;
        }

        .img-list-item .img-idx {
            color: #66667a;
            font-size: 12px;
            min-width: 28px;
            padding-top: 2px;
        }

        .img-list-item .img-link {
            flex: 1;
            min-width: 0;
        }

        .img-list-item .img-link a {
            font-size: 12px;
            word-break: break-all;
            line-height: 1.5;
        }

        /* 音频播放器 */
        .audio-player-wrap {
            margin-top: 8px;
            width: 100%;
        }

        .audio-player-wrap audio {
            width: 100%;
            height: 36px;
            border-radius: 8px;
            background: #1a1a24;
            outline: none;
        }

        /* 历史记录 */
        .history-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #66667a;
        }

        .history-header .title {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .history-header .clear-btn {
            font-size: 11px;
            color: #555568;
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .history-header .clear-btn:hover {
            color: #ff6b35;
            background: #1a1a24;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .history-item {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            color: #b0b0c0;
            cursor: pointer;
            transition: all 0.2s;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item:hover {
            border-color: #ff6b35;
            color: #ff6b35;
            background: #1f1820;
        }

        .history-empty {
            font-size: 12px;
            color: #3a3a4e;
            padding: 2px 0;
        }

        @media (max-width: 600px) {
            .meta-grid {
                grid-template-columns: 1fr;
            }

            .row label {
                min-width: 100%;
            }

            .header h1 {
                font-size: 17px;
            }

            .atlas-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- 头部 -->
        <div class="header">
            <h1>快手/Bilibili 视频浏览 · bugpk API</h1>
            <span class="badge">静态页 · 自动识别平台</span>
        </div>

        <!-- 输入区 -->
        <div class="card">
            <div class="row">
                <label for="inputUrl">视频链接</label>
                <input type="text" id="inputUrl" placeholder="粘贴快手或 Bilibili 分享链接 / BV号（可含文字，会自动过滤）" autocomplete="off">
            </div>
            <div class="row">
                <button id="btnParse" style="flex:1; min-width:140px;">解析并播放</button>
                <button id="btnClear" class="ghost" style="flex:0 0 auto;">清空</button>
            </div>
            <div class="api-hint" id="apiHint">支持平台：快手、Bilibili（自动识别）· 非法字符自动省略 · 支持图集解析 · 通过 api.bugpk.com 解析</div>

            <!-- 历史记录 -->
            <div class="history-section" id="historySection">
                <div class="history-header">
                    <span class="title">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                        </svg>
                        解析历史
                    </span>
                    <button class="clear-btn" id="btnClearHistory">清空历史</button>
                </div>
                <div class="history-list" id="historyList">
                    <span class="history-empty">暂无历史记录</span>
                </div>
            </div>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">就绪，输入链接后点击解析</span>
        </div>

        <!-- 错误提示 -->
        <div id="errorBox" class="error-box" style="display:none;">
            <div class="label">错误详情</div>
            <div id="errorText"></div>
        </div>

        <!-- 播放器 / 图集展示区 -->
        <div class="video-wrap" id="videoWrap">
            <div class="video-placeholder" id="videoPlaceholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="2" y="4" width="20" height="16" rx="3" />
                    <polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none" />
                </svg>
                <span>视频/图集将在此处展示</span>
            </div>
            <video id="videoPlayer" controls playsinline style="display:none;" preload="metadata"></video>
            <div id="atlasContainer" class="atlas-grid" style="display:none;"></div>
        </div>

        <!-- 元信息 -->
        <div class="meta-grid" id="metaGrid" style="display:none;">
            <div class="meta-item">
                <div class="k">标题</div>
                <div class="v" id="metaTitle">—</div>
            </div>
            <div class="meta-item">
                <div class="k">作者</div>
                <div class="v" id="metaAuthor">—</div>
            </div>
            <div class="meta-item" style="grid-column: 1 / -1;">
                <div class="k">作品类型</div>
                <div class="v" id="metaType">—</div>
            </div>
            <div class="meta-item" style="grid-column: 1 / -1;">
                <div class="k">原始分享链接</div>
                <div class="v" id="metaShareUrl">—</div>
            </div>

            <!-- 视频直链（仅视频作品显示） -->
            <div class="meta-item" id="videoUrlItem" style="grid-column: 1 / -1;">
                <div class="meta-header">
                    <span class="k">视频直链（无水印）</span>
                    <button class="copy-btn" id="copyVideoBtn" disabled>复制</button>
                </div>
                <div class="v" id="metaVideoUrl">—</div>
            </div>

            <!-- 图集图片直链（仅图集作品显示） -->
            <div class="meta-item" id="atlasItem" style="grid-column: 1 / -1; display:none;">
                <div class="meta-header">
                    <span class="k">图集图片直链</span>
                    <button class="copy-btn" id="copyAllImagesBtn" disabled>复制全部</button>
                </div>
                <div class="v" id="metaImages">—</div>
            </div>

            <!-- 音频直链（图集作品才显示，含音频播放器） -->
            <div class="meta-item" id="audioItem" style="grid-column: 1 / -1; display:none;">
                <div class="meta-header">
                    <span class="k">背景音频直链</span>
                    <button class="copy-btn" id="copyAudioBtn" disabled>复制</button>
                </div>
                <div class="v" id="metaAudio">—</div>
                <div class="audio-player-wrap" id="audioPlayerWrap" style="display:none;">
                    <audio id="audioPlayer" controls preload="none"></audio>
                </div>
            </div>

            <!-- 封面 -->
            <div class="meta-item" style="grid-column: 1 / -1;">
                <div class="meta-header">
                    <span class="k">封面直链</span>
                    <button class="copy-btn" id="copyCoverBtn" disabled>复制</button>
                </div>
                <div class="v" id="metaCover">—</div>
            </div>
        </div>

        <div class="footer">
            所有解析均通过公开第三方 API 代理完成 · 仅供技术学习
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ====== DOM 引用 ======
            const inputUrl = document.getElementById('inputUrl');
            const btnParse = document.getElementById('btnParse');
            const btnClear = document.getElementById('btnClear');
            const apiHint = document.getElementById('apiHint');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const errorBox = document.getElementById('errorBox');
            const errorText = document.getElementById('errorText');
            const videoPlayer = document.getElementById('videoPlayer');
            const videoPlaceholder = document.getElementById('videoPlaceholder');
            const atlasContainer = document.getElementById('atlasContainer');
            const metaGrid = document.getElementById('metaGrid');
            const metaTitle = document.getElementById('metaTitle');
            const metaAuthor = document.getElementById('metaAuthor');
            const metaType = document.getElementById('metaType');
            const metaShareUrl = document.getElementById('metaShareUrl');
            const metaVideoUrl = document.getElementById('metaVideoUrl');
            const metaImages = document.getElementById('metaImages');
            const metaAudio = document.getElementById('metaAudio');
            const metaCover = document.getElementById('metaCover');
            const videoUrlItem = document.getElementById('videoUrlItem');
            const atlasItem = document.getElementById('atlasItem');
            const audioItem = document.getElementById('audioItem');
            const copyVideoBtn = document.getElementById('copyVideoBtn');
            const copyCoverBtn = document.getElementById('copyCoverBtn');
            const copyAllImagesBtn = document.getElementById('copyAllImagesBtn');
            const copyAudioBtn = document.getElementById('copyAudioBtn');
            const audioPlayerWrap = document.getElementById('audioPlayerWrap');
            const audioPlayer = document.getElementById('audioPlayer');
            const historyList = document.getElementById('historyList');
            const btnClearHistory = document.getElementById('btnClearHistory');

            // ====== 状态 ======
            let loading = false;
            let currentData = {
                videoUrl: '',
                cover: '',
                images: [],
                audio: ''
            };

            // ====== API 配置 ======
            const BUGPK_BASE = 'https://api.bugpk.com/api';
            const HISTORY_KEY = 'ks_bili_history_v1';
            const MAX_HISTORY = 10;

            // ====== 工具函数 ======

            /**
             * 从输入中提取有效链接或 ID
             */
            function extractLink(input) {
                if (!input) return '';

                const raw = String(input).trim();

                // 1. 尝试匹配 http(s) URL
                const urlMatch = raw.match(/https?:\/\/[^\s,，。；;）)】\]]+/);
                if (urlMatch) {
                    return urlMatch[0];
                }

                // 2. 无 URL，进行字符清洗
                let cleaned = raw.replace(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]/g, '');
                cleaned = cleaned.replace(/[\u3000-\u303f\uff00-\uffef\u2000-\u206f]/g, '');
                cleaned = cleaned.replace(/[，。！？、；：""''【】《》（）—…·]/g, '');
                cleaned = cleaned.replace(/\s+/g, '');
                cleaned = cleaned.replace(/[^A-Za-z0-9\-._~:/?#\[\]@!$&'()*+,;=%]/g, '');

                // 3. 尝试提取 BV 号 / av 号
                const bvMatch = cleaned.match(/BV[0-9A-Za-z]{10}/);
                if (bvMatch) return bvMatch[0];

                const avMatch = cleaned.match(/av\d+/i);
                if (avMatch) return avMatch[0];

                return cleaned;
            }

            /** 判断链接属于哪个平台 */
            function detectPlatform(input) {
                const text = (input || '').toLowerCase();
                if (/bilibili\.com|b23\.tv|bili2233\.cn|b23\.wtf/.test(text) ||
                    /^BV[0-9A-Za-z]{10}$/.test(input.trim()) ||
                    /^av\d+$/i.test(input.trim())) {
                    return 'bilibili';
                }
                if (/kuaishou\.com|v\.kuaishou\.com|kwai\.com/.test(text)) {
                    return 'kuaishou';
                }
                return 'kuaishou';
            }

            /** 更新状态栏 */
            function setStatus(type, text) {
                statusDot.className = 'dot ' + (type || '');
                statusText.textContent = text;
            }

            /** 显示错误 */
            function showError(msg) {
                errorText.textContent = msg;
                errorBox.style.display = 'block';
            }

            /** 隐藏错误 */
            function hideError() {
                errorBox.style.display = 'none';
                errorText.textContent = '';
            }

            /** 切换加载状态 */
            function setLoading(val) {
                loading = val;
                btnParse.disabled = val;
                inputUrl.disabled = val;
                if (val) {
                    btnParse.innerHTML = '<span class="spinner"></span> 解析中...';
                } else {
                    btnParse.innerHTML = '解析并播放';
                }
            }

            /** 重置播放器 / 图集展示 */
            function resetPlayer() {
                videoPlayer.pause();
                videoPlayer.removeAttribute('src');
                videoPlayer.load();
                videoPlayer.style.display = 'none';
                atlasContainer.innerHTML = '';
                atlasContainer.style.display = 'none';
                videoPlaceholder.style.display = 'flex';
                metaGrid.style.display = 'none';
                videoUrlItem.style.display = '';
                atlasItem.style.display = 'none';
                audioItem.style.display = 'none';
                audioPlayerWrap.style.display = 'none';
                audioPlayer.pause();
                audioPlayer.removeAttribute('src');
                audioPlayer.load();

                currentData = { videoUrl: '', cover: '', images: [], audio: '' };
                copyVideoBtn.disabled = true;
                copyCoverBtn.disabled = true;
                copyAllImagesBtn.disabled = true;
                copyAudioBtn.disabled = true;
                copyVideoBtn.classList.remove('copied');
                copyCoverBtn.classList.remove('copied');
                copyAllImagesBtn.classList.remove('copied');
                copyAudioBtn.classList.remove('copied');
                copyVideoBtn.textContent = '复制';
                copyCoverBtn.textContent = '复制';
                copyAllImagesBtn.textContent = '复制全部';
                copyAudioBtn.textContent = '复制';
            }

            /** 复制文本到剪贴板 */
            async function copyToClipboard(text, btn, originalLabel) {
                if (!text) return;
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                    }
                    const original = originalLabel || btn.textContent;
                    btn.textContent = '已复制';
                    btn.classList.add('copied');
                    setTimeout(function() {
                        btn.textContent = original;
                        btn.classList.remove('copied');
                    }, 1500);
                } catch (err) {
                    console.error('复制失败:', err);
                    alert('复制失败，请手动选中复制');
                }
            }

            // ====== 历史记录管理 ======

            function getHistory() {
                try {
                    const raw = localStorage.getItem(HISTORY_KEY);
                    return raw ? JSON.parse(raw) : [];
                } catch (e) {
                    return [];
                }
            }

            function saveHistory(list) {
                try {
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
                } catch (e) {
                    console.warn('保存历史记录失败:', e);
                }
            }

            function addHistory(link) {
                if (!link) return;
                let list = getHistory();
                // 去重，将新记录放到最前
                list = list.filter(function(item) { return item !== link; });
                list.unshift(link);
                // 限制条数
                if (list.length > MAX_HISTORY) {
                    list = list.slice(0, MAX_HISTORY);
                }
                saveHistory(list);
                renderHistory();
            }

            function removeHistory(link) {
                let list = getHistory();
                list = list.filter(function(item) { return item !== link; });
                saveHistory(list);
                renderHistory();
            }

            function clearHistory() {
                if (!confirm('确定要清空所有解析历史吗？')) return;
                saveHistory([]);
                renderHistory();
            }

            function renderHistory() {
                const list = getHistory();
                historyList.innerHTML = '';

                if (list.length === 0) {
                    historyList.innerHTML = '<span class="history-empty">暂无历史记录</span>';
                    return;
                }

                list.forEach(function(link) {
                    const item = document.createElement('span');
                    item.className = 'history-item';
                    // 显示简化后的链接
                    let display = link;
                    if (display.length > 28) {
                        display = display.slice(0, 12) + '...' + display.slice(-12);
                    }
                    item.textContent = display;
                    item.title = link;
                    item.addEventListener('click', function() {
                        inputUrl.value = link;
                        // 自动触发解析
                        handleParse();
                    });
                    historyList.appendChild(item);
                });
            }

            // ====== 图集渲染 ======

            function renderAtlasGrid(images) {
                atlasContainer.innerHTML = '';
                if (!images || images.length === 0) {
                    atlasContainer.style.display = 'none';
                    return;
                }
                images.forEach(function(url, i) {
                    var item = document.createElement('div');
                    item.className = 'atlas-item';
                    var img = document.createElement('img');
                    img.src = url;
                    img.alt = '图集 ' + (i + 1);
                    img.loading = 'lazy';
                    img.referrerPolicy = 'no-referrer';
                    img.onerror = function() {
                        this.style.display = 'none';
                        var ph = document.createElement('div');
                        ph.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100%;color:#555568;font-size:12px;text-align:center;padding:8px;';
                        ph.textContent = '图片加载失败';
                        item.appendChild(ph);
                    };
                    var idx = document.createElement('span');
                    idx.className = 'idx';
                    idx.textContent = (i + 1) + ' / ' + images.length;
                    item.appendChild(img);
                    item.appendChild(idx);
                    atlasContainer.appendChild(item);
                });
                atlasContainer.style.display = 'grid';
            }

            // ====== 填充元信息 ======

            function fillMeta(data) {
                // 基本信息
                metaTitle.textContent = data.title || '—';
                metaAuthor.textContent = data.author || '—';

                // 作品类型
                const typeMap = {
                    video: '视频',
                    image: '图集（纯图片）',
                    live: '实况图',
                    unknown: '未知'
                };
                metaType.textContent = typeMap[data.type] || data.type || '—';

                // 分享链接
                metaShareUrl.innerHTML = data.shareUrl ?
                    '<a href="' + escapeHtml(data.shareUrl) + '" target="_blank" rel="noopener">' + escapeHtml(data.shareUrl) + '</a>' :
                    '—';

                // ===== 视频直链（视频作品） =====
                if (data.type === 'video' && data.videoUrl) {
                    videoUrlItem.style.display = '';
                    atlasItem.style.display = 'none';
                    audioItem.style.display = 'none';
                    audioPlayerWrap.style.display = 'none';
                    audioPlayer.pause();

                    metaVideoUrl.innerHTML = '<a href="' + escapeHtml(data.videoUrl) + '" target="_blank" rel="noopener">' + escapeHtml(data.videoUrl) + '</a>';
                    copyVideoBtn.disabled = false;
                    currentData.videoUrl = data.videoUrl;
                } else {
                    videoUrlItem.style.display = 'none';
                    currentData.videoUrl = '';
                }

                // ===== 图集图片直链 =====
                if ((data.type === 'image' || data.type === 'live') && data.images && data.images.length > 0) {
                    atlasItem.style.display = '';
                    audioItem.style.display = data.audio ? '' : 'none';

                    // 构建图片列表 HTML
                    var html = '';
                    data.images.forEach(function(url, i) {
                        html += '<div class="img-list-item">' +
                            '<span class="img-idx">#' + (i + 1) + '</span>' +
                            '<div class="img-link"><a href="' + escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(url) + '</a></div>' +
                            '</div>';
                    });
                    metaImages.innerHTML = html;

                    copyAllImagesBtn.disabled = false;
                    currentData.images = data.images;

                    // 音频直链及播放器
                    if (data.audio) {
                        metaAudio.innerHTML = '<a href="' + escapeHtml(data.audio) + '" target="_blank" rel="noopener">' + escapeHtml(data.audio) + '</a>';
                        copyAudioBtn.disabled = false;
                        currentData.audio = data.audio;

                        // 加载音频播放器
                        audioPlayer.src = data.audio;
                        audioPlayerWrap.style.display = 'block';
                    } else {
                        metaAudio.textContent = '—';
                        copyAudioBtn.disabled = true;
                        currentData.audio = '';
                        audioPlayerWrap.style.display = 'none';
                    }

                    // 渲染图集网格
                    renderAtlasGrid(data.images);
                } else {
                    atlasItem.style.display = 'none';
                    audioItem.style.display = 'none';
                    audioPlayerWrap.style.display = 'none';
                    audioPlayer.pause();
                    currentData.images = [];
                    currentData.audio = '';
                }

                // ===== 封面 =====
                if (data.cover) {
                    metaCover.innerHTML = '<a href="' + escapeHtml(data.cover) + '" target="_blank" rel="noopener">' + escapeHtml(data.cover) + '</a>';
                    copyCoverBtn.disabled = false;
                    currentData.cover = data.cover;
                } else {
                    metaCover.textContent = '—';
                    copyCoverBtn.disabled = true;
                    currentData.cover = '';
                }

                metaGrid.style.display = 'grid';
            }

            function escapeHtml(s) {
                if (!s) return '';
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            // ====== 请求构造 ======

            function buildRequestUrl(link, platform) {
                const encoded = encodeURIComponent(link);
                if (platform === 'bilibili') {
                    return BUGPK_BASE + '/bilibili?url=' + encoded;
                }
                return BUGPK_BASE + '/kuaishou?url=' + encoded;
            }

            /**
             * 从 bugpk 响应中提取统一格式的数据
             * 重点优化：音频字段的提取，支持多层嵌套、数组、对象等
             */
            function parseResponse(json) {
                if (json.code !== undefined && json.code !== 0 && json.code !== 200) {
                    throw new Error(json.msg || '接口返回错误 code=' + json.code);
                }

                const d = json.data || json;

                // 作品类型: video / image / live / unknown
                const type = d.type || 'video';

                // ----- 视频直链（仅 video 类型） -----
                let videoUrl = '';
                if (type === 'video') {
                    videoUrl = d.url || d.video_url || d.videoUrl || d.play_url || '';
                    if (!videoUrl && Array.isArray(d.video_backup) && d.video_backup.length > 0) {
                        videoUrl = d.video_backup[0];
                    }
                }

                // ----- 图集图片列表（image / live 类型） -----
                let images = [];
                if ((type === 'image' || type === 'live') && Array.isArray(d.images)) {
                    images = d.images.filter(function(u) { return typeof u === 'string' && u.length > 0; });
                }
                // 兼容部分响应把图片放在 imgurl 字段
                if (images.length === 0 && Array.isArray(d.imgurl)) {
                    images = d.imgurl.filter(function(u) { return typeof u === 'string' && u.length > 0; });
                }

                // ----- 音频直链（图集作品的背景音乐） - 强化提取 -----
                let audio = '';
                // 候选字段列表（包含常见的嵌套字段）
                const audioCandidates = [
                    d.music,
                    d.audio,
                    d.audio_url,
                    d.music_url,
                    d.atlas_music,
                    d.bgm,
                    d.sound
                ];
                for (let cand of audioCandidates) {
                    if (!cand) continue;
                    if (typeof cand === 'string') {
                        audio = cand;
                        break;
                    } else if (Array.isArray(cand) && cand.length > 0) {
                        const first = cand[0];
                        audio = typeof first === 'string' ? first : (first.url || first.play_url || first.src || '');
                        if (audio) break;
                    } else if (typeof cand === 'object') {
                        audio = cand.url || cand.play_url || cand.src || '';
                        if (audio) break;
                    }
                }

                // ----- 封面 -----
                const cover = d.cover || d.cover_url || d.coverUrl || d.pic || '';

                // ----- 标题 -----
                const title = d.title || d.desc || (Array.isArray(d.videos) && d.videos[0] ? d.videos[0].title : '') || '';

                // ----- 作者 -----
                let author = '';
                if (d.author && typeof d.author === 'object') {
                    author = d.author.name || d.author.nickname || '';
                } else if (d.user && d.user.name) {
                    author = d.user.name;
                } else if (d.auther) {
                    author = d.auther;
                } else if (d.author) {
                    author = d.author;
                }

                // ----- 分享链接 -----
                const shareUrl = d.share_url || d.shareUrl || d.source_url || '';

                // 校验：视频作品必须有直链；图集作品必须有图片
                if (type === 'video' && !videoUrl) {
                    throw new Error('视频作品但未获取到视频直链');
                }
                if ((type === 'image' || type === 'live') && images.length === 0) {
                    throw new Error('图集作品但未获取到图片直链');
                }

                return { type, title, author, shareUrl, videoUrl, images, audio, cover };
            }

            // ====== 核心解析流程 ======

            async function handleParse() {
                if (loading) return;

                const rawInput = inputUrl.value.trim();
                if (!rawInput) {
                    showError('请先输入视频链接或 ID');
                    setStatus('error', '输入为空');
                    return;
                }

                const link = extractLink(rawInput);
                if (!link) {
                    showError('未识别到有效链接，请粘贴完整的分享链接或视频 ID');
                    setStatus('error', '无效链接');
                    return;
                }

                const cleaned = link !== rawInput;
                const platform = detectPlatform(link);
                const platformName = platform === 'bilibili' ? 'Bilibili' : '快手';

                hideError();
                resetPlayer();
                setLoading(true);
                setStatus('loading', '正在通过 bugpk 解析 ' + platformName + ' 作品...' +
                    (cleaned ? '（已过滤非法字符）' : ''));

                try {
                    const requestUrl = buildRequestUrl(link, platform);
                    const res = await fetch(requestUrl);
                    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);

                    const json = await res.json();
                    const data = parseResponse(json);

                    if (!data.shareUrl) {
                        data.shareUrl = link;
                    }

                    // ===== 视频作品：加载播放器 =====
                    if (data.type === 'video' && data.videoUrl) {
                        videoPlayer.src = data.videoUrl;
                        videoPlayer.style.display = 'block';
                        videoPlaceholder.style.display = 'none';
                        atlasContainer.style.display = 'none';

                        videoPlayer.onerror = function() {
                            setStatus('error', '视频加载失败（直链可能已过期或存在防盗链）');
                            showError('视频无法播放。直链可能已过期，或源站要求特定 Referer。' +
                                (data.videoUrl ? ' 直链: ' + data.videoUrl : ''));
                        };

                        videoPlayer.onloadeddata = function() {
                            setStatus('success', '解析成功，视频已就绪');
                        };

                        videoPlayer.play().catch(function() {});
                    }
                    // ===== 图集作品：显示图片网格 =====
                    else if ((data.type === 'image' || data.type === 'live') && data.images.length > 0) {
                        videoPlayer.style.display = 'none';
                        videoPlaceholder.style.display = 'none';
                    }

                    // 填充元信息（同时会渲染图集网格和音频播放器）
                    fillMeta(data);

                    // 解析成功后，添加历史记录
                    addHistory(link);

                    setStatus('success', platformName + ' 解析成功（' +
                        (data.type === 'video' ? '视频' : data.type === 'image' ? '图集' : data.type === 'live' ? '实况' : '作品') +
                        '）· 来源: api.bugpk.com' +
                        (cleaned ? ' · 已过滤非法字符' : ''));

                } catch (err) {
                    console.error('[Parse Error]', err);
                    const msg = err.message || String(err);
                    showError(msg + '\n\n建议：\n1. 确认链接有效且未过期\n2. 检查网络连接\n3. B站视频需为公开视频\n4. 稍后重试');
                    setStatus('error', '解析失败: ' + msg);
                    resetPlayer();
                } finally {
                    setLoading(false);
                }
            }

            // ====== 事件绑定 ======

            btnParse.addEventListener('click', handleParse);

            inputUrl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleParse();
                }
            });

            btnClear.addEventListener('click', function() {
                inputUrl.value = '';
                hideError();
                resetPlayer();
                setStatus('', '就绪，输入链接后点击解析');
                inputUrl.focus();
            });

            btnClearHistory.addEventListener('click', clearHistory);

            copyVideoBtn.addEventListener('click', function() {
                if (currentData.videoUrl) {
                    copyToClipboard(currentData.videoUrl, copyVideoBtn);
                }
            });

            copyCoverBtn.addEventListener('click', function() {
                if (currentData.cover) {
                    copyToClipboard(currentData.cover, copyCoverBtn);
                }
            });

            copyAllImagesBtn.addEventListener('click', function() {
                if (currentData.images && currentData.images.length > 0) {
                    copyToClipboard(currentData.images.join('\n'), copyAllImagesBtn);
                }
            });

            copyAudioBtn.addEventListener('click', function() {
                if (currentData.audio) {
                    copyToClipboard(currentData.audio, copyAudioBtn);
                }
            });

            // 初始化：渲染历史记录，聚焦输入框
            renderHistory();
            inputUrl.focus();

        })();
    </script>

</body>
</html>
