<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快手/Bilibili 视频浏览 · bugpk API</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f0f14;
            color: #e8e8ed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #ff6b35, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1e1e2a;
            color: #9a9ab0;
            border: 1px solid #2a2a3a;
        }

        .card {
            background: #181820;
            border: 1px solid #2a2a35;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .row label {
            font-size: 13px;
            color: #9a9ab0;
            white-space: nowrap;
            min-width: 70px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #2e2e3e;
            background: #101018;
            color: #e8e8ed;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #ff6b35;
        }

        input[type="text"]::placeholder {
            color: #555568;
        }

        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            background: #ff6b35;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover:not(:disabled) {
            background: #e85a28;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        button.ghost {
            background: transparent;
            border: 1px solid #2e2e3e;
            color: #9a9ab0;
        }

        button.ghost:hover:not(:disabled) {
            border-color: #ff6b35;
            color: #ff6b35;
        }

        /* 复制按钮专用样式 */
        .copy-btn {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 8px;
            background: #2a2a3a;
            color: #c8c8d8;
            border: 1px solid #2e2e3e;
            cursor: pointer;
            flex-shrink: 0;
            align-self: flex-start;
            transition: all 0.2s;
            font-weight: 500;
            min-width: 56px;
        }

        .copy-btn:hover:not(:disabled) {
            background: #3a3a4e;
            border-color: #ff6b35;
            color: #ff6b35;
        }

        .copy-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .copy-btn.copied {
            background: #14281a;
            border-color: #4ade80;
            color: #4ade80;
        }

        .video-wrap {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #2a2a35;
        }

        .video-wrap video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .video-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #555568;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        .video-placeholder svg {
            width: 48px;
            height: 48px;
            opacity: 0.4;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .meta-item {
            background: #101018;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid #22222e;
            min-width: 0;
        }

        .meta-item .k {
            font-size: 11px;
            color: #66667a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .meta-item .v {
            font-size: 13px;
            color: #d0d0e0;
            word-break: break-all;
            line-height: 1.5;
            max-height: 100px;
            overflow-y: auto;
        }

        .meta-item .v a {
            color: #ff8c5a;
            text-decoration: none;
        }

        .meta-item .v a:hover {
            text-decoration: underline;
        }

        .meta-row {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .meta-row .v {
            flex: 1;
            min-width: 0;
        }

        .status-bar {
            font-size: 12px;
            color: #9a9ab0;
            padding: 8px 12px;
            background: #101018;
            border-radius: 8px;
            border: 1px solid #1e1e2a;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
        }

        .status-bar .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            background: #555568;
        }

        .status-bar .dot.loading {
            background: #ffb347;
            animation: pulse 1s infinite;
        }

        .status-bar .dot.success {
            background: #4ade80;
        }

        .status-bar .dot.error {
            background: #ef4444;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #555568;
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .api-hint {
            font-size: 11px;
            color: #555568;
            margin-top: 2px;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #3a3a4e;
            padding: 8px 0;
        }

        .error-box {
            background: #1f1015;
            border: 1px solid #4a1a2a;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 13px;
            color: #f87171;
            line-height: 1.6;
            word-break: break-all;
        }

        .error-box .label {
            color: #9a6a7a;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        @media (max-width: 600px) {
            .meta-grid {
                grid-template-columns: 1fr;
            }

            .row label {
                min-width: 100%;
            }

            .header h1 {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- 头部 -->
        <div class="header">
            <h1>快手/Bilibili 视频浏览 · bugpk API</h1>
            <span class="badge">静态页 · 自动识别平台</span>
        </div>

        <!-- 输入区 -->
        <div class="card">
            <div class="row">
                <label for="inputUrl">视频链接</label>
                <input type="text" id="inputUrl" placeholder="粘贴快手或 Bilibili 分享链接 / BV号，如 https://v.kuaishou.com/xxxxx 或 BV1xx4y1xx" autocomplete="off">
            </div>
            <div class="row">
                <button id="btnParse" style="flex:1; min-width:140px;">解析并播放</button>
                <button id="btnClear" class="ghost" style="flex:0 0 auto;">清空</button>
            </div>
            <div class="api-hint" id="apiHint">支持平台：快手、Bilibili（自动识别）· 通过 api.bugpk.com 解析</div>
        </div>

        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">就绪，输入链接后点击解析</span>
        </div>

        <!-- 错误提示 -->
        <div id="errorBox" class="error-box" style="display:none;">
            <div class="label">错误详情</div>
            <div id="errorText"></div>
        </div>

        <!-- 播放器 -->
        <div class="video-wrap" id="videoWrap">
            <div class="video-placeholder" id="videoPlaceholder">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="2" y="4" width="20" height="16" rx="3" />
                    <polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none" />
                </svg>
                <span>视频将在此处播放</span>
            </div>
            <video id="videoPlayer" controls playsinline style="display:none;" preload="metadata"></video>
        </div>

        <!-- 元信息 -->
        <div class="meta-grid" id="metaGrid" style="display:none;">
            <div class="meta-item">
                <div class="k">标题</div>
                <div class="v" id="metaTitle">—</div>
            </div>
            <div class="meta-item">
                <div class="k">作者</div>
                <div class="v" id="metaAuthor">—</div>
            </div>
            <div class="meta-item" style="grid-column: 1 / -1;">
                <div class="k">原始分享链接</div>
                <div class="v" id="metaShareUrl">—</div>
            </div>
            <div class="meta-item" style="grid-column: 1 / -1;">
                <div class="k">视频直链（无水印）</div>
                <div class="meta-row">
                    <div class="v" id="metaVideoUrl">—</div>
                    <button class="copy-btn" id="btnCopyVideoUrl" title="复制视频直链" disabled>复制</button>
                </div>
            </div>
            <div class="meta-item" style="grid-column: 1 / -1;">
                <div class="k">封面</div>
                <div class="v" id="metaCover">—</div>
            </div>
        </div>

        <div class="footer">
            所有解析均通过公开第三方 API 代理完成 · 仅供技术学习
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ====== DOM 引用 ======
            const inputUrl = document.getElementById('inputUrl');
            const btnParse = document.getElementById('btnParse');
            const btnClear = document.getElementById('btnClear');
            const apiHint = document.getElementById('apiHint');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const errorBox = document.getElementById('errorBox');
            const errorText = document.getElementById('errorText');
            const videoPlayer = document.getElementById('videoPlayer');
            const videoPlaceholder = document.getElementById('videoPlaceholder');
            const metaGrid = document.getElementById('metaGrid');
            const metaTitle = document.getElementById('metaTitle');
            const metaAuthor = document.getElementById('metaAuthor');
            const metaShareUrl = document.getElementById('metaShareUrl');
            const metaVideoUrl = document.getElementById('metaVideoUrl');
            const metaCover = document.getElementById('metaCover');
            const btnCopyVideoUrl = document.getElementById('btnCopyVideoUrl');

            // ====== 状态 ======
            let loading = false;
            let currentVideoUrl = '';

            // ====== API 配置（仅保留 bugpk，自动路由到不同端点） ======
            const BUGPK_BASE = 'https://api.bugpk.com/api';

            // ====== 工具函数 ======

            /** 从文本中提取第一个 http(s) URL */
            function extractUrl(text) {
                if (!text) return null;
                const m = text.match(/https?:\/\/[^\s,，。；;）)】\]]+/);
                return m ? m[0] : null;
            }

            /** 判断链接属于哪个平台 */
            function detectPlatform(input) {
                const text = (input || '').toLowerCase();
                if (/bilibili\.com|b23\.tv|bili2233\.cn|b23\.wtf/.test(text) ||
                    /^BV[0-9A-Za-z]{10}$/.test(input.trim()) ||
                    /^av\d+$/i.test(input.trim())) {
                    return 'bilibili';
                }
                if (/kuaishou\.com|v\.kuaishou\.com|kwai\.com/.test(text)) {
                    return 'kuaishou';
                }
                return 'kuaishou';
            }

            /** 更新状态栏 */
            function setStatus(type, text) {
                statusDot.className = 'dot ' + (type || '');
                statusText.textContent = text;
            }

            /** 显示错误 */
            function showError(msg) {
                errorText.textContent = msg;
                errorBox.style.display = 'block';
            }

            /** 隐藏错误 */
            function hideError() {
                errorBox.style.display = 'none';
                errorText.textContent = '';
            }

            /** 切换加载状态 */
            function setLoading(val) {
                loading = val;
                btnParse.disabled = val;
                inputUrl.disabled = val;
                if (val) {
                    btnParse.innerHTML = '<span class="spinner"></span> 解析中...';
                } else {
                    btnParse.innerHTML = '解析并播放';
                }
            }

            /** 重置复制按钮 */
            function resetCopyButton() {
                btnCopyVideoUrl.disabled = true;
                btnCopyVideoUrl.textContent = '复制';
                btnCopyVideoUrl.classList.remove('copied');
            }

            /** 重置播放器 */
            function resetPlayer() {
                videoPlayer.pause();
                videoPlayer.removeAttribute('src');
                videoPlayer.load();
                videoPlayer.style.display = 'none';
                videoPlaceholder.style.display = 'flex';
                metaGrid.style.display = 'none';
                currentVideoUrl = '';
                resetCopyButton();
            }

            /** 填充元信息 */
            function fillMeta(data) {
                metaTitle.textContent = data.title || '—';
                metaAuthor.textContent = data.author || '—';
                metaShareUrl.innerHTML = data.shareUrl ?
                    '<a href="' + escapeHtml(data.shareUrl) + '" target="_blank" rel="noopener">' + escapeHtml(data.shareUrl) + '</a>' :
                    '—';
                metaVideoUrl.innerHTML = data.videoUrl ?
                    '<a href="' + escapeHtml(data.videoUrl) + '" target="_blank" rel="noopener">' + escapeHtml(truncate(data.videoUrl, 80)) + '</a>' :
                    '—';
                metaCover.innerHTML = data.cover ?
                    '<a href="' + escapeHtml(data.cover) + '" target="_blank" rel="noopener">' + escapeHtml(truncate(data.cover, 80)) + '</a>' :
                    '—';

                // 启用复制按钮（仅当有视频直链时）
                if (data.videoUrl) {
                    btnCopyVideoUrl.disabled = false;
                } else {
                    btnCopyVideoUrl.disabled = true;
                }

                metaGrid.style.display = 'grid';
            }

            function escapeHtml(s) {
                if (!s) return '';
                return String(s)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }

            function truncate(s, n) {
                if (!s) return '';
                return s.length > n ? s.slice(0, n) + '…' : s;
            }

            // ====== 复制直链功能 ======

            function copyToClipboard(text) {
                // 优先使用现代 Clipboard API
                if (navigator.clipboard && window.isSecureContext) {
                    return navigator.clipboard.writeText(text);
                }
                // 回退方案：创建临时 textarea
                return new Promise(function(resolve, reject) {
                    try {
                        const ta = document.createElement('textarea');
                        ta.value = text;
                        ta.style.position = 'fixed';
                        ta.style.top = '0';
                        ta.style.left = '-9999px';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.focus();
                        ta.select();
                        const ok = document.execCommand('copy');
                        document.body.removeChild(ta);
                        if (ok) {
                            resolve();
                        } else {
                            reject(new Error('execCommand copy failed'));
                        }
                    } catch (e) {
                        reject(e);
                    }
                });
            }

            function handleCopyVideoUrl() {
                if (!currentVideoUrl) return;

                copyToClipboard(currentVideoUrl).then(function() {
                    btnCopyVideoUrl.textContent = '已复制';
                    btnCopyVideoUrl.classList.add('copied');
                    setTimeout(function() {
                        btnCopyVideoUrl.textContent = '复制';
                        btnCopyVideoUrl.classList.remove('copied');
                    }, 1500);
                }).catch(function(err) {
                    console.error('[Copy Error]', err);
                    btnCopyVideoUrl.textContent = '失败';
                    setTimeout(function() {
                        btnCopyVideoUrl.textContent = '复制';
                    }, 1500);
                });
            }

            // ====== 请求构造 ======

            function buildRequestUrl(link, platform) {
                const encoded = encodeURIComponent(link);
                if (platform === 'bilibili') {
                    return BUGPK_BASE + '/bilibili?url=' + encoded;
                }
                return BUGPK_BASE + '/kuaishou?url=' + encoded;
            }

            function parseResponse(json) {
                if (json.code !== undefined && json.code !== 0 && json.code !== 200) {
                    throw new Error(json.msg || '接口返回错误 code=' + json.code);
                }

                const d = json.data || json;

                let videoUrl = d.url || d.video_url || d.videoUrl || d.play_url || '';
                if (!videoUrl && Array.isArray(d.videos) && d.videos.length > 0) {
                    videoUrl = d.videos[0].url || d.videos[0].video_url || '';
                }

                const cover = d.cover || d.cover_url || d.coverUrl || d.pic || '';
                const title = d.title || d.desc ||
                    (Array.isArray(d.videos) && d.videos[0] ? d.videos[0].title : '') || '';

                let author = '';
                if (d.user && d.user.name) {
                    author = d.user.name;
                } else if (d.auther) {
                    author = d.auther;
                } else if (typeof d.author === 'object' && d.author !== null) {
                    author = d.author.name || d.author.nickname || '';
                } else if (d.author) {
                    author = d.author;
                }

                const shareUrl = d.share_url || d.shareUrl || d.source_url || '';

                if (!videoUrl) {
                    throw new Error('未能从响应中提取到视频直链');
                }

                return { title, author, shareUrl, videoUrl, cover };
            }

            // ====== 核心解析流程 ======

            async function handleParse() {
                if (loading) return;

                const rawInput = inputUrl.value.trim();
                if (!rawInput) {
                    showError('请先输入视频链接或 ID');
                    setStatus('error', '输入为空');
                    return;
                }

                const link = extractUrl(rawInput) || rawInput;
                if (!link) {
                    showError('未识别到有效链接，请粘贴完整的分享链接或视频 ID');
                    setStatus('error', '无效链接');
                    return;
                }

                const platform = detectPlatform(link);
                const platformName = platform === 'bilibili' ? 'Bilibili' : '快手';

                hideError();
                resetPlayer();
                setLoading(true);
                setStatus('loading', '正在通过 bugpk 解析 ' + platformName + ' 视频...');

                try {
                    const requestUrl = buildRequestUrl(link, platform);

                    const res = await fetch(requestUrl);
                    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);

                    const json = await res.json();

                    const data = parseResponse(json);

                    if (!data.shareUrl) {
                        data.shareUrl = link;
                    }

                    // 保存当前直链（供复制按钮使用）
                    currentVideoUrl = data.videoUrl;

                    videoPlayer.src = data.videoUrl;
                    videoPlayer.style.display = 'block';
                    videoPlaceholder.style.display = 'none';

                    videoPlayer.onerror = function() {
                        setStatus('error', '视频加载失败（直链可能已过期或存在防盗链）');
                        showError('视频无法播放。直链可能已过期，或源站要求特定 Referer。' +
                            (data.videoUrl ? ' 直链: ' + data.videoUrl : ''));
                    };

                    videoPlayer.onloadeddata = function() {
                        setStatus('success', '解析成功，视频已就绪');
                    };

                    videoPlayer.play().catch(function() {});

                    fillMeta(data);

                    setStatus('success', platformName + ' 解析成功 · 来源: api.bugpk.com');

                } catch (err) {
                    console.error('[Parse Error]', err);
                    const msg = err.message || String(err);
                    showError(msg + '\n\n建议：\n1. 确认链接有效且未过期\n2. 检查网络连接\n3. B站视频需为公开视频\n4. 稍后重试');
                    setStatus('error', '解析失败: ' + msg);
                    resetPlayer();
                } finally {
                    setLoading(false);
                }
            }

            // ====== 事件绑定 ======

            btnParse.addEventListener('click', handleParse);

            inputUrl.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleParse();
                }
            });

            btnClear.addEventListener('click', function() {
                inputUrl.value = '';
                hideError();
                resetPlayer();
                setStatus('', '就绪，输入链接后点击解析');
                inputUrl.focus();
            });

            // 复制按钮点击事件
            btnCopyVideoUrl.addEventListener('click', handleCopyVideoUrl);

            // 页面加载后自动聚焦输入框
            inputUrl.focus();

        })();
    </script>

</body>
</html>
