<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KUNKUN Win Box</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", Tahoma, sans-serif;
    background: #000;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; outline: none; }
  input, textarea { font: inherit; outline: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #b0b0b0; }
  ::-webkit-scrollbar-track { background: #f0f0f0; }

  #boot {
    position: fixed; inset: 0; z-index: 9999;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding-bottom: 14vh;
    transition: opacity .65s ease;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  .boot-logo {
    color: #fff; font-size: 30px; line-height: 1.35;
    letter-spacing: 3px; text-align: center; font-weight: 300;
    text-shadow: 0 0 18px rgba(255,255,255,.25);
  }
  .boot-spin {
    width: 46px; height: 46px;
    border: 3px solid #2b2b2b;
    border-top-color: #ffffff;
    border-radius: 50%;
    margin: 30px 0 22px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .boot-hint { color: #8a8a8a; font-size: 12px; letter-spacing: 1px; }

  #desktop {
    position: fixed; inset: 0;
    background: #0a3d91;
    background-image: radial-gradient(circle at 30% 22%, #3a8ae8 0%, #1650b0 48%, #08215a 100%);
    opacity: 0;
    transition: opacity .8s ease;
    overflow: hidden;
  }
  #desktop.show { opacity: 1; }

  #iconLayer {
    position: absolute; left: 0; right: 0; top: 0; bottom: 44px;
    z-index: 1;
    overflow: hidden;
    touch-action: none;
  }

  .dicon {
    position: absolute;
    width: 86px;
    padding: 8px 4px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .dicon .dico { font-size: 30px; line-height: 1; }
  .dicon .dname {
    font-size: 11px; color: #fff; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.95);
    word-break: break-all; max-width: 80px; line-height: 1.25;
  }
  .dicon.sel { background: rgba(255,255,255,.28); border-color: rgba(255,255,255,.75); }

  #taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
    background: #ffffff;
    border-top: 1px solid #000;
    display: flex; align-items: stretch;
    z-index: 5000;
  }
  #startBtn {
    width: 58px; flex: 0 0 58px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #000;
    border-right: 1px solid #000;
    background: #fff;
  }
  #startBtn:hover { background: #e8e8e8; }
  #startBtn:active { background: #ccc; }
  #tasks {
    flex: 1 1 auto;
    display: flex; align-items: stretch;
    overflow-x: auto; overflow-y: hidden;
  }
  #tasks::-webkit-scrollbar { height: 0; }
  .task {
    display: flex; align-items: center; gap: 6px;
    padding: 0 14px;
    max-width: 190px;
    border-right: 1px solid #000;
    background: #fff; color: #000;
    font-size: 12px; white-space: nowrap;
    cursor: pointer;
  }
  .task .t-ico { font-size: 14px; }
  .task .t-name { overflow: hidden; text-overflow: ellipsis; }
  .task:hover { background: #e8e8e8; }
  .task.active { background: #cfe2ff; }
  .task.min { background: #ededed; color: #8a8a8a; }

  .window {
    position: absolute;
    display: flex; flex-direction: column;
    padding: 8px 32px 32px 32px;
    background: #ffffff;
    border: 1px solid #000000;
    box-shadow: 0 22px 48px rgba(0,0,0,.72);
    min-width: 260px;
    min-height: 160px;
    touch-action: none;
    z-index: 100;
  }
  .titlebar {
    flex: 0 0 34px; height: 34px;
    display: flex; align-items: center;
    padding-left: 10px;
    border: 1px solid #000000;
    margin-bottom: 6px;
    background: #ffffff;
  }
  .ttl {
    flex: 1 1 auto;
    font-size: 13px; letter-spacing: .5px; color: #000;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-right: 10px;
  }
  .ctls { display: flex; align-self: stretch; flex: 0 0 auto; }
  .ctl {
    position: relative; width: 42px; height: 100%;
    padding: 0; margin: 0;
    border: 1px solid #000;
    display: flex; align-items: center; justify-content: center;
    background: #ffffff; cursor: pointer;
  }
  .ctl:hover { background: #e8e8e8; }
  .ctl:active { background: #cccccc; }
  .ctl-close { background: #c0332e; }
  .ctl-close:hover { background: #d2403a; }
  .ctl-close:active { background: #8d1f1b; }
  .ctl i { display: block; position: relative; }
  .ctl-min i { width: 11px; height: 2px; background: #000; }
  .ctl-max i { width: 11px; height: 10px; border: 1px solid #000; }
  .ctl-close i { width: 12px; height: 12px; }
  .ctl-close i::before, .ctl-close i::after {
    content: ""; position: absolute; left: 0; top: 5px;
    width: 12px; height: 2px; background: #fff;
  }
  .ctl-close i::before { transform: rotate(45deg); }
  .ctl-close i::after  { transform: rotate(-45deg); }

  .content {
    flex: 1 1 auto; min-height: 0;
    background: #ffffff;
    border: 1px solid #000;
    position: relative;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .rs { position: absolute; z-index: 20; }
  .rs-n  { top: 0;    left: 32px;  right: 32px; height: 8px;  cursor: ns-resize; }
  .rs-s  { bottom: 0; left: 32px;  right: 32px; height: 32px; cursor: ns-resize; }
  .rs-w  { left: 0;   top: 8px;   bottom: 32px; width: 32px;  cursor: ew-resize; }
  .rs-e  { right: 0;  top: 8px;   bottom: 32px; width: 32px;  cursor: ew-resize; }
  .rs-nw { top: 0;    left: 0;     width: 32px; height: 8px;  cursor: nwse-resize; }
  .rs-ne { top: 0;    right: 0;    width: 32px; height: 8px;  cursor: nesw-resize; }
  .rs-sw { bottom: 0; left: 0;     width: 32px; height: 32px; cursor: nesw-resize; }
  .rs-se { bottom: 0; right: 0;    width: 32px; height: 32px; cursor: nwse-resize; }
  .window.max .rs { display: none; }

  .fm { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; background: #f5f6f7; }
  .fm-bar {
    display: flex; align-items: center; gap: 4px;
    padding: 5px;
    background: #e8e8e8;
    border-bottom: 1px solid #b8b8b8;
    overflow-x: auto;
  }
  .fm-bar::-webkit-scrollbar { height: 0; }
  .fm-btn {
    border: 1px solid #9a9a9a; background: #ffffff; color: #000;
    padding: 4px 9px; font-size: 12px; white-space: nowrap;
  }
  .fm-btn:hover { background: #f0f0f0; }
  .fm-btn:active { background: #d8d8d8; }
  .fm-path {
    flex: 1 1 auto; min-width: 70px;
    border: 1px solid #9a9a9a; background: #ffffff; color: #004a99;
    font-size: 12px; padding: 4px 7px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .fm-body {
    flex: 1 1 auto; min-height: 0;
    overflow: auto;
    padding: 4px;
    background: #ffffff;
    touch-action: none;
  }
  .fm-empty { color: #9a9a9a; font-size: 12px; padding: 20px; }

  .fm-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px;
    border-bottom: 1px solid #ececec;
    color: #1a1a1a; font-size: 12px;
    cursor: pointer;
  }
  .fm-row:hover { background: #eef4ff; }
  .fm-row.sel { background: #cce0ff; }
  .fm-row .fi-icon { font-size: 16px; width: 20px; text-align: center; flex: 0 0 20px; }
  .fm-row .fi-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fm-row .fi-meta { flex: 0 0 auto; color: #8a8a8a; font-size: 11px; }

  .np { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; background: #f5f6f7; }
  .np-bar {
    display: flex; align-items: center; gap: 6px;
    padding: 6px; border-bottom: 1px solid #b8b8b8;
  }
  .np-info {
    margin-left: auto; font-size: 11px; color: #666;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 50%;
  }
  .np-area {
    flex: 1 1 auto; min-height: 0; width: 100%;
    background: #ffffff; color: #111;
    border: none; resize: none;
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px; line-height: 1.5; padding: 10px;
    touch-action: pan-y;
  }

  .app-frame { flex: 1 1 auto; width: 100%; border: 0; background: #fff; display: block; }
  .loading {
    position: absolute; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center;
    background: #ffffff; color: #333; font-size: 14px; letter-spacing: 1px;
    animation: blink 1.2s ease-in-out infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

  .ctx {
    position: fixed; left: 0; top: 0;
    min-width: 150px;
    background: #fff;
    border: 1px solid #000;
    box-shadow: 4px 4px 0 rgba(0,0,0,.45);
    padding: 2px;
    z-index: 6000;
  }
  .ctx-item {
    padding: 8px 14px; font-size: 13px; color: #000;
    white-space: nowrap; cursor: pointer;
  }
  .ctx-item:hover { background: #0a5fbf; color: #fff; }
  .ctx-item.disabled { color: #aaa; pointer-events: none; }
  .ctx-sep { height: 1px; background: #000; margin: 2px 0; opacity: .5; }

  #startMenu {
    position: fixed; left: 0; bottom: 44px;
    width: 290px; max-width: 88vw; max-height: 72vh;
    background: #fff; border: 1px solid #000;
    display: none; flex-direction: column;
    z-index: 6000;
    box-shadow: 4px -4px 16px rgba(0,0,0,.55);
  }
  #startMenu.show { display: flex; }
  .sm-head {
    padding: 9px 12px; font-size: 13px; font-weight: 700;
    background: #e9e9e9; border-bottom: 1px solid #000;
    letter-spacing: 1px;
  }
  .sm-list { flex: 1 1 auto; overflow-y: auto; padding: 4px; touch-action: pan-y; }
  .sm-sub {
    padding: 6px 10px; font-size: 11px; color: #666;
    border-bottom: 1px solid #ddd; margin-bottom: 2px;
  }
  .sm-item {
    padding: 7px 10px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    overflow: hidden; white-space: nowrap;
  }
  .sm-item span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .sm-item:hover { background: #0a5fbf; color: #fff; }
  .sm-foot {
    border-top: 1px solid #000; padding: 8px;
    display: flex; justify-content: flex-end;
  }
  .sm-shutdown {
    border: 1px solid #000; padding: 6px 18px; font-size: 13px;
    background: #fff;
  }
  .sm-shutdown:hover { background: #c0332e; color: #fff; border-color: #000; }

  #modalLayer {
    position: fixed; inset: 0; z-index: 7000;
    background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center;
  }
  #modalLayer.show { display: flex; }
  .dlg {
    background: #fff; border: 1px solid #000;
    min-width: 280px; max-width: 90vw;
    box-shadow: 6px 6px 0 rgba(0,0,0,.6);
  }
  .dlg-title {
    padding: 8px 12px; font-size: 13px; font-weight: 700;
    background: #e9e9e9; border-bottom: 1px solid #000;
  }
  .dlg-body { padding: 14px 12px; font-size: 13px; line-height: 1.5; }
  .dlg-body input {
    width: 100%; border: 1px solid #000; padding: 7px 8px;
    font-size: 13px; background: #fff; color: #000;
  }
  .dlg-foot {
    padding: 10px 12px; display: flex; justify-content: flex-end; gap: 8px;
    border-top: 1px solid #000;
  }
  .dlg-btn { border: 1px solid #000; padding: 6px 18px; font-size: 13px; background: #fff; }
  .dlg-btn:hover { background: #e8e8e8; }
  .dlg-btn.primary { background: #0a5fbf; color: #fff; }
  .dlg-btn.primary:hover { background: #0d74e6; }

  .drag-ghost {
    position: fixed; z-index: 9000;
    pointer-events: none;
    background: rgba(0,0,0,.82);
    border: 1px solid #fff;
    color: #fff; font-size: 12px;
    padding: 5px 9px; white-space: nowrap;
    transform: translate(-50%, -50%);
  }
  .drop-hover { outline: 2px solid #2b7de9; outline-offset: -2px; background: rgba(43,125,233,.14); }

  .toast {
    position: fixed; left: 50%; bottom: 70px;
    transform: translateX(-50%);
    background: rgba(0,0,0,.85);
    border: 1px solid #fff;
    color: #fff; font-size: 12px;
    padding: 7px 14px; z-index: 9500;
    transition: opacity .3s;
    pointer-events: none;
    white-space: nowrap;
  }

  #shutdown {
    position: fixed; inset: 0; z-index: 9800;
    background: #000;
    display: none; align-items: center; justify-content: center;
  }
  #shutdown.show { display: flex; }
  .sd-btn {
    border: 1px solid #fff; color: #fff; background: transparent;
    padding: 14px 42px; font-size: 15px; letter-spacing: 3px;
  }
  .sd-btn:hover { background: #fff; color: #000; }
</style>
</head>
<body>

<div id="boot">
  <div class="boot-logo">KUNKUN<br>Win Box</div>
  <div class="boot-spin"></div>
  <div class="boot-hint">移动端单击左键，长按右键</div>
</div>

<div id="desktop">
  <div id="iconLayer"></div>
  <div id="taskbar">
    <div id="startBtn">⊞</div>
    <div id="tasks"></div>
  </div>
</div>

<div id="startMenu"></div>
<div id="modalLayer"></div>
<div id="shutdown"></div>

<script>
(function () {
"use strict";

/* =========================================================
   一、文件系统
   ========================================================= */
var DESKTOP_PATH = "C/User/KUNKUN/Table";

var FS = {
  name: "C", type: "dir", children: {
    "User": { name: "User", type: "dir", children: {
      "KUNKUN": { name: "KUNKUN", type: "dir", children: {
        "Table": { name: "Table", type: "dir", children: {
          "Computer.exe":     { name: "Computer.exe",     type: "file", content: "" },
          "Threeblock.exe":   { name: "Threeblock.exe",   type: "file", content: "" },
          "方块世界2.4.exe":   { name: "方块世界2.4.exe",   type: "file", content: "" },
          "Level 37.exe":     { name: "Level 37.exe",     type: "file", content: "" },
          "Kimi排行榜.exe":    { name: "Kimi排行榜.exe",    type: "file", content: "" },
          "Cmd.exe":          { name: "Cmd.exe",          type: "file", content: "" },
          "浏览器.exe":        { name: "浏览器.exe",        type: "file", content: "" },
          "魔方.exe":          { name: "魔方.exe",          type: "file", content: "" },
          "记事本.exe":        { name: "记事本.exe",        type: "file", content: "" },
          "回收站.exe":        { name: "回收站.exe",        type: "file", content: "" },
          "示例脚本.bat":      { name: "示例脚本.bat",      type: "file",
            content: "ECHO 你好，KUNKUN！\r\nECHO 当前时间：\r\nTIME\r\nECHO 这是一段批处理脚本。" },
          "示例页面.html":     { name: "示例页面.html",     type: "file",
            content: "<!DOCTYPE html>\r\n<html>\r\n<head>\r\n  <meta charset=\"utf-8\">\r\n  <title>示例页面</title>\r\n  <style>\r\n    body { font-family: sans-serif; padding: 24px; background: #eef5ff; color: #123; }\r\n    h1 { border-bottom: 2px solid #2b7de9; padding-bottom: 6px; }\r\n  </style>\r\n</head>\r\n<body>\r\n  <h1>你好，KUNKUN！</h1>\r\n  <p>这是一个示例 HTML 文件。你可以把它拖动到桌面，或用浏览器打开它。</p>\r\n  <p>试着在同目录放一张 photo.png 图片，然后在这里用 &lt;img src=\"photo.png\"&gt; 引用它。</p>\r\n</body>\r\n</html>" },
          "样式示例.css":      { name: "样式示例.css",      type: "file",
            content: "/* 示例样式表 */\r\nbody {\r\n  margin: 0;\r\n  padding: 24px;\r\n  background: #ffffff;\r\n  color: #222222;\r\n  font-family: sans-serif;\r\n}" },
          "脚本示例.js":       { name: "脚本示例.js",       type: "file",
            content: "/* 示例脚本 */\r\nconsole.log('Hello, KUNKUN!');\r\n" }
        }}
      }}
    }},
    "SandBox": { name: "SandBox", type: "dir", children: {} }
  }
};

var RECYCLE = [];
var recSeq = 0;

/* =========================================================
   二、路径工具
   ========================================================= */
function splitPath(p) {
  var raw = String(p == null ? "" : p).split("/");
  var out = [];
  for (var i = 0; i < raw.length; i++) {
    var s = raw[i];
    if (s === "" || s === ".") continue;
    if (s === "..") { out.pop(); continue; }
    out.push(s);
  }
  return out;
}
function getNode(path) {
  var parts = splitPath(path);
  if (parts.length === 0) return null;
  if (parts[0] !== "C") return null;
  var node = FS;
  for (var i = 1; i < parts.length; i++) {
    if (!node.children) return null;
    node = node.children[parts[i]];
    if (!node) return null;
  }
  return node;
}
function getParentPath(path) {
  var parts = splitPath(path);
  parts.pop();
  return parts.join("/");
}
function basename(path) {
  var parts = splitPath(path);
  return parts.length ? parts[parts.length - 1] : "";
}
function uniqueName(dirPath, base) {
  var dir = getNode(dirPath);
  if (!dir || !dir.children) return base;
  if (!dir.children[base]) return base;
  var dot = base.lastIndexOf(".");
  var stem = dot > 0 ? base.slice(0, dot) : base;
  var ext = dot > 0 ? base.slice(dot) : "";
  var i = 2, name;
  do { name = stem + "(" + i + ")" + ext; i++; } while (dir.children[name]);
  return name;
}

function hardDelete(path) {
  var parent = getNode(getParentPath(path));
  if (!parent || !parent.children) return false;
  var key = basename(path);
  if (!parent.children[key]) return false;
  delete parent.children[key];
  return true;
}

function recyclePath(path) {
  var node = getNode(path);
  if (!node) return false;
  var entry = {
    id: ++recSeq,
    name: node.name,
    type: node.type,
    node: cloneNode(node),
    fromPath: getParentPath(path),
    time: Date.now()
  };
  RECYCLE.push(entry);
  hardDelete(path);
  return true;
}

function restoreFromRecycle(id) {
  for (var i = 0; i < RECYCLE.length; i++) {
    if (RECYCLE[i].id !== id) continue;
    var e = RECYCLE[i];
    var destPath = (getNode(e.fromPath) && getNode(e.fromPath).type === "dir") ? e.fromPath : DESKTOP_PATH;
    var dir = getNode(destPath);
    if (!dir || dir.type !== "dir") { toast("无法恢复"); return false; }
    var finalName = uniqueName(destPath, e.node.name);
    var copy = cloneNode(e.node);
    copy.name = finalName;
    dir.children[finalName] = copy;
    RECYCLE.splice(i, 1);
    refreshAll();
    return true;
  }
  return false;
}

function purgeFromRecycle(id) {
  for (var i = 0; i < RECYCLE.length; i++) {
    if (RECYCLE[i].id === id) { RECYCLE.splice(i, 1); refreshAll(); return true; }
  }
  return false;
}

function clearRecycle() { RECYCLE.length = 0; refreshAll(); }

function renamePath(path, newName) {
  var parentPath = getParentPath(path);
  var parent = getNode(parentPath);
  if (!parent || !parent.children) return false;
  var key = basename(path);
  if (!parent.children[key]) return false;
  if (newName === key) return true;
  if (parent.children[newName]) return false;
  var node = parent.children[key];
  node.name = newName;
  delete parent.children[key];
  parent.children[newName] = node;
  return true;
}

function movePath(srcPath, destDirPath) {
  if (!srcPath || !destDirPath) return { ok: false, msg: "路径无效" };
  if (srcPath === destDirPath) return { ok: false, msg: "不能移动到自身" };
  if (destDirPath.indexOf(srcPath + "/") === 0) return { ok: false, msg: "不能移动到子目录" };
  var srcNode = getNode(srcPath);
  var destDir = getNode(destDirPath);
  if (!srcNode) return { ok: false, msg: "源文件不存在" };
  if (!destDir || destDir.type !== "dir") return { ok: false, msg: "目标不是文件夹" };
  var parentPath = getParentPath(srcPath);
  if (parentPath === destDirPath) return { ok: false, msg: "已经在该位置" };
  var srcParent = getNode(parentPath);
  if (!srcParent || !srcParent.children) return { ok: false, msg: "源目录无效" };
  var key = basename(srcPath);
  if (!srcParent.children[key]) return { ok: false, msg: "源文件不存在" };
  var finalName = uniqueName(destDirPath, srcNode.name);
  delete srcParent.children[key];
  srcNode.name = finalName;
  destDir.children[finalName] = srcNode;
  return { ok: true };
}

function cloneNode(node) {
  var c = { name: node.name, type: node.type };
  if (typeof node._gx === "number") c._gx = node._gx;
  if (typeof node._gy === "number") c._gy = node._gy;
  if (node.type === "dir") {
    c.children = {};
    var keys = Object.keys(node.children || {});
    for (var i = 0; i < keys.length; i++) {
      c.children[keys[i]] = cloneNode(node.children[keys[i]]);
    }
  } else {
    c.content = node.content || "";
  }
  return c;
}

function copyInto(srcPath, destDirPath) {
  var src = getNode(srcPath);
  var dest = getNode(destDirPath);
  if (!src || !dest || dest.type !== "dir") return false;
  var finalName = uniqueName(destDirPath, src.name);
  var clone = cloneNode(src);
  clone.name = finalName;
  dest.children[finalName] = clone;
  return true;
}

/* =========================================================
   三、文件类型判断
   ========================================================= */
function extOf(name) {
  var dot = String(name || "").lastIndexOf(".");
  if (dot <= 0) return "";
  return String(name).slice(dot + 1).toLowerCase();
}
function hasExt(name) { return extOf(name) !== ""; }
function isTextExt(ext) {
  return ext === "txt" || ext === "bat" || ext === "html" || ext === "htm" ||
         ext === "css" || ext === "js" || ext === "json" || ext === "md" ||
         ext === "csv" || ext === "xml" || ext === "svg" || ext === "log";
}

  function sizeOf(file){ return file.content ? file.content.length : 0; }

    var node = nodeAt(segs);
    if(!node){ print('系统找不到指定的路径。'); return; }
    if(node.type === 'file'){
      printInfoHeader(segs.slice(0, -1));
      printFileRow(segs[segs.length - 1], node);

      print('               0 个目录');

    var names = Object.keys(node.children);

      } else {
        fileCount++;

    var node = nodeAt(segs);

    print(node.content);

  function cmdEcho(rest){

    if(m){ text = m[1]; append = (m[2] === '>>'); target = m[3]; }
    text = text.replace(/^\s+/, '');
    if(/^\.\s*$/.test(text)) text = '';
    else if(/^\./.test(text)) text = text.replace(/^\./, '');
    if(target){
      var segs = parsePath(target);
      if(!segs.length){ print('命令语法不正确。'); return; }
      var parent = nodeAt(segs.slice(0, -1));
      var name = segs[segs.length - 1];
      if(!parent || parent.type !== 'dir'){ print('系统找不到指定的路径。'); return; }
      var key = findKey(parent, name);
      if(key){
        if(parent.children[key].type === 'dir'){ print('拒绝访问。'); return; }
        var f = parent.children[key];

  function execPart(part){
    part = String(part == null ? '' : part).trim();

    var delay = 0;
    var delayMatch = /^(\S+?)\s*\{t=([0-9.]+)\}\s*([\s\S]*)$/i.exec(part);
    if(delayMatch){
      var cmdName = delayMatch[1];
      delay = parseFloat(delayMatch[2]);
      var restArgs = delayMatch[3] || '';
      part = cmdName + (restArgs ? ' ' + restArgs : '');
    }
    var sm = /^(\S+?)\s*\/$/.exec(part);
    if(sm){
      var nm = sm[1].toLowerCase();
      if(HELP_DETAIL[nm]){ print(''); print(HELP_DETAIL[nm]); print(''); return; }
    }
    var aliasName = matchAlias(part);
    if(aliasName){
      var def = aliases[aliasName];
      var runAlias = function(){
        for(var r=0;r<def.count;r++){
          var bodyParts = def.body.split('&');
          for(var b=0;b<bodyParts.length;b++){ execPart(bodyParts[b]); }
        }
      };
      if(delay > 0) setTimeout(runAlias, delay * 1000);
      else runAlias();
      return;
    }
    var m = /^(\S+)(?:\s+([\s\S]*))?$/.exec(part);
    if(!m) return;
    var cmd = m[1].toLowerCase();
    var rest = m[2] || '';
    if(/^echo\./i.test(cmd)){ rest = '.' + cmd.slice(5) + (rest ? rest : ''); cmd = 'echo'; }

    var doExec = function(){
      switch(cmd){
        case 'help': case '?': showHelp(rest); break;
        case 'cls': case 'clear': outputEl.innerHTML = ''; break;
        case 'echo': cmdEcho(rest); break;
        case 'color': cmdColor(rest); break;
        case 'dir': cmdDir(rest); break;
        case 'cd': case 'chdir': cmdCd(rest); break;
        case 'type': cmdType(rest); break;
        case 'ver': print(''); print('Microsoft Windows [版本 10.0.19045.3803]'); print(''); break;
        case 'date':
          (function(){
            var d = new Date();
            var w = ['日','一','二','三','四','五','六'][d.getDay()];
            print('当前日期: ' + d.getFullYear() + '/' + ('0' + (d.getMonth()+1)).slice(-2) + '/' + ('0' + d.getDate()).slice(-2) + ' 星期' + w);
          })();
          break;
        case 'time':
          (function(){
            var d = new Date();
            print('当前时间: ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2) + ':' + ('0'+d.getSeconds()).slice(-2));
          })();
          break;
        case 'whoami': print('desktop-8f3k2a' + BS + 'user'); break;
        case 'exit': print(''); print('感谢使用。'); break;
        default:
          print("'" + m[1] + "' 不是内部或外部命令，也不是可运行的程序");
          print('或批处理文件。');
          break;
      }
    };

    else doExec();
  }

  function matchAlias(part){
    var best = null;
    for(var k in aliases){
      if(!Object.prototype.hasOwnProperty.call(aliases, k)) continue;
      if(k === '') continue;
      if(part === k || (part.indexOf(k) === 0 && /\s/.test(part.charAt(k.length)))){
        if(!best || k.length > best.length) best = k;
      }
    }
    return best;
  }

  function parseMakeDef(str){
    var mkMatch = /^make\s*(?:\{t=([0-9.]+)\}\s*)?\{\s*([^}]*?)\s*\}\s*(\d+)?\s*do\s+([\s\S]+)$/i.exec(str.trim());
    if(mkMatch){
      return {
        delay: mkMatch[1] ? parseFloat(mkMatch[1]) : 0,
        name: mkMatch[2],
        times: mkMatch[3] ? parseInt(mkMatch[3], 10) : 1,
        body: mkMatch[4].trim()
      };
    }
    return null;
  }
  function processMakeDef(def){
    if(!def.name){ print('命令名称不能为空。'); return; }
    if(!def.times || def.times < 1){ print('重复次数必须是不小于 1 的正整数。'); return; }
    if(!def.body){ print('命令内容不能为空。'); return; }
    var doCreate = function(){
      aliases[def.name] = { count: def.times, body: def.body };
      print('已创建自定义命令: ' + def.name + '   (重复 ' + def.times + ' 次)');
      print('输入「' + def.name + '」即可执行: ' + def.body);
    };
    if(def.delay > 0){
      print('将在 ' + def.delay + ' 秒后创建自定义命令: ' + def.name);
      setTimeout(doCreate, def.delay * 1000);
    } else doCreate();
  }

  function execLine(line){
    line = String(line == null ? '' : line).trim();
    if(line === '') return;
    line = replaceRandom(line);
    var wholeMake = parseMakeDef(line);
    if(wholeMake){ processMakeDef(wholeMake); return; }
    var lastAmp = line.lastIndexOf('&');
    if(lastAmp !== -1){
      var afterLast = line.slice(lastAmp + 1).trim();
      var makeDef = parseMakeDef(afterLast);
      if(makeDef){
        var before = line.slice(0, lastAmp).trim();
        if(before){
          var partsBefore = before.split('&');
          for(var i=0;i<partsBefore.length;i++){ execPart(partsBefore[i]); }
        }
        processMakeDef(makeDef);
        return;
      }
    }
    var parts = line.split('&');
    for(var j=0;j<parts.length;j++){ execPart(parts[j]); }
  }

  function submit(line){
    printPromptLine(line);
    if(line.trim() !== ''){ history.push(line); histIndex = history.length; histDraft = ''; }
    execLine(line);
    scrollBottom();
  }
  function updateInputLine(){
    var v = inputEl.value;

    typedAfter.textContent = v.slice(pos);
  }
  function focusInput(){
    try{

    updateInputLine();
    scrollBottom();

  inputEl.addEventListener('blur', function(){ screenEl.classList.remove('focused'); });

  inputEl.addEventListener('keydown', function(e){

      e.preventDefault();
      var val = inputEl.value;
      inputEl.value = '';
      updateInputLine();
      submit(val);
      return;
    }
    if(e.key === 'ArrowUp'){

function cmpKeys(dir, a, b) {
  var na = dir.children[a], nb = dir.children[b];

function bindTapAction(el, fn) {
  el.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();

    var sx = e.clientX, sy = e.clientY;
    var t0 = Date.now();
    var finished = false;
    var timer = null;

    function cleanup() {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      document.removeEventListener("pointercancel", onUp);
      if (timer) clearTimeout(timer);
    }
    function onMove(ev) {
      if (finished) return;
      if (Math.abs(ev.clientX - sx) > 8 || Math.abs(ev.clientY - sy) > 8) {
        finished = true;
        cleanup();
      }
    }
    function onUp() {
      if (finished) return;
      finished = true;
      cleanup();
      if (Date.now() - t0 < 300) fn();
    }

    timer = setTimeout(function () {
      if (finished) return;
      finished = true;
      cleanup();
    }, 300);

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  });
}

/* =========================================================

   ========================================================= */
function openPath(path) {
  var node = getNode(path);
  if (!node) { toast("文件不存在"); return; }
  if (node.type === "dir") { openComputer(path); return; }

  var name = node.name || "";
  var ext = extOf(name);

  // 无后缀 → 选择打开方式
  if (ext === "") {
    askOpenWith(path);
    return;
  }

  // 已知类型
  if (ext === "bat") { openCmd(path); return; }
  if (ext === "html" || ext === "htm" || ext === "css" || ext === "js") {
    openBrowserWithFile(path);
    return;
  }
  if (ext === "txt") { openNotepad(path); return; }
  if (ext === "exe") {
    var app = APPS[name.slice(0, -4)];
    if (app) { app.launch(path); return; }
    askOpenWith(path);
    return;
  }

  // 其他 → 选择打开方式
  askOpenWith(path);
}

function askOpenWith(path) {
  dlgChoose("选择打开方式", [
    { label: "📒 记事本", value: "notepad" },
    { label: "🔳 命令提示符", value: "cmd" },
    { label: "🌏 浏览器", value: "browser" }
  ]).then(function (v) {
    if (!v) return;
    if (v === "notepad") openNotepad(path);
    else if (v === "cmd") openCmd(path);
    else if (v === "browser") openBrowserWithFile(path);
  });
}

function refreshAll() {
  renderDesktop();
  for (var i = 0; i < winList.length; i++) {

      try { winList[i].refresh(); } catch (e) {}
    }

/* =========================================================
   十二、桌面渲染
   ========================================================= */
function ensureDesktopPositions() {
  var dir = getNode(DESKTOP_PATH);
  if (!dir || !dir.children) return [];
  var names = Object.keys(dir.children).sort(function (a, b) { return cmpKeys(dir, a, b); });

  var layer = document.getElementById("iconLayer");
  var layerH = layer ? layer.clientHeight : (window.innerHeight - TASKBAR_H);
  var maxRows = Math.max(1, Math.floor((layerH - GRID_PAD * 2) / GRID_H));

  var used = {};
  names.forEach(function (n) {
    var node = dir.children[n];
    if (typeof node._gx === "number" && typeof node._gy === "number") {
      used[node._gx + "," + node._gy] = true;
    }
  });

  var gx = 0, gy = 0;
  names.forEach(function (n) {
    var node = dir.children[n];
    if (typeof node._gx === "number" && typeof node._gy === "number") return;
    var guard = 0;
    while (used[gx + "," + gy] && guard < 9999) {
      gy++;
      if (gy >= maxRows) { gy = 0; gx++; }
      guard++;
    }
    node._gx = gx;
    node._gy = gy;
    used[gx + "," + gy] = true;
  });

  return names;
}

function renderDesktop() {
  var layer = document.getElementById("iconLayer");
  if (!layer) return;
  layer.setAttribute("data-droppath", DESKTOP_PATH);
  layer.innerHTML = "";

  var dir = getNode(DESKTOP_PATH);
  if (!dir || !dir.children) return;

  var names = ensureDesktopPositions();

  names.forEach(function (n) {
    var node = dir.children[n];
    var path = DESKTOP_PATH + "/" + n;
    var d = document.createElement("div");
    d.className = "dicon";
    d.dataset.path = path;
    if (node.type === "dir") d.dataset.droppath = path;
    if (n === "回收站.exe") d.dataset.recycle = "1";

    d.style.left = (GRID_PAD + node._gx * GRID_W) + "px";
    d.style.top  = (GRID_PAD + node._gy * GRID_H) + "px";

    var ic = document.createElement("div");
    ic.className = "dico";
    ic.textContent = iconFor(node);
    var nm = document.createElement("div");
    nm.className = "dname";
    nm.textContent = n;

    d.appendChild(ic);
    d.appendChild(nm);
    bindItem(d, path, {
      source: "desktop",
      onOpen: function (p) { openPath(p); }
    });
    layer.appendChild(d);
  });
}

function setDesktopGridPos(node, cx, cy) {
  var layer = document.getElementById("iconLayer");
  if (!layer || !node) return;
  var r = layer.getBoundingClientRect();
  var x = cx - r.left - 43;
  var y = cy - r.top - 32;
  var gx = Math.round((x - GRID_PAD) / GRID_W);
  var gy = Math.round((y - GRID_PAD) / GRID_H);
  node._gx = Math.max(0, gx);
  node._gy = Math.max(0, gy);
}

function inIconLayer(cx, cy) {
  var layer = document.getElementById("iconLayer");
  if (!layer) return false;
  var r = layer.getBoundingClientRect();
  return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
}

/* =========================================================
   十三、指针交互
   ========================================================= */
function bindPointer(el, handlers) {
  el.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    e.stopPropagation();
    e.preventDefault();

    var sx = e.clientX, sy = e.clientY;
    var down = true;
    var longFired = false;
    var dragging = false;
    var hasDrag = typeof handlers.onDragStart === "function";

    var longTimer = setTimeout(function () {
      longFired = true;
      if (handlers.onLong) handlers.onLong(e);
    }, 500);

    function move(ev) {
      if (!down || !hasDrag) return;
      var dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!dragging && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
        clearTimeout(longTimer);
        dragging = true;
        handlers.onDragStart(ev);
      }
      if (dragging && handlers.onDragMove) handlers.onDragMove(ev);
    }
    function up(ev) {
      if (!down) return;
      down = false;
      clearTimeout(longTimer);
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
      if (dragging) {
        if (handlers.onDragEnd) handlers.onDragEnd(ev);
        return;
      }
      if (longFired) return;
      if (handlers.onTap) handlers.onTap(ev);
    }
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
  });
}

function selectItem(el) {
  if (currentSelected && currentSelected !== el) currentSelected.classList.remove("sel");
  currentSelected = el;
  if (el) el.classList.add("sel");
}

function bindItem(el, path, opts) {
  opts = opts || {};
  var node = getNode(path);
  if (!node) return;
  var lastTap = 0;

  bindPointer(el, {
    onTap: function () {
      var now = Date.now();
      if (now - lastTap < 400) {
        lastTap = 0;
        selectItem(null);
        if (opts.onOpen) opts.onOpen(path);
        else openPath(path);
      } else {
        lastTap = now;
        selectItem(el);
      }
    },
    onLong: function (e) {
      selectItem(el);
      showItemMenu(e.clientX, e.clientY, path);
    },
    onDragStart: function (e) { startDrag(path, e, opts.source || "fm"); },
    onDragMove: function (e) { moveDrag(e); },
    onDragEnd: function (e) { endDrag(e); }
  });

  el.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    e.stopPropagation();
    selectItem(el);
    showItemMenu(e.clientX, e.clientY, path);
  });
}

/* =========================================================
   十四、拖拽系统
   ========================================================= */
function startDrag(path, e, source) {
  var node = getNode(path);
  if (!node) return;
  var ghost = document.createElement("div");
  ghost.className = "drag-ghost";
  ghost.textContent = iconFor(node) + " " + node.name;
  ghost.style.left = e.clientX + "px";
  ghost.style.top = e.clientY + "px";
  document.body.appendChild(ghost);
  dragState = { path: path, ghost: ghost, hover: null, source: source || "fm" };
}

function dropTargetAt(x, y) {
  if (!dragState) return null;
  var el = document.elementFromPoint(x, y);
  if (!el || !el.closest) return null;
  var cand = el.closest("[data-droppath],[data-recycle]");
  if (!cand) return null;

  if (cand.getAttribute("data-recycle") === "1") return cand;

  var p = cand.getAttribute("data-droppath");
  if (!p) return null;
  if (p === dragState.path) return null;
  if (p.indexOf(dragState.path + "/") === 0) return null;
  return cand;
}

function moveDrag(e) {
  if (!dragState) return;
  dragState.ghost.style.left = e.clientX + "px";
  dragState.ghost.style.top = e.clientY + "px";
  var target = dropTargetAt(e.clientX, e.clientY);
  if (dragState.hover && dragState.hover !== target) {
    dragState.hover.classList.remove("drop-hover");
  }
  dragState.hover = target;
  if (target && target.id !== "iconLayer") target.classList.add("drop-hover");
}

function endDrag(e) {
  if (!dragState) return;
  var path = dragState.path;
  var source = dragState.source;
  var hover = dragState.hover;
  if (dragState.ghost.parentNode) dragState.ghost.parentNode.removeChild(dragState.ghost);
  if (hover) hover.classList.remove("drop-hover");
  dragState = null;

  if (hover) {
    if (hover.getAttribute("data-recycle") === "1") {
      recyclePath(path);
      toast("已移入回收站");
      refreshAll();
      return;
    }
    var dest = hover.getAttribute("data-droppath");
    if (source === "desktop" && dest === DESKTOP_PATH) {
      var nd = getNode(path);
      if (nd) setDesktopGridPos(nd, e.clientX, e.clientY);
      renderDesktop();
      return;
    }
    if (dest) {
      var r = movePath(path, dest);
      if (!r.ok && r.msg && r.msg !== "已经在该位置") toast(r.msg);
      refreshAll();
      return;
    }
  }

  if (source === "desktop" && inIconLayer(e.clientX, e.clientY)) {
    var n2 = getNode(path);
    if (n2) setDesktopGridPos(n2, e.clientX, e.clientY);
    renderDesktop();
  }
}

/* =========================================================
   十五、窗口系统
   ========================================================= */
function focusWin(winObj) {
  activeWin = winObj;
  winZ++;
  winObj.el.style.zIndex = winZ;
  for (var i = 0; i < winList.length; i++) {
    if (winList[i].taskEl) {
      winList[i].taskEl.classList.toggle("active", winList[i] === winObj);
    }
  }
}

function createWindow(opts) {
  var el = document.createElement("div");
  el.className = "window";

  var availH = window.innerHeight - TASKBAR_H;
  var w = Math.min(opts.width || 580, window.innerWidth - 18);
  var h = Math.min(opts.height || 400, availH - 18);
  w = Math.max(w, 240);
  h = Math.max(h, 150);

  var k = winList.length % 6;
  var x = Math.max(6, Math.round((window.innerWidth - w) / 2) - 50 + k * 26);
  var y = Math.max(6, Math.round((availH - h) / 2) - 40 + k * 26);

  el.style.left = x + "px";
  el.style.top = y + "px";
  el.style.width = w + "px";
  el.style.height = h + "px";

  el.innerHTML =
    '<div class="titlebar">' +
      '<div class="ttl"></div>' +
      '<div class="ctls">' +
        '<button class="ctl ctl-min" data-act="min" title="最小化"><i></i></button>' +
        '<button class="ctl ctl-max" data-act="max" title="全屏"><i></i></button>' +
        '<button class="ctl ctl-close" data-act="close" title="关闭"><i></i></button>' +
      '</div>' +
    '</div>' +
    '<div class="content"></div>' +
    '<div class="rs rs-n" data-dir="n"></div>' +
    '<div class="rs rs-s" data-dir="s"></div>' +
    '<div class="rs rs-w" data-dir="w"></div>' +
    '<div class="rs rs-e" data-dir="e"></div>' +
    '<div class="rs rs-nw" data-dir="nw"></div>' +
    '<div class="rs rs-ne" data-dir="ne"></div>' +
    '<div class="rs rs-sw" data-dir="sw"></div>' +
    '<div class="rs rs-se" data-dir="se"></div>';

  el.querySelector(".ttl").textContent = opts.title || "窗口";
  document.getElementById("desktop").appendChild(el);

  var winObj = {
    id: ++winSeq,
    el: el,
    title: opts.title || "窗口",
    icon: opts.icon || "🪟",
    content: el.querySelector(".content"),
    minimized: false,
    maximized: false,
    saved: null,
    taskEl: null,
    refresh: null,
    onClose: opts.onClose || null
  };
  winObj.setTitle = function (t) {
    winObj.title = t;
    el.querySelector(".ttl").textContent = t;
    if (winObj.taskEl) {
      var nm = winObj.taskEl.querySelector(".t-name");
      if (nm) nm.textContent = t;
    }
  };

  winList.push(winObj);

  Array.prototype.forEach.call(el.querySelectorAll(".ctl"), function (btn) {
    var act = btn.getAttribute("data-act");
    btn.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      e.preventDefault();
    });
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      e.preventDefault();
      if (act === "min") minimizeWin(winObj);
      else if (act === "max") toggleMaximize(winObj);
      else if (act === "close") closeWin(winObj);
    });
  });

  el.addEventListener("pointerdown", function () { focusWin(winObj); }, true);

  el.addEventListener("pointerdown", function (e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    var t = e.target;
    var rz = t.closest ? t.closest(".rs") : null;
    if (rz && !winObj.maximized) {
      e.preventDefault();
      startResize(winObj, e, rz.getAttribute("data-dir"));
      return;
    }
    var tb = t.closest ? t.closest(".titlebar") : null;
    var isCtl = t.closest ? t.closest(".ctl") : null;
    if (tb && !isCtl && !winObj.maximized) {
      e.preventDefault();
      startMove(winObj, e);
    }
  });

  createTask(winObj);
  focusWin(winObj);
  return winObj;
}

function startMove(winObj, e) {
  var el = winObj.el;
  var sx = e.clientX, sy = e.clientY;
  var r = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };

  function onMove(ev) {
    var nx = r.x + (ev.clientX - sx);
    var ny = r.y + (ev.clientY - sy);
    var minX = 80 - r.w;
    var maxX = window.innerWidth - 80;
    var minY = 0;
    var maxY = window.innerHeight - TASKBAR_H;
    if (nx < minX) nx = minX;
    if (nx > maxX) nx = maxX;
    if (ny < minY) ny = minY;
    if (ny > maxY) ny = maxY;
    el.style.left = nx + "px";
    el.style.top = ny + "px";
  }
  function onUp() {
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

function startResize(winObj, e, dir) {
  var el = winObj.el;
  var sx = e.clientX, sy = e.clientY;
  var r = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };

  function onMove(ev) {
    var dx = ev.clientX - sx;
    var dy = ev.clientY - sy;
    var x = r.x, y = r.y, w = r.w, h = r.h;

    if (dir.indexOf("e") > -1) { w = Math.max(MIN_W, r.w + dx); }
    if (dir.indexOf("s") > -1) { h = Math.max(MIN_H, r.h + dy); }
    if (dir.indexOf("w") > -1) {
      w = Math.max(MIN_W, r.w - dx);
      x = r.x + r.w - w;
    }
    if (dir.indexOf("n") > -1) {
      h = Math.max(MIN_H, r.h - dy);
      y = r.y + r.h - h;
    }
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.width = w + "px";
    el.style.height = h + "px";
  }
  function onUp() {
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

function toggleMaximize(winObj) {
  var el = winObj.el;
  if (!winObj.maximized) {
    winObj.saved = {
      x: el.offsetLeft, y: el.offsetTop,
      w: el.offsetWidth, h: el.offsetHeight
    };
    winObj.maximized = true;
    el.classList.add("max");
    el.style.left = "0px";
    el.style.top = "0px";
    el.style.width = window.innerWidth + "px";
    el.style.height = (window.innerHeight - TASKBAR_H) + "px";
  } else {
    winObj.maximized = false;
    el.classList.remove("max");
    var s = winObj.saved;
    if (s) {
      el.style.left = s.x + "px";
      el.style.top = s.y + "px";
      el.style.width = s.w + "px";
      el.style.height = s.h + "px";
    }
  }
}

function minimizeWin(winObj) {
  winObj.minimized = true;
  winObj.el.style.display = "none";
  updateTasks();
}
function restoreWin(winObj) {
  winObj.minimized = false;
  winObj.el.style.display = "flex";
  focusWin(winObj);
  updateTasks();
}
function toggleTask(winObj) {
  if (winObj.minimized) restoreWin(winObj);
  else minimizeWin(winObj);
}
function closeWin(winObj) {
  if (winObj.onClose) { try { winObj.onClose(); } catch (e) {} }
  if (winObj.el.parentNode) winObj.el.parentNode.removeChild(winObj.el);
  if (winObj.taskEl && winObj.taskEl.parentNode) winObj.taskEl.parentNode.removeChild(winObj.taskEl);
  var i = winList.indexOf(winObj);
  if (i >= 0) winList.splice(i, 1);
  if (activeWin === winObj) activeWin = null;
  if (ctxEl) closeContextMenu();
  refreshAll();
}

/* =========================================================
   十六、任务栏
   ========================================================= */
function createTask(winObj) {
  var tasks = document.getElementById("tasks");
  var t = document.createElement("div");
  t.className = "task";

  var ico = document.createElement("span");
  ico.className = "t-ico";
  ico.textContent = winObj.icon;
  var nm = document.createElement("span");
  nm.className = "t-name";
  nm.textContent = winObj.title;

  t.appendChild(ico);
  t.appendChild(nm);
  tasks.appendChild(t);
  winObj.taskEl = t;

  var longTimer = null, longFired = false;

  t.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    e.stopPropagation();
    closeContextMenu();
    closeStartMenu();
    if (e.pointerType === "mouse" && e.button === 2) return;

    longFired = false;
    clearTimeout(longTimer);
    longTimer = setTimeout(function () {
      longFired = true;
      showTaskMenu(winObj, t);
    }, 500);

    function up() {
      clearTimeout(longTimer);
      document.removeEventListener("pointerup", up);
      document.removeEventListener("pointercancel", up);
      if (!longFired) toggleTask(winObj);
    }
    document.addEventListener("pointerup", up);
    document.addEventListener("pointercancel", up);
  });

  t.addEventListener("contextmenu", function (e) {
    e.preventDefault();
    e.stopPropagation();
    showTaskMenu(winObj, t);
  });
}

function showTaskMenu(winObj, taskEl) {
  var r = taskEl.getBoundingClientRect();
  showContextMenu(r.left, r.top - 4, [
    { label: "关闭窗口", action: function () { closeWin(winObj); } }
  ], true);
}

function updateTasks() {
  for (var i = 0; i < winList.length; i++) {
    if (winList[i].taskEl) {
      winList[i].taskEl.classList.toggle("min", winList[i].minimized);
    }
  }
}

/* =========================================================
   十七、Computer 程序
   ========================================================= */
function openComputer(startPath) {
  var path = startPath || DESKTOP_PATH;
  var winObj = createWindow({ title: "Computer - " + path, icon: "🖥", width: 660, height: 470 });
  var c = winObj.content;

  var fm = document.createElement("div");
  fm.className = "fm";
  fm.innerHTML =
    '<div class="fm-bar">' +
      '<button class="fm-btn" data-a="back">←</button>' +
      '<button class="fm-btn" data-a="up">↑</button>' +
      '<div class="fm-path"></div>' +
      '<button class="fm-btn" data-a="newdir">新建文件夹</button>' +
      '<button class="fm-btn" data-a="newfile">新建文件</button>' +
      '<button class="fm-btn" data-a="paste">粘贴</button>' +
    '</div>' +
    '<div class="fm-body"></div>';
  c.appendChild(fm);

  var bar = fm.querySelector(".fm-bar");
  var pathEl = fm.querySelector(".fm-path");
  var body = fm.querySelector(".fm-body");

  var current = path;
  var hist = [];

  function nav(p, push) {
    if (push && current !== p) hist.push(current);
    current = p;
    if (winObj.setTitle) winObj.setTitle("Computer - " + current);
    render();
  }

  function render() {
    if (!getNode(current)) current = DESKTOP_PATH;
    pathEl.textContent = current;
    body.setAttribute("data-droppath", current);
    body.innerHTML = "";

    var dir = getNode(current);
    if (!dir || dir.type !== "dir") {
      var e = document.createElement("div");
      e.className = "fm-empty";
      e.textContent = "路径不存在";
      body.appendChild(e);
      return;
    }

    var keys = Object.keys(dir.children).sort(function (a, b) { return cmpKeys(dir, a, b); });

    if (keys.length === 0) {
      var emp = document.createElement("div");
      emp.className = "fm-empty";
      emp.textContent = "空文件夹";
      body.appendChild(emp);
    }

    keys.forEach(function (n) {
      var node = dir.children[n];
      var p = current + "/" + n;

      var row = document.createElement("div");
      row.className = "fm-row";
      row.dataset.path = p;
      if (node.type === "dir") row.dataset.droppath = p;

      var ic = document.createElement("span");
      ic.className = "fi-icon";
      ic.textContent = iconFor(node);

      var nm = document.createElement("span");
      nm.className = "fi-name";
      nm.textContent = n;

      var meta = document.createElement("span");
      meta.className = "fi-meta";
      if (node.type === "dir") {
        var cnt = node.children ? Object.keys(node.children).length : 0;
        meta.textContent = "文件夹 · " + cnt + " 项";
      } else {
        var size = (node.content || "").length;
        meta.textContent = "文件 · " + size + " 字节";
      }

      row.appendChild(ic);
      row.appendChild(nm);
      row.appendChild(meta);

      bindItem(row, p, {
        source: "fm",
        onOpen: function (pp) {
          var nn = getNode(pp);
          if (!nn) return;
          if (nn.type === "dir") nav(pp, true);
          else openPath(pp);
        }
      });
      body.appendChild(row);
    });
  }

  winObj.refresh = render;

  bar.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".fm-btn") : null;
    if (!btn) return;
    var a = btn.getAttribute("data-a");
    if (a === "back") {
      if (hist.length) { current = hist.pop(); if (winObj.setTitle) winObj.setTitle("Computer - " + current); render(); }
    } else if (a === "up") {
      if (current === "C") return;
      var p = getParentPath(current);
      if (p) { hist.push(current); current = p; if (winObj.setTitle) winObj.setTitle("Computer - " + current); render(); }
    } else if (a === "newdir") {
      createNewFolder(current);
    } else if (a === "newfile") {
      createNewGenericFile(current);
    } else if (a === "paste") {
      pasteInto(current);
    }
  });

  body.addEventListener("contextmenu", function (e) {
    if (e.target.closest && e.target.closest(".fm-row")) return;
    e.preventDefault();
    showDirMenu(e.clientX, e.clientY, current);
  });

  body.addEventListener("pointerdown", function (e) {
    if (e.target !== body) return;
    closeContextMenu();
    selectItem(null);
    var timer = setTimeout(function () {
      showDirMenu(e.clientX, e.clientY, current);
    }, 500);
    function cancel() {
      clearTimeout(timer);
      document.removeEventListener("pointerup", cancel);
      document.removeEventListener("pointercancel", cancel);
    }
    document.addEventListener("pointerup", cancel);
    document.addEventListener("pointercancel", cancel);
  });

  render();
  return winObj;
}

        ev.stopPropagation();

          { label: "恢复", action: function () {
              if (restoreFromRecycle(it.id)) toast("已恢复");
            }
          },
          { label: "永久删除", action: function () {
              purgeFromRecycle(it.id);
              toast("已永久删除");
            }
          }
        ]);
      });

      var ltimer = null, fired = false;
      row.addEventListener("pointerdown", function (ev) {
        if (ev.pointerType === "mouse" && ev.button !== 0) return;
        ev.preventDefault();
        fired = false;
        clearTimeout(ltimer);
        ltimer = setTimeout(function () {
          fired = true;
          showContextMenu(ev.clientX, ev.clientY, [
            { label: "恢复", action: function () {

function runBatInFrame(frame, content) {
  var doc;
  try { doc = frame.contentDocument; } catch (e) { return; }
  if (!doc) return;

  var input = doc.getElementById("hiddenInput");
  if (!input) return;

  var lines = String(content).split(/\r?\n/).filter(function (l) {
    var t = l.replace(/\r$/, "").trim();
    if (t === "") return false;
    if (t.charAt(0) === "@" || t.charAt(0) === ":") return false;
    return true;
  });

  var i = 0;
  function step() {
    if (i >= lines.length) return;
    var line = lines[i++].replace(/\r$/, "");
    input.value = line;
    try { input.dispatchEvent(new Event("input", { bubbles: true })); } catch (e) {}

    var ev;
    try {
      ev = new KeyboardEvent("keydown", {
        key: "Enter", code: "Enter", keyCode: 13, which: 13,
        bubbles: true, cancelable: true
      });
    } catch (e) {
      ev = new Event("keydown", { bubbles: true, cancelable: true });
    }
    input.dispatchEvent(ev);
    setTimeout(step, 180);
  }
  setTimeout(step, 200);
}

/* 把虚拟文件内容转成 data URL，供 HTML 内引用 */
function fileToDataUrl(filename, node) {
  var ext = extOf(filename);
  var textMimes = {
    html: "text/html", htm: "text/html", css: "text/css",
    js: "application/javascript", json: "application/json",
    txt: "text/plain", md: "text/markdown", csv: "text/csv",
    xml: "application/xml", svg: "image/svg+xml", log: "text/plain"
  };
  var binMimes = {
    png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg",
    gif: "image/gif", webp: "image/webp", bmp: "image/bmp",
    ico: "image/x-icon", svg: "image/svg+xml",
    mp4: "video/mp4", webm: "video/webm", ogv: "video/ogg",
    mp3: "audio/mpeg", wav: "audio/wav", ogg: "audio/ogg",
    pdf: "application/pdf", woff: "font/woff", woff2: "font/woff2",
    ttf: "font/ttf", otf: "font/otf"
  };
  var content = String(node.content || "");

  if (textMimes[ext]) {
    var mime = textMimes[ext];
    try {
      return "data:" + mime + ";charset=utf-8," + encodeURIComponent(content);
    } catch (e) {
      return "data:" + mime + ";charset=utf-8," + content;
    }
  }

  var bmime = binMimes[ext] || "application/octet-stream";

  // 若内容是纯 base64 字符串（无空格以外的字符，且较长），直接当作 base64
  var compact = content.replace(/\s/g, "");
  if (compact.length > 24 && /^[A-Za-z0-9+/]+={0,2}$/.test(compact)) {
    return "data:" + bmime + ";base64," + compact;
  }

  // 否则把文本内容按 UTF-8 编码为 base64
  try {
    var b64 = btoa(unescape(encodeURIComponent(content)));
    return "data:" + bmime + ";base64," + b64;
  } catch (e) {
    return "data:" + bmime + ";base64,";
  }
}

/* 构造一个可被 iframe 直接渲染的 html，并把同目录相对引用替换成 data URL */
function buildHtmlPreview(htmlPath) {
  var node = getNode(htmlPath);
  if (!node || node.type !== "file") return "";
  var dirPath = getParentPath(htmlPath);
  var content = String(node.content || "");

  content = content.replace(/(\s(?:src|href|poster|data)\s*=\s*)(["'])([^"']+)\2/gi,
    function (m, pre, q, url) {
      if (/^(https?:|data:|blob:|mailto:|tel:|javascript:|about:|#|\/\/)/i.test(url)) return m;
      if (url.charAt(0) === "#") return m;
      var target = dirPath ? (dirPath + "/" + url) : url;
      var tn = getNode(target);
      if (!tn || tn.type !== "file") return m;
      try {
        return pre + q + fileToDataUrl(url, tn) + q;
      } catch (e) {
        return m;
      }
    }
  );

  return content;
}

function openBrowserWithFile(path) {
  var node = getNode(path);

  frame.setAttribute("allow", "autoplay; fullscreen");
  frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups allow-modals");

  if (ext === "html" || ext === "htm") {
    var html = buildHtmlPreview(path);
    frame.srcdoc = html;
  } else if (ext === "css" || ext === "js" || ext === "json" || ext === "txt" ||
             ext === "md" || ext === "csv" || ext === "xml" || ext === "log") {
    // 以纯文本方式展示
    var esc = String(node.content || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
    var lang = ext === "css" ? "CSS" : ext === "js" ? "JavaScript" : (ext === "json" ? "JSON" : "TEXT");
    frame.srcdoc =
      '<!DOCTYPE html><html><head><meta charset="utf-8">' +
      '<style>' +
      'html,body{margin:0;padding:0;background:#1e1e1e;height:100%;}' +
      'body{color:#dcdcdc;font-family:Consolas,"Courier New",monospace;font-size:13px;line-height:1.55;}' +
      '.hdr{padding:8px 14px;background:#2a2a2a;border-bottom:1px solid #3a3a3a;color:#9cdcfe;font-size:12px;letter-spacing:1px;}' +
      'pre{margin:0;padding:14px;white-space:pre-wrap;word-break:break-word;}' +
      '</style></head><body>' +
      '<div class="hdr">' + lang + ' 视图 · ' + esc.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").length + ' 字节</div>' +
      '<pre>' + esc + '</pre>' +
      '</body></html>';
  } else {
    // 其他类型：若可转为 data URL，则直接嵌入 iframe
    var dataUrl = fileToDataUrl(name, node);
    frame.src = dataUrl;
  }

  c.appendChild(frame);

  var done = false;
  function hide() {
    if (done) return;
    done = true;
    if (loading.parentNode) loading.parentNode.removeChild(loading);
  }
  frame.addEventListener("load", hide);
  setTimeout(hide, 4000);

  return winObj;
}

/* =========================================================

function buildStartMenu() {
  var m = document.getElementById("startMenu");
  m.innerHTML = "";

  var head = document.createElement("div");
  head.className = "sm-head";
  head.textContent = "KUNKUN Win Box";
  m.appendChild(head);

  var list = document.createElement("div");
  list.className = "sm-list";

  var folders = [];
  (function walk(node, path) {
    if (!node || node.type !== "dir") return;
    if (path !== "C") folders.push({ path: path, name: node.name });
    var keys = Object.keys(node.children || {});
    for (var i = 0; i < keys.length; i++) {
      walk(node.children[keys[i]], path + "/" + keys[i]);
    }
  })(FS, "C");

  var sub1 = document.createElement("div");
  sub1.className = "sm-sub";
  sub1.textContent = "C 盘文件夹";
  list.appendChild(sub1);

  if (folders.length === 0) {
    var e1 = document.createElement("div");
    e1.className = "sm-item";
    e1.textContent = "（无）";
    list.appendChild(e1);
  }
  folders.forEach(function (f) {
    var it = document.createElement("div");
    it.className = "sm-item";
    var ic = document.createElement("span");
    ic.textContent = "📁";
    var tx = document.createElement("span");
    tx.textContent = f.path;
    it.appendChild(ic);
    it.appendChild(tx);
    bindTapAction(it, function () {
      closeStartMenu();
      openComputer(f.path);
    });
    list.appendChild(it);
  });

  var sub2 = document.createElement("div");
  sub2.className = "sm-sub";
  sub2.textContent = "桌面";
  list.appendChild(sub2);

  var desk = getNode(DESKTOP_PATH);
  var dkeys = desk && desk.children ? Object.keys(desk.children).sort(function (a, b) { return cmpKeys(desk, a, b); }) : [];
  if (dkeys.length === 0) {
    var e2 = document.createElement("div");
    e2.className = "sm-item";
    e2.textContent = "（无）";
    list.appendChild(e2);
  }
  dkeys.forEach(function (n) {
    var node = desk.children[n];
    var p = DESKTOP_PATH + "/" + n;
    var it = document.createElement("div");
    it.className = "sm-item";
    var ic = document.createElement("span");
    ic.textContent = iconFor(node);
    var tx = document.createElement("span");
    tx.textContent = n;
    it.appendChild(ic);
    it.appendChild(tx);
    bindTapAction(it, function () {
      closeStartMenu();
      openPath(p);
    });
    list.appendChild(it);
  });

  m.appendChild(list);

  var foot = document.createElement("div");
  foot.className = "sm-foot";
  var sd = document.createElement("button");
  sd.className = "sm-shutdown";
  sd.textContent = "关机";
  bindTapAction(sd, function () {
    closeStartMenu();
    doShutdown();
  });
  foot.appendChild(sd);
  m.appendChild(foot);
}

/* =========================================================
   二十六、桌面事件
   ========================================================= */
function bindDesktopEvents() {
  var desktop = document.getElementById("desktop");
  var iconLayer = document.getElementById("iconLayer");

  desktop.addEventListener("contextmenu", function (e) {
    if (e.target.closest && (e.target.closest(".window") || e.target.closest("#taskbar") || e.target.closest(".dicon"))) return;
    e.preventDefault();
    closeStartMenu();
    showDirMenu(e.clientX, e.clientY, DESKTOP_PATH);
  });

  iconLayer.addEventListener("pointerdown", function (e) {
    if (e.target !== iconLayer) return;
    selectItem(null);
    closeContextMenu();
    var timer = setTimeout(function () {
      showDirMenu(e.clientX, e.clientY, DESKTOP_PATH);
    }, 500);
    function cancel() {
      clearTimeout(timer);
      document.removeEventListener("pointerup", cancel);
      document.removeEventListener("pointercancel", cancel);
    }
    document.addEventListener("pointerup", cancel);
    document.addEventListener("pointercancel", cancel);
  });

  document.getElementById("startBtn").addEventListener("pointerdown", function (e) {
    e.preventDefault();
    e.stopPropagation();
    closeContextMenu();
    toggleStartMenu();
  });

  document.addEventListener("pointerdown", function (e) {
    if (!startOpen) return;
    var sm = document.getElementById("startMenu");
    if (sm.contains(e.target)) return;
    if (e.target.closest && e.target.closest("#startBtn")) return;
    closeStartMenu();
  });

  window.addEventListener("resize", function () {
    for (var i = 0; i < winList.length; i++) {
      var w = winList[i];
      if (w.maximized) {
        w.el.style.left = "0px";
        w.el.style.top = "0px";
        w.el.style.width = window.innerWidth + "px";
        w.el.style.height = (window.innerHeight - TASKBAR_H) + "px";
      }
    }
    closeContextMenu();
    renderDesktop();
  });
}

/* =========================================================
   二十七、启动
   ========================================================= */
function init() {
  renderDesktop();
  bindDesktopEvents();

  setTimeout(function () {
    var boot = document.getElementById("boot");
    var desktop = document.getElementById("desktop");
    if (boot) boot.classList.add("hide");
    if (desktop) desktop.classList.add("show");
    setTimeout(function () {
      if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
      renderDesktop();
    }, 720);
  }, 2500);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

})();
