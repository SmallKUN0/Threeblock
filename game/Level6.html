<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Level 6</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            user-select: none;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            touch-action: none;
            background: #000;
        }
        #menu {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            position: absolute;
            z-index: 100;
            pointer-events: none;
        }
        .menu-btn {
            width: 260px;
            height: 80px;
            border: 5px solid rgba(255, 255, 255, .9);
            background: rgba(0, 0, 0, .45);
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
            letter-spacing: 4px;
            pointer-events: auto;
            text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
            flex-direction: column;
            line-height: 1.2;
            padding: 6px 12px;
            border-radius: 4px;
        }
        .menu-btn:active {
            background: rgba(0, 0, 0, .7);
            transform: scale(.96);
        }
        .menu-btn-sm {
            width: 200px;
            height: 56px;
            font-size: 20px;
            border-width: 3px;
            letter-spacing: 2px;
            margin-top: -4px;
        }
        #gameUI {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
        }
        #gameUI>* {
            pointer-events: auto;
        }
        #joystick {
            position: absolute;
            border: 3px solid rgba(255, 255, 255, .4);
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            display: none;
            touch-action: none;
            left: 3%;
            bottom: 14%;
            width: 260px;
            height: 260px;
            max-width: 38vw;
            max-height: 38vw;
        }
        #joystick-knob {
            position: absolute;
            width: 42%;
            height: 42%;
            background: rgba(255, 255, 255, .65);
            border-radius: 50%;
            left: 29%;
            top: 29%;
            pointer-events: none;
        }
        #backBtn {
            position: absolute;
            left: 5%;
            top: 5%;
            width: 110px;
            height: 68px;
            border: 2px solid rgba(255, 255, 255, .8);
            background: rgba(0, 0, 0, .55);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 4px;
            z-index: 52;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            pointer-events: none;
            z-index: 55;
            opacity: .85;
        }
        #crosshair-v {
            position: absolute;
            top: 0;
            left: 11px;
            width: 2px;
            height: 24px;
            background: #fff;
        }
        #crosshair-h {
            position: absolute;
            top: 11px;
            left: 0;
            width: 24px;
            height: 2px;
            background: #fff;
        }
        #crosshair-c {
            position: absolute;
            top: 11px;
            left: 11px;
            width: 2px;
            height: 2px;
            background: #fff;
        }
        #fpsDisplay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: #0f0;
            font-size: 16px;
            font-weight: bold;
            font-family: monospace;
            text-shadow: 0 0 4px #000;
            display: none;
            pointer-events: none;
            z-index: 60;
        }
        #resultScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .9);
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            pointer-events: none;
        }
        #resultText {
            font-size: 46px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 8px;
            text-shadow: 0 2px 16px rgba(0, 0, 0, .9);
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #sanityOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 80;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0.8) 100%);
            opacity: 0;
            transition: opacity 0.2s;
        }
        #appContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transform-origin: center center;
            transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                width 0.45s cubic-bezier(0.4, 0, 0.2, 1),
                height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            background: #000;
            z-index: 1;
        }
        #appContainer.portrait {
            width: 100vh;
            height: 100vw;
            transform: rotate(90deg);
            transform-origin: center center;
            margin-left: calc((100vw - 100vh) / 2);
            margin-top: calc((100vh - 100vw) / 2);
        }
        #appContainer>* {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #appContainer.portrait #menu .menu-btn {
            width: 200px;
            height: 64px;
            font-size: 22px;
        }
        #appContainer.portrait #menu .menu-btn-sm {
            width: 160px;
            height: 48px;
            font-size: 18px;
        }
        #appContainer.portrait #joystick {
            width: 220px;
            height: 220px;
            left: 2%;
            bottom: 8%;
        }
        @media (max-width: 600px) {
            .menu-btn {
                width: 200px;
                height: 64px;
                font-size: 22px;
            }
            .menu-btn-sm {
                width: 160px;
                height: 48px;
                font-size: 17px;
            }
            #joystick {
                width: 200px;
                height: 200px;
                left: 2%;
                bottom: 10%;
            }
        }
        #sprayBtn {
            position: absolute;
            right: 5%;
            bottom: 50%;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(255,255,255,.8);
            background: rgba(0,0,0,.55);
            color: #fff;
            font-size: 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 52;
            font-weight: bold;
            letter-spacing: 1px;
            user-select: none;
            -webkit-user-select: none;
            text-align: center;
        }
        #sprayBtn:active {
            background: rgba(255,255,255,.3);
        }
        #blackFilter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 79;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.7) 100%);
        }
        /* VR教学界面改为纯文本 */
        #vrTutorial {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 300;
            pointer-events: auto;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #vrTutorial .instruction {
            margin: 20px 0;
        }
        #tutLearn {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,255,0,0.7);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            z-index: 310;
        }
        /* 条款界面 */
        #termsOverlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 500;
            background: #000;
            color: #fff;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        #termsText {
            background: #0000ff;
            color: #fff;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 8px;
            margin-bottom: 30px;
            cursor: pointer;
            display: inline-block;
        }
        #termsCheckbox {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            vertical-align: middle;
        }
        #termsEnterBtn {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 30px;
            opacity: 0.5;
            pointer-events: none;
            transition: opacity 0.2s;
        }
        #termsEnterBtn.enabled {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="appContainer">
        <div id="menu">
            <div style="position:absolute;top:40px;left:50%;transform:translateX(-50%);font-size:48px;font-weight:bold;color:#fff;letter-spacing:12px;text-shadow:0 2px 12px rgba(0,0,0,.9);">熄灯</div>
            <div class="menu-btn" id="btnStart">开始游戏</div>
            <div class="menu-btn menu-btn-sm" id="btnFlipScreen">翻转屏幕</div>
            <div class="menu-btn menu-btn-sm" id="btnVR">VR模式    测试版</div>
            <div id="loadingText" style="font-size:18px;color:#fff;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.8);letter-spacing:2px;margin-top:-4px;">正在生成中，可能需要等待十几秒时间</div>
            <div style="position:absolute;bottom:16px;right:20px;font-size:13px;color:#fff;font-weight:bold;letter-spacing:1px;opacity:.7;text-shadow:0 1px 4px rgba(0,0,0,.8);">🏀坤坤工作室</div>
        </div>

        <!-- VR教学界面 -->
        <div id="vrTutorial">
            <div class="instruction">滑动左半边屏幕控制角色</div>
            <div class="instruction">滑动右半边屏幕控制视角</div>
            <div class="instruction">单击右半边屏幕开关粒子发射状态</div>
            <button id="tutLearn">学会了（点击正式进入游戏）</button>
        </div>

        <!-- 条款界面 -->
        <div id="termsOverlay">
            <div id="termsText">点击此文本查看具体事项</div>
            <div style="margin-top:20px;">
                <input type="checkbox" id="termsCheckbox">
                <label for="termsCheckbox" style="font-size:18px;">此游戏的内容不同以往</label>
            </div>
            <button id="termsEnterBtn" disabled>勾选进入</button>
        </div>

        <div id="gameUI">
            <div id="joystick"><div id="joystick-knob"></div></div>
            <div id="backBtn">返回主菜单</div>
            <div id="crosshair"><div id="crosshair-v"></div><div id="crosshair-h"></div><div id="crosshair-c"></div></div>
            <div id="fpsDisplay">0 FPS</div>
            <div id="sprayBtn">点击发射粒子</div>
            <div id="blackFilter"></div>
        </div>
        <div id="sanityOverlay"></div>
        <div id="resultScreen">
            <div id="resultText"></div>
            <div class="menu-btn" id="btnResultBack" style="pointer-events:auto;width:220px;height:70px;font-size:24px;">返回主菜单</div>
        </div>
        <div id="canvas-container"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==================== 配置 ====================
        const CONFIG = {
            mazeSize: 100,
            cellSize: 2.2,
            wallHeight: 2.56,
            cameraHeight: 1.6,
            fov: 75,
            sens: 2.34,
            speed: 1.0,
            viewRadius: 14,
            showFps: false
        };

        // ==================== 大区块系统 ====================
        const SUPER_BLOCK_SIZE = 10;
        const SUPER_BLOCK_COUNT = Math.floor(CONFIG.mazeSize / SUPER_BLOCK_SIZE);
        const dirtyBlocks = new Set();
        const pillarBlocks = new Set();

        function initSuperBlocks() {
            dirtyBlocks.clear();
            pillarBlocks.clear();
            for (let sbz = 0; sbz < SUPER_BLOCK_COUNT; sbz++) {
                for (let sbx = 0; sbx < SUPER_BLOCK_COUNT; sbx++) {
                    if (Math.random() < 0.6) dirtyBlocks.add(`${sbx},${sbz}`);
                    if (Math.random() < 0.4) pillarBlocks.add(`${sbx},${sbz}`);
                }
            }
        }

        function getSuperBlock(gx, gz) {
            return `${Math.floor(gx / SUPER_BLOCK_SIZE)},${Math.floor(gz / SUPER_BLOCK_SIZE)}`;
        }

        function isDirtyCell(gx, gz) {
            return dirtyBlocks.has(getSuperBlock(gx, gz));
        }

        function isPillarCell(gx, gz) {
            return pillarBlocks.has(getSuperBlock(gx, gz));
        }

        function isPlayerInDirtyBlock() {
            const gx = Math.floor(camera.position.x / CONFIG.cellSize + 0.5);
            const gz = Math.floor(camera.position.z / CONFIG.cellSize + 0.5);
            return isDirtyCell(gx, gz);
        }

        function findSafeSpawn() {
            const ms = CONFIG.mazeSize;
            const cx = Math.floor(ms / 2);
            const cz = Math.floor(ms / 2);
            if (!isDirtyCell(cx, cz)) return { gx: cx, gz: cz };
            for (let r = 1; r < ms; r++) {
                for (let dz = -r; dz <= r; dz++) {
                    for (let dx = -r; dx <= r; dx++) {
                        if (Math.abs(dx) !== r && Math.abs(dz) !== r) continue;
                        const nx = cx + dx;
                        const nz = cz + dz;
                        if (nx < 1 || nx >= ms - 1 || nz < 1 || nz >= ms - 1) continue;
                        if (!isDirtyCell(nx, nz)) return { gx: nx, gz: nz };
                    }
                }
            }
            return { gx: cx, gz: cz };
        }

        // ==================== 核心变量 ====================
        let scene, camera, renderer;
        let appState = 'menu';
        let clock = new THREE.Clock();
        let fpsFrameCount = 0,
            fpsLastTime = 0;
        let joystick = { active: false, dx: 0, dy: 0, originX: 0, originY: 0, maxR: 43 };
        let lookInput = { active: false, lastX: 0, lastY: 0 };
        let pressedKeys = new Set();
        const menu = document.getElementById('menu');
        const gameUI = document.getElementById('gameUI');
        const fpsDisplay = document.getElementById('fpsDisplay');
        const joystickEl = document.getElementById('joystick');
        const knobEl = document.getElementById('joystick-knob');
        const backBtn = document.getElementById('backBtn');
        const resultScreen = document.getElementById('resultScreen');
        const resultText = document.getElementById('resultText');
        const btnResultBack = document.getElementById('btnResultBack');
        const sanityOverlay = document.getElementById('sanityOverlay');
        const appContainer = document.getElementById('appContainer');
        const btnFlipScreen = document.getElementById('btnFlipScreen');
        const sprayBtn = document.getElementById('sprayBtn');
        const btnVR = document.getElementById('btnVR');
        const vrTutorial = document.getElementById('vrTutorial');
        const tutLearn = document.getElementById('tutLearn');
        const termsOverlay = document.getElementById('termsOverlay');
        const termsText = document.getElementById('termsText');
        const termsCheckbox = document.getElementById('termsCheckbox');
        const termsEnterBtn = document.getElementById('termsEnterBtn');
        const crosshair = document.getElementById('crosshair');

        let isPortrait = false;
        let isVRMode = false;
        let monsterSpawnTimer = 0;
        let lastMoveTime = 0;
        let hasSpawnedIdle = false;
        let pendingVR = false; // 判断是否VR模式启动

        // ==================== 理智计时器变量 ====================
        let sanityTime = 0;

        // ==================== 动态数据 ====================
        const activeCells = new Map();
        let monsters = new Map();
        let sharedWallGeo = null;
        let sharedWallMat = null;
        let sharedWallMatDirty = null;
        let sharedPillarGeo = null;
        let sharedFloorGeo = null;
        let sharedFloorMat = null;
        let sharedFloorMatDirty = null;
        let sharedCeilGeo = null;
        let sharedCeilMat = null;
        let sharedCeilMatDirty = null;
        let manholeGeo = null;
        let manholeMat = null;
        let texturesLoaded = false;
        let wasMoving = false;

        // 动态光源
        let playerLight = null;
        let ambientLight = null;
        // 行走晃动
        let walkTime = 0;
        // 雾颜色渐变
        let currentFogColor = new THREE.Color(0x000000);
        // 脏区块渐变程度
        let currentDirtyLevel = 0.0;

        // 地板/天花板网格数组
        let floorMeshes = [];
        let ceilMeshes = [];

        // 喷漆相关
        let isSpraying = false;
        let lastSprayTime = 0;
        let sprayColorIndex = 0;
        const sprayColors = [0xff0000, 0xffa500, 0xffff00, 0x00ff00, 0x0000ff, 0x800080, 0xffffff];
        let sprayMarks = [];
        let exitSprayMarks = [];

        // Eye 怪物
        let eyeMonster = null;
        let eyeDir = { x: 1, z: 0 };
        let eyeSpeed = 1.5;
        let eyeTarget = null;
        let eyeState = 'moving';
        let eyeTimer = 0;

        // 雷达 HUD
        let hudGroup = null;
        let hudPanel = null;
        let radarRedDot = null;
        const RADAR_RANGE = 30;

        // VR触摸相关
        let vrMoveTouchId = null;
        let vrLookTouchId = null;
        let vrMoveOriginX = 0, vrMoveOriginY = 0;
        let vrLookLastX = 0, vrLookLastY = 0;
        let vrLastClickTime = 0;
        let vrClickCount = 0;

        // 音频
        let bgmAudio = null;
        let audioCtx = null;

        // ==================== 纹理加载 ====================
        const textures = {};
        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        function loadTexture(name, url) {
            return new Promise((resolve) => {
                textureLoader.load(url, (tex) => {
                    tex.wrapS = THREE.RepeatWrapping;
                    tex.wrapT = THREE.RepeatWrapping;
                    tex.magFilter = THREE.LinearFilter;
                    tex.minFilter = THREE.LinearMipmapLinearFilter;
                    tex.generateMipmaps = true;
                    textures[name] = tex;
                    resolve();
                }, undefined, () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 64;
                    canvas.height = 64;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, 64, 64);
                    const fallback = new THREE.CanvasTexture(canvas);
                    fallback.wrapS = THREE.RepeatWrapping;
                    fallback.wrapT = THREE.RepeatWrapping;
                    fallback.magFilter = THREE.LinearFilter;
                    fallback.minFilter = THREE.LinearMipmapLinearFilter;
                    fallback.generateMipmaps = true;
                    textures[name] = fallback;
                    resolve();
                });
            });
        }

        // ==================== 初始化 Three.js ====================
        function initThree() {
            if (renderer) return;
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            camera = new THREE.PerspectiveCamera(CONFIG.fov, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, CONFIG.cameraHeight, 0);
            camera.rotation.order = 'YXZ';
            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            window.addEventListener('resize', () => {
                resizeRenderer();
            });
            playerLight = new THREE.PointLight(0xffaa00, 0.6, 8.8);
            playerLight.visible = true;
            scene.add(playerLight);
            ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            createRadarHUD();
        }

        function resizeRenderer() {
            const container = document.getElementById('canvas-container');
            if (!container) return;
            const w = container.clientWidth || window.innerWidth;
            const h = container.clientHeight || window.innerHeight;
            if (w === 0 || h === 0) return;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }

        // ==================== 创建雷达HUD ====================
        function createRadarHUD() {
            if (hudGroup) return;
            hudGroup = new THREE.Group();
            scene.add(hudGroup);

            hudPanel = new THREE.Group();
            hudGroup.add(hudPanel);

            const radarRadius = 0.6;

            const bgGeo = new THREE.CircleGeometry(radarRadius, 64);
            const bgMat = new THREE.MeshBasicMaterial({ color: 0x001100, side: THREE.DoubleSide });
            const bg = new THREE.Mesh(bgGeo, bgMat);
            bg.rotation.x = -Math.PI / 2;
            bg.position.y = 0.001;
            hudPanel.add(bg);

            const borderGeo = new THREE.RingGeometry(radarRadius - 0.004, radarRadius + 0.004, 64);
            const borderMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide });
            const border = new THREE.Mesh(borderGeo, borderMat);
            border.rotation.x = -Math.PI / 2;
            border.position.y = 0.002;
            hudPanel.add(border);

            for (let i = 1; i <= 4; i++) {
                const r = (radarRadius / 4) * i;
                const ringGeo = new THREE.RingGeometry(r - 0.002, r + 0.002, 64);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = -Math.PI / 2;
                ring.position.y = 0.003;
                hudPanel.add(ring);
            }

            const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff00 });
            const hLine = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-radarRadius, 0, 0),
                    new THREE.Vector3(radarRadius, 0, 0)
                ]), lineMat
            );
            const vLine = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, 0, -radarRadius),
                    new THREE.Vector3(0, 0, radarRadius)
                ]), lineMat
            );
            hudPanel.add(hLine, vLine);

            const diagMat = new THREE.LineBasicMaterial({ color: 0x00ff00, opacity: 0.5, transparent: true });
            const d1 = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-radarRadius*0.707, 0, -radarRadius*0.707),
                new THREE.Vector3(radarRadius*0.707, 0, radarRadius*0.707)
            ]), diagMat);
            const d2 = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-radarRadius*0.707, 0, radarRadius*0.707),
                new THREE.Vector3(radarRadius*0.707, 0, -radarRadius*0.707)
            ]), diagMat);
            hudPanel.add(d1, d2);

            const greenDot = new THREE.Mesh(
                new THREE.SphereGeometry(0.03, 16, 16),
                new THREE.MeshBasicMaterial({ color: 0x00ff00 })
            );
            greenDot.position.y = 0.01;
            hudPanel.add(greenDot);

            const glow = new THREE.Mesh(
                new THREE.CircleGeometry(0.07, 32),
                new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide, transparent: true, opacity: 0.5 })
            );
            glow.rotation.x = -Math.PI / 2;
            glow.position.y = 0.012;
            hudPanel.add(glow);

            radarRedDot = new THREE.Mesh(
                new THREE.SphereGeometry(0.02, 12, 12),
                new THREE.MeshBasicMaterial({ color: 0xff0000 })
            );
            radarRedDot.position.y = 0.01;
            hudPanel.add(radarRedDot);

            const scanLine = new THREE.Line(

            );
            scanLine.position.y = 0.005;
            hudPanel.add(scanLine);
            hudPanel.userData.scanLine = scanLine;

            hudGroup.position.set(0, 0, 0);
