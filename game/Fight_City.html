<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>OPERATION WINTER LINE — Pixel Sniper</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05060c;
    font-family:"Courier New",Consolas,monospace;}

  #app{
    position:fixed;
    top:50%;
    left:50%;
    width:100vw;
    height:100vh;
    transform:translate(-50%,-50%);
    transform-origin:center center;
    background:#05060c;
    overflow:hidden;
    transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);
  }
  #app.portrait{
    width:100vh;
    height:100vw;
    transform:translate(-50%,-50%) rotate(90deg);
  }
  #stage{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    line-height:0;
  }
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none;}

  #hud{
    position:absolute;left:0;right:0;bottom:8px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    pointer-events:none;line-height:1.3;
  }
  #weapons{display:flex;gap:5px;pointer-events:auto;flex-wrap:wrap;justify-content:center;}
  .wbtn{
    padding:6px 12px;border-radius:7px;
    background:rgba(16,22,38,.82);
    border:1px solid rgba(120,165,225,.45);
    color:#9fb6d8;font-family:inherit;font-size:12px;letter-spacing:1px;
    cursor:pointer;user-select:none;white-space:nowrap;line-height:1.3;
    backdrop-filter:blur(2px);
    transition:background .15s,border-color .15s,color .15s,box-shadow .15s;
  }
  .wbtn:hover{background:rgba(32,48,80,.92);border-color:rgba(160,205,255,.8);color:#dce9ff;}
  .wbtn.active{
    background:rgba(56,108,182,.92);
    border-color:rgba(178,218,255,.95);
    color:#fff;
    box-shadow:0 0 14px rgba(90,160,255,.55);
  }
  #regen{
    pointer-events:auto;
    padding:6px 14px;border-radius:7px;
    background:rgba(16,22,38,.82);
    border:1px solid rgba(120,165,225,.45);
    color:#cfe2ff;font-family:inherit;font-size:12px;letter-spacing:1px;
    cursor:pointer;user-select:none;white-space:nowrap;line-height:1.3;
    backdrop-filter:blur(2px);
  }
  #regen:hover{background:rgba(32,48,80,.92);border-color:rgba(160,205,255,.85);color:#fff;}
  #regen:active{transform:scale(.96);}

  #throwBtn{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    width:76px;height:76px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(80,130,210,.95), rgba(20,40,80,.95));
    border:2px solid rgba(160,205,255,.75);
    color:#eaf3ff;font-family:inherit;font-size:15px;font-weight:bold;letter-spacing:2px;
    cursor:pointer;user-select:none;line-height:1.15;
    box-shadow:0 4px 20px rgba(60,130,240,.45), inset 0 2px 8px rgba(255,255,255,.18);
    transition:transform .1s, box-shadow .15s;
    z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  #throwBtn:hover{box-shadow:0 4px 26px rgba(100,170,255,.7), inset 0 2px 10px rgba(255,255,255,.25);}
  #throwBtn:active{transform:translateY(-50%) scale(.92);}
  #throwBtn .ico{font-size:22px;line-height:1;}

  #joystick{
    position:absolute;left:20px;bottom:64px;
    width:128px;height:128px;border-radius:50%;
    background:rgba(16,22,38,.72);
    border:2px solid rgba(120,165,225,.5);
    backdrop-filter:blur(2px);
    touch-action:none;user-select:none;z-index:20;
    box-shadow:inset 0 2px 14px rgba(0,0,0,.55);
  }
  #joystick::before{
    content:'';position:absolute;inset:14px;border-radius:50%;
    border:1px dashed rgba(120,165,225,.25);pointer-events:none;
  }
  #joystickKnob{
    position:absolute;left:50%;top:50%;
    width:52px;height:52px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #9dc4ff, #3a6cc0);
    border:2px solid rgba(200,225,255,.9);
    transform:translate(-50%,-50%);
    box-shadow:0 2px 10px rgba(60,130,240,.6);
    pointer-events:none;will-change:transform;
  }

  #hpWrap{
    position:absolute;left:14px;top:14px;
    width:158px;height:22px;border-radius:11px;
    background:rgba(10,14,24,.85);
    border:1px solid rgba(120,165,225,.5);
    overflow:hidden;z-index:20;backdrop-filter:blur(2px);
  }
  #hpFill{
    height:100%;width:100%;
    background:linear-gradient(90deg,#3ddc84,#7ef0a8);
    transition:width .12s linear, background .3s;
  }
  #hpFill.low{background:linear-gradient(90deg,#e04a4a,#ff8a6a);}
  #hpText{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:#eaf3ff;letter-spacing:1px;
    text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none;
  }

  #flipBtn{
    position:absolute;right:14px;top:14px;
    padding:6px 12px;border-radius:7px;
    background:rgba(16,22,38,.82);
    border:1px solid rgba(120,165,225,.45);
    color:#cfe2ff;font-family:inherit;font-size:12px;letter-spacing:1px;
    cursor:pointer;user-select:none;white-space:nowrap;line-height:1.3;
    backdrop-filter:blur(2px);z-index:30;
  }
  #flipBtn:hover{background:rgba(32,48,80,.92);border-color:rgba(160,205,255,.85);color:#fff;}
  #flipBtn:active{transform:scale(.96);}

  #gameOver,#gameWin{
    position:absolute;inset:0;z-index:100;
    background:rgba(4,6,14,.88);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;backdrop-filter:blur(4px);
  }
  #gameOver.show,#gameWin.show{display:flex;}
  #gameOver .title{
    font-size:46px;color:#ff5a5a;letter-spacing:8px;
    text-shadow:0 0 26px rgba(255,60,60,.8);
  }
  #gameWin .title{
    font-size:46px;color:#5aff8a;letter-spacing:8px;
    text-shadow:0 0 26px rgba(60,255,120,.8);
  }
  #gameOver .sub,#gameWin .sub{font-size:14px;color:#9fb6d8;letter-spacing:3px;}
  #retryBtn,#winBtn{
    margin-top:10px;padding:12px 38px;border-radius:9px;
    background:rgba(56,108,182,.92);
    border:1px solid rgba(178,218,255,.95);
    color:#fff;font-family:inherit;font-size:15px;letter-spacing:3px;
    cursor:pointer;box-shadow:0 0 20px rgba(90,160,255,.5);
  }
  #retryBtn:hover,#winBtn:hover{background:rgba(80,140,220,.95);}
  #retryBtn:active,#winBtn:active{transform:scale(.96);}

  #videoAudio{display:none;}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hpWrap">
      <div id="hpFill"></div>
      <div id="hpText">100 / 100</div>
    </div>

    <div id="joystick"><div id="joystickKnob"></div></div>

    <button id="throwBtn"><span class="ico">🎯</span>投掷</button>
    <button id="flipBtn">🔄 屏幕翻转</button>

    <div id="hud">
      <div id="weapons">
        <button class="wbtn active" data-weapon="sniper">🔫 狙击枪</button>
        <button class="wbtn" data-weapon="bomb">💣 炸药</button>
        <button class="wbtn" data-weapon="fire">🔥 火弹</button>
        <button class="wbtn" data-weapon="c4">⏱️ 计时C4</button>
      </div>
      <button id="regen">重新生成</button>
    </div>

    <div id="gameOver">
      <div class="title">任 务 失 败</div>
      <div class="sub">OPERATOR DOWN</div>
      <button id="retryBtn">重 新 部 署</button>
    </div>

    <div id="gameWin">
      <div class="title">任 务 完 成</div>
      <div class="sub">MISSION ACCOMPLISHED</div>
      <button id="winBtn">再 来 一 次</button>
    </div>
  </div>
</div>

<audio id="videoAudio" preload="auto" crossorigin="anonymous"></audio>

<script>
(function(){
'use strict';

/* ============================================================
   基础工具
   ============================================================ */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function hash3(x,y,s){
  let h=Math.imul(x|0,0x27d4eb2d);
  h^=Math.imul(y|0,0x165667b1);
  h^=Math.imul(s|0,0x9e3779b1);
  h=Math.imul(h^(h>>>15),0x85ebca6b);
  h^=h>>>13;
  h=Math.imul(h,0xc2b2ae35);
  h^=h>>>16;
  return (h>>>0)/4294967296;
}
let _uid = 1;
function allocId(){ return _uid++; }

/* ============================================================
   全局状态
   ============================================================ */
const CHUNK_W = 160;
const WHITE_CHUNK_CHANCE = 0.00004;
let   seed    = (Math.random()*1e9)|0;

let LOGICAL_W = 480;
let LOGICAL_H = 270;
let groundBase = 157;

const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const stage  = document.getElementById('stage');
const app    = document.getElementById('app');

let flipped = false;

const videoAudio = document.getElementById('videoAudio');
const VIDEO_AUDIO_URL = 'https://tymov2.a.kwimgs.com/upic/2026/01/24/17/BMjAyNjAxMjQxNzE2MTdfMjc1NTMzNTg1MV8xODU4NDQzNDY0MzlfMV8z_b_B183ae35e40acbe03cdce4e5c5cbcf800.mp4?clientCacheKey=3xwnzqskycug4z4_b.mp4&tt=b&di=89f966a&bp=10004';
let videoAudioReady = false;

const chunks = new Map();
const damage = new Map();
const chunkWindows = new Map();
const whiteChunks = new Set();

let turrets = [];
const turretHpStore = new Map();
const TURRET_CHANCE = 0.04;

let camX = 0;

const player = {
  id: 0,
  x: 0, y: 0,
  facing: 1,
  hp: 100, maxHp: 100,
  regen: 0,
  alive: true,
  moving: false
};

let cars   = [];
let peds   = [];
let helis  = [];
let bombs  = [];
let shards = [];
let bullets= [];
let particles = [];
let impacts  = [];
let mushroomClouds = [];

let carTimer = 0;
let pedTimer = 0;
let heliTimer = 6;

let redAlertTimer = 0;
let alertEventTimer = 35;
let beepsToPlay = 0;
let beepTimer = 0;
let pendingShakes = 0;
let shakeQueueTimer = 0;

let weapon = 'sniper';
let gameOver = false;
let gameWin  = false;

const chunkSpawnState = new Map();

let joyDX = 0, joyDY = 0;
const keys = {};

/* ============================================================
   尺寸
   ============================================================ */
function resize(){
  const cw = stage.parentElement.clientWidth;
  const ch = stage.parentElement.clientHeight;
  const ar = cw/ch;

  let W = 480;
  let H = Math.round(W/ar);
  if(H < 240){ H = 240; W = Math.round(H*ar); }
  if(H > 780){ H = 780; W = Math.round(H*ar); }

  LOGICAL_W = Math.max(320, Math.round(W));
  LOGICAL_H = Math.max(220, Math.round(H));

  const groundH = Math.round(Math.max(112, Math.min(200, LOGICAL_H*0.42)));
  groundBase = LOGICAL_H - groundH;

  canvas.width  = LOGICAL_W;
  canvas.height = LOGICAL_H;

  const s = Math.min(cw/LOGICAL_W, ch/LOGICAL_H);
  const dw = Math.round(LOGICAL_W*s);
  const dh = Math.round(LOGICAL_H*s);
  canvas.style.width  = dw+'px';
  canvas.style.height = dh+'px';
  stage.style.width   = dw+'px';
  stage.style.height  = dh+'px';

  chunks.clear();
  damage.clear();
  chunkWindows.clear();
  whiteChunks.clear();
  chunkSpawnState.clear();
  turrets = [];
  turretHpStore.clear();
  impacts.length = 0;
  particles.length = 0;
  mushroomClouds.length = 0;

  player.y = groundBase + 12;
  player.x = 0;
  camX = player.x - LOGICAL_W*0.40;
}

/* ============================================================
   屏幕翻转
   ============================================================ */
function toggleFlip(){
  flipped = !flipped;
  if(flipped){
    app.classList.add('portrait');
  }else{
    app.classList.remove('portrait');
  }
  setTimeout(function(){
    resize();
    needPrewarm = true;
  }, 480);
}

/* ============================================================
   视频音频
   ============================================================ */
function initVideoAudio(){
  if(videoAudioReady) return;
  videoAudio.src = VIDEO_AUDIO_URL;
  videoAudio.load();
  videoAudioReady = true;
}
function playVideoAudio(){
  initVideoAudio();
  if(videoAudio.paused){
    videoAudio.currentTime = 0;
    var p = videoAudio.play();
    if(p !== undefined){ p.catch(function(){}); }
  }
}

/* ============================================================
   粒子
   ============================================================ */
function addParticle(x, y, vx, vy, color, life, size, gravity){
  if(!isFinite(x) || !isFinite(y)) return;
  if(particles.length > 900) particles.shift();
  particles.push({
    x:x, y:y, vx:vx, vy:vy,
    color:color, life:life, t:0, size:size,
    g:(gravity === undefined ? 150 : gravity)
  });
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.t += dt;
    if(p.t >= p.life){ particles.splice(i,1); continue; }
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.vy += p.g*dt;
  }
}
function drawParticles(){
  for(let i=0;i<particles.length;i++){
    const p = particles[i];
    const a = 1 - p.t/p.life;
    ctx.globalAlpha = a < 0 ? 0 : a;
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x - camX), Math.round(p.y), p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   破坏辅助
   ============================================================ */
function getDamage(ci){
  let d = damage.get(ci);
  if(!d){ d = { dead:new Set(), windowsOff:new Set() }; damage.set(ci, d); }
  return d;
}
function erasePixelSet(c2, W, set){
  if(!set) return;
  const rows = new Map();
  set.forEach(function(idx){
    const y = (idx / W) | 0;
    const x = idx - y * W;
    let a = rows.get(y);
    if(!a){ a = []; rows.set(y, a); }
    a.push(x);
  });
  if(!rows.size) return;
  c2.save();
  c2.globalCompositeOperation = 'destination-out';
  c2.fillStyle = '#000';
  rows.forEach(function(xs, y){
    xs.sort(function(a,b){ return a-b; });
    let s = xs[0], p = xs[0];
    for(let i=1;i<xs.length;i++){
      if(xs[i] === p+1){ p = xs[i]; continue; }
      c2.fillRect(s, y, p-s+1, 1);
      s = p = xs[i];
    }
    c2.fillRect(s, y, p-s+1, 1);
  });
  c2.restore();
}
function ensureChunk(ci){
  let cv = chunks.get(ci);
  if(!cv){ cv = buildChunk(ci); chunks.set(ci, cv); }
  return cv;
}
function isTurretPixel(ci, lx, y){
  for(let i=0;i<turrets.length;i++){
    const t = turrets[i];
    if(t.ci !== ci) continue;
    if(lx >= t.x0 && lx < t.x1 && y >= t.y0 && y < t.y1) return true;
  }
  return false;
}

/* ============================================================
   区块生成
   ============================================================ */
function buildChunk(ci){
  const W = CHUNK_W, H = LOGICAL_H, GB = groundBase;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c2 = cv.getContext('2d');

  for(let i=turrets.length-1;i>=0;i--){
    if(turrets[i].ci === ci) turrets.splice(i,1);
  }

  const cseed = (seed ^ Math.imul(ci, 0x9E3779B1)) >>> 0;
  const rng = mulberry32(cseed);

  if(rng() < WHITE_CHUNK_CHANCE){
    whiteChunks.add(ci);
    c2.fillStyle = '#ffffff';
    c2.fillRect(0, 0, W, H);
    chunkWindows.set(ci, []);
    return cv;
  }

  const img = c2.createImageData(W, H);
  const d = img.data;

  const wx0 = ci * CHUNK_W;
  const lights = [];
  const winList = [];

  const dmg    = damage.get(ci);
  const offSet = dmg ? dmg.windowsOff : null;

  const P = (x,y,r,g,b)=>{
    x|=0; y|=0;
    if(x<0||x>=W||y<0||y>=H) return;
    const i = (y*W+x)<<2;
    d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255;
  };
  const NZ = (x,y)=> hash3(wx0+x, y, seed) - 0.5;

  for(let y=0;y<GB;y++){
    const t = y/GB;
    const br = 5 + t*t*16;
    const bg = 8 + t*t*21;
    const bb = 25 + t*42;
    for(let x=0;x<W;x++){
      const n = NZ(x,y)*10;
      P(x,y, br+n, bg+n, bb+n);
    }
  }

  const SC = 7;
  const cx0 = Math.floor(wx0/SC)-1;
  const cx1 = Math.floor((wx0+W)/SC)+1;
  const cyMax = Math.ceil(GB/SC);
  for(let cx=cx0; cx<=cx1; cx++){
    for(let cy=0; cy<cyMax; cy++){
      const h = hash3(cx*37+11, cy*91+5, seed);
      if(h < 0.80) continue;
      const sx = cx*SC + Math.floor(hash3(cx,cy,seed^0x1234)*SC) - wx0;
      const sy = cy*SC + Math.floor(hash3(cx,cy,seed^0x5678)*SC);
      if(sy >= GB) continue;
      if(sx<0||sx>=W) continue;
      const b = 0.45 + hash3(cx*3,cy*5,seed)*0.55;
      const v = Math.floor(150 + b*105);
      P(sx, sy, v, v, Math.min(255, v+22));
      if(b > 0.92){
        P(sx+1, sy, v*0.6, v*0.6, v*0.7);
        P(sx, sy+1, v*0.6, v*0.6, v*0.7);
      }
    }
  }

  const hScale = Math.min(Math.max(H/270, 1), 1.6);

  let bx = -22;
  while(bx < W+22){
    const bw = Math.floor(16 + rng()*34);
    const bh = Math.floor((26 + rng()*52) * hScale);
    const top = GB - bh;
    const v = 9 + Math.floor(rng()*7);
    const yA = Math.max(0, top);
    const xA = Math.max(0, bx);
    const xB = Math.min(W, bx+bw);
    for(let y=yA; y<GB; y++){
      for(let x=xA; x<xB; x++){
        const n = NZ(x,y)*5;
        P(x,y, v+n, v+3+n, v+13+n);
      }
    }
    const cnt = Math.floor(rng()*4);
    for(let k=0;k<cnt;k++){
      const wx = bx + 3 + Math.floor(rng()*(bw-6));
      const wy = top + 3 + Math.floor(rng()*Math.max(1,bh-6));
      if(wy<0||wy>=GB) continue;
      P(wx,wy, 190, 155, 90);
    }
    bx += bw + Math.floor(rng()*5);
  }

  bx = -46;
  while(bx < W+46){
    const bw = Math.floor(26 + rng()*40);
    const bh = Math.floor((44 + rng()*74) * hScale);
    const top = GB - bh;

    const isTurret = (rng() < TURRET_CHANCE) && (bh >= 16) && (bw >= 16);

    const v = 17 + rng()*15;
    const br = v, bg = v+4, bb = v+19;

    const xA = Math.max(0, bx), xB = Math.min(W, bx+bw);
    const yA = Math.max(0, top);

    for(let y=yA; y<GB; y++){
      for(let x=xA; x<xB; x++){
        const n = NZ(x,y)*7;
        P(x,y, br+n, bg+n, bb+n);
      }
    }
    if(top>=0){
      for(let x=xA;x<xB;x++){
        P(x, top, br+22, bg+22, bb+26);
      }
    }

    const padX=3, padY=5, stepX=7, stepY=9, ww=4, wh=4;
    const cols = Math.floor((bw - padX*2)/stepX);
    const rows = Math.floor((bh - padY*2)/stepY);
    const litRate = 0.40;

    for(let rr=0; rr<rows; rr++){
      for(let cc=0; cc<cols; cc++){
        const wx = bx + padX + cc*stepX;
        const wy = top + padY + rr*stepY;
        if(wx + ww > bx + bw) continue;
        if(wy + wh > GB) continue;
        if(wy < 0) continue;

        for(let yy=0; yy<wh; yy++){
          for(let xx=0; xx<ww; xx++){
            if(xx===0 || yy===0 || xx===ww-1 || yy===wh-1){
              const n = NZ(wx+xx, wy+yy)*11;
              P(wx+xx, wy+yy, 58+n, 62+n, 74+n);
            }
          }
        }

        const off = offSet ? offSet.has(wx+','+wy) : false;
        const lit = rng() < litRate;

        if(lit){
          const t = rng();
          let cr,cg,cb;
          if(t<0.52){ cr=255; cg=198; cb=108; }
          else if(t<0.82){ cr=255; cg=168; cb=78; }
          else { cr=196; cg=216; cb=255; }
          const k = 0.5 + rng()*0.5;
          const addGlow = rng() < 0.10;

          if(off){
            for(let yy=1; yy<wh-1; yy++){
              for(let xx=1; xx<ww-1; xx++){
                const n = NZ(wx+xx, wy+yy)*5;
                P(wx+xx, wy+yy, 20+n, 24+n, 37+n);
              }
            }
          }else{
            for(let yy=1; yy<wh-1; yy++){
              for(let xx=1; xx<ww-1; xx++){
                const n = NZ(wx+xx, wy+yy)*14;
                P(wx+xx, wy+yy, cr*k+n, cg*k+n, cb*k+n);
              }
            }
            winList.push({x:wx, y:wy});
            if(addGlow){
              lights.push({x:wx+1.5, y:wy+1.5, r:9, c0:'rgba(255,190,100,0.16)'});
            }
          }
        }else{
          for(let yy=1; yy<wh-1; yy++){
            for(let xx=1; xx<ww-1; xx++){
              const n = NZ(wx+xx, wy+yy)*5;
              P(wx+xx, wy+yy, 20+n, 24+n, 37+n);
            }
          }
        }
      }
    }

    if(isTurret){
      const tw = 10, th = 7;
      const tx = bx + Math.floor((bw - tw)/2);
      const ty = top - th;

      for(let y=Math.max(0,ty); y<top; y++){
        for(let x=tx; x<tx+tw; x++){
          if(x<0 || x>=W) continue;
          const n = NZ(x,y)*4;
          P(x, y, 48+n, 52+n, 60+n);
        }
      }
      for(let y=Math.max(0, ty-3); y<ty; y++){
        if(tx+4 >= 0 && tx+4 < W) P(tx+4, y, 72, 76, 86);
        if(tx+5 >= 0 && tx+5 < W) P(tx+5, y, 48, 52, 60);
      }
      if(ty-4 >= 0 && tx+4 >= 0 && tx+4 < W) P(tx+4, ty-4, 255, 70, 70);

      const key = ci + '_' + tx;
      const savedHp = turretHpStore.has(key) ? turretHpStore.get(key) : 1000;

      const x0 = Math.max(0, tx);
      const x1 = Math.min(W, tx + tw);
      const y0 = Math.max(0, ty - 4);
      const y1 = top;

      if(savedHp > 0 && x1 > x0 && y1 > y0){
        turrets.push({
          id: allocId(),
          ci: ci,
          localX: tx,
          localY: ty,
          x0: x0,
          y0: y0,
          x1: x1,
          y1: y1,
          worldX: wx0 + tx + tw/2,
          worldY: ty + th/2,
          hp: savedHp,
          maxHp: 1000,
          fireCd: 2 + Math.random()*3,
          redFlash: 0,
          key: key
        });
      }
    }

    if(rng() < 0.30 && top > 6){
      const ax = bx + 4 + Math.floor(rng()*(bw-8));
      const ah = 4 + Math.floor(rng()*8);
      for(let y=top-ah; y<top; y++){
        if(y>=0) P(ax, y, 48, 52, 70);
      }
      P(ax, top-ah, 255, 90, 90);
      lights.push({x:ax, y:top-ah, r:7, c0:'rgba(255,80,80,0.55)'});
    }

    bx += bw + Math.floor(rng()*7) + 2;
  }

  const walkBot = Math.min(H, GB+14);
  for(let y=GB; y<walkBot; y++){
    for(let x=0;x<W;x++){
      const n = NZ(x,y)*8;
      let r=34,g=38,b=55;
      if(y < GB+2){ r=52; g=58; b=80; }
      P(x,y, r+n, g+n, b+n);
    }
  }

  const roadTop = GB+14;
  const roadBot = Math.min(H, GB+42);
  for(let y=roadTop; y<roadBot; y++){
    for(let x=0;x<W;x++){
      const n = NZ(x,y)*6;
      P(x,y, 16+n, 19+n, 30+n);
    }
  }
  const midY = roadTop + 14;
  if(midY < H){
    for(let x=0;x<W;x++){
      if(((wx0+x) % 18) < 8){
        P(x, midY,   72, 78, 98);
        if(midY+1<H) P(x, midY+1, 58, 64, 82);
      }
    }
  }

  for(let y=roadBot; y<H; y++){
    const t = (y-roadBot)/Math.max(1,(H-roadBot));
    const br = 8 + t*5;
    const bg = 11 + t*6;
    const bb = 22 + t*10;
    for(let x=0;x<W;x++){
      const n = NZ(x,y)*7;
      P(x,y, br+n, bg+n, bb+n);
    }
  }
  const glintCount = 30;
  for(let i=0;i<glintCount;i++){
    const gx = Math.floor(rng()*W);
    const gy = roadBot + 4 + Math.floor(rng()*Math.max(1,(H-roadBot-8)));
    const len = 3 + Math.floor(rng()*11);
    for(let k=0;k<len;k++){
      const n = NZ(gx+k, gy)*10;
      P(gx+k, gy, 38+n, 50+n, 80+n);
    }
  }

  const spacing = 62;
  const startWX = Math.ceil(wx0/spacing)*spacing;
  for(let wx=startWX; wx<wx0+W; wx+=spacing){
    const lx = wx - wx0;
    if(lx < -6 || lx > W+6) continue;
    const poleTop = GB - 36;
    const poleBot = Math.min(H, GB + 12);
    for(let y=Math.max(0,poleTop); y<poleBot; y++){
      P(lx,   y, 44, 48, 66);
      P(lx+1, y, 32, 36, 52);
    }
    for(let k=0;k<5;k++){
      if(poleTop>=0) P(lx+k, poleTop, 44, 48, 66);
    }
    const hx = lx+4, hy = Math.max(0, poleTop+1);
    P(hx,   hy, 255, 238, 190);
    P(hx+1, hy, 255, 220, 150);
    lights.push({x:hx+0.5, y:hy+1, r:34, c0:'rgba(255,186,88,0.34)'});
    lights.push({x:hx+0.5, y:hy+1, r:13, c0:'rgba(255,236,180,0.75)'});
  }

  c2.putImageData(img, 0, 0);

  c2.globalCompositeOperation = 'lighter';
  for(let i=0;i<lights.length;i++){
    const L = lights[i];
    const g = c2.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
    g.addColorStop(0, L.c0);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    c2.fillStyle = g;
    c2.beginPath();
    c2.arc(L.x, L.y, L.r, 0, Math.PI*2);
    c2.fill();
  }
  c2.globalCompositeOperation = 'source-over';

  if(dmg && dmg.dead.size) erasePixelSet(c2, W, dmg.dead);

  chunkWindows.set(ci, winList);
  return cv;
}

/* ============================================================
   音频引擎
   ============================================================ */
let audioCtx = null;
let noiseBuf = null;
let curveCache = null;

const MAX_CONCURRENT_SOUNDS = 6;
let activeSounds = [];

function acquireSoundSlot(durationSec){
  const now = performance.now();
  if(activeSounds.length){
    let w = 0;
    for(let i=0;i<activeSounds.length;i++){
      if(activeSounds[i] > now) activeSounds[w++] = activeSounds[i];
    }
    activeSounds.length = w;
  }
  if(activeSounds.length >= MAX_CONCURRENT_SOUNDS) return false;
  activeSounds.push(now + durationSec * 1000);
  return true;
}
function initAudio(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    audioCtx = new AC();
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return true;
}
function getNoiseBuffer(){
  if(noiseBuf) return noiseBuf;
  const len = Math.floor(audioCtx.sampleRate * 2.5);
  noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) data[i] = Math.random()*2 - 1;
  return noiseBuf;
}
function getCurve(){
  if(curveCache) return curveCache;
  const n = 2048;
  const c = new Float32Array(n);
  for(let i=0;i<n;i++){
    const x = (i/(n-1))*2 - 1;
    c[i] = Math.tanh(x*2.2);
  }
  curveCache = c;
  return c;
}

const EXPLOSION_DURATION = 2.4;
const GUNSHOT_DURATION   = 0.22;
const BEEP_DURATION      = 0.15;

function playExplosion(volume){
  if(!initAudio()) return;
  const vol = (volume === undefined ? 0.85 : volume);
  if(vol <= 0.001) return;
  if(!acquireSoundSlot(EXPLOSION_DURATION)) return;
  try {
    const now = audioCtx.currentTime + 0.001;
    const out = audioCtx.createGain();
    out.gain.value = vol;
    out.connect(audioCtx.destination);

    const noise = audioCtx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    noise.loop = true;

    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 0.7;
    lp.frequency.setValueAtTime(4200, now);
    lp.frequency.exponentialRampToValueAtTime(90, now + 1.8);

    const shaper = audioCtx.createWaveShaper();
    shaper.curve = getCurve();
    shaper.oversample = '2x';

    const env = audioCtx.createGain();
    env.gain.setValueAtTime(0.0001, now);
    env.gain.exponentialRampToValueAtTime(1.00, now + 0.006);
    env.gain.exponentialRampToValueAtTime(0.45, now + 0.12);
    env.gain.exponentialRampToValueAtTime(0.07, now + 0.90);
    env.gain.exponentialRampToValueAtTime(0.0001, now + 2.30);

    noise.connect(lp).connect(shaper).connect(env).connect(out);
    noise.start(now); noise.stop(now + 2.4);

    const sub = audioCtx.createOscillator();
    sub.type = 'sine';
    const f0 = 90 + Math.random()*45;
    sub.frequency.setValueAtTime(f0, now);
    sub.frequency.exponentialRampToValueAtTime(24, now + 1.1);

    const subGain = audioCtx.createGain();
    subGain.gain.setValueAtTime(0.0001, now);
    subGain.gain.exponentialRampToValueAtTime(0.9, now + 0.01);
    subGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.5);

    sub.connect(subGain).connect(out);
    sub.start(now); sub.stop(now + 1.6);

    const crack = audioCtx.createBufferSource();
    crack.buffer = getNoiseBuffer();
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 1800;
    const crackGain = audioCtx.createGain();
    crackGain.gain.setValueAtTime(0.7, now);
    crackGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
    crack.connect(hp).connect(crackGain).connect(out);
    crack.start(now); crack.stop(now + 0.1);
  } catch(e) {}
}
function playGunshot(vol){
  if(!initAudio()) return;
  const v = (vol === undefined ? 0.7 : vol);
  if(v <= 0.001) return;
  if(!acquireSoundSlot(GUNSHOT_DURATION)) return;
  try {
    const now = audioCtx.currentTime + 0.001;
    const out = audioCtx.createGain();
    out.gain.value = v;
    out.connect(audioCtx.destination);

    const noise = audioCtx.createBufferSource();
    noise.buffer = getNoiseBuffer();
    const bp = audioCtx.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(3600, now);
    bp.frequency.exponentialRampToValueAtTime(420, now + 0.14);

    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(0.0001, now);
    ng.gain.exponentialRampToValueAtTime(1.0, now + 0.002);
    ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

    noise.connect(bp).connect(ng).connect(out);
    noise.start(now); noise.stop(now + 0.2);

    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(240, now);
    osc.frequency.exponentialRampToValueAtTime(58, now + 0.09);

    const og = audioCtx.createGain();
    og.gain.setValueAtTime(0.0001, now);
    og.gain.exponentialRampToValueAtTime(0.55, now + 0.003);
    og.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);

    osc.connect(og).connect(out);
    osc.start(now); osc.stop(now + 0.16);
  } catch(e) {}
}
/* 滴滴声 —— 提高响度 */
function playBeep(){
  if(!initAudio()) return;
  if(!acquireSoundSlot(BEEP_DURATION)) return;
  try {
    const now = audioCtx.currentTime + 0.001;
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = 880;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.5, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.16);
  } catch(e) {}
}

/* ============================================================
   屏幕震动 —— 关键修复：保留 -50% 居中偏移，避免翻转后偏移
   ============================================================ */
function shakeStage(mag){
  if(!stage.animate) return;
  const m = (mag === undefined ? 11 : mag);
  const N = 12;
  const frames = [];
  for(let i=0;i<=N;i++){
    const p = i/N;
    const amp = m * (1-p) * (1-p);
    frames.push({
      transform:
        'translate(-50%,-50%) ' +
        'translate(' + ((Math.random()*2-1)*amp).toFixed(2) + 'px,' +
                       ((Math.random()*2-1)*amp).toFixed(2) + 'px) ' +
        'rotate(' + ((Math.random()*2-1)*amp*0.06).toFixed(3) + 'deg)'
    });
  }
  stage.animate(frames, { duration: 420, easing: 'ease-out' });
}

/* ============================================================
   伤害系统
   ============================================================ */
function damagePlayer(amount, srcId){
  if(!player.alive || gameOver || gameWin) return;
  if(srcId === player.id) return;
  player.hp -= amount;
  if(player.hp <= 0){
    player.hp = 0;
    player.alive = false;
    triggerGameOver();
  }
}
function damageCar(c, amount, srcId){
  if(c.destroyed || c.hp <= 0) return;
  if(srcId === c.id) return;
  c.hp -= amount;
  if(c.hp <= 0){
    c.hp = 0;
    destroyCar(c);
  }
}
function damagePed(p, amount, srcId){
  if(p.broken || p.hp <= 0) return;
  if(srcId === p.id) return;
  p.hp -= amount;
  if(p.hp <= 0){
    p.hp = 0;
    damagePedBreak(p);
  }
}
function damageHeli(h, amount, srcId){
  if(h.destroyed || h.hp <= 0) return;
  if(srcId === h.id) return;
  h.hp -= amount;
  if(h.hp <= 0){
    h.hp = 0;
    destroyHeli(h);
  }
}

/* ============================================================
   爆炸
   ============================================================ */
function doExplosion(worldX, worldY, radius, damage, srcId, destroyPixels, isPlayerSource){
  if(!isFinite(worldX) || !isFinite(worldY)) return;
  const r2 = radius * radius;

  if(destroyPixels){
    const byChunk = new Map();
    function addCell(fx, fy){
      const x = Math.floor(fx), y = Math.floor(fy);
      if(y < 0 || y >= LOGICAL_H) return;
      const ci = Math.floor(x / CHUNK_W);
      const lx = x - ci * CHUNK_W;
      if(isTurretPixel(ci, lx, y)) return;
      let s = byChunk.get(ci);
      if(!s){ s = new Set(); byChunk.set(ci, s); }
      s.add(y * CHUNK_W + lx);
    }

    const yA = Math.max(0, Math.floor(worldY - radius));
    const yB = Math.min(LOGICAL_H-1, Math.ceil(worldY + radius));
    for(let y=yA; y<=yB; y++){
      const dy = y - worldY;
      const q = r2 - dy*dy;
      if(q < 0) continue;
      const span = Math.sqrt(q);
      const sx = Math.floor(worldX - span);
      const ex = Math.ceil(worldX + span);
      for(let x=sx; x<=ex; x++) addCell(x, y);
    }

    const crackCount = 6 + Math.floor(Math.random()*5);
    for(let c=0;c<crackCount;c++){
      let ang = Math.random() * Math.PI * 2;
      let cxx = worldX, cyy = worldY;
      const steps = Math.floor(radius * (0.9 + Math.random()*1.6));
      for(let s=0;s<steps;s++){
        ang += (Math.random()-0.5) * 0.55;
        cxx += Math.cos(ang);
        cyy += Math.sin(ang);
        addCell(cxx, cyy);
        if(Math.random() < 0.40) addCell(cxx, cyy + 1);
      }
    }

    byChunk.forEach(function(cells, ci){
      const dmg = getDamage(ci);
      cells.forEach(function(idx){ dmg.dead.add(idx); });
    });

    const toRebuild = new Set();
    byChunk.forEach(function(cells, ci){
      const dmg = getDamage(ci);
      const wins = chunkWindows.get(ci);
      if(wins && wins.length){
        const offX = ci * CHUNK_W;
        for(let i=0;i<wins.length;i++){
          const w = wins[i];
          const wwx = offX + w.x;
          const nx = Math.max(wwx, Math.min(worldX, wwx + 4));
          const ny = Math.max(w.y, Math.min(worldY, w.y + 4));
          const dx = nx - worldX, dy = ny - worldY;
          if(dx*dx + dy*dy <= r2){
            const key = w.x + ',' + w.y;
            if(!dmg.windowsOff.has(key)){
              dmg.windowsOff.add(key);
              toRebuild.add(ci);
            }
          }
        }
      }
    });

    toRebuild.forEach(function(ci){
      chunks.set(ci, buildChunk(ci));
    });

    byChunk.forEach(function(cells, ci){
      if(toRebuild.has(ci)) return;
      const cv = chunks.get(ci);
      if(!cv) return;
      erasePixelSet(cv.getContext('2d'), CHUNK_W, cells);
    });
  }

  for(let i=0;i<cars.length;i++){
    const c = cars[i];
    if(c.destroyed) continue;
    const nx = Math.max(c.x, Math.min(worldX, c.x + c.w));
    const ny = Math.max(c.y, Math.min(worldY, c.y + c.h));
    const dx = nx - worldX, dy = ny - worldY;
    if(dx*dx + dy*dy <= r2) damageCar(c, damage, srcId);
  }

  for(let i=0;i<peds.length;i++){
    const p = peds[i];
    if(p.broken) continue;
    const nx = Math.max(p.x, Math.min(worldX, p.x + 3));
    const ny = Math.max(p.feetY - 8, Math.min(worldY, p.feetY));
    const dx = nx - worldX, dy = ny - worldY;
    if(dx*dx + dy*dy <= r2) damagePed(p, damage, srcId);
  }

  for(let i=0;i<helis.length;i++){
    const h = helis[i];
    if(h.destroyed) continue;
    const dx = h.x - worldX, dy = h.y - worldY;
    if(dx*dx + dy*dy <= (radius + 14)*(radius + 14)){
      damageHeli(h, damage, srcId);
    }
  }

  for(let i=0;i<turrets.length;i++){
    const t = turrets[i];
    if(t.hp <= 0) continue;
    const dx = t.worldX - worldX, dy = t.worldY - worldY;
    if(dx*dx + dy*dy <= r2){
      t.hp -= damage;
      t.redFlash = 0.4;
      turretHpStore.set(t.key, t.hp);
    }
  }

  if(player.alive){
    const nx = Math.max(player.x - 2, Math.min(worldX, player.x + 2));
    const ny = Math.max(player.y - 10, Math.min(worldY, player.y));
    const dx = nx - worldX, dy = ny - worldY;
    if(dx*dx + dy*dy <= r2) damagePlayer(damage, srcId);
  }

  impacts.push({ x:worldX, y:worldY, t:0, life:0.55, type:'boom', r:radius });
}

function doC4Explosion(worldX, worldY, baseR, crackLength){
  if(!isFinite(worldX) || !isFinite(worldY)) return;
  const byChunk = new Map();
  function addCell(fx, fy){
    const x = Math.floor(fx), y = Math.floor(fy);
    if(y < 0 || y >= LOGICAL_H) return;
    const ci = Math.floor(x / CHUNK_W);
    const lx = x - ci * CHUNK_W;
    if(isTurretPixel(ci, lx, y)) return;
    let s = byChunk.get(ci);
    if(!s){ s = new Set(); byChunk.set(ci, s); }
    s.add(y * CHUNK_W + lx);
  }

  const r2 = baseR*baseR;
  const yA = Math.max(0, Math.floor(worldY - baseR));
  const yB = Math.min(LOGICAL_H-1, Math.ceil(worldY + baseR));
  for(let y=yA; y<=yB; y++){
    const dy = y - worldY;
    const q = r2 - dy*dy;
    if(q < 0) continue;
    const span = Math.sqrt(q);
    const sx = Math.floor(worldX - span);
    const ex = Math.ceil(worldX + span);
    for(let x=sx; x<=ex; x++) addCell(x, y);
  }

  const crackCount = 9 + Math.floor(Math.random()*6);
  for(let c=0;c<crackCount;c++){
    let ang = Math.random() * Math.PI * 2;
    let cxx = worldX, cyy = worldY;
    const steps = Math.floor(crackLength * (0.9 + Math.random()*0.5));
    for(let s=0;s<steps;s++){
      ang += (Math.random()-0.5) * 0.40;
      cxx += Math.cos(ang);
      cyy += Math.sin(ang);
      addCell(cxx, cyy);
      if(Math.random() < 0.35) addCell(cxx, cyy + 1);
    }
  }

  byChunk.forEach(function(cells, ci){
    const dmg = getDamage(ci);
    cells.forEach(function(idx){ dmg.dead.add(idx); });
  });

  const toRebuild = new Set();
  byChunk.forEach(function(cells, ci){
    const dmg = getDamage(ci);
    const wins = chunkWindows.get(ci);
    if(wins && wins.length){
      const offX = ci * CHUNK_W;
      for(let i=0;i<wins.length;i++){
        const w = wins[i];
        const wwx = offX + w.x;
        const nx = Math.max(wwx, Math.min(worldX, wwx + 4));
        const ny = Math.max(w.y, Math.min(worldY, w.y + 4));
        const dx = nx - worldX, dy = ny - worldY;
        if(dx*dx + dy*dy <= r2){
          const key = w.x + ',' + w.y;
          if(!dmg.windowsOff.has(key)){
            dmg.windowsOff.add(key);
            toRebuild.add(ci);
          }
        }
      }
    }
  });

  toRebuild.forEach(function(ci){ chunks.set(ci, buildChunk(ci)); });
  byChunk.forEach(function(cells, ci){
    if(toRebuild.has(ci)) return;
    const cv = chunks.get(ci);
    if(!cv) return;
    erasePixelSet(cv.getContext('2d'), CHUNK_W, cells);
  });

  const crackR = baseR + crackLength;
  const crackR2 = crackR * crackR;
  const baseR2 = baseR * baseR;

  function hurtAt(nx, ny, damageFn){
    const d2 = (nx - worldX)*(nx - worldX) + (ny - worldY)*(ny - worldY);
    if(d2 <= baseR2) damageFn(400);
    else if(d2 <= crackR2) damageFn(50);
  }

  for(let i=0;i<cars.length;i++){
    const c = cars[i];
    if(c.destroyed) continue;
    const nx = Math.max(c.x, Math.min(worldX, c.x + c.w));
    const ny = Math.max(c.y, Math.min(worldY, c.y + c.h));
    hurtAt(nx, ny, function(dmg){ damageCar(c, dmg, -1); });
  }
  for(let i=0;i<peds.length;i++){
    const p = peds[i];
    if(p.broken) continue;
    const nx = Math.max(p.x, Math.min(worldX, p.x + 3));
    const ny = Math.max(p.feetY - 8, Math.min(worldY, p.feetY));
    hurtAt(nx, ny, function(dmg){ damagePed(p, dmg, -1); });
  }
  for(let i=0;i<helis.length;i++){
    const h = helis[i];
    if(h.destroyed) continue;
    hurtAt(h.x, h.y, function(dmg){ damageHeli(h, dmg, -1); });
  }
  if(player.alive){
    const nx = Math.max(player.x - 2, Math.min(worldX, player.x + 2));
    const ny = Math.max(player.y - 10, Math.min(worldY, player.y));
    hurtAt(nx, ny, function(dmg){ damagePlayer(dmg, -1); });
  }

  impacts.push({ x:worldX, y:worldY, t:0, life:0.7, type:'boom', r:baseR });
}

function spawnShards(worldX, worldY, count, srcId, isPlayerSource, damage){
  if(!isFinite(worldX) || !isFinite(worldY)) return;
  for(let i=0;i<count;i++){
    const ang = Math.random() * Math.PI * 2;
    const spd = 60 + Math.random() * 140;
    shards.push({
      x: worldX,
      y: worldY,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 30,
      timer: 0.6,
      owner: srcId,
      isPlayer: isPlayerSource,
      damage: damage
    });
  }
}

function applyCage(){
  if(!player.alive) return;
  if(!isFinite(player.x)) return;
  const leftB = camX;
  const rightB = camX + LOGICAL_W;

  for(let i=0;i<cars.length;i++){
    const c = cars[i];
    if(c.destroyed) continue;
    if(c.x + c.w < leftB || c.x > rightB) continue;
    if(c.x < leftB){ c.x = leftB; c.dir = 1; }
    if(c.x + c.w > rightB){ c.x = rightB - c.w; c.dir = -1; }
  }
  for(let i=0;i<peds.length;i++){
    const p = peds[i];
    if(p.broken) continue;
    if(p.x + 3 < leftB || p.x > rightB) continue;
    if(p.x < leftB){ p.x = leftB; p.dir = 1; }
    if(p.x + 3 > rightB){ p.x = rightB - 3; p.dir = -1; }
  }
}

/* ============================================================
   玩家更新
   ============================================================ */
function updatePlayer(dt){
  if(!player.alive || gameOver || gameWin) return;

  if(player.hp < player.maxHp){
    player.regen += dt;
    let guard = 0;
    while(player.regen >= 0.2 && player.hp < player.maxHp && guard < 50){
      player.regen -= 0.2;
      player.hp = Math.min(player.maxHp, player.hp + 1);
      guard++;
    }
  }

  let inx = 0, iny = 0;
  if(Math.abs(joyDX) > 0.001 || Math.abs(joyDY) > 0.001){
    inx = joyDX;
    iny = joyDY;
  } else {
    if(keys['a'] || keys['arrowleft']) inx -= 1;
    if(keys['d'] || keys['arrowright']) inx += 1;
    if(keys['w'] || keys['arrowup']) iny -= 1;
    if(keys['s'] || keys['arrowdown']) iny += 1;
    const mag = Math.sqrt(inx*inx + iny*iny);
    if(mag > 1){ inx /= mag; iny /= mag; }
  }

  if(flipped){
    const tx = inx;
    const ty = iny;
    inx = ty;
    iny = -tx;
  }

  if(!isFinite(inx)) inx = 0;
  if(!isFinite(iny)) iny = 0;

  const speed = 115;
  if(inx !== 0 || iny !== 0){
    player.x += inx * speed * dt;
    player.y += iny * speed * dt;

    if(!isFinite(player.x)) player.x = 0;
    if(!isFinite(player.y)) player.y = groundBase + 12;

    const pYMin = groundBase + 4;
    const pYMax = LOGICAL_H - 6;
    if(player.y < pYMin) player.y = pYMin;
    if(player.y > pYMax) player.y = pYMax;
  }

  if(inx > 0.1) player.facing = 1;
  else if(inx < -0.1) player.facing = -1;

  player.moving = (Math.abs(inx) > 0.1 || Math.abs(iny) > 0.1);

  updateHpUI();

  if(!gameWin){
    const pci = Math.floor(player.x / CHUNK_W);
    if(whiteChunks.has(pci)){
      triggerGameWin();
    }
  }
}

/* ============================================================
   子弹
   ============================================================ */
function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    let dead = false;
    if(b.life <= 0 || b.y < -50 || b.y > LOGICAL_H + 20) dead = true;
    if(b.x < camX - 500 || b.x > camX + LOGICAL_W + 500) dead = true;

    if(!dead && b.fromPlayer){
      let hit = false;
      for(let j=0;j<cars.length;j++){
        const c = cars[j];
        if(c.destroyed) continue;
        if(b.x >= c.x && b.x < c.x + c.w && b.y >= c.y && b.y < c.y + c.h){
          damageCar(c, b.damage, b.owner);
          if(b.isFire){ c.burning = true; c.burnTickCd = 0.05; }
          hit = true; break;
        }
      }
      if(!hit){
        for(let j=0;j<peds.length;j++){
          const p = peds[j];
          if(p.broken) continue;
          if(b.x >= p.x && b.x < p.x + 3 && b.y >= p.feetY - 8 && b.y < p.feetY){
            damagePed(p, b.damage, b.owner);
            if(b.isFire){ p.burning = true; p.burnTickCd = 0.05; }
            hit = true; break;
          }
        }
      }
      if(!hit){
        for(let j=0;j<helis.length;j++){
          const h = helis[j];
          if(h.destroyed) continue;
          if(Math.abs(b.x - h.x) < 12 && Math.abs(b.y - h.y) < 6){
            damageHeli(h, b.damage, b.owner);
            if(b.isFire){ h.burning = true; h.burnTickCd = 0.05; }
            hit = true; break;
          }
        }
      }
      if(!hit){
        for(let j=0;j<turrets.length;j++){
          const t = turrets[j];
          if(t.hp <= 0) continue;
          if(b.x >= t.x0 + t.ci*CHUNK_W && b.x <= t.x1 + t.ci*CHUNK_W &&
             b.y >= t.y0 && b.y <= t.y1){
            t.hp -= b.damage;
            t.redFlash = 0.3;
            turretHpStore.set(t.key, t.hp);
            hit = true; break;
          }
        }
      }
      if(hit){
        if(b.isFire){
          doExplosion(b.x, b.y, 8, 0, b.owner, false, true);
          impacts.push({ x:b.x, y:b.y, t:0, life:0.22, type:'boom', r:8 });
          playExplosion(0.17);
        }
        dead = true;
      }
    }else if(!dead && !b.fromPlayer){
      if(player.alive &&
         b.x >= player.x - 3 && b.x < player.x + 3 &&
         b.y >= player.y - 11 && b.y < player.y + 1){
        damagePlayer(b.damage, b.owner);
        dead = true;
      }
      if(!dead){
        for(let j=0;j<peds.length;j++){
          const p = peds[j];
          if(p.broken || p.id === b.owner) continue;
          if(b.x >= p.x && b.x < p.x + 3 && b.y >= p.feetY - 8 && b.y < p.feetY){
            damagePed(p, b.damage, b.owner);
            dead = true; break;
          }
        }
      }
      if(!dead){
        for(let j=0;j<cars.length;j++){
          const c = cars[j];
          if(c.destroyed || c.id === b.owner) continue;
          if(b.x >= c.x && b.x < c.x + c.w && b.y >= c.y && b.y < c.y + c.h){
            damageCar(c, b.damage, b.owner);
            dead = true; break;
          }
        }
      }
    }

    if(dead) bullets.splice(i,1);
  }
}

/* ============================================================
   炸弹 / 导弹 / C4
   ============================================================ */
function checkBombEnemyCollision(b){
  for(let j=0;j<cars.length;j++){
    const c = cars[j];
    if(c.destroyed) continue;
    if(b.x >= c.x && b.x <= c.x + c.w && b.y >= c.y && b.y <= c.y + c.h) return true;
  }
  for(let j=0;j<peds.length;j++){
    const p = peds[j];
    if(p.broken) continue;
    if(b.x >= p.x && b.x <= p.x + 3 && b.y >= p.feetY - 10 && b.y <= p.feetY) return true;
  }
  for(let j=0;j<helis.length;j++){
    const h = helis[j];
    if(h.destroyed) continue;
    if(Math.abs(b.x - h.x) < 10 && Math.abs(b.y - h.y) < 6) return true;
  }
  return false;
}
function checkMissilePlayerCollision(b){
  if(!player.alive) return false;
  if(b.x >= player.x - 2 && b.x <= player.x + 3 &&
     b.y >= (player.y - 5) - 7 && b.y <= (player.y - 5) + 5) return true;
  return false;
}

function updateBombs(dt){
  for(let i=bombs.length-1;i>=0;i--){
    const b = bombs[i];

    if(b.type === 'c4'){
      b.timer -= dt;
      if(b.timer <= 0){
        playExplosion(1.0);
        shakeStage(20);
        doC4Explosion(b.x, b.y, 22, 22*5);
        bombs.splice(i,1);
      }
      continue;
    }

    if(b.directFlight){
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      if(b.x < camX - 600 || b.x > camX + LOGICAL_W + 600 || b.y > LOGICAL_H + 80){
        bombs.splice(i,1);
        continue;
      }
      if(!b.fromPlayer && b.missileColor === '#8a5a2a'){
        if(checkMissilePlayerCollision(b)){
          b.timer = 0;
        }
      }
    } else {
      const e = b.maxTimer - b.timer;
      b.x = b.startX + b.vx * e;
      b.y = b.startY + b.vy * e + 0.5 * b.g * e * e;
    }

    if(b.fromPlayer && b.timer > 0 && checkBombEnemyCollision(b)){
      b.timer = 0;
    }

    b.timer -= dt;

    if(b.timer <= 0){
      const r = b.radius || 20;
      const dmg = b.damage || 15;
      if(b.fromPlayer){
        playExplosion(0.9);
        shakeStage(12);
      }else{
        playExplosion(1.0);
        shakeStage(14);
      }
      doExplosion(b.x, b.y, r, dmg, b.owner, true, b.fromPlayer);
      const shardCount = b.shardCount || 6;
      spawnShards(b.x, b.y, shardCount, b.owner, b.fromPlayer, b.shardDamage || 2);
      if(b.mushroom){
        mushroomClouds.push({ x: b.x, y: b.y, t: 0, life: 1.5, r: r * 0.85 });
      }
      bombs.splice(i,1);
    }
  }
}

function updateShards(dt){
  for(let i=shards.length-1;i>=0;i--){
    const s = shards[i];
    s.vy += 500 * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.timer -= dt;

    if(s.timer <= 0){
      doExplosion(s.x, s.y, 8, s.damage, s.owner, s.isPlayer, s.isPlayer);
      impacts.push({ x:s.x, y:s.y, t:0, life:0.22, type:'boom', r:8 });
      shards.splice(i,1);
    }
  }
}

function updateMushrooms(dt){
  for(let i=mushroomClouds.length-1;i>=0;i--){
    const m = mushroomClouds[i];
    m.t += dt;
    if(m.t >= m.life) mushroomClouds.splice(i,1);
  }
}

    if(t.redFlash > 0) t.redFlash -= dt;

    if(t.fireCd <= 0 && player.alive && !gameOver && !gameWin){

      t.redFlash = 0.4;

      const dx = player.x - t.worldX;
      const dy = (player.y - 5) - (t.worldY - 3);
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      const spd = 130;
      bombs.push({
        x: t.worldX,
        y: t.worldY - 3,
        vx: dx/len * spd,
        vy: dy/len * spd,
        directFlight: true,
        timer: 3.0,
        maxTimer: 3.0,
        owner: t.id,
        fromPlayer: false,
        damage: 10,
        radius: 18,
        shardCount: 5,
        shardDamage: 2,
        missile: true,
        missileColor: '#8a5a2a'
      });
    }
  }
}

/* ============================================================
   车辆
   ============================================================ */
function updateCars(dt){
  const margin = 380;
  const lo = camX - margin;
  const hi = camX + LOGICAL_W + margin;

  const next = [];
  for(let i=0;i<cars.length;i++){
    const c = cars[i];
    if(c.destroyed) continue;

    /* 持续燃烧：每 0.1 秒造成 20 伤害，直到被击败 */
    if(c.burning){
      c.burnTickCd -= dt;
      let guard = 0;
      while(c.burnTickCd <= 0 && guard < 30){
        c.burnTickCd += 0.1;
        c.hp -= 20;
        if(c.hp <= 0){
          c.hp = 0;
          destroyCar(c);
          break;
        }
        guard++;
      }
      if(c.destroyed) continue;
    }

    c.x += c.dir * c.spd * dt;

    c.fireCd -= dt;
    if(c.fireCd <= 0 && player.alive && !gameOver && !gameWin){
      c.fireCd = 5.0;
      if(Math.abs(c.x - player.x) < LOGICAL_W * 0.9){
        if(c.type === 'missile' || c.type === 'police'){
          const dx = player.x - (c.x + c.w/2);
          const dy = (player.y - 5) - (c.y + c.h/2);
          const len = Math.sqrt(dx*dx + dy*dy) || 1;
          const spd = 130;
          bombs.push({
            x: c.x + c.w/2,
            y: c.y + c.h/2,
            vx: dx/len * spd,
            vy: dy/len * spd,
            directFlight: true,
            timer: 3.0,
            maxTimer: 3.0,
            owner: c.id,
            fromPlayer: false,
            damage: 10,
            radius: 18,
            shardCount: 5,
            shardDamage: 2,
            missile: true,
            missileColor: '#8a5a2a'
          });
        } else {
          const dx = player.x - (c.x + c.w/2);
          const dy = (player.y - 5) - (c.y + c.h/2);
          const len = Math.sqrt(dx*dx + dy*dy) || 1;
          const spd = 240;
          bullets.push({
            x: c.x + c.w/2,
            y: c.y + c.h/2,
            vx: dx/len * spd,
            vy: dy/len * spd,
            life: 3,
            owner: c.id,
            fromPlayer: false,
            damage: 1
          });
          addParticle(c.x + c.w/2, c.y + c.h/2,
                      dx/len * 40, dy/len * 40, '#ffd070', 0.12, 2, 0);
          playGunshot(0.065);
        }
      }
    }

    if(c.x > lo - 260 && c.x < hi + 260) next.push(c);
  }
  cars = next;

  carTimer -= dt;
  if(carTimer <= 0){
    carTimer = 0.24 + Math.random()*0.48;
    if(cars.length < 25) spawnCar();
  }
}

/* ============================================================
   直升机
   ============================================================ */
function updateHelis(dt){
  const margin = 300;
  const next = [];
  for(let i=0;i<helis.length;i++){
    const h = helis[i];
    if(h.destroyed) continue;

    if(h.burning){
      h.burnTickCd -= dt;
      let guard = 0;
      while(h.burnTickCd <= 0 && guard < 30){
        h.burnTickCd += 0.1;
        h.hp -= 20;
        if(h.hp <= 0){
          h.hp = 0;
          destroyHeli(h);
          break;
        }
        guard++;
      }
      if(h.destroyed) continue;
    }

    h.bobPhase += dt * 3;
    const bob = Math.sin(h.bobPhase) * 3;

    if(h.type === 'shooter'){
      h.x += h.hoverDir * 22 * dt;
      if(Math.random() < 0.005) h.hoverDir *= -1;

      h.fireCd -= dt;
      if(h.fireCd <= 0 && player.alive && !gameOver && !gameWin){
        h.fireCd = 6.0;
        if(Math.abs(h.x - player.x) < LOGICAL_W * 0.85){
          const dx = player.x - h.x;
          const dy = (player.y - 5) - (h.y + bob);
          const len = Math.sqrt(dx*dx + dy*dy) || 1;
          const spd = 260;
          bullets.push({
            x: h.x, y: h.y + bob,
            vx: dx/len * spd, vy: dy/len * spd,
            life: 3,
            owner: h.id, fromPlayer: false, damage: 1
          });
          playGunshot(0.065);
        }
      }
    }else{
      const dx = player.x - h.x;
      h.x += Math.sign(dx) * Math.min(Math.abs(dx), 55 * dt);

      h.bombCd -= dt;
      if(h.bombCd <= 0 && player.alive && !gameOver && !gameWin){
        h.bombCd = 2.5 + Math.random()*1.5;
        const dropDist = (groundBase + 30) - (h.y + bob + 4);
        const dropTime = 5.0;
        const g = 2 * dropDist / (dropTime * dropTime);
        bombs.push({
          startX: h.x, startY: h.y + bob + 4,
          vx: 0, vy: 0, g: g,
          timer: 5.0, maxTimer: 5.0,
          x: h.x, y: h.y + bob + 4,
          owner: h.id, fromPlayer: false,
          damage: 99.5, radius: 52,
          shardCount: 10, shardDamage: 5,
          missile: true,
          missileColor: '#4ab85a',
          mushroom: true, glowing: true
        });
      }
    }

    if(Math.random() < 0.3){
      addParticle(h.x + (Math.random()-0.5)*18,
                  h.y + bob + 2,
                  (Math.random()-0.5)*20,
                  20 + Math.random()*25,
                  'rgba(200,215,235,0.6)', 0.35, 1, 0);
    }

    if(h.x > camX - margin && h.x < camX + LOGICAL_W + margin) next.push(h);
  }
  helis = next;

  heliTimer -= dt;
  if(heliTimer <= 0){
    heliTimer = 7 + Math.random()*8;
    if(helis.length < 3 && player.alive && !gameOver && !gameWin) spawnHeli();
  }
}

/* ============================================================
   区块敌人刷新
   ============================================================ */
let spawnCheckTimer = 0;
function updateChunkSpawning(dt){
  spawnCheckTimer -= dt;
  if(spawnCheckTimer > 0) return;
  spawnCheckTimer = 0.5;

  const now = performance.now() / 1000;
  const first = Math.floor(camX / CHUNK_W);
  const last  = Math.floor((camX + LOGICAL_W) / CHUNK_W);

  for(let ci = first - 1; ci <= last + 1; ci++){
    if(whiteChunks.has(ci)) continue;
    let st = chunkSpawnState.get(ci);
    if(!st){
      st = { spawned: false, last: 0 };
      chunkSpawnState.set(ci, st);
      continue;
    }
    if(!st.spawned){
      if(Math.random() < 0.35){
        const wx = ci * CHUNK_W + Math.random() * CHUNK_W;
        if(Math.random() < 0.65) spawnPedAt(wx);
        else spawnCarAt(wx);
      }
      st.spawned = true;
      st.last = now;
    }else if(now - st.last > 12){
      if(Math.random() < 0.45){
        const wx = ci * CHUNK_W + Math.random() * CHUNK_W;
        if(Math.random() < 0.65) spawnPedAt(wx);
        else spawnCarAt(wx);
      }
      st.last = now;
    }
  }
}

      beepTimer = 0.1;
      beepsToPlay--;
      playBeep();

    shakeQueueTimer -= dt;
    if(shakeQueueTimer <= 0){
      shakeQueueTimer = 0.1;
      pendingShakes--;
      shakeStage(24 + Math.random() * 8);

}

function playerFire(){
  if(!player.alive || gameOver || gameWin) return;

    const muzzleY = player.y - 8;

    else if(left) sdx = -1;
    else if(right) sdx = 1;
    else sdx = player.facing;

    let vx = sdx, vy = sdy;
    if(flipped){
      const t = vx;
      vx = vy;
      vy = -t;
    }

    bullets.push({
      x: player.x, y: muzzleY,
      vx: vx * spd, vy: vy * spd,

      owner: player.id, fromPlayer: true,

    });

/* ============================================================
   特效更新
   ============================================================ */
function updateImpacts(dt){
  for(let i=impacts.length-1;i>=0;i--){
    impacts[i].t += dt;
    if(impacts[i].t >= impacts[i].life) impacts.splice(i,1);
  }
}

/* ============================================================
   渲染
   ============================================================ */
function drawImpacts(){
  for(let i=0;i<impacts.length;i++){
    const im = impacts[i];
    const x = im.x - camX;
    const y = im.y;
    const p = im.t / im.life;

    if(im.type === 'boom'){
      const R = im.r || 18;
      if(p < 0.55){
        const fa = 1 - p / 0.55;
        const fr = R * (1.0 + p * 0.7);
        if(fr > 0){
          const g = ctx.createRadialGradient(x, y, 0, x, y, fr);
          g.addColorStop(0,   'rgba(255,255,255,' + (fa * 0.92).toFixed(3) + ')');
          g.addColorStop(0.22,'rgba(255,232,178,' + (fa * 0.78).toFixed(3) + ')');
          g.addColorStop(0.52,'rgba(255,150,50,' + (fa * 0.42).toFixed(3) + ')');
          g.addColorStop(0.82,'rgba(255,80,10,' + (fa * 0.16).toFixed(3) + ')');
          g.addColorStop(1,   'rgba(255,40,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(x, y, fr, 0, Math.PI*2);
          ctx.fill();
        }
      }
      const ringR = 4 + p * R * 2.0;
      if(ringR > 0){
        ctx.strokeStyle = 'rgba(255,170,70,' + (0.85 * (1-p)).toFixed(2) + ')';
        ctx.lineWidth = Math.max(1, 3 * (1-p));
        ctx.beginPath();
        ctx.arc(x, y, ringR, 0, Math.PI*2);
        ctx.stroke();
      }
    }
  }
}

function drawMushroomClouds(){
  for(let i=0;i<mushroomClouds.length;i++){
    const m = mushroomClouds[i];
    const x = m.x - camX;
    const y = m.y;
    const p = m.t / m.life;
    const R = m.r;

    const stemH = R * 1.6 * Math.min(1, p * 2.5);
    const stemW = R * 1.0 * (0.55 + p * 0.45);
    const stemA = (1 - p) * 0.7;
    ctx.fillStyle = 'rgba(150,130,95,' + stemA.toFixed(2) + ')';
    ctx.fillRect(x - stemW/2, y - stemH, stemW, stemH);

    const capR = R * (0.65 + p * 1.05);
    if(capR > 0){
      const capY = y - stemH - capR * 0.35;
      const capA = (1 - p) * 0.9;
      const g = ctx.createRadialGradient(x, capY, 0, x, capY, capR);
      g.addColorStop(0,    'rgba(255,240,205,' + (capA * 0.95).toFixed(2) + ')');
      g.addColorStop(0.4,  'rgba(250,205,145,' + (capA * 0.85).toFixed(2) + ')');
      g.addColorStop(0.75, 'rgba(200,140,75,'  + (capA * 0.55).toFixed(2) + ')');
      g.addColorStop(1,    'rgba(140,80,40,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, capY, capR, 0, Math.PI*2);
      ctx.fill();
    }

    if(p < 0.35){
      const ia = 1 - p/0.35;
      const innerR = R * 0.6 * (1 - p * 1.5);
      if(innerR > 0){
        ctx.fillStyle = 'rgba(255,255,230,' + (ia * 0.85).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(x, y - stemH * 0.5, innerR, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }
}

/* 路灯变红 + 灯泡像素变红 + 红色辉光 */
function drawRedAlertLamps(){
  if(redAlertTimer <= 0) return;
  const pulse = Math.abs(Math.sin(redAlertTimer * 12));
  const alpha = 0.5 + pulse * 0.5;
  const spacing = 62;
  const firstLamp = Math.ceil(camX / spacing) * spacing;
  const lampY = groundBase - 36 + 1;

  /* 1) 用纯红覆盖灯泡像素，让灯泡本身变红 */
  ctx.save();
  for(let wx = firstLamp; wx < camX + LOGICAL_W; wx += spacing){
    const sx = Math.round(wx - camX + 4);
    ctx.fillStyle = 'rgb(255,50,30)';
    ctx.fillRect(sx, lampY, 2, 1);
    ctx.fillStyle = 'rgb(255,110,60)';
    ctx.fillRect(sx, lampY, 1, 1);
  }
  ctx.restore();

  /* 2) 红色辉光 */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for(let wx = firstLamp; wx < camX + LOGICAL_W; wx += spacing){
    const sx = wx - camX + 4;
    const g = ctx.createRadialGradient(sx, lampY, 0, sx, lampY, 16);
    g.addColorStop(0, 'rgba(255,70,40,' + (0.85 * alpha).toFixed(2) + ')');
    g.addColorStop(0.45, 'rgba(255,50,25,' + (0.4 * alpha).toFixed(2) + ')');
    g.addColorStop(1, 'rgba(255,30,10,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, lampY, 16, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawTurretFlashes(){
  for(let i=0;i<turrets.length;i++){
    const t = turrets[i];
    if(t.redFlash <= 0) continue;
    const w = t.x1 - t.x0;
    const h = t.y1 - t.y0;
    if(w <= 0 || h <= 0) continue;
    const pulse = Math.abs(Math.sin(t.redFlash * 18));
    const alpha = 0.25 + pulse * 0.6;
    const sx = t.worldX - camX;
    const sy = t.worldY;
    if(!isFinite(sx) || !isFinite(sy)) continue;
    const rad = w * 1.4;
    if(rad <= 0) continue;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, rad);
    g.addColorStop(0, 'rgba(255,60,40,' + alpha.toFixed(2) + ')');
    g.addColorStop(1, 'rgba(255,60,40,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(sx, sy, rad, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawPlayer(){
  if(!player.alive) return;
  const x = Math.round(player.x - camX);
  const y = Math.round(player.y);
  if(!isFinite(x) || !isFinite(y)) return;
  if(x < -20 || x > LOGICAL_W + 20) return;

  const f = player.facing;
  const moving = player.moving;
  const walkPhase = (performance.now() / 120) | 0;
  const legA = moving ? (walkPhase % 2 === 0 ? 0 : 1) : 0;

  ctx.fillStyle = '#161b28';
  ctx.fillRect(x - 1, y - 2 - legA, 1, 2 + legA);
  ctx.fillRect(x + 2, y - 2 - (1 - legA), 1, 2 + (1 - legA));

  ctx.fillStyle = '#2f6b4a';
  ctx.fillRect(x - 1, y - 7, 4, 5);
  ctx.fillStyle = '#243b2c';
  ctx.fillRect(x, y - 6, 2, 3);

  ctx.fillStyle = '#c9b09a';
  ctx.fillRect(x - 1, y - 10, 4, 3);
  ctx.fillStyle = '#3a4a3c';
  ctx.fillRect(x - 1, y - 10, 4, 2);

  if(weapon === 'sniper'){
    ctx.fillStyle = '#1d2230';
    if(moving){
      ctx.fillRect(x + (f > 0 ? 4 : -4), y - 7, 4, 2);
    }else{
      ctx.fillRect(x, y - 15, 2, 5);
    }
  } else if(weapon === 'bomb'){
    ctx.fillStyle = '#3a2a1a';
    ctx.fillRect(x + (f > 0 ? 3 : -3), y - 6, 3, 3);
  } else if(weapon === 'fire'){
    ctx.fillStyle = '#c04a1a';
    ctx.fillRect(x + (f > 0 ? 4 : -4), y - 7, 4, 2);
  } else if(weapon === 'c4'){
    ctx.fillStyle = '#a02020';
    ctx.fillRect(x + (f > 0 ? 3 : -3), y - 6, 3, 3);
  }
}

function drawHelis(){
  for(let i=0;i<helis.length;i++){
    const h = helis[i];
    if(h.destroyed) continue;
    const x = Math.round(h.x - camX);
    const y = Math.round(h.y + Math.sin(h.bobPhase)*3);
    if(x < -40 || x > LOGICAL_W + 40) continue;

    const isBomber = h.type === 'bomber';
    ctx.fillStyle = isBomber ? '#2d6b3a' : '#4a3a3a';
    ctx.fillRect(x - 7, y - 2, 14, 4);
    ctx.fillStyle = '#7ea8c8';
    ctx.fillRect(x - 3, y - 2, 5, 3);
    ctx.fillStyle = isBomber ? '#1a4a25' : '#3a2a2a';
    ctx.fillRect(x + 7, y - 1, 6, 2);
    ctx.fillRect(x + 12, y - 3, 1, 5);
    ctx.fillStyle = '#222';
    ctx.fillRect(x - 5, y + 2, 1, 2);
    ctx.fillRect(x + 4, y + 2, 1, 2);

    const rotor = (performance.now() / 30) | 0;
    const spread = (rotor % 2 === 0) ? 12 : 3;
    ctx.fillStyle = 'rgba(200,215,235,0.55)';
    ctx.fillRect(x - spread, y - 5, spread*2, 1);
    ctx.fillStyle = '#888';
    ctx.fillRect(x - 1, y - 5, 2, 2);

    if(isBomber){
      ctx.fillStyle = '#0f2a15';
      ctx.fillRect(x - 3, y + 1, 6, 2);
    }

    /* 持续燃烧：精确覆盖直升机模型外轮廓 */
    if(h.burning){
      const pulse = Math.abs(Math.sin(performance.now() / 150));
      ctx.fillStyle = 'rgba(255,50,30,' + (0.45 + pulse * 0.55).toFixed(2) + ')';
      /* 覆盖机身 + 尾梁 + 座舱 + 起落架 */
      ctx.fillRect(x - 7, y - 2, 14, 4);   /* 机身 */
      ctx.fillRect(x - 3, y - 2, 5, 3);    /* 座舱 */
      ctx.fillRect(x + 7, y - 1, 6, 2);    /* 尾梁 */
      ctx.fillRect(x + 12, y - 3, 1, 5);   /* 尾翼 */
      ctx.fillRect(x - 5, y + 2, 1, 2);    /* 起落架 */
      ctx.fillRect(x + 4, y + 2, 1, 2);
    }

    const maxHp = h.maxHp || 150;
    if(h.hp < maxHp){
      const w = 20, hpw = Math.round(w * (h.hp/maxHp));
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x - 10, y - 9, w, 2);
      ctx.fillStyle = h.hp > maxHp*0.35 ? '#3ddc84' : '#e04a4a';
      ctx.fillRect(x - 10, y - 9, hpw, 2);
    }
  }
}

function drawMissileSprite(x, y, vx, vy, color, glow){
  if(!isFinite(x) || !isFinite(y)) return;
  let ang;
  if(vx === undefined || vy === undefined || (vx === 0 && vy === 0)){
    ang = Math.PI / 2;
  } else {
    ang = Math.atan2(vy, vx);
  }
  if(!isFinite(ang)) ang = Math.PI / 2;

  if(glow){
    const t = performance.now() / 300;
    const pulse = 0.7 + Math.sin(t) * 0.3;
    const gr = 22;
    const g2 = ctx.createRadialGradient(x, y, 0, x, y, gr);
    g2.addColorStop(0, 'rgba(120,255,140,' + (0.55 * pulse).toFixed(3) + ')');
    g2.addColorStop(0.5, 'rgba(60,220,90,' + (0.25 * pulse).toFixed(3) + ')');
    g2.addColorStop(1, 'rgba(40,180,60,0)');
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(x, y, gr, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang + Math.PI/2);

  const blink = (performance.now() / 50) | 0;
  ctx.fillStyle = blink % 2 === 0 ? 'rgba(255,220,100,0.85)' : 'rgba(255,150,50,0.75)';
  ctx.fillRect(-1, 7, 2, 3);

  ctx.fillStyle = color;
  ctx.fillRect(-2, -6, 4, 12);
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  ctx.fillRect(-1, -5, 1, 10);
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.fillRect(-2, -1, 4, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(-1, -8, 2, 2);
  ctx.fillRect(0, -9, 1, 1);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(-3, 4, 1, 3);
  ctx.fillRect(2, 4, 1, 3);

  ctx.restore();
}

function drawBombs(){
  for(let i=0;i<bombs.length;i++){
    const b = bombs[i];
    const x = Math.round(b.x - camX);
    const y = Math.round(b.y);
    if(!isFinite(x) || !isFinite(y)) continue;
    if(x < -30 || x > LOGICAL_W + 30) continue;

    if(b.type === 'c4'){
      const pulse = (performance.now() / 200) % 1;
      ctx.fillStyle = '#3a1a1a';
      ctx.fillRect(x - 4, y - 4, 8, 8);
      ctx.fillStyle = '#1a0808';
      ctx.fillRect(x - 3, y - 3, 6, 6);

      const r = 3 + pulse * 2;
      const g2 = ctx.createRadialGradient(x, y, 0, x, y, r + 6);
      g2.addColorStop(0, 'rgba(255,80,60,' + (0.9 - pulse * 0.5).toFixed(2) + ')');
      g2.addColorStop(1, 'rgba(255,60,30,0)');
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.arc(x, y, r + 6, 0, Math.PI*2);
      ctx.fill();
      continue;
    }

    if(b.missile){
      let vx, vy;
      if(b.directFlight){ vx = b.vx; vy = b.vy; }
      else { vx = 0; vy = 1; }
      drawMissileSprite(x, y, vx, vy, b.missileColor || '#4ab85a', b.glowing);
    } else {
      ctx.fillStyle = '#1a1a1e';
      ctx.fillRect(x - 2, y - 3, 5, 6);
      ctx.fillStyle = '#333';
      ctx.fillRect(x - 1, y - 3, 3, 1);

      const blinkRate = b.timer < 1 ? 0.06 : 0.18;
      if((performance.now() / 1000 / blinkRate) % 1 < 0.5){
        ctx.fillStyle = b.timer < 1 ? '#ff4a2a' : '#ffb347';
        ctx.fillRect(x, y - 5, 1, 2);
        ctx.fillStyle = 'rgba(255,200,80,0.6)';
        ctx.fillRect(x - 2, y - 6, 5, 1);
      }
    }
  }
}

function drawShards(){
  for(let i=0;i<shards.length;i++){
    const s = shards[i];
    const x = Math.round(s.x - camX);
    const y = Math.round(s.y);
    if(x < -10 || x > LOGICAL_W + 10) continue;
    ctx.fillStyle = s.isPlayer ? '#ffd070' : '#ff8a5a';
    ctx.fillRect(x, y, 2, 2);
    ctx.fillStyle = 'rgba(255,180,90,0.5)';
    ctx.fillRect(x - 1, y - 1, 1, 1);
    ctx.fillRect(x + 2, y + 2, 1, 1);
  }
}

function drawBullets(){
  for(let i=0;i<bullets.length;i++){
    const b = bullets[i];
    const x = Math.round(b.x - camX);
    const y = Math.round(b.y);
    if(x < -10 || x > LOGICAL_W + 10) continue;

    if(b.isFire){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(x, y, 0, x, y, 7);
      g.addColorStop(0, 'rgba(255,180,80,0.75)');
      g.addColorStop(1, 'rgba(255,90,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, 7, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#ff9a2a';
      ctx.fillRect(x - 2, y - 1, 5, 2);
      ctx.fillStyle = '#fff4c4';
      ctx.fillRect(x - 1, y, 3, 1);
    } else if(b.fromPlayer){
      ctx.fillStyle = '#fff4c4';
      ctx.fillRect(x - 2, y - 1, 5, 2);
      ctx.fillStyle = 'rgba(255,235,160,0.5)';
      ctx.fillRect(x - 4, y, 3, 1);
    } else {
      ctx.fillStyle = '#ff6b5e';
      ctx.fillRect(x - 1, y - 1, 3, 2);
      ctx.fillStyle = 'rgba(255,120,90,0.55)';
      ctx.fillRect(x - 3, y, 3, 1);
    }
  }
}

function drawCars(){
  for(let i=0;i<cars.length;i++){
    const c = cars[i];
    if(c.destroyed) continue;
    const x = Math.round(c.x - camX);
    const y = Math.round(c.y);
    if(x + c.w < -4 || x > LOGICAL_W+4) continue;

    ctx.fillStyle = c.color;
    ctx.fillRect(x, y, c.w, c.h);
    ctx.fillStyle = '#131b2b';
    ctx.fillRect(x+2, y+1, Math.max(1,c.w-5), Math.max(1, c.h-4));

    if(c.type === 'police'){
      const blink = (performance.now() / 150) | 0;
      ctx.fillStyle = blink % 2 === 0 ? '#ff3030' : '#3050ff';
      ctx.fillRect(x + Math.floor(c.w/2) - 3, y - 2, 2, 2);
      ctx.fillStyle = blink % 2 === 0 ? '#3050ff' : '#ff3030';
      ctx.fillRect(x + Math.floor(c.w/2) + 1, y - 2, 2, 2);
    }
    if(c.type === 'missile'){
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(x + Math.floor(c.w/2) - 2, y - 3, 4, 3);
      ctx.fillStyle = '#8a5a2a';
      ctx.fillRect(x + Math.floor(c.w/2) - 1, y - 5, 2, 2);
    }

    if(c.dir > 0){
      ctx.fillStyle = '#fff4c4';
      ctx.fillRect(x + c.w - 2, y + c.h - 3, 2, 2);
      ctx.fillStyle = '#ff6b5e';
      ctx.fillRect(x, y + c.h - 3, 1, 2);
    }else{
      ctx.fillStyle = '#fff4c4';
      ctx.fillRect(x, y + c.h - 3, 2, 2);
      ctx.fillStyle = '#ff6b5e';
      ctx.fillRect(x + c.w - 1, y + c.h - 3, 1, 2);
    }

    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(x, y + c.h, c.w, 1);

    /* 持续燃烧：精确覆盖车辆模型 */
    if(c.burning){
      const pulse = Math.abs(Math.sin(performance.now() / 150));
      ctx.fillStyle = 'rgba(255,50,30,' + (0.5 + pulse * 0.5).toFixed(2) + ')';
      ctx.fillRect(x, y, c.w, c.h);
    }

    const maxHp = (c.type === 'police') ? 600 : 700;
    if(c.hp < maxHp){
      const w = Math.max(8, c.w), hpw = Math.round(w * (c.hp/maxHp));
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(x, y - 6, w, 1);
      ctx.fillStyle = c.hp > maxHp*0.35 ? '#3ddc84' : '#e04a4a';
      ctx.fillRect(x, y - 6, hpw, 1);
    }
  }
}

function drawPeds(){
  for(let i=0;i<peds.length;i++){
    const p = peds[i];
    const x = Math.round(p.x - camX);
    const y = Math.round(p.feetY);
    if(x < -8 || x > LOGICAL_W + 8) continue;

    if(p.broken){
      ctx.fillStyle = '#161b28';
      ctx.fillRect(x - 2, y - 2, 1, 2);
      ctx.fillRect(x + 3, y - 2, 1, 2);
      ctx.fillStyle = p.coat;
      ctx.fillRect(x - 1, y - 5, 2, 2);
      ctx.fillRect(x + 2, y - 6, 2, 3);
      ctx.fillStyle = '#c9b09a';
      ctx.fillRect(x + 4, y - 8, 2, 2);
      ctx.fillStyle = '#1b1f2b';
      ctx.fillRect(x + 4, y - 8, 2, 1);
      ctx.fillStyle = 'rgba(120,15,15,0.5)';
      ctx.fillRect(x - 2, y - 1, 7, 1);
    }else{
      ctx.fillStyle = '#161b28';
      ctx.fillRect(x, y-2, 1, 2);
      ctx.fillRect(x+2, y-2, 1, 2);
      ctx.fillStyle = p.coat;
      ctx.fillRect(x, y-6, 3, 4);
      ctx.fillStyle = '#c9b09a';
      ctx.fillRect(x, y-8, 2, 2);
      ctx.fillStyle = '#1b1f2b';
      ctx.fillRect(x, y-8, 2, 1);

      /* 持续燃烧：精确覆盖行人模型 */
      if(p.burning){
        const pulse = Math.abs(Math.sin(performance.now() / 150));
        ctx.fillStyle = 'rgba(255,50,30,' + (0.55 + pulse * 0.45).toFixed(2) + ')';
        /* 头 + 身体 + 腿 */
        ctx.fillRect(x, y - 8, 2, 2);   /* 头 */
        ctx.fillRect(x, y - 6, 3, 4);   /* 身体 */
        ctx.fillRect(x, y - 2, 1, 2);   /* 左腿 */
        ctx.fillRect(x + 2, y - 2, 1, 2); /* 右腿 */
      }
    }
  }
}

/* ============================================================
   血量 UI
   ============================================================ */
const hpFillEl = document.getElementById('hpFill');
const hpTextEl = document.getElementById('hpText');
let lastHpShown = -1;
function updateHpUI(){
  const hp = Math.ceil(player.hp);
  if(hp === lastHpShown) return;
  lastHpShown = hp;
  const pct = Math.max(0, Math.min(100, (player.hp / player.maxHp) * 100));
  hpFillEl.style.width = pct + '%';
  hpFillEl.classList.toggle('low', pct < 35);
  hpTextEl.textContent = hp + ' / ' + player.maxHp;
}

/* ============================================================
   主循环
   ============================================================ */
let lastT = performance.now();
let needPrewarm = true;

function frame(now){
  try {
    let dt = (now - lastT) / 1000;
    lastT = now;
    if(!isFinite(dt) || dt <= 0) dt = 0.001;
    if(dt > 0.05) dt = 0.05;

    if(player.alive && !gameOver && !gameWin && isFinite(player.x)){
      const targetCamX = player.x - LOGICAL_W * 0.40;
      camX += (targetCamX - camX) * Math.min(1, dt * 6);
      if(!isFinite(camX)) camX = targetCamX;
    }

    if(!gameOver && !gameWin){
      updatePlayer(dt);
      updateCars(dt);
      updatePeds(dt);
      updateHelis(dt);
      updateTurrets(dt);
      updateBullets(dt);
      updateBombs(dt);
      updateShards(dt);
      updateChunkSpawning(dt);
      updateAlertEvent(dt);
      applyCage();
      updateParticles(dt);
      updateImpacts(dt);
      updateMushrooms(dt);
    }

    ctx.setTransform(1,0,0,1,0,0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = '#070a16';
    ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);

    const first = Math.floor(camX / CHUNK_W);
    const last  = Math.floor((camX + LOGICAL_W) / CHUNK_W);

    if(needPrewarm){
      for(let ci = first-2; ci <= last+2; ci++){
        if(!chunks.has(ci)) chunks.set(ci, buildChunk(ci));
      }
      needPrewarm = false;
    }

    let made = 0;
    for(let ci = first-1; ci <= last+1; ci++){
      if(!chunks.has(ci)){
        chunks.set(ci, buildChunk(ci));
        if(++made >= 2) break;
      }
    }

    for(let ci = first; ci <= last; ci++){
      const cv = chunks.get(ci);
      if(cv){
        ctx.drawImage(cv, Math.round(ci*CHUNK_W - camX), 0);
      }
    }

    if(chunks.size > 16){
      const dead = [];
      for(const k of chunks.keys()){
        if(k < first-2 || k > last+2) dead.push(k);
      }
      for(let i=0;i<dead.length;i++) chunks.delete(dead[i]);
      for(let i=turrets.length-1;i>=0;i--){
        if(turrets[i].ci < first-2 || turrets[i].ci > last+2) turrets.splice(i,1);
      }
    }

    drawRedAlertLamps();

    drawCars();
    drawPeds();
    drawHelis();
    drawBombs();
    drawShards();
    drawBullets();
    drawPlayer();
    drawTurretFlashes();
    drawImpacts();
    drawMushroomClouds();
    drawParticles();
  } catch(e) {
    console.error('Frame error:', e);
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   键盘
   ============================================================ */
window.addEventListener('keydown', function(e){
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(k === '1') selectWeapon('sniper');
  if(k === '2') selectWeapon('bomb');
  if(k === '3') selectWeapon('fire');
  if(k === '4') selectWeapon('c4');
  if(k === ' ' || k === 'f'){ e.preventDefault(); playerFire(); }
  if(['arrowleft','arrowright','arrowup','arrowdown'].indexOf(k) >= 0) e.preventDefault();
});
window.addEventListener('keyup', function(e){
  keys[e.key.toLowerCase()] = false;
});

/* ============================================================
   摇杆
   ============================================================ */
const joystickEl = document.getElementById('joystick');
const joystickKnob = document.getElementById('joystickKnob');
let joystickActive = false;

function setJoystick(clientX, clientY){
  const rect = joystickEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = clientX - cx;
  let dy = clientY - cy;
  const maxR = Math.max(1, rect.width / 2 - 10);
  const dist = Math.sqrt(dx*dx + dy*dy);
  if(dist > maxR && dist > 0){
    dx = dx / dist * maxR;
    dy = dy / dist * maxR;
  }
  joystickKnob.style.transform =
    'translate(calc(-50% + ' + dx.toFixed(1) + 'px), calc(-50% + ' + dy.toFixed(1) + 'px))';

  joyDX = dx / maxR;
  joyDY = dy / maxR;
  if(!isFinite(joyDX)) joyDX = 0;
  if(!isFinite(joyDY)) joyDY = 0;
  if(Math.abs(joyDX) < 0.12) joyDX = 0;
  if(Math.abs(joyDY) < 0.12) joyDY = 0;
}

function resetJoystick(){
  joystickKnob.style.transform = 'translate(-50%,-50%)';
  joyDX = 0; joyDY = 0;
}

joystickEl.addEventListener('pointerdown', function(e){
  initAudio();
  playVideoAudio();
  joystickActive = true;
  try{ joystickEl.setPointerCapture(e.pointerId); }catch(_){}
  setJoystick(e.clientX, e.clientY);
  e.preventDefault();
}, {passive:false});

joystickEl.addEventListener('pointermove', function(e){
  if(!joystickActive) return;
  setJoystick(e.clientX, e.clientY);
  e.preventDefault();
}, {passive:false});

function joystickEnd(e){
  if(!joystickActive) return;
  joystickActive = false;
  resetJoystick();
  try{ joystickEl.releasePointerCapture(e.pointerId); }catch(_){}
}
joystickEl.addEventListener('pointerup', joystickEnd);
joystickEl.addEventListener('pointercancel', joystickEnd);

/* ============================================================
   投掷按钮
   ============================================================ */
const throwBtn = document.getElementById('throwBtn');
let throwRepeatTimer = null;

throwBtn.addEventListener('pointerdown', function(e){
  initAudio();
  playVideoAudio();
  e.preventDefault();
  e.stopPropagation();
  playerFire();
  if(throwRepeatTimer) clearInterval(throwRepeatTimer);
  throwRepeatTimer = setInterval(function(){
    if(!gameOver && !gameWin) playerFire();
  }, 80);
}, {passive:false});

function stopThrow(){
  if(throwRepeatTimer){ clearInterval(throwRepeatTimer); throwRepeatTimer = null; }
}
throwBtn.addEventListener('pointerup', stopThrow);
throwBtn.addEventListener('pointercancel', stopThrow);
throwBtn.addEventListener('pointerleave', stopThrow);

/* ============================================================
   武器选择
   ============================================================ */
const wbtns = document.querySelectorAll('.wbtn');
function selectWeapon(w){
  weapon = w;
  for(let i=0;i<wbtns.length;i++){
    wbtns[i].classList.toggle('active', wbtns[i].dataset.weapon === w);
  }
}
for(let i=0;i<wbtns.length;i++){
  wbtns[i].addEventListener('click', function(e){
    e.stopPropagation();
    initAudio();
    playVideoAudio();
    selectWeapon(this.dataset.weapon);
  });
}

/* ============================================================
   屏幕翻转按钮
   ============================================================ */
document.getElementById('flipBtn').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  playVideoAudio();
  toggleFlip();
});

/* ============================================================
   重新生成 / 重新部署
   ============================================================ */
document.getElementById('regen').addEventListener('click', function(e){
  e.stopPropagation();
  initAudio();
  playVideoAudio();
  restartGame();
});
document.getElementById('retryBtn').addEventListener('click', function(e){
  e.stopPropagation();
  restartGame();
});
document.getElementById('winBtn').addEventListener('click', function(e){
  e.stopPropagation();
  restartGame();
});

document.addEventListener('pointerdown', function(){ playVideoAudio(); }, { once: false });

/* ============================================================
   启动
   ============================================================ */
window.addEventListener('resize', function(){
  resize();
  needPrewarm = true;
});

resize();
needPrewarm = true;
updateHpUI();
requestAnimationFrame(frame);

})();
