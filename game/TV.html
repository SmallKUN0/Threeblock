<script type="module">
import * as THREE from 'three';

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=false;
document.body.appendChild(renderer.domElement);

const MAX_ANISO=renderer.capabilities.getMaxAnisotropy();
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070b);
const EYE_HEIGHT=1.62;
const camera=new THREE.PerspectiveCamera(76,window.innerWidth/window.innerHeight,0.06,45);
camera.rotation.order='YXZ';
camera.position.set(-3.2,EYE_HEIGHT,2.6);

function makeCanvasTexture(w,h,draw){
  const cv=document.createElement('canvas');
  cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d');
  draw(ctx,w,h);
  const tex=new THREE.CanvasTexture(cv);
  tex.colorSpace=THREE.SRGBColorSpace;
  tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
  tex.generateMipmaps=true;
  tex.minFilter=THREE.LinearMipmapLinearFilter;
  tex.magFilter=THREE.LinearFilter;
  tex.anisotropy=MAX_ANISO;
  return tex;
}

function makeWoodTexture({size=512,planks=8,hue=30,sat=42,light=46,vertical=false,gapColor='rgba(38,22,8,0.9)',gapW=3,grainDensity=1}={}){
  return makeCanvasTexture(size,size,(ctx,W,H)=>{
    ctx.fillStyle=`hsl(${hue}, ${sat}%, ${light}%)`;
    ctx.fillRect(0,0,W,H);
    const pw=(vertical?W:H)/planks;
    for(let i=0;i<planks;i++){
      const l=light+(Math.random()*14-7);
      const s=Math.max(6,sat+(Math.random()*12-6));
      ctx.fillStyle=`hsl(${hue}, ${s}%, ${l}%)`;
      if(vertical)ctx.fillRect(i*pw,0,pw+1,H);
      else ctx.fillRect(0,i*pw,W,pw+1);
      const lines=Math.round(10*grainDensity);
      for(let g=0;g<lines;g++){
        const t=Math.random();
        const a=0.05+Math.random()*0.12;
        ctx.strokeStyle=`hsla(${hue-7}, ${s}%, ${Math.max(8,l-22)}%, ${a})`;
        ctx.lineWidth=0.7+Math.random()*1.8;
        ctx.beginPath();
        if(vertical){
          const x0=i*pw+t*pw;
          ctx.moveTo(x0,-6);
          for(let y=0;y<=H;y+=18){
            ctx.lineTo(x0+Math.sin(y*0.021+t*13)*4+Math.sin(y*0.095+t*31)*1.6,y);
          }
        }else{
          const y0=i*pw+t*pw;
          ctx.moveTo(-6,y0);
          for(let x=0;x<=W;x+=18){
            ctx.lineTo(x,y0+Math.sin(x*0.021+t*13)*4+Math.sin(x*0.095+t*31)*1.6);
          }
        }
        ctx.stroke();
      }
      ctx.fillStyle=gapColor;
      if(vertical)ctx.fillRect(i*pw-gapW/2,0,gapW,H);
      else ctx.fillRect(0,i*pw-gapW/2,W,gapW);
    }
    const img=ctx.getImageData(0,0,W,H);
    const d=img.data;
    for(let i=0;i<d.length;i+=4){
      const n=(Math.random()-0.5)*11;
      d[i]+=n;d[i+1]+=n;d[i+2]+=n;
    }
    ctx.putImageData(img,0,0);
  });
}

function makeFabricTexture(color='#e9e5db',noise=0.055){
  return makeCanvasTexture(256,256,(ctx,W,H)=>{
    ctx.fillStyle=color;
    ctx.fillRect(0,0,W,H);
    for(let i=0;i<9000;i++){
      ctx.fillStyle=`rgba(0,0,0,${Math.random()*noise})`;
      ctx.fillRect(Math.random()*W,Math.random()*H,2,2);
    }
    ctx.strokeStyle='rgba(0,0,0,0.045)';
    ctx.lineWidth=1;
    for(let i=0;i<W;i+=5){
      ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();
    }
  });
}

function makePlasticTexture(base='#1b1d21',hi='#2c3037'){
  return makeCanvasTexture(256,256,(ctx,W,H)=>{
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,hi);
    g.addColorStop(0.5,base);
    g.addColorStop(1,'#101215');
    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);
    for(let i=0;i<4000;i++){
      ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.03})`;
      ctx.fillRect(Math.random()*W,Math.random()*H,1,1);
    }
  });
}

function makeSymbolTexture(sym){
  const S=128;
  const tex=makeCanvasTexture(S,S,(ctx)=>{
    ctx.clearRect(0,0,S,S);
    const r=24,x=8,y=8,w=S-16,h=S-16;
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    ctx.fillStyle='rgba(26,28,34,0.92)';
    ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.6)';
    ctx.lineWidth=4;
    ctx.stroke();
    ctx.fillStyle='#ffffff';
    ctx.font='bold 62px system-ui, -apple-system, sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(sym,S/2,S/2+3);
  });
  tex.wrapS=tex.wrapT=THREE.ClampToEdgeWrapping;
  return tex;
}

const TEX={
  floor:makeWoodTexture({planks:6,hue:27,sat:44,light:36,gapW:4}),
  wall:makeWoodTexture({planks:5,hue:32,sat:33,light:60,gapW:3}),
  ceil:makeWoodTexture({planks:4,hue:36,sat:16,light:78,gapW:2}),
  wood:makeWoodTexture({planks:4,hue:26,sat:46,light:44,gapW:3}),
  plastic:makePlasticTexture(),
  fabric:makeFabricTexture('#e9e4da'),
  sheet:makeFabricTexture('#b9c7d6',0.06)
};

function makeMat(baseTex,rx=1,ry=1,opts={}){
  const t=baseTex.clone();
  t.needsUpdate=true;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rx,ry);
  t.anisotropy=MAX_ANISO;
  t.generateMipmaps=true;
  t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter;
  t.colorSpace=THREE.SRGBColorSpace;
  return new THREE.MeshStandardMaterial({map:t,roughness:0.88,metalness:0.0,...opts});
}

scene.add(new THREE.HemisphereLight(0xf3e6d6,0x4a3524,0.78));
scene.add(new THREE.AmbientLight(0xffffff,0.26));
const dirLight=new THREE.DirectionalLight(0xfff1dc,1.0);
dirLight.position.set(-6,9.5,6);
scene.add(dirLight);
const lampLiving=new THREE.PointLight(0xffd7a0,7,11,2);
lampLiving.position.set(-4,2.72,0);
scene.add(lampLiving);

const ROOM_H=3.0;
const HALF_D=4.0;
const colliders=[];
function addCollider(cx,cz,w,d){colliders.push({minX:cx-w/2,maxX:cx+w/2,minZ:cz-d/2,maxZ:cz+d/2});}

function addFloor(cx,cz,w,d,mat){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);
  m.rotation.x=-Math.PI/2;
  m.position.set(cx,0,cz);
  m.frustumCulled=true;
  scene.add(m);
}

function addCeiling(cx,cz,w,d,mat){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),mat);
  m.rotation.x=Math.PI/2;
  m.position.set(cx,ROOM_H,cz);
  m.frustumCulled=true;
  scene.add(m);
}

addFloor(-4,0,8,8,makeMat(TEX.floor,3.2,3.2));
addCeiling(-4,0,8,8,makeMat(TEX.ceil,3,3));

function addWall(w,h,d,x,y,z,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  m.frustumCulled=true;
  scene.add(m);
  return m;
}

const TILE=2.2;

addWall(0.2,ROOM_H,HALF_D*2+0.4,-8.1,ROOM_H/2,0,makeMat(TEX.wall,(HALF_D*2)/TILE,ROOM_H/TILE));
addCollider(-8.1,0,0.2,HALF_D*2+0.4);

addWall(0.2,ROOM_H,HALF_D*2+0.4,0,ROOM_H/2,0,makeMat(TEX.wall,(HALF_D*2)/TILE,ROOM_H/TILE));
addCollider(0,0,0.2,HALF_D*2+0.4);

addWall(8.4,ROOM_H,0.2,-4,ROOM_H/2,-4.1,makeMat(TEX.wall,8.4/TILE,ROOM_H/TILE));
addCollider(-4,-4.1,8.4,0.2);

addWall(8.4,ROOM_H,0.2,-4,ROOM_H/2,4.1,makeMat(TEX.wall,8.4/TILE,ROOM_H/TILE));
addCollider(-4,4.1,8.4,0.2);

const TABLE={x:-4.6,z:1.4,topY:1.01,w:1.6,d:0.9};

function buildTable(x,z){
  const g=new THREE.Group();
  const topMat=makeMat(TEX.wood,1.6/1.2,0.9/1.2);
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.08,0.9),topMat);
  top.position.y=0.97;
  g.add(top);
  const legMat=makeMat(TEX.wood,0.3,0.7);
  const legGeo=new THREE.BoxGeometry(0.09,0.93,0.09);
  [[-0.7,-0.36],[0.7,-0.36],[-0.7,0.36],[0.7,0.36]].forEach(([lx,lz])=>{
    const leg=new THREE.Mesh(legGeo,legMat);
    leg.position.set(lx,0.465,lz);
    leg.frustumCulled=true;
    g.add(leg);
  });
  const barMat=makeMat(TEX.wood,0.8,0.1);
  const bar=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.05,0.05),barMat);
  bar.position.set(0,0.323,0.36);
  g.add(bar);
  const bar2=bar.clone();
  bar2.position.z=-0.36;
  g.add(bar2);
  g.position.set(x,0,z);
  scene.add(g);
  addCollider(x,z,1.6,0.9);
}
buildTable(TABLE.x,TABLE.z);

function buildTVCabinet(x,z){
  const g=new THREE.Group();

function escapeHtml(s){

function addLink(url,title,ts){
  url=String(url||'').trim();
  if(!url)return false;
  if(seenUrls.has(url))return false;
  seenUrls.add(url);
  videoList.push({url,title:String(title||'').trim(),ts:ts||0});
  return true;
}

function ingestNdjson(txt){
  let added=0;
  const lines=String(txt).split('\n');
  for(let i=0;i<lines.length;i++){
    const line=lines[i].trim();
    if(!line)continue;
    let d;
    try{d=JSON.parse(line)}catch(e){continue}
    if(!d||d.event!=='message'||!d.message)continue;
    let m=null;
    try{m=JSON.parse(d.message)}catch(e){m=null}
    if(m&&m.type==='video'&&m.url){
      if(addLink(m.url,m.title,d.time||m.ts))added++;
    }else if(typeof d.message==='string'&&/^https?:\/\//i.test(d.message.trim())){
      if(addLink(d.message.trim(),'',d.time))added++;
    }
  }
  return added;
}

function loadCache(){
  try{
    const arr=JSON.parse(localStorage.getItem(TV_API.cacheKey)||'[]');
    if(Array.isArray(arr)){
      arr.forEach(v=>{if(v&&v.url)addLink(v.url,v.title,v.ts)});
    }
  }catch(e){}
}

function saveCache(){
  try{localStorage.setItem(TV_API.cacheKey,JSON.stringify(videoList.slice(-300)))}catch(e){}
}

async function refreshLinks(){
  const token=++fetchToken;
  flashStatus('⏳ 正在拉取 API…',6000);
  const ctrl=new AbortController();
  const abortTimer=setTimeout(()=>ctrl.abort(),10000);
  try{
    const res=await fetch(`${TV_API.base}/${TV_API.topic}/json?poll=1&since=all`,{cache:'no-store',signal:ctrl.signal});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const txt=await res.text();
    if(token!==fetchToken)return;
    const added=ingestNdjson(txt);
    netState='online';
    if(added>0){saveCache();afterLinksChanged()}
    renderStatus();
    flashStatus(added>0?`✅ 同步完成，新增 ${added} 条`:'✅ 同步完成，无新增');
  }catch(err){
    if(token!==fetchToken)return;
    netState='offline';
    renderStatus();
    const msg=(err&&err.name==='AbortError')?'请求超时':(err.message||'网络错误');
    flashStatus('❌ 拉取失败：'+msg);
  }finally{
    clearTimeout(abortTimer);
  }
}

function connectStream(){
  try{if(es)es.close()}catch(e){}
  try{es=new EventSource(`${TV_API.base}/${TV_API.topic}/sse`)}catch(e){return}
  es.onopen=()=>{netState='online';renderStatus()};
  es.onmessage=(ev)=>{
    try{

      if(added>0){
        saveCache();
        afterLinksChanged();
        flashStatus(`📡 实时收到 ${added} 条新链接`);
      }
    }catch(e){}
  };
  es.onerror=()=>{
    if(netState!=='offline'){netState='offline';renderStatus()}
  };
}

function startPlayback(){
  if(tvState.paused)return;
  if(videoEl.paused){
    const p=videoEl.play();
    if(p&&p.catch)p.catch(()=>{});
  }
  if(audioEl.paused){
    const p=audioEl.play();
    if(p&&p.catch)p.catch(()=>{});
  }
}

function stopPlayback(){
  if(!videoEl.paused)videoEl.pause();
  if(!audioEl.paused)audioEl.pause();
}

function clearMediaCache(){
  try{videoEl.pause()}catch(e){}
  try{audioEl.pause()}catch(e){}
  videoEl.removeAttribute('src');
  audioEl.removeAttribute('src');
  videoEl.load();
  audioEl.load();
}

function selectVideo(i){
  if(videoList.length===0){
    clearPendingKick();
    clearMediaCache();
    applyScreenVisual();
    renderLinkList();
    return;
  }
  const now=performance.now();
  if(lastSwitchTime!==0&&now-lastSwitchTime<SWITCH_COOLDOWN)return;
  lastSwitchTime=now;
  tvState.index=((i%videoList.length)+videoList.length)%videoList.length;
  const url=videoList[tvState.index].url;
  const token=++loadToken;
  tvState.error=false;
  clearPendingKick();
  clearMediaCache();
  videoEl.src=url;
  audioEl.src=url;
  videoEl.load();
  audioEl.load();
  if(!tvState.paused){
    pendingKick=()=>{
      if(token!==loadToken)return;
      clearPendingKick();
      startPlayback();
    };
    videoEl.addEventListener('loadeddata',pendingKick);
    videoEl.addEventListener('canplay',pendingKick);
    pendingTimer=setTimeout(()=>{
      pendingTimer=null;
      if(token!==loadToken)return;
      startPlayback();
    },2000);
  }
  renderLinkList();
  applyScreenVisual();
}

function extractLink(input){
  if(!input)return '';
  const raw=String(input).trim();
  const urlMatch=raw.match(/https?:\/\/[^\s,，。；;）)】\]"'<>]+/);
  if(urlMatch)return urlMatch[0];
  let cleaned=raw.replace(/[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]/g,'');
  cleaned=cleaned.replace(/[\u3000-\u303f\uff00-\uffef\u2000-\u206f]/g,'');
  cleaned=cleaned.replace(/[，。！？、；：""''【】《》（）—…·]/g,'');
  cleaned=cleaned.replace(/\s+/g,'');
  cleaned=cleaned.replace(/[^A-Za-z0-9\-._~:/?#\[\]@!$&'()*+,;=%]/g,'');
  const bvMatch=cleaned.match(/BV[0-9A-Za-z]{10}/);
  if(bvMatch)return bvMatch[0];
  const avMatch=cleaned.match(/av\d+/i);
  if(avMatch)return avMatch[0];
  return cleaned;
}

function detectPlatform(input){
  const text=String(input||'').trim().toLowerCase();
  if(!text)return null;
  if(/bilibili\.com|b23\.tv|bili2233\.cn|b23\.wtf/.test(text)||/^bv[0-9a-z]{10}$/i.test(input.trim())||/^av\d+$/i.test(input.trim())){
    return 'bilibili';
  }
  if(/kuaishou\.com|v\.kuaishou\.com|kwai\.com/.test(text)){
    return 'kuaishou';
  }
  return null;
}

function parseBugpkResponse(json){
  if(!json||typeof json!=='object')throw new Error('接口返回为空');
  if(json.code!==undefined&&json.code!==0&&json.code!==200){
    throw new Error(json.msg||('接口返回错误 code='+json.code));
  }
  const d=json.data||json;
  const type=d.type||'video';
  if(type!=='video'){
    throw new Error(type==='image'?'该链接为图集作品，无法作为视频上传':type==='live'?'该链接为实况作品，无法作为视频上传':'该链接不是视频作品');
  }
  let videoUrl=d.url||d.video_url||d.videoUrl||d.play_url||'';
  if(!videoUrl&&Array.isArray(d.video_backup)&&d.video_backup.length>0){
    videoUrl=d.video_backup[0];
  }
  if(!videoUrl)throw new Error('未解析到视频直链');
  let title=d.title||d.desc||(Array.isArray(d.videos)&&d.videos[0]?d.videos[0].title:'')||'';
  let author='';
  if(d.author&&typeof d.author==='object'){
    author=d.author.name||d.author.nickname||'';
  }else if(d.user&&d.user.name){
    author=d.user.name;
  }else if(d.auther){
    author=d.auther;
  }else if(typeof d.author==='string'){
    author=d.author;
  }
  return{url:videoUrl,title,author,type};
}

async function resolveShareLink(link,platform){
  const encoded=encodeURIComponent(link);
  const apiUrl=platform==='bilibili'?`${BUGPK.base}/bilibili?url=${encoded}`:`${BUGPK.base}/kuaishou?url=${encoded}`;
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),BUGPK.timeout);
  try{
    const res=await fetch(apiUrl,{cache:'no-store',signal:ctrl.signal});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const json=await res.json();
    return parseBugpkResponse(json);
  }catch(err){
    if(err&&err.name==='AbortError')throw new Error('解析超时，请稍后重试');
    throw err;
  }finally{
    clearTimeout(timer);
  }
}

  const item=e.target.closest('.link-item');
  const raw=btn?btn.dataset.play:(item?item.dataset.i:null);
  if(raw===null||raw===undefined)return;
  const idx=parseInt(raw,10);
  if(!Number.isFinite(idx))return;
  tvState.paused=false;
  tvState.black=false;
  selectVideo(idx);
  startPlayback();
  applyScreenVisual();
  showTip('▶ '+(videoList[idx]?(videoList[idx].title||'频道 '+(idx+1)):''));
});

function setUploading(on,label){
  if(!linkUploadBtn)return;
  linkUploadBtn.disabled=!!on;
  linkUploadBtn.textContent=label||(on?'处理中…':'⬆ 上传到 API');
}

async function uploadLink(){
  const rawInput=linkUrlEl.value.trim();
  let title=linkTitleEl.value.trim();
  if(!rawInput){showTip('请输入视频直链或分享链接');linkUrlEl.focus();return;}
  const extracted=extractLink(rawInput);
  if(!extracted){showTip('未识别到有效链接');return;}
  const platform=detectPlatform(extracted);
  let finalUrl=extracted;
  let resolved=false;
  if(platform){
    const pName=platform==='bilibili'?'B站':'快手';
    setUploading(true,`解析${pName}中…`);
    flashStatus(`⏳ 检测到${pName}分享链接，正在解析无水印直链…`,15000);
    showTip(`正在解析${pName}直链…`);
    try{
      const result=await resolveShareLink(extracted,platform);
      finalUrl=result.url;
      if(!title&&result.title)title=result.title.slice(0,30);
      resolved=true;
      flashStatus('✅ 直链解析成功，正在上传…',8000);
    }catch(err){
      setUploading(false);
      const msg=err&&err.message?err.message:'未知错误';
      flashStatus('❌ 解析失败：'+msg,6000);
      showTip('解析失败：'+msg);
      return;
    }
  }
  if(!/^https?:\/\//i.test(finalUrl)){
    setUploading(false);
    showTip('链接需以 http:// 或 https:// 开头');
    return;
  }
  setUploading(true,'上传中…');
  const payload=JSON.stringify({type:'video',url:finalUrl,title,ts:Date.now()});
  const added=addLink(finalUrl,title,Date.now());
  linkUrlEl.value='';
  linkTitleEl.value='';
  if(added){saveCache();afterLinksChanged()}
  try{
    await fetch(`${TV_API.base}/${TV_API.topic}`,{
      method:'POST',
      body:payload,
      headers:{'Title':'TV-Link','Priority':'default'},
      cache:'no-store'
    });
    netState='online';
    renderStatus();
    const tag=resolved?'（已解直链）':'';
    flashStatus(`✅ 上传成功${tag} · 共 ${videoList.length} 条链接`);
    showTip(resolved?'已解析并上传直链':'已上传到 API');
  }catch(err){
    netState='offline';
    renderStatus();
    flashStatus('❌ 上传失败：'+((err&&err.message)||'网络错误'));
    showTip('上传失败（已保存在本地）');
  }finally{
    setUploading(false);
  }
}

linkUploadBtn.addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();uploadLink()});
document.getElementById('link-refresh').addEventListener('click',(e)=>{e.preventDefault();e.stopPropagation();refreshLinks()});
linkUrlEl.addEventListener('keydown',(e)=>{if(e.key==='Enter')uploadLink()});
linkTitleEl.addEventListener('keydown',(e)=>{if(e.key==='Enter')uploadLink()});

const interactables=[];
function registerInteractive(mesh,fn,name){
  mesh.userData.onInteract=fn;
  mesh.userData.displayName=name;
  mesh.frustumCulled=true;
  interactables.push(mesh);
}
tvButtons.forEach(btn=>registerInteractive(btn,btn.userData.onInteract,btn.userData.label));

const raycaster=new THREE.Raycaster();
const CENTER_2D=new THREE.Vector2(0,0);
const crosshairEl=document.getElementById('crosshair');
const interactBtn=document.getElementById('interact');
let currentTarget=null;

function updateInteraction(){
  raycaster.setFromCamera(CENTER_2D,camera);
  const hits=raycaster.intersectObjects(interactables,false);
  let found=null;
  for(let i=0;i<hits.length;i++){
    if(hits[i].distance<=2.0){found=hits[i].object;break;}
  }
  if(found!==currentTarget){
    currentTarget=found;
    crosshairEl.classList.toggle('active',!!found);
    interactBtn.classList.toggle('ready',!!found);
    if(found){
      const n=found.userData.displayName;
      interactBtn.textContent=n&&n.length<=2?n:'F';
    }else{
      interactBtn.textContent='F';
    }
  }
}

function doInteract(){
  if(!currentTarget)return;
  const fn=currentTarget.userData.onInteract;
  if(typeof fn==='function')fn();
}

interactBtn.addEventListener('pointerdown',(e)=>{e.preventDefault();e.stopPropagation();doInteract()});
interactBtn.addEventListener('contextmenu',e=>e.preventDefault());

const PLAYER_RADIUS=0.34;
const SPEED=2.9;
let yaw=0;
let pitch=0;

function resolveCollisions(pos,radius){
  for(let i=0;i<colliders.length;i++){
    const b=colliders[i];
    if(b.disabled)continue;
    const cx=Math.max(b.minX,Math.min(pos.x,b.maxX));
    const cz=Math.max(b.minZ,Math.min(pos.z,b.maxZ));
    const dx=pos.x-cx;
    const dz=pos.z-cz;
    const d2=dx*dx+dz*dz;
    if(d2<radius*radius){
      const d=Math.sqrt(d2);
      if(d>1e-5){
        const push=(radius-d)/d;
        pos.x+=dx*push;
        pos.z+=dz*push;
      }else{
        const left=pos.x-b.minX;
        const right=b.maxX-pos.x;
        const back=pos.z-b.minZ;
        const front=b.maxZ-pos.z;
        const m=Math.min(left,right,back,front);
        if(m===left)pos.x=b.minX-radius;
        else if(m===right)pos.x=b.maxX+radius;
        else if(m===back)pos.z=b.minZ-radius;
        else pos.z=b.maxZ+radius;
      }
    }
  }
}

const keys=Object.create(null);

window.addEventListener('keydown',(e)=>{
  if(e.repeat){
    if(e.code==='KeyF')return;
  }
  keys[e.code]=true;
  if(e.code==='KeyF'&&!e.repeat)doInteract();
  if(['KeyW','KeyA','KeyS','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)){
    e.preventDefault();
  }
});

window.addEventListener('keyup',(e)=>{keys[e.code]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

const joyEl=document.getElementById('joystick');
const knobEl=document.getElementById('knob');
let joyPointerId=null;
let joyCenterX=0,joyCenterY=0,joyRadius=60;
let joyX=0,joyY=0;

function joyStart(e){
  if(joyPointerId!==null)return;
  joyPointerId=e.pointerId;
  const r=joyEl.getBoundingClientRect();
  joyCenterX=r.left+r.width/2;
  joyCenterY=r.top+r.height/2;
  joyRadius=r.width/2-12;
  try{joyEl.setPointerCapture(e.pointerId)}catch(err){}
  joyMove(e);
  e.preventDefault();
  e.stopPropagation();
}

function joyMove(e){
  if(e.pointerId!==joyPointerId)return;
  let dx=e.clientX-joyCenterX;
  let dy=e.clientY-joyCenterY;
  const dist=Math.hypot(dx,dy);
  if(dist>joyRadius){
    dx=dx/dist*joyRadius;
    dy=dy/dist*joyRadius;
  }
  knobEl.style.transform=`translate(${dx}px, ${dy}px)`;
  joyX=dx/joyRadius;
  joyY=-dy/joyRadius;
  e.preventDefault();
}

function joyEnd(e){
  if(e.pointerId!==joyPointerId)return;
  joyPointerId=null;
  joyX=0;
  joyY=0;
  knobEl.style.transform='translate(0px, 0px)';
}

joyEl.addEventListener('pointerdown',joyStart);
joyEl.addEventListener('pointermove',joyMove);
joyEl.addEventListener('pointerup',joyEnd);
joyEl.addEventListener('pointercancel',joyEnd);
joyEl.addEventListener('lostpointercapture',joyEnd);
joyEl.addEventListener('contextmenu',e=>e.preventDefault());

const LOOK_SENS=0.0032;
let lookPointerId=null;
let lastPX=0,lastPY=0;
const canvasEl=renderer.domElement;

canvasEl.addEventListener('pointerdown',(e)=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(lookPointerId!==null)return;
  lookPointerId=e.pointerId;
  lastPX=e.clientX;
  lastPY=e.clientY;
  try{canvasEl.setPointerCapture(e.pointerId)}catch(err){}
});

canvasEl.addEventListener('pointermove',(e)=>{
  if(e.pointerId!==lookPointerId)return;
  const dx=e.clientX-lastPX;
  const dy=e.clientY-lastPY;
  lastPX=e.clientX;
  lastPY=e.clientY;
  yaw-=dx*LOOK_SENS;
  pitch-=dy*LOOK_SENS;
  const limit=Math.PI/2-0.02;
  pitch=Math.max(-limit,Math.min(limit,pitch));
});

function endLook(e){
  if(e.pointerId!==lookPointerId)return;
  lookPointerId=null;
  try{canvasEl.releasePointerCapture(e.pointerId)}catch(err){}
}

canvasEl.addEventListener('pointerup',endLook);
canvasEl.addEventListener('pointercancel',endLook);
canvasEl.addEventListener('contextmenu',e=>e.preventDefault());

let lastTime=performance.now();
let interactionTimer=0;

function update(dt){
  let ix=joyX;
  let iy=joyY;
  if(keys['KeyW']||keys['ArrowUp'])iy+=1;
  if(keys['KeyS']||keys['ArrowDown'])iy-=1;
  if(keys['KeyA']||keys['ArrowLeft'])ix-=1;
  if(keys['KeyD']||keys['ArrowRight'])ix+=1;
  const inLen=Math.hypot(ix,iy);
  if(inLen>1){ix/=inLen;iy/=inLen;}
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw);
  const rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const mx=fx*iy+rx*ix;
  const mz=fz*iy+rz*ix;
  if(mx!==0||mz!==0){
    const step=SPEED*dt;
    camera.position.x+=mx*step;
    camera.position.z+=mz*step;
    resolveCollisions(camera.position,PLAYER_RADIUS);
  }
  camera.position.y=EYE_HEIGHT;
  camera.rotation.set(pitch,yaw,0,'YXZ');
  interactionTimer+=dt;
  if(interactionTimer>0.05){
    interactionTimer=0;
    updateInteraction();
  }
}

function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min((now-lastTime)/1000,0.05);
  lastTime=now;
  update(dt);
  if(!tvState.paused&&!tvState.black&&!tvState.error&&videoEl.readyState>=2){
    videoTexture.needsUpdate=true;
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
});

const tipEl=document.getElementById('tip');
let tipTimer=setTimeout(()=>{tipEl.style.opacity='0'},6200);

function showTip(text,ms=1900){
  tipEl.textContent=text;
  tipEl.style.opacity='1';
  clearTimeout(tipTimer);
  tipTimer=setTimeout(()=>{tipEl.style.opacity='0'},ms);
}

document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

loadCache();
if(videoList.length>0){
  autoLoaded=true;
  tvState.index=0;
  selectVideo(0);
}else{
  applyScreenVisual();
}
renderLinkList();
renderStatus();
refreshLinks();
connectStream();
</script>
