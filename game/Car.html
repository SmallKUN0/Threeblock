<!DOCTYPE html>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0b0e13;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;

  .hud {
    position: fixed; left: 18px; top: 16px; z-index: 10;

  .pad {

  .btn {

  @media (max-width: 560px) {

{

<body>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============================================================
   0. 工具
   ============================================================ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}

function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi);
  const b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1);
  const d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

function periodicNoise(x, y, period) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const w = (i) => ((i % period) + period) % period;
  const a = hash2(w(xi), w(yi));
  const b = hash2(w(xi + 1), w(yi));
  const c = hash2(w(xi), w(yi + 1));
  const d = hash2(w(xi + 1), w(yi + 1));
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

function fbm(x, y) {
  let v = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) {
    v += amp * valueNoise(x * f, y * f);
    f *= 2.03;
    amp *= 0.5;
  }
  return v / 0.9375;
}

/* ============================================================
   1. 地形高度 / 法线
   ============================================================ */
function terrainHeight(x, z) {
  const base   = fbm(x * 0.045,        z * 0.045);
  const detail = fbm(x * 0.175 + 41.3, z * 0.175 - 17.7);
  return (base - 0.5) * 6.4 + (detail - 0.5) * 0.84;
}

const _nTmp = new THREE.Vector3();
function terrainNormal(x, z, e = 0.7) {
  const hL = terrainHeight(x - e, z);
  const hR = terrainHeight(x + e, z);
  const hD = terrainHeight(x, z - e);
  const hU = terrainHeight(x, z + e);
  return _nTmp.set(hL - hR, 2 * e, hD - hU).normalize();
}

/* ============================================================
   2. 渲染器 / 场景 / 相机
   ============================================================ */
const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const SKY = 0xa2ccf2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 25, 50);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;
pmrem.dispose();

const BASE_VISUAL_FAR = 55;
const BASE_FOG_NEAR = 25;
const BASE_FOG_FAR = 50;
const BASE_CHUNK_RADIUS = 10;

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.5, BASE_VISUAL_FAR);
camera.position.set(0, 6, -10);

/* ============================================================
   3. 灯光（无阴影）
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xc4e0ff, 0x4a6b38, 0.95));
scene.add(new THREE.AmbientLight(0xffffff, 0.18));

const sun = new THREE.DirectionalLight(0xfff3dd, 2.35);
sun.castShadow = false;
sun.position.set(14, 26, 10);
scene.add(sun);

const rim = new THREE.DirectionalLight(0x8fc0ff, 0.7);
rim.castShadow = false;
rim.position.set(-12, 8, -10);
scene.add(rim);

/* ============================================================
   4. 程序化天空 + 体积云
   ============================================================ */
const NOISE_GLSL = `
  float hash21(vec2 p){
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  float vnoise(vec2 p){
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f*f*(3.0-2.0*f);
    float a = hash21(i);
    float b = hash21(i+vec2(1.0,0.0));
    float c = hash21(i+vec2(0.0,1.0));
    float d = hash21(i+vec2(1.0,1.0));
    return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
  }
  float fbm(vec2 p){
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
    for(int i=0;i<5;i++){
      v += a * vnoise(p);
      p = rot * p * 2.02 + vec2(1.7, 9.2);
      a *= 0.5;
    }
    return v;
  }
  float sampleCloud(vec2 uv, float time, float coverage, float wind, float detail, float scale){
    vec2 p = uv * 0.045 / scale;
    p += vec2(time * wind * 0.4, time * wind * 0.1);

    vec2 q = vec2(
      vnoise(p * 1.3 + vec2(0.0, time * 0.04)),
      vnoise(p * 1.3 + vec2(5.2, 1.3) + vec2(time * 0.035, 0.0))
    );

    float base = fbm(p + q * 0.7);
    float det = fbm(p * 3.0 + 11.3 + q * 0.4);

    float covField = vnoise(p * 0.2 + vec2(time * 0.025, time * 0.018) + 17.3);
    float effCov = coverage + (covField - 0.5) * 0.55;
    effCov = clamp(effCov, 0.0, 1.0);

    float d = base + det * detail * 0.35;
    d = d - (1.0 - effCov) * 0.85;
    d = smoothstep(0.0, 0.28, d);
    return d;
  }
`;

const skyUniforms = {
  uTime:          { value: 0 },
  uSunDir:        { value: new THREE.Vector3(0.42, 0.78, 0.46).normalize() },
  uSunHeight:     { value: 0.78 },
  uCloudCoverage: { value: 0.55 },
  uWindSpeed:     { value: 0.30 },
  uCameraPos:     { value: new THREE.Vector3() },
  uDetail:        { value: 0.50 },
  uScale:         { value: 1.00 },
  uExposure:      { value: 1.00 },
};

const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  side: THREE.BackSide,
  depthWrite: false,
  depthTest: false,
  vertexShader: `
    varying vec3 vWorldDir;
    void main(){
      vWorldDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec3 vWorldDir;
    uniform float uTime;
    uniform vec3 uSunDir;
    uniform float uSunHeight;
    uniform float uCloudCoverage;
    uniform float uWindSpeed;
    uniform vec3 uCameraPos;
    uniform float uDetail;
    uniform float uScale;
    uniform float uExposure;
    ${NOISE_GLSL}

    vec3 getSkyColor(vec3 dir, float sh){
      float t = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 dayHorizon  = vec3(0.78, 0.88, 0.96);
      vec3 dayZenith   = vec3(0.30, 0.55, 0.92);
      vec3 nightHorizon= vec3(0.09, 0.11, 0.20);
      vec3 nightZenith = vec3(0.02, 0.03, 0.07);
      vec3 sunsetHoriz = vec3(1.0, 0.50, 0.22);
      vec3 sunsetZen   = vec3(0.35, 0.22, 0.42);

      float dayF = smoothstep(-0.15, 0.28, sh);
      float sunsetF = clamp(1.0 - abs(sh) * 2.6, 0.0, 1.0);
      sunsetF *= smoothstep(-0.22, 0.06, sh);

      vec3 horizon = mix(nightHorizon, dayHorizon, dayF);
      vec3 zenith  = mix(nightZenith,  dayZenith,  dayF);
      horizon = mix(horizon, sunsetHoriz, sunsetF * 0.88);
      zenith  = mix(zenith,  sunsetZen,  sunsetF * 0.42);

      return mix(horizon, zenith, pow(t, 0.55));
    }

    vec3 getSun(vec3 dir, vec3 sunDir, float sh){
      float sd = max(0.0, dot(dir, sunDir));
      float disk = smoothstep(0.9995, 0.99978, sd);
      float glow = pow(sd, 80.0)*0.55 + pow(sd, 8.0)*0.22 + pow(sd, 2.0)*0.06;

      vec3 sunCol = vec3(1.0, 0.96, 0.88);
      if(sh < 0.35) sunCol = mix(vec3(1.0, 0.42, 0.15), sunCol, smoothstep(0.0, 0.35, sh));
      if(sh < 0.0)  sunCol = vec3(0.85, 0.9, 1.0);
      return disk * sunCol * 2.2 + glow * sunCol * 0.7;
    }

    void main(){
      vec3 dir = normalize(vWorldDir);
      vec3 sky = getSkyColor(dir, uSunHeight);
      sky += getSun(dir, uSunDir, uSunHeight);

      if(uSunHeight < 0.1){
        float nightF = smoothstep(0.1, -0.25, uSunHeight);
        float s = step(0.9986, hash21(dir.xy*900.0 + dir.z*120.0));
        float tw = 0.55 + 0.45*sin(uTime*2.5 + hash21(dir.xy*40.0)*30.0);
        sky += s * vec3(0.95, 0.98, 1.0) * nightF * tw * 0.9;
      }

      if(dir.y > 0.02){
        float cloudY = 80.0;
        float t = (cloudY - uCameraPos.y) / dir.y;
        vec2 cuv = dir.xz * t + uCameraPos.xz;
        float density = sampleCloud(cuv, uTime, uCloudCoverage, uWindSpeed, uDetail, uScale);
        float edge = smoothstep(0.0, 0.18, dir.y);
        density *= edge;

        vec3 sunDir = normalize(uSunDir);
        float sunLight = clamp(sunDir.y * 1.6 + 0.25, 0.0, 1.0);

        vec3 cLit, cShadow;
        if(uSunHeight > 0.35){
          cLit = vec3(1.0, 0.99, 0.97);
          cShadow = vec3(0.48, 0.54, 0.66);
        } else if(uSunHeight > 0.0){
          float f = uSunHeight / 0.35;
          cLit    = mix(vec3(1.0, 0.55, 0.30), vec3(1.0, 0.99, 0.97), f);
          cShadow = mix(vec3(0.42, 0.28, 0.42), vec3(0.48, 0.54, 0.66), f);
        } else {
          cLit    = vec3(0.28, 0.32, 0.44);
          cShadow = vec3(0.10, 0.13, 0.20);
        }

        vec3 dirXZ = normalize(vec3(dir.x, 0.0, dir.z) + 1e-5);
        vec3 sunXZ = normalize(vec3(sunDir.x, 0.0, sunDir.z) + 1e-5);
        float sunInfl = max(0.0, dot(dirXZ, sunXZ));
        sunInfl = pow(sunInfl, 3.0);

        float sunsetF = clamp(1.0 - abs(uSunHeight)*2.6, 0.0, 1.0) * step(-0.22, uSunHeight);
        vec3 warmTint = vec3(1.0, 0.55, 0.30);
        vec3 coolTint = vec3(0.65, 0.42, 0.62);
        vec3 dirTint  = mix(coolTint, warmTint, sunInfl);

        vec3 cloudCol = mix(cShadow, cLit, sunLight);
        cloudCol = mix(cloudCol, dirTint, sunsetF * 0.45);
        cloudCol = mix(cloudCol, cLit * 1.25, sunInfl * sunsetF * 0.55);

        sky = mix(sky, cloudCol, density);
      }

      gl_FragColor = vec4(sky * uExposure, 1.0);
    }
  `
});

const skyGeo  = new THREE.SphereGeometry(50, 32, 16);
const skyMesh = new THREE.Mesh(skyGeo, skyMat);
skyMesh.frustumCulled = false;
skyMesh.renderOrder = -1000;
scene.add(skyMesh);

/* ============================================================
   5. 像素贴图工厂
   ============================================================ */
function makeCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return c;
}

function toPixelTexture(canvas) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestMipmapNearestFilter;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.generateMipmaps = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 1;
  return tex;
}

function hslToRgb(h, s, l) {
  const a = s * Math.min(l, 1 - l);
  const f = (n) => {
    const k = (n + h * 12) % 12;
    return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
  };
  return [f(0), f(8), f(4)];
}

const GRASS_TEX_SIZE = 64;
const GRASS_TILE_WORLD = 4;
const ROAD_TILE_WORLD = 6;      // 与区块大小一致，纹理与区块对齐

function makeGrassTexture() {
  const size = GRASS_TEX_SIZE;
  const P = 16;
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const nx = (x / size) * P;
      const ny = (y / size) * P;
      const n = periodicNoise(nx, ny, P) * 0.68 + Math.random() * 0.32;

      const hue = 0.255 + (n - 0.5) * 0.062;
      const sat = clamp(0.38 + (n - 0.5) * 0.36, 0.14, 0.88);
      const val = clamp(0.33 + (n - 0.5) * 0.40, 0.13, 0.80);

      const [r, g, b] = hslToRgb(hue, sat, val);
      const i = (y * size + x) * 4;
      d[i] = (r * 255) | 0;
      d[i + 1] = (g * 255) | 0;
      d[i + 2] = (b * 255) | 0;
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return toPixelTexture(c);
}

function makeRoadTexture() {
  const size = GRASS_TEX_SIZE;
  const P = 16;
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const nx = (x / size) * P;
      const ny = (y / size) * P;
      const n = periodicNoise(nx, ny, P) * 0.72 + Math.random() * 0.28;

      const lum = clamp(0.05 + n * 0.40, 0.03, 0.44);
      const v = (lum * 255) | 0;

      const i = (y * size + x) * 4;
      d[i] = v;
      d[i + 1] = v;
      d[i + 2] = v;
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return toPixelTexture(c);
}

function makeColorTexture(hex, size = 16, jitter = 0.09) {
  const col = new THREE.Color(hex);
  const hsl = { h: 0, s: 0, l: 0 };
  col.getHSL(hsl);

  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;

  for (let i = 0; i < size * size; i++) {
    const h = clamp(hsl.h + (Math.random() - 0.5) * 0.025, 0, 1);
    const s = clamp(hsl.s + (Math.random() - 0.5) * jitter * 2.0, 0, 1);
    const l = clamp(hsl.l + (Math.random() - 0.5) * jitter * 1.6, 0, 1);
    const [r, g, b] = hslToRgb(h, s, l);
    d[i * 4] = (r * 255) | 0;
    d[i * 4 + 1] = (g * 255) | 0;
    d[i * 4 + 2] = (b * 255) | 0;
    d[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return toPixelTexture(c);
}

function pixelMat(hex, opts = {}) {
  const { size = 16, jitter = 0.09, metalness = 0.25, roughness = 0.7 } = opts;
  return new THREE.MeshStandardMaterial({
    map: makeColorTexture(hex, size, jitter),
    metalness,
    roughness,
  });
}

/* ============================================================
   6. 道路生成
   ============================================================ */
const roadChunks = new Set();
const roadKey = (cx, cz) => cx + '|' + cz;

(function initRoad() {
  let cx = 0, cz = 0;
  let dirX = 1, dirZ = 0;
  roadChunks.add(roadKey(cx, cz));

  const MAX_STEPS = 260;
  for (let i = 0; i < MAX_STEPS; i++) {
    if (i > 3 && Math.random() < 0.02) {
      const rX = dirZ,  rZ = -dirX;
      const lX = -dirZ, lZ = dirX;
      const rOK = !roadChunks.has(roadKey(cx + rX, cz + rZ));
      const lOK = !roadChunks.has(roadKey(cx + lX, cz + lZ));
      const options = [];
      if (rOK) options.push([rX, rZ]);
      if (lOK) options.push([lX, lZ]);
      if (options.length) {
        const pick = options[Math.floor(Math.random() * options.length)];
        dirX = pick[0]; dirZ = pick[1];
      }
    }
    cx += dirX;
    cz += dirZ;
    if (roadChunks.has(roadKey(cx, cz))) break;
    roadChunks.add(roadKey(cx, cz));
  }
})();

/* ============================================================
   7. 草叶系统
   ============================================================ */
const bladeTexture = (function makeBladeTexture() {
  const W = 128, H = 1024;
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createLinearGradient(0, H, 0, 0);
  grad.addColorStop(0.00, '#16300a');
  grad.addColorStop(0.28, '#2d6114');
  grad.addColorStop(0.62, '#4d9924');
  grad.addColorStop(0.88, '#74bb33');
  grad.addColorStop(1.00, '#9ad84a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const veins = 13;
  for (let i = 0; i < veins; i++) {
    const t = (i + 1) / (veins + 1);
    const baseX = t * W;
    const distFromCenter = Math.abs(t - 0.5) * 2;
    const alpha = 0.30 - distFromCenter * 0.20;

    ctx.beginPath();
    const steps = 26;
    for (let s = 0; s <= steps; s++) {
      const p = s / steps;
      const y = H - p * H;
      const wave = Math.sin(p * Math.PI * 1.15 + i * 0.7) * 2.0 * p * p;
      const x = baseX + wave;
      if (s === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.strokeStyle = `rgba(178, 232, 108, ${alpha})`;
    ctx.lineWidth = 1.6;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  ctx.beginPath();
  for (let s = 0; s <= 48; s++) {
    const p = s / 48;
    const y = H - p * H;
    const x = W / 2 + Math.sin(p * Math.PI * 1.4) * 2.4 * p;
    if (s === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(214, 246, 150, 0.50)';
  ctx.lineWidth = 3.4;
  ctx.stroke();

  ctx.beginPath();
  for (let s = 0; s <= 48; s++) {
    const p = s / 48;
    const y = H - p * H;
    const x = W / 2 + Math.sin(p * Math.PI * 1.4) * 2.4 * p - 1.6;
    if (s === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(235, 255, 190, 0.22)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  for (let i = 0; i < 90; i++) {
    const y = Math.random() * H;
    const p = 1 - y / H;
    const len = 6 + Math.random() * 22;
    const x = Math.random() * W;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len, y + (Math.random() - 0.5) * 3);
    ctx.strokeStyle = `rgba(255, 255, 210, ${0.05 + 0.07 * (1 - p)})`;
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }

  for (let i = 0; i < 2600; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const a = Math.random() * 0.10;
    ctx.fillStyle = Math.random() > 0.5
      ? `rgba(255, 255, 220, ${a})`
      : `rgba(10, 40, 5, ${a * 0.9})`;
    ctx.fillRect(x, y, 1, 1);
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.needsUpdate = true;
  return tex;
})();

const grassBladeMaterial = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uMap:  { value: bladeTexture }
  },
  side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    uniform float uTime;
    attribute vec2 aOrigin;

    varying vec2  vUv;
    varying float vHeight;
    varying float vShade;

    float hash(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
    }

    void main() {
      vUv     = uv;
      vHeight = uv.y;

      float rnd   = hash(aOrigin);
      float phase = aOrigin.x * 1.7 + aOrigin.y * 2.3 + rnd * 6.2831;

      float bend = pow(uv.y, 1.5);

      float windX = sin(uTime * 1.60 + phase)       * 0.30
                  + sin(uTime * 0.70 + phase * 0.5) * 0.16
                  + sin(uTime * 3.10 + phase * 2.0) * 0.05;

      float windZ = cos(uTime * 1.25 + phase * 0.9) * 0.16
                  + sin(uTime * 2.30 + phase * 1.3) * 0.06;

      vec3 pos = position;
      pos.x += windX * bend;
      pos.z += windZ * bend;

      vShade = rnd;

      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D uMap;

    varying vec2  vUv;
    varying float vHeight;
    varying float vShade;

    void main() {
      vec3 col = texture2D(uMap, vUv).rgb;

      col *= 0.78 + vShade * 0.46;

      col += vec3(0.10, 0.09, 0.0) * pow(vHeight, 3.0) * (0.4 + vShade * 0.6);

      if (!gl_FrontFacing) col *= 0.80;

      gl_FragColor = vec4(col, 1.0);
    }
  `
});

/* 生成单个区块的合并草叶几何体 —— 修复：草叶位置以区块中心为原点 */
function buildGrassGeometry(cx, cz, chunkSize, count) {
  const SEG = 5;
  const HEIGHT = 1.0;
  const BASE_W = 0.075;

  const baseVerts = [];
  for (let s = 0; s <= SEG; s++) {
    const t = s / SEG;
    const y = t * HEIGHT;
    const w = BASE_W * (1 - 0.85 * t);
    const bend = t * t * 0.22;
    baseVerts.push([-w * 0.5, y, bend, 0, t]);
    baseVerts.push([ w * 0.5, y, bend, 1, t]);
  }

  const positions = [];
  const uvs = [];
  const origins = [];
  const indices = [];

  const ox = cx * chunkSize;
  const oz = cz * chunkSize;

  let vertOffset = 0;

  for (let i = 0; i < count; i++) {
    const r1 = hash2(cx * 17.3 + i * 2.71, cz * 11.9 + i * 1.33);
    const r2 = hash2(cx * 5.17 + i * 1.91, cz * 19.3 + i * 3.77);
    const r3 = hash2(cx * 13.1 + i * 3.30, cz * 7.50 + i * 2.20);
    const r4 = hash2(cx * 3.70 + i * 4.40, cz * 15.1 + i * 1.10);
    const r5 = hash2(cx * 21.5 + i * 1.70, cz * 3.30 + i * 5.50);
    const r6 = hash2(cx * 9.90 + i * 6.10, cz * 27.7 + i * 3.20);

    // ★ 修复：草叶相对区块中心 [-size/2, +size/2] 均匀分布，
    //        与以原点为中心的 PlaneGeometry 完全重合。
    const lx = (r1 - 0.5) * chunkSize;
    const lz = (r2 - 0.5) * chunkSize;
    const wx = ox + lx;
    const wz = oz + lz;
    const wy = terrainHeight(wx, wz);

    const scaleXZ = 0.80 + r3 * 0.50;
    const scaleY  = 0.55 + r4 * 0.95;
    const rotY    = r5 * Math.PI * 2;
    const tiltZ   = (r6 - 0.5) * 0.30;

    const cy = Math.cos(rotY), sy = Math.sin(rotY);
    const ct = Math.cos(tiltZ), st = Math.sin(tiltZ);

    for (const bv of baseVerts) {
      const bvx = bv[0], bvy = bv[1], bvz = bv[2], u = bv[3], v = bv[4];

      let x1 = bvx * ct - bvy * st;
      let y1 = bvx * st + bvy * ct;
      let z1 = bvz;

      x1 *= scaleXZ; y1 *= scaleY; z1 *= scaleXZ;

      const x2 =  x1 * cy + z1 * sy;
      const z2 = -x1 * sy + z1 * cy;

      positions.push(wx + x2, wy + y1, wz + z2);
      uvs.push(u, v);
      origins.push(wx, wz);
    }

    for (let s = 0; s < SEG; s++) {
      const a = vertOffset + s * 2;
      const b = a + 1;
      const c = a + 2;
      const d = a + 3;
      indices.push(a, c, b, b, c, d);
    }
    vertOffset += (SEG + 1) * 2;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  geo.setAttribute('aOrigin',  new THREE.Float32BufferAttribute(origins, 2));
  geo.setIndex(indices);
  geo.computeBoundingSphere();
  return geo;
}

const NEAR_SIZE = 6;
const NEAR_SEG = 12;
let NEAR_RADIUS = BASE_CHUNK_RADIUS;

const GRASS_PER_CHUNK = 140;

const grassTexture = makeGrassTexture();
const roadTexture  = makeRoadTexture();

const grassMaterial = new THREE.MeshStandardMaterial({
  map: grassTexture,
  vertexColors: true,
  roughness: 0.96,
  metalness: 0.0,
});

const roadMaterial = new THREE.MeshStandardMaterial({
  map: roadTexture,

const PINE_MAT = {
  trunk: pixelMat(0x5b3d28, { size: 24, jitter: 0.14, roughness: 0.92, metalness: 0.0 }),
  canopy: [
    pixelMat(0x2a5528, { size: 24, jitter: 0.17, roughness: 0.88, metalness: 0.0 }),
    pixelMat(0x316030, { size: 24, jitter: 0.17, roughness: 0.88, metalness: 0.0 }),
    pixelMat(0x3a6b38, { size: 24, jitter: 0.17, roughness: 0.88, metalness: 0.0 }),
  ],
  tip: pixelMat(0x4f7c46, { size: 24, jitter: 0.15, roughness: 0.85, metalness: 0.0 }),
};

function createPine() {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.42, 2.8, 8, 1),
    PINE_MAT.trunk
  );
  trunk.position.y = 1.4;
  g.add(trunk);

  for (let i = 0; i < 6; i++) {
    const radius = 2.05 - i * 0.3;
    const height = 1.75 - i * 0.06;
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(radius, height, 8, 1),
      PINE_MAT.canopy[i % 3]
    );
    cone.position.y = 1.65 + i * 0.78;
    cone.rotation.y = i * 0.45;
    g.add(cone);
  }

  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.7, 6), PINE_MAT.tip);
  tip.position.y = 6.35;
  g.add(tip);

  return g;
}

const chunks = new Map();

function buildChunk(size, seg, ox, oz, cx, cz, isRoad) {
  const group = new THREE.Group();

  /* --- 地面网格 --- */
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI / 2);

  const pos = geo.attributes.position;
  const uv = geo.attributes.uv;

  for (let i = 0; i < pos.count; i++) {
    const lx = pos.getX(i);              // 本地坐标（-size/2 .. +size/2）
    const lz = pos.getZ(i);
    const x = lx + ox;
    const z = lz + oz;
    pos.setXYZ(i, x, terrainHeight(x, z), z);

    // ★ 修复：道路 UV 改为世界空间（与草地一致），
    //        使用 ROAD_TILE_WORLD = 区块大小 6，使纹理与区块边界严格对齐。
    if (isRoad) {
      uv.setXY(i, x / ROAD_TILE_WORLD, z / ROAD_TILE_WORLD);
    } else {
      uv.setXY(i, x / GRASS_TILE_WORLD, z / GRASS_TILE_WORLD);
    }
  }
  pos.needsUpdate = true;
  uv.needsUpdate = true;
  geo.computeVertexNormals();
  geo.computeBoundingSphere();

  const tr = 1 + (hash2(cx * 13.7, cz * 7.3) - 0.5) * 0.15;
  const tg = 1 + (hash2(cx * 3.1 + 5.0, cz * 9.9) - 0.5) * 0.15;
  const tb = 1 + (hash2(cx * 5.5, cz * 2.7 + 11.0) - 0.5) * 0.15;
  const colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    colors[i * 3] = tr;
    colors[i * 3 + 1] = tg;
    colors[i * 3 + 2] = tb;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mesh = new THREE.Mesh(geo, isRoad ? roadMaterial : grassMaterial);
  mesh.castShadow = false;
  mesh.receiveShadow = false;
  mesh.frustumCulled = false;
  group.add(mesh);

  /* --- 草叶：仅非路面区块 --- */
  if (!isRoad) {
    const grassGeo = buildGrassGeometry(cx, cz, size, GRASS_PER_CHUNK);
    const grassMesh = new THREE.Mesh(grassGeo, grassBladeMaterial);
    grassMesh.castShadow = false;
    grassMesh.receiveShadow = false;
    grassMesh.frustumCulled = true;
    group.add(grassMesh);
  }

  /* --- 松树（非路面 5% 概率） --- */
  if (!isRoad) {
    const roll = hash2(cx * 12.37, cz * 7.13);
    if (roll < 0.05) {
      const offX = hash2(cx * 3.71 + 1.0, cz * 5.29 + 2.0);
      const offZ = hash2(cx * 7.13 + 3.0, cz * 2.41 + 4.0);
      const px = ox + size * (0.2 + offX * 0.6);
      const pz = oz + size * (0.2 + offZ * 0.6);
      const py = terrainHeight(px, pz);

      const pine = createPine();
      pine.position.set(px, py, pz);
      const sc = 0.6 + hash2(cx * 11.1, cz * 3.3) * 0.7;
      pine.scale.setScalar(sc);
      pine.rotation.y = hash2(cx * 9.7, cz * 5.5) * Math.PI * 2;
      group.add(pine);
    }
  }

  return group;
}

let lastNCX = 1e9, lastNCZ = 1e9;
let forceChunkRefresh = false;

function updateChunks(px, pz) {
  const ncx = Math.floor(px / NEAR_SIZE);
  const ncz = Math.floor(pz / NEAR_SIZE);

  if (!forceChunkRefresh && ncx === lastNCX && ncz === lastNCZ) return;
  lastNCX = ncx; lastNCZ = ncz;
  forceChunkRefresh = false;

  const needed = new Set();

  for (let dz = -NEAR_RADIUS; dz <= NEAR_RADIUS; dz++) {
    for (let dx = -NEAR_RADIUS; dx <= NEAR_RADIUS; dx++) {
      const cx = ncx + dx, cz = ncz + dz;
      const key = 'N' + cx + '|' + cz;
      needed.add(key);
      if (!chunks.has(key)) {
        const isRoad = roadChunks.has(roadKey(cx, cz));
        const g = buildChunk(NEAR_SIZE, NEAR_SEG, cx * NEAR_SIZE, cz * NEAR_SIZE, cx, cz, isRoad);
        scene.add(g);
        chunks.set(key, g);
      }
    }
  }

  for (const [k, g] of chunks) {
    if (!needed.has(k)) {
      scene.remove(g);
      g.traverse((o) => { if (o.geometry) o.geometry.dispose(); });
      chunks.delete(k);
    }
  }
}

  wheelBase:    2.30,
  maxSteer:     0.62,
  rollResist:   6.0,
  dragCoef:     0.30,
  lateralGrip:  7.8,
};

const car = {
  pos: new THREE.Vector3(0, 0, 0),
  vel: new THREE.Vector3(0, 0, 0),
  yaw: Math.PI / 2,
  vLong: 0,
};
car.pos.set(0, terrainHeight(0, 0), 0);

const keyState = { gas: false, brake: false, reverse: false, left: false, right: false };
const btnState = { gas: false, brake: false, reverse: false, left: false, right: false };
const IN = { gas: false, brake: false, reverse: false, left: false, right: false };

const KEYMAP = {
  KeyQ: 'gas',
  KeyW: 'brake',
  KeyS: 'reverse',
  KeyA: 'left',
  KeyD: 'right',
  ArrowUp: 'gas',
  ArrowDown: 'brake',
  ArrowLeft: 'left',
  ArrowRight: 'right',
};

window.addEventListener('keydown', (e) => {
  const act = KEYMAP[e.code];
  if (act) { keyState[act] = true; e.preventDefault(); }
});
window.addEventListener('keyup', (e) => {
  const act = KEYMAP[e.code];
  if (act) { keyState[act] = false; e.preventDefault(); }
});
window.addEventListener('blur', () => {
  for (const k in keyState) keyState[k] = false;
});

const _fwd = new THREE.Vector3();
const _right = new THREE.Vector3();

function stepPhysics(dt) {
  for (const k in IN) IN[k] = keyState[k] || btnState[k];

  _fwd.set(Math.sin(car.yaw), 0, Math.cos(car.yaw));
  _right.set(Math.cos(car.yaw), 0, -Math.sin(car.yaw));

  let vLong = car.vel.dot(_fwd);
  let vLat = car.vel.dot(_right);

  const speedRatio = clamp(Math.abs(vLong) / PHYS.maxSpeed, 0, 1);

  let accel = 0;

  if (IN.gas) {
    accel += (PHYS.engineForce / PHYS.mass) * (1 - 0.85 * speedRatio);
  }

  if (IN.brake) {
    if (vLong > 0.4) accel -= PHYS.brakeForce / PHYS.mass;
    else if (vLong < -0.4) accel += PHYS.brakeForce / PHYS.mass;
    else vLong = 0;
  }

  if (IN.reverse) {
    if (vLong > 0.4) {
      accel -= PHYS.brakeForce / PHYS.mass;
    } else {
      const rr = clamp(Math.abs(vLong) / PHYS.maxReverse, 0, 1);
      accel -= (PHYS.reverseForce / PHYS.mass) * (1 - 0.8 * rr);
    }
  }

  accel -= (PHYS.rollResist / PHYS.mass) * vLong;
  accel -= (PHYS.dragCoef / PHYS.mass) * vLong * Math.abs(vLong);

  vLong += accel * dt;
  vLong = clamp(vLong, -PHYS.maxReverse, PHYS.maxSpeed);

  const grip = PHYS.lateralGrip * (1 - 0.32 * speedRatio);
  vLat *= Math.exp(-grip * dt);
  if (Math.abs(vLat) < 0.002) vLat = 0;

  let steerInput = 0;
  if (IN.left)  steerInput += 1;
  if (IN.right) steerInput -= 1;

  const steerAngle = steerInput * PHYS.maxSteer / (1 + Math.abs(vLong) * 0.32);
  const yawRate = (vLong / PHYS.wheelBase) * Math.tan(steerAngle);

  car.vel.copy(_fwd).multiplyScalar(vLong).addScaledVector(_right, vLat);
  car.vel.y = 0;

  car.yaw += clamp(yawRate, -3.0, 3.0) * dt;
  if (car.yaw > Math.PI) car.yaw -= Math.PI * 2;
  if (car.yaw < -Math.PI) car.yaw += Math.PI * 2;

  car.pos.x += car.vel.x * dt;
  car.pos.z += car.vel.z * dt;

  const c = Math.cos(car.yaw), s = Math.sin(car.yaw);
  let hSum = 0;
  const wOffs = [[-WHEEL_X, WHEEL_Z], [WHEEL_X, WHEEL_Z], [-WHEEL_X, -WHEEL_Z], [WHEEL_X, -WHEEL_Z]];
  for (const [wx, wz] of wOffs) {
    const wxp = car.pos.x + wx * c + wz * s;
    const wzp = car.pos.z - wx * s + wz * c;
    hSum += terrainHeight(wxp, wzp);
  }
  const targetY = hSum * 0.25;
  car.pos.y += (targetY - car.pos.y) * Math.min(1, dt * 14);

  car.vLong = vLong;

  const spin = (vLong / WHEEL_R) * dt;
  for (const w of wheels) w.rotation.x += spin;
}

const _qTarget = new THREE.Quaternion();
const _mBasis = new THREE.Matrix4();
const _vF = new THREE.Vector3();
const _vR = new THREE.Vector3();

function updateCarVisual(dt) {
  carGroup.position.copy(car.pos);

  const n = terrainNormal(car.pos.x, car.pos.z);
  _vF.set(Math.sin(car.yaw), 0, Math.cos(car.yaw));
  _vF.projectOnPlane(n).normalize();
  _vR.crossVectors(n, _vF).normalize();

  _mBasis.makeBasis(_vR, n, _vF);
  _qTarget.setFromRotationMatrix(_mBasis);

  carGroup.quaternion.slerp(_qTarget, 1 - Math.exp(-14 * dt));
}

/* ============================================================
   11. 第三人称四元数相机
   ============================================================ */
const BASE_FOV = 52;
const MAX_FOV = 135;

let camYaw = Math.PI + car.yaw;
let camPitch = 0.40;
const CAM_DIST = 8.2;

let dragging = false;
let lastMX = 0, lastMY = 0;

renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  dragging = true;
  lastMX = e.clientX;
  lastMY = e.clientY;
  e.preventDefault();
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastMX;
  const dy = e.clientY - lastMY;
  lastMX = e.clientX;
  lastMY = e.clientY;

  camYaw -= dx * 0.0052;
  camPitch = clamp(camPitch + dy * 0.0052, 0.04, 1.32);
});
window.addEventListener('mouseup', () => { dragging = false; });
window.addEventListener('contextmenu', (e) => e.preventDefault());

let lookTouchId = null;
let lastTX = 0, lastTY = 0;

renderer.domElement.addEventListener('touchstart', (e) => {
  if (lookTouchId !== null) return;
  const t = e.changedTouches[0];
  lookTouchId = t.identifier;
  lastTX = t.clientX;
  lastTY = t.clientY;
  e.preventDefault();
}, { passive: false });

renderer.domElement.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier !== lookTouchId) continue;
    const dx = t.clientX - lastTX;
    const dy = t.clientY - lastTY;
    lastTX = t.clientX;
    lastTY = t.clientY;
    camYaw -= dx * 0.0062;
    camPitch = clamp(camPitch + dy * 0.0062, 0.04, 1.32);
  }
  e.preventDefault();
}, { passive: false });

function endLook(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === lookTouchId) lookTouchId = null;
  }
}
renderer.domElement.addEventListener('touchend', endLook, { passive: false });
renderer.domElement.addEventListener('touchcancel', endLook, { passive: false });

const _camQuat = new THREE.Quaternion();
const _camEuler = new THREE.Euler(0, 0, 0, 'YXZ');
const _camOffset = new THREE.Vector3();
const _camTarget = new THREE.Vector3();

function updateCamera(dt) {
  if (!dragging && lookTouchId === null) {
    const follow = clamp(Math.abs(car.vLong) / 6, 0, 1);
    if (follow > 0.01) {
      const desired = car.yaw + Math.PI;
      let diff = desired - camYaw;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      camYaw += diff * (1 - Math.exp(-dt * 1.4)) * follow;
    }
  }

  _camEuler.set(-camPitch, camYaw, 0, 'YXZ');
  _camQuat.setFromEuler(_camEuler);

  _camOffset.set(0, 0, 1).applyQuaternion(_camQuat).multiplyScalar(CAM_DIST);

  _camTarget.copy(car.pos);
  _camTarget.y += 1.15;

  camera.position.copy(_camTarget).add(_camOffset);

  const minY = terrainHeight(camera.position.x, camera.position.z) + 0.7;
  if (camera.position.y < minY) camera.position.y = minY;

  camera.lookAt(_camTarget);

  const spd = Math.hypot(car.vel.x, car.vel.z);
  const ratio = clamp(spd / PHYS.maxSpeed, 0, 1);
  const targetFov = BASE_FOV + (MAX_FOV - BASE_FOV) * ratio;
  camera.fov += (targetFov - camera.fov) * (1 - Math.exp(-dt * 3.2));
  camera.updateProjectionMatrix();
}

/* ============================================================
   12. GPU 粒子系统（圆形黑烟）
   ============================================================ */
class ParticleSystem {
  constructor(max, color) {
    this.max = max;
    this.count = 0;
    this.pos = new Float32Array(max * 3);
    this.vel = new Float32Array(max * 3);
    this.size = new Float32Array(max);
    this.alpha = new Float32Array(max);
    this.life = new Float32Array(max);
    this.maxLife = new Float32Array(max);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage));
    geo.setDrawRange(0, 0);

    const mat = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color(color) } },
      vertexShader: `
        attribute float aSize;
        attribute float aAlpha;
        varying float vAlpha;
        void main() {
          vAlpha = aAlpha;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * (400.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        varying float vAlpha;
        void main() {
          vec2 c = gl_PointCoord - vec2(0.5);
          float d = length(c);
          if (d > 0.5) discard;
          float edge = smoothstep(0.5, 0.42, d);
          gl_FragColor = vec4(uColor, vAlpha * edge);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.NormalBlending,
    });

    this.points = new THREE.Points(geo, mat);
    this.points.frustumCulled = false;
    this.geo = geo;
  }

  spawn(x, y, z, vx, vy, vz, size, life) {
    if (this.count >= this.max) return;
    const i = this.count++;
    const i3 = i * 3;
    this.pos[i3] = x; this.pos[i3 + 1] = y; this.pos[i3 + 2] = z;
    this.vel[i3] = vx; this.vel[i3 + 1] = vy; this.vel[i3 + 2] = vz;
    this.size[i] = size;
    this.alpha[i] = 1;
    this.life[i] = life;
    this.maxLife[i] = life;
  }

  update(dt) {
    for (let i = 0; i < this.count; i++) {
      this.life[i] -= dt;
      if (this.life[i] <= 0) {
        const last = --this.count;
        if (i !== last) {
          const i3 = i * 3, l3 = last * 3;
          this.pos[i3] = this.pos[l3];
          this.pos[i3 + 1] = this.pos[l3 + 1];
          this.pos[i3 + 2] = this.pos[l3 + 2];
          this.vel[i3] = this.vel[l3];
          this.vel[i3 + 1] = this.vel[l3 + 1];
          this.vel[i3 + 2] = this.vel[l3 + 2];
          this.size[i] = this.size[last];
          this.alpha[i] = this.alpha[last];
          this.life[i] = this.life[last];
          this.maxLife[i] = this.maxLife[last];
        }
        i--;
        continue;
      }

      const i3 = i * 3;
      this.pos[i3] += this.vel[i3] * dt;
      this.pos[i3 + 1] += this.vel[i3 + 1] * dt;
      this.pos[i3 + 2] += this.vel[i3 + 2] * dt;
      this.alpha[i] = Math.max(0, this.life[i] / this.maxLife[i]);
    }

    this.geo.setDrawRange(0, this.count);
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.aSize.needsUpdate = true;
    this.geo.attributes.aAlpha.needsUpdate = true;
  }
}

const smokeParticles = new ParticleSystem(600, 0x1b1b1b);
scene.add(smokeParticles.points);

const SMOKE_INTERVAL = 0.032;
let smokeTimer = 0;

const _discFwd = new THREE.Vector3();

function updateParticles(dt) {
  _discFwd.set(Math.sin(car.yaw), 0, Math.cos(car.yaw));

  if (IN.gas && Math.abs(car.vLong) > 0.4) {
    smokeTimer += dt;
    while (smokeTimer >= SMOKE_INTERVAL) {
      smokeTimer -= SMOKE_INTERVAL;
      const bx = car.pos.x - _discFwd.x * 0.9 + (Math.random() - 0.5) * 0.9;
      const bz = car.pos.z - _discFwd.z * 0.9 + (Math.random() - 0.5) * 0.9;
      const by = car.pos.y + 0.10;

      smokeParticles.spawn(
        bx, by, bz,
        (Math.random() - 0.5) * 0.7,
        0.45 + Math.random() * 0.7,
        (Math.random() - 0.5) * 0.7,
        0.42 + Math.random() * 0.34,
        1.1 + Math.random() * 0.7
      );
    }
  } else {
    smokeTimer = 0;
  }

  smokeParticles.update(dt);
}

/* ============================================================
   13. 渲染距离滑块
   ============================================================ */
const compSlider = document.getElementById('compDistSlider');
const visSlider  = document.getElementById('visDistSlider');
const compVal    = document.getElementById('compDistVal');
const visVal     = document.getElementById('visDistVal');

function applyRenderDistances() {
  const visMult = parseInt(visSlider.value, 10) / 100;
  camera.far = BASE_VISUAL_FAR * visMult;
  camera.updateProjectionMatrix();
  scene.fog.near = BASE_FOG_NEAR * visMult;
  scene.fog.far  = BASE_FOG_FAR  * visMult;

  const compMult = parseInt(compSlider.value, 10) / 100;
  const newRadius = Math.max(1, Math.round(BASE_CHUNK_RADIUS * compMult));
  if (newRadius !== NEAR_RADIUS) {
    NEAR_RADIUS = newRadius;
    forceChunkRefresh = true;
  }

  compVal.textContent = compSlider.value + '%';
  visVal.textContent  = visSlider.value  + '%';
}

compSlider.addEventListener('input', applyRenderDistances);
visSlider.addEventListener('input', applyRenderDistances);
applyRenderDistances();

/* ============================================================
   14. 移动端按钮
   ============================================================ */
document.querySelectorAll('.btn').forEach((btn) => {
  const act = btn.dataset.act;
  if (!act) return;

  const press = (e) => {
    e.preventDefault();
    btnState[act] = true;
    btn.classList.add('pressed');
    if (btn.setPointerCapture && e.pointerId !== undefined) {
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
    }
  };
  const release = (e) => {
    if (e) e.preventDefault();
    btnState[act] = false;
    btn.classList.remove('pressed');
  };

  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('pointerleave', release);
});

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');

/* ============================================================
   15. HUD
   ============================================================ */
const spdNum = document.getElementById('spdNum');
const spdBar = document.getElementById('spdBar');

let smoothSpd = 0;
function updateHUD(dt) {
  const raw = Math.hypot(car.vel.x, car.vel.z);
  smoothSpd += (raw - smoothSpd) * Math.min(1, dt * 10);
  const shown = clamp(smoothSpd, 0, 30);
  spdNum.textContent = shown.toFixed(1);
  spdBar.style.width = (shown / 30 * 100).toFixed(1) + '%';
}

/* ============================================================
   16. 主循环
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  stepPhysics(dt);
  updateCarVisual(dt);
  updateChunks(car.pos.x, car.pos.z);
  updateCamera(dt);
  updateParticles(dt);
  updateHUD(dt);

  grassBladeMaterial.uniforms.uTime.value = elapsed;

  skyUniforms.uTime.value = elapsed;
  skyUniforms.uCameraPos.value.copy(camera.position);

  skyMesh.position.copy(camera.position);
  skyMesh.scale.setScalar((camera.far * 0.9) / 50);

  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);

updateChunks(car.pos.x, car.pos.z);
lastNCX = 1e9;

/* ============================================================
   17. 自适应
   ============================================================ */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
</script>
