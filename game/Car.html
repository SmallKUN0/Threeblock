<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0b0e13;

  #appContainer {
    position: fixed;
    top: 50%; left: 50%;

  .dist-controls {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    z-index: 30;
    background: rgba(16,22,32,.78);
    border: 1px solid rgba(255,255,255,.10);

    padding: 8px 14px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 24px rgba(0,0,0,.42);
    display: flex; flex-direction: column; gap: 5px;
    min-width: 268px;
  }
  .dist-row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #cfe0f5; }
  .dist-label { white-space: nowrap; letter-spacing: .5px; min-width: 84px; }
  .dist-row input[type="range"] {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,.12); outline: none; cursor: pointer;
  }
  .dist-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #ffb166;

  .dist-row input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #ffb166; border: none;

  .pad { position: absolute; z-index: 20; display: none; gap: 12px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ============================================================
   0. 工具
   ============================================================ */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}

function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi);
  const b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1);
  const d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

function periodicNoise(x, y, period) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const w = (i) => ((i % period) + period) % period;
  const a = hash2(w(xi), w(yi));
  const b = hash2(w(xi + 1), w(yi));
  const c = hash2(w(xi), w(yi + 1));
  const d = hash2(w(xi + 1), w(yi + 1));
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

function fbm(x, y) {
  let v = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) {
    v += amp * valueNoise(x * f, y * f);
    f *= 2.03;
    amp *= 0.5;
  }
  return v / 0.9375;
}

/* ============================================================
   1. 地形高度 / 法线
   ============================================================ */
function terrainHeight(x, z) {
  const base   = fbm(x * 0.045,        z * 0.045);
  const detail = fbm(x * 0.175 + 41.3, z * 0.175 - 17.7);
  return (base - 0.5) * 6.4 + (detail - 0.5) * 0.84;
}

const _nTmp = new THREE.Vector3();
function terrainNormal(x, z, e = 0.7) {
  const hL = terrainHeight(x - e, z);
  const hR = terrainHeight(x + e, z);
  const hD = terrainHeight(x, z - e);
  const hU = terrainHeight(x, z + e);
  return _nTmp.set(hL - hR, 2 * e, hD - hU).normalize();
}

/* ============================================================
   2. 渲染器 / 场景 / 相机
   ============================================================ */
const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const SKY = 0xa2ccf2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 25, 50);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;
pmrem.dispose();

const BASE_VISUAL_FAR = 55;
const BASE_FOG_NEAR = 25;
const BASE_FOG_FAR = 50;
const BASE_CHUNK_RADIUS = 10;

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.5, BASE_VISUAL_FAR);
camera.position.set(0, 6, -10);

/* ============================================================
   2b. 翻转屏幕
   ============================================================ */
const appContainer = document.getElementById('appContainer');
const btnFlipScreen = document.getElementById('btnFlipScreen');
let isPortrait = false;

function toggleFlipScreen() {
  isPortrait = !isPortrait;
  appContainer.classList.toggle('portrait', isPortrait);
  btnFlipScreen.textContent = isPortrait ? '横屏模式' : '翻转屏幕';
  onResize();
  setTimeout(onResize, 500);
}

btnFlipScreen.addEventListener('click', toggleFlipScreen);
btnFlipScreen.addEventListener('touchend', (e) => { e.preventDefault(); toggleFlipScreen(); }, { passive: false });

/* ============================================================
   3. 灯光
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xc4e0ff, 0x4a6b38, 0.95));
scene.add(new THREE.AmbientLight(0xffffff, 0.18));

const sun = new THREE.DirectionalLight(0xfff3dd, 2.35);
sun.castShadow = false;
sun.position.set(14, 26, 10);
scene.add(sun);

const rim = new THREE.DirectionalLight(0x8fc0ff, 0.7);
rim.castShadow = false;
rim.position.set(-12, 8, -10);
scene.add(rim);

/* ============================================================
   4. 程序化天空 + 静态体积云
   ============================================================ */
const NOISE_GLSL = `
  float hash21(vec2 p){
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  float vnoise(vec2 p){
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f*f*(3.0-2.0*f);
    float a = hash21(i);
    float b = hash21(i+vec2(1.0,0.0));
    float c = hash21(i+vec2(0.0,1.0));
    float d = hash21(i+vec2(1.0,1.0));
    return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
  }
  float fbm(vec2 p){
    float v = 0.0;
    float a = 0.5;
    mat2 rot = mat2(0.8, 0.6, -0.6, 0.8);
    for(int i=0;i<5;i++){
      v += a * vnoise(p);
      p = rot * p * 2.02 + vec2(1.7, 9.2);
      a *= 0.5;
    }
    return v;
  }
  float sampleCloud(vec2 uv, float coverage, float detail, float scale){
    vec2 p = uv * 0.045 / scale;
    vec2 q = vec2(vnoise(p * 1.3), vnoise(p * 1.3 + vec2(5.2, 1.3)));
    float base = fbm(p + q * 0.7);
    float det = fbm(p * 3.0 + 11.3 + q * 0.4);
    float covField = vnoise(p * 0.2 + 17.3);
    float effCov = coverage + (covField - 0.5) * 0.55;
    effCov = clamp(effCov, 0.0, 1.0);
    float d = base + det * detail * 0.35;
    d = d - (1.0 - effCov) * 0.85;
    d = smoothstep(0.0, 0.28, d);
    return d;
  }
`;

const skyUniforms = {
  uTime:          { value: 0 },
  uSunDir:        { value: new THREE.Vector3(0.42, 0.78, 0.46).normalize() },
  uSunHeight:     { value: 0.78 },
  uCloudCoverage: { value: 0.55 },
  uWindSpeed:     { value: 0.30 },
  uCameraPos:     { value: new THREE.Vector3() },
  uDetail:        { value: 0.50 },
  uScale:         { value: 1.00 },
  uExposure:      { value: 1.00 },
};

const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  side: THREE.BackSide,
  depthWrite: false,
  depthTest: false,
  vertexShader: `
    varying vec3 vWorldDir;
    void main(){
      vWorldDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec3 vWorldDir;
    uniform float uTime;
    uniform vec3 uSunDir;
    uniform float uSunHeight;
    uniform float uCloudCoverage;
    uniform float uWindSpeed;
    uniform vec3 uCameraPos;
    uniform float uDetail;
    uniform float uScale;
    uniform float uExposure;
    ${NOISE_GLSL}
    vec3 getSkyColor(vec3 dir, float sh){
      float t = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 dayHorizon  = vec3(0.78, 0.88, 0.96);
      vec3 dayZenith   = vec3(0.30, 0.55, 0.92);
      vec3 nightHorizon= vec3(0.09, 0.11, 0.20);
      vec3 nightZenith = vec3(0.02, 0.03, 0.07);
      vec3 sunsetHoriz = vec3(1.0, 0.50, 0.22);
      vec3 sunsetZen   = vec3(0.35, 0.22, 0.42);
      float dayF = smoothstep(-0.15, 0.28, sh);
      float sunsetF = clamp(1.0 - abs(sh) * 2.6, 0.0, 1.0);
      sunsetF *= smoothstep(-0.22, 0.06, sh);
      vec3 horizon = mix(nightHorizon, dayHorizon, dayF);
      vec3 zenith  = mix(nightZenith,  dayZenith,  dayF);
      horizon = mix(horizon, sunsetHoriz, sunsetF * 0.88);
      zenith  = mix(zenith,  sunsetZen,  sunsetF * 0.42);
      return mix(horizon, zenith, pow(t, 0.55));
    }
    vec3 getSun(vec3 dir, vec3 sunDir, float sh){
      float sd = max(0.0, dot(dir, sunDir));
      float disk = smoothstep(0.9995, 0.99978, sd);
      float glow = pow(sd, 80.0)*0.55 + pow(sd, 8.0)*0.22 + pow(sd, 2.0)*0.06;
      vec3 sunCol = vec3(1.0, 0.96, 0.88);
      if(sh < 0.35) sunCol = mix(vec3(1.0, 0.42, 0.15), sunCol, smoothstep(0.0, 0.35, sh));
      if(sh < 0.0)  sunCol = vec3(0.85, 0.9, 1.0);
      return disk * sunCol * 2.2 + glow * sunCol * 0.7;
    }
    void main(){
      vec3 dir = normalize(vWorldDir);
      vec3 sky = getSkyColor(dir, uSunHeight);
      sky += getSun(dir, uSunDir, uSunHeight);
      if(uSunHeight < 0.1){
        float nightF = smoothstep(0.1, -0.25, uSunHeight);
        float s = step(0.9986, hash21(dir.xy*900.0 + dir.z*120.0));
        float tw = 0.55 + 0.45*sin(uTime*2.5 + hash21(dir.xy*40.0)*30.0);
        sky += s * vec3(0.95, 0.98, 1.0) * nightF * tw * 0.9;
      }
      if(dir.y > 0.02){
        float cloudY = 80.0;
        float t = (cloudY - uCameraPos.y) / dir.y;
        vec2 cuv = dir.xz * t + uCameraPos.xz;
        float density = sampleCloud(cuv, uCloudCoverage, uDetail, uScale);
        float edge = smoothstep(0.0, 0.18, dir.y);
        density *= edge;
        vec3 sunDir = normalize(uSunDir);
        float sunLight = clamp(sunDir.y * 1.6 + 0.25, 0.0, 1.0);
        vec3 cLit, cShadow;
        if(uSunHeight > 0.35){ cLit = vec3(1.0, 0.99, 0.97); cShadow = vec3(0.48, 0.54, 0.66); }
        else if(uSunHeight > 0.0){
          float f = uSunHeight / 0.35;
          cLit = mix(vec3(1.0, 0.55, 0.30), vec3(1.0, 0.99, 0.97), f);
          cShadow = mix(vec3(0.42, 0.28, 0.42), vec3(0.48, 0.54, 0.66), f);
        } else { cLit = vec3(0.28, 0.32, 0.44); cShadow = vec3(0.10, 0.13, 0.20); }
        vec3 dirXZ = normalize(vec3(dir.x, 0.0, dir.z) + 1e-5);
        vec3 sunXZ = normalize(vec3(sunDir.x, 0.0, sunDir.z) + 1e-5);
        float sunInfl = max(0.0, dot(dirXZ, sunXZ));
        sunInfl = pow(sunInfl, 3.0);
        float sunsetF = clamp(1.0 - abs(uSunHeight)*2.6, 0.0, 1.0) * step(-0.22, uSunHeight);
        vec3 warmTint = vec3(1.0, 0.55, 0.30);
        vec3 coolTint = vec3(0.65, 0.42, 0.62);
        vec3 dirTint  = mix(coolTint, warmTint, sunInfl);
        vec3 cloudCol = mix(cShadow, cLit, sunLight);
        cloudCol = mix(cloudCol, dirTint, sunsetF * 0.45);
        cloudCol = mix(cloudCol, cLit * 1.25, sunInfl * sunsetF * 0.55);
        sky = mix(sky, cloudCol, density);
      }
      gl_FragColor = vec4(sky * uExposure, 1.0);
    }
  `
});

const skyGeo  = new THREE.SphereGeometry(50, 32, 16);
const skyMesh = new THREE.Mesh(skyGeo, skyMat);
skyMesh.frustumCulled = false;
skyMesh.renderOrder = -1000;
scene.add(skyMesh);

/* ============================================================
   5. 像素贴图工厂
   ============================================================ */
function makeCanvas(size) { const c = document.createElement('canvas'); c.width = c.height = size; return c; }

function toPixelTexture(canvas) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestMipmapNearestFilter;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.generateMipmaps = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 1;
  return tex;
}

function hslToRgb(h, s, l) {
  const a = s * Math.min(l, 1 - l);
  const f = (n) => {
    const k = (n + h * 12) % 12;
    return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
  };
  return [f(0), f(8), f(4)];
}

const GRASS_TEX_SIZE = 64;
const GRASS_TILE_WORLD = 4;
const ROAD_TILE_WORLD = 12;

function makeGrassTexture() {
  const size = GRASS_TEX_SIZE, P = 16;
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const nx = (x / size) * P, ny = (y / size) * P;
    const n = periodicNoise(nx, ny, P) * 0.68 + Math.random() * 0.32;
    const hue = 0.255 + (n - 0.5) * 0.062;
    const sat = clamp(0.38 + (n - 0.5) * 0.36, 0.14, 0.88);
    const val = clamp(0.33 + (n - 0.5) * 0.40, 0.13, 0.80);
    const [r, g, b] = hslToRgb(hue, sat, val);
    const i = (y * size + x) * 4;
    d[i] = (r * 255) | 0; d[i + 1] = (g * 255) | 0; d[i + 2] = (b * 255) | 0; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return toPixelTexture(c);
}

function makeRoadTexture() {
  const size = GRASS_TEX_SIZE, P = 16;
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const nx = (x / size) * P, ny = (y / size) * P;
    const n = periodicNoise(nx, ny, P) * 0.72 + Math.random() * 0.28;
    const lum = clamp(0.05 + n * 0.40, 0.03, 0.44);
    const v = (lum * 255) | 0;
    const i = (y * size + x) * 4;
    d[i] = v; d[i + 1] = v; d[i + 2] = v; d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return toPixelTexture(c);
}

function makeColorTexture(hex, size = 16, jitter = 0.09) {
  const col = new THREE.Color(hex);
  const hsl = { h: 0, s: 0, l: 0 };
  col.getHSL(hsl);
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let i = 0; i < size * size; i++) {
    const h = clamp(hsl.h + (Math.random() - 0.5) * 0.025, 0, 1);
    const s = clamp(hsl.s + (Math.random() - 0.5) * jitter * 2.0, 0, 1);
    const l = clamp(hsl.l + (Math.random() - 0.5) * jitter * 1.6, 0, 1);
    const [r, g, b] = hslToRgb(h, s, l);
    d[i * 4] = (r * 255) | 0; d[i * 4 + 1] = (g * 255) | 0; d[i * 4 + 2] = (b * 255) | 0; d[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return toPixelTexture(c);
}

function pixelMat(hex, opts = {}) {
  const { size = 16, jitter = 0.09, metalness = 0.25, roughness = 0.7 } = opts;
  return new THREE.MeshStandardMaterial({ map: makeColorTexture(hex, size, jitter), metalness, roughness });
}

/* ============================================================
   6. 道路生成
   ============================================================ */
const roadChunks = new Set();
const roadKey = (cx, cz) => cx + '|' + cz;

(function initRoad() {
  let cx = 0, cz = 0, dirX = 1, dirZ = 0;
  roadChunks.add(roadKey(cx, cz));
  const MAX_STEPS = 5000;
  for (let i = 0; i < MAX_STEPS; i++) {
    if (i > 3 && Math.random() < 0.02) {
      const rX = dirZ, rZ = -dirX;
      const lX = -dirZ, lZ = dirX;
      const rOK = !roadChunks.has(roadKey(cx + rX, cz + rZ));
      const lOK = !roadChunks.has(roadKey(cx + lX, cz + lZ));
      const options = [];
      if (rOK) options.push([rX, rZ]);
      if (lOK) options.push([lX, lZ]);
      if (options.length) {
        const pick = options[Math.floor(Math.random() * options.length)];
        dirX = pick[0]; dirZ = pick[1];
      }
    }
    cx += dirX; cz += dirZ;
    roadChunks.add(roadKey(cx, cz));
  }
})();

   7. 草叶系统
   ============================================================ */
const GRASS_MODEL_URL = 'https://cdn.jsdelivr.net/gh/smallkun0/Grass@main/Field/YuMi_Plant.glb';
let grassModelPrototype = null;

const gltfLoader = new GLTFLoader();
gltfLoader.load(
  GRASS_MODEL_URL,
  (gltf) => {
    grassModelPrototype = new THREE.Group();
    grassModelPrototype.add(gltf.scene);
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const minY = box.min.y;
    gltf.scene.position.y = -minY;
    const maxAniso = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    gltf.scene.traverse((o) => {
      if (!o.isMesh || !o.material) return;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) {
        const keys = ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'emissiveMap', 'aoMap', 'alphaMap'];
        for (const k of keys) {
          const t = m[k];
          if (t && t.isTexture) {
            t.generateMipmaps = true;
            t.minFilter = THREE.LinearMipmapLinearFilter;
            t.magFilter = THREE.LinearFilter;
            t.anisotropy = maxAniso;
            t.needsUpdate = true;
          }
        }
        m.needsUpdate = true;
      }
      o.frustumCulled = true;
    });
    forceChunkRefresh = true;
  },
  undefined,
  (error) => { console.error('Failed to load grass model:', error); }
);

function addGrassInstances(group, cx, cz, chunkSize, count) {
  if (!grassModelPrototype || count <= 0) return;
  const ox = cx * chunkSize;
  const oz = cz * chunkSize;
  for (let i = 0; i < count; i++) {
    const r1 = hash2(cx * 17.3 + i * 2.71, cz * 11.9 + i * 1.33);
    const r2 = hash2(cx * 5.17 + i * 1.91, cz * 19.3 + i * 3.77);
    const r3 = hash2(cx * 13.1 + i * 3.30, cz * 7.50 + i * 2.20);
    const r4 = hash2(cx * 3.70 + i * 4.40, cz * 15.1 + i * 1.10);
    const r5 = hash2(cx * 21.5 + i * 1.70, cz * 3.30 + i * 5.50);
    const r6 = hash2(cx * 9.90 + i * 6.10, cz * 27.7 + i * 3.20);
    const lx = (r1 - 0.5) * chunkSize;
    const lz = (r2 - 0.5) * chunkSize;
    const wx = ox + lx;
    const wz = oz + lz;
    const wy = terrainHeight(wx, wz);
    const scaleXZ = 0.80 + r3 * 0.50;
    const scaleY  = 0.55 + r4 * 0.95;
    const rotY    = r5 * Math.PI * 2;
    const tiltZ   = (r6 - 0.5) * 0.30;
    const instance = grassModelPrototype.clone();
    instance.scale.set(scaleXZ, scaleY, scaleXZ);
    instance.rotation.y = rotY;
    instance.rotation.z = tiltZ;
    instance.position.set(wx, wy, wz);
    group.add(instance);
  }
}

const NEAR_SIZE = 12;
const NEAR_SEG = 24;
let NEAR_RADIUS = BASE_CHUNK_RADIUS;

const BASE_GRASS_PER_CHUNK = Math.round(560 * 0.12);
let plantDensityPct = 100;

const grassTexture = makeGrassTexture();
const roadTexture  = makeRoadTexture();

const grassMaterial = new THREE.MeshStandardMaterial({ map: grassTexture, vertexColors: true, roughness: 0.96, metalness: 0.0 });
const roadMaterial  = new THREE.MeshStandardMaterial({ map: roadTexture,  vertexColors: true, roughness: 0.95, metalness: 0.0 });

/* -------- 8.1 栅栏原型 -------- */
const FENCE_PROTO_WIDTH  = 6.72;
const FENCE_SCALE        = NEAR_SIZE / FENCE_PROTO_WIDTH;
const FENCE_HEIGHT_SCALE = 0.5;

let fencePrototype = null;

function buildFencePrototype() {
  const g = new THREE.Group();
  const woodMats = [
    pixelMat(0xb07c4a, { size: 24, jitter: 0.13, roughness: 0.94, metalness: 0.0 }),
    pixelMat(0xa06f40, { size: 24, jitter: 0.13, roughness: 0.94, metalness: 0.0 }),
    pixelMat(0xbb8753, { size: 24, jitter: 0.13, roughness: 0.94, metalness: 0.0 }),
  ];
  let mi = 0;
  const nextMat = () => woodMats[(mi++) % woodMats.length];
  function part(w, h, d, x, y, z) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), nextMat());
    mesh.position.set(x, y, z);
    mesh.castShadow = false; mesh.receiveShadow = false;
    g.add(mesh);
    return mesh;
  }
  [-3.22, 3.22].forEach((x) => {
    part(0.28, 2.34, 0.28, x, 1.17, 0);
    part(0.40, 0.14, 0.40, x, 2.41, 0);
  });
  part(6.60, 0.18, 0.12, 0, 0.70, 0);
  part(6.60, 0.18, 0.12, 0, 1.62, 0);
  const SLAT_COUNT = 17, SLAT_GAP = 0.36;
  const startX = -((SLAT_COUNT - 1) * SLAT_GAP) / 2;
  for (let i = 0; i < SLAT_COUNT; i++) {
    const x = startX + i * SLAT_GAP;
    const t = Math.abs(Math.sin(i * 12.9898) * 43758.5453 % 1);
    const h = 1.84 + t * 0.24;
    part(0.22, h, 0.10, x, h / 2 + 0.10, 0.055);
  }
  g.scale.set(FENCE_SCALE, FENCE_SCALE * FENCE_HEIGHT_SCALE, FENCE_SCALE);
  g.updateMatrixWorld(true);
  const lb = new THREE.Box3().setFromObject(g);
  g.userData.localMin = lb.min.clone();
  g.userData.localMax = lb.max.clone();
  return g;
}

fencePrototype = buildFencePrototype();

/* -------- 8.1b 裙边 -------- */
const SKIRT_CHUNKS = 5;
const skirtMaterial = pixelMat(0x7a542c, { size: 32, jitter: 0.14, roughness: 0.95, metalness: 0.0 });

let skirtGeoAlongX = null, skirtGeoAlongZ = null;
function getSkirtGeometry(alongX, size) {
  const len = SKIRT_CHUNKS * size;
  if (alongX) {
    if (!skirtGeoAlongX) skirtGeoAlongX = new THREE.BoxGeometry(size, len, 0.3);
    return skirtGeoAlongX;
  } else {
    if (!skirtGeoAlongZ) skirtGeoAlongZ = new THREE.BoxGeometry(0.3, len, size);
    return skirtGeoAlongZ;
  }
}

const fenceColliders = [];
function collectFenceColliders() {
  fenceColliders.length = 0;
  for (const g of chunks.values()) {
    const boxes = g.userData.fenceBoxes;
    if (!boxes) continue;
    for (let i = 0; i < boxes.length; i++) fenceColliders.push(boxes[i]);
  }
}

function tryCreateFence(group, cx, cz, size) {
  if (!fencePrototype) return;
  const myRoad = roadChunks.has(roadKey(cx, cz));
  const dirs = [{ dx: 1, dz: 0 }, { dx: 0, dz: 1 }];
  for (const dir of dirs) {
    const ncx = cx + dir.dx, ncz = cz + dir.dz;
    const nRoad = roadChunks.has(roadKey(ncx, ncz));
    if (nRoad === myRoad) continue;
    const r = hash2(cx * 12.97 + dir.dx * 31.7 + 5.3, cz * 7.13 + dir.dz * 47.1 + 9.1);
    if (r >= 0.5) continue;
    let fx, fz, rotY;
    if (dir.dx === 1) { fx = (cx + 0.5) * size; fz = cz * size; rotY = Math.PI / 2; }
    else { fx = cx * size; fz = (cz + 0.5) * size; rotY = 0; }
    const half = size * 0.5;
    let maxH = -Infinity;
    const samples = 9;
    for (let i = 0; i <= samples; i++) {
      const t = i / samples;
      let sx, sz;
      if (dir.dx === 1) { sx = fx; sz = fz - half + t * size; }
      else { sx = fx - half + t * size; sz = fz; }
      const h = terrainHeight(sx, sz);
      if (h > maxH) maxH = h;
    }
    const fence = fencePrototype.clone();
    fence.position.set(fx, maxH, fz);
    fence.rotation.y = rotY;
    group.add(fence);
    const skirtLen = SKIRT_CHUNKS * size;
    const alongX = (dir.dx === 0);
    const skirt = new THREE.Mesh(getSkirtGeometry(alongX, size), skirtMaterial);
    skirt.position.set(fx, maxH - skirtLen / 2, fz);
    skirt.castShadow = false; skirt.receiveShadow = false;
    group.add(skirt);
    const lmin = fencePrototype.userData.localMin;
    const lmax = fencePrototype.userData.localMax;
    let minX, maxX, minZ, maxZ;
    if (rotY === 0) { minX = fx + lmin.x; maxX = fx + lmax.x; minZ = fz + lmin.z; maxZ = fz + lmax.z; }
    else { minX = fx + lmin.z; maxX = fx + lmax.z; minZ = fz - lmax.x; maxZ = fz - lmin.x; }
    const aabb = { minX, maxX, minZ, maxZ, minY: maxH + lmin.y, maxY: maxH + lmax.y };
    if (!group.userData.fenceBoxes) group.userData.fenceBoxes = [];
    group.userData.fenceBoxes.push(aabb);
  }
}

/* -------- 8.2 区块构建 -------- */
const chunks = new Map();

function buildChunk(size, seg, ox, oz, cx, cz, isRoad) {
  const group = new THREE.Group();
  group.userData.cx = cx;
  group.userData.cz = cz;
  const geo = new THREE.PlaneGeometry(size, size, seg, seg);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const lx = pos.getX(i), lz = pos.getZ(i);
    const x = lx + ox, z = lz + oz;
    pos.setXYZ(i, x, terrainHeight(x, z), z);
    if (isRoad) uv.setXY(i, x / ROAD_TILE_WORLD, z / ROAD_TILE_WORLD);
    else uv.setXY(i, x / GRASS_TILE_WORLD, z / GRASS_TILE_WORLD);
  }
  pos.needsUpdate = true; uv.needsUpdate = true;
  geo.computeVertexNormals();
  geo.computeBoundingSphere();
  const tr = 1 + (hash2(cx * 13.7, cz * 7.3) - 0.5) * 0.15;
  const tg = 1 + (hash2(cx * 3.1 + 5.0, cz * 9.9) - 0.5) * 0.15;
  const tb = 1 + (hash2(cx * 5.5, cz * 2.7 + 11.0) - 0.5) * 0.15;
  const colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) { colors[i * 3] = tr; colors[i * 3 + 1] = tg; colors[i * 3 + 2] = tb; }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mesh = new THREE.Mesh(geo, isRoad ? roadMaterial : grassMaterial);
  mesh.castShadow = false; mesh.receiveShadow = false;
  mesh.frustumCulled = false;
  mesh.userData.ownGeometry = true;
  group.add(mesh);
  if (!isRoad) {
    const count = Math.round(BASE_GRASS_PER_CHUNK * plantDensityPct / 100);
    if (count > 0) {
      const grassGroup = new THREE.Group();
      grassGroup.name = 'grass';
      group.add(grassGroup);
      group.userData.grassGroup = grassGroup;
      addGrassInstances(grassGroup, cx, cz, size, count);
    }
  }
  tryCreateFence(group, cx, cz, size);
  return group;
}

let lastNCX = 1e9, lastNCZ = 1e9;
let forceChunkRefresh = false;

function updateChunks(px, pz) {
  const ncx = Math.floor(px / NEAR_SIZE);
  const ncz = Math.floor(pz / NEAR_SIZE);
  if (!forceChunkRefresh && ncx === lastNCX && ncz === lastNCZ) return;
  if (forceChunkRefresh) {
    for (const [k, g] of chunks) {
      scene.remove(g);
      g.traverse((o) => { if (o.isMesh && o.geometry && o.userData.ownGeometry) o.geometry.dispose(); });
    }
    chunks.clear();
    forceChunkRefresh = false;
  }
  lastNCX = ncx; lastNCZ = ncz;
  const needed = new Set();
  for (let dz = -NEAR_RADIUS; dz <= NEAR_RADIUS; dz++) {
    for (let dx = -NEAR_RADIUS; dx <= NEAR_RADIUS; dx++) {
      const cx = ncx + dx, cz = ncz + dz;
      const key = 'N' + cx + '|' + cz;
      needed.add(key);
      if (!chunks.has(key)) {
        const isRoad = roadChunks.has(roadKey(cx, cz));
        const g = buildChunk(NEAR_SIZE, NEAR_SEG, cx * NEAR_SIZE, cz * NEAR_SIZE, cx, cz, isRoad);
        scene.add(g);
        chunks.set(key, g);
      }
    }
  }
  for (const [k, g] of chunks) {
    if (!needed.has(k)) {
      scene.remove(g);
      g.traverse((o) => { if (o.isMesh && o.geometry && o.userData.ownGeometry) o.geometry.dispose(); });
      chunks.delete(k);
    }
  }
}

   ============================================================ */
let grassCullDist = 40;

function updateGrassVisibility() {
  const d2max = grassCullDist * grassCullDist;
  for (const g of chunks.values()) {
    const gg = g.userData.grassGroup;
    if (!gg) continue;
    const cxw = (g.userData.cx + 0.5) * NEAR_SIZE;
    const czw = (g.userData.cz + 0.5) * NEAR_SIZE;
    const dx = cxw - car.pos.x, dz = czw - car.pos.z;
    gg.visible = (dx * dx + dz * dz) < d2max;
  }
}

car.pos.set(0, terrainHeight(0, 0), 0);

const keyState = { gas: false, brake: false, reverse: false, left: false, right: false };
const btnState = { gas: false, brake: false, reverse: false, left: false, right: false };
const IN = { gas: false, brake: false, reverse: false, left: false, right: false };

const KEYMAP = {
  KeyQ: 'gas', KeyW: 'brake', KeyS: 'reverse', KeyA: 'left', KeyD: 'right',
  ArrowUp: 'gas', ArrowDown: 'brake', ArrowLeft: 'left', ArrowRight: 'right',
};

window.addEventListener('keydown', (e) => {
  const act = KEYMAP[e.code];
  if (act) { keyState[act] = true; e.preventDefault(); }
});
window.addEventListener('keyup', (e) => {
  const act = KEYMAP[e.code];
  if (act) { keyState[act] = false; e.preventDefault(); }
});
window.addEventListener('blur', () => { for (const k in keyState) keyState[k] = false; });

const _fwd = new THREE.Vector3();
const _right = new THREE.Vector3();
const CAR_COLLISION_R = 1.15;

function resolveFenceCollision() {
  for (let i = 0; i < fenceColliders.length; i++) {
    const b = fenceColliders[i];
    const px = car.pos.x, pz = car.pos.z;
    const cx = clamp(px, b.minX, b.maxX);
    const cz = clamp(pz, b.minZ, b.maxZ);
    const dx = px - cx, dz = pz - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 > CAR_COLLISION_R * CAR_COLLISION_R) continue;
    if (d2 > 1e-8) {
      const d = Math.sqrt(d2);
      const nx = dx / d, nz = dz / d;
      const pen = CAR_COLLISION_R - d;
      car.pos.x += nx * pen; car.pos.z += nz * pen;
      const vn = car.vel.x * nx + car.vel.z * nz;
      if (vn < 0) { car.vel.x -= vn * nx * 1.1; car.vel.z -= vn * nz * 1.1; }
    } else {
      const dl = px - b.minX, dr = b.maxX - px, dd = pz - b.minZ, du = b.maxZ - pz;
      const m = Math.min(dl, dr, dd, du);
      let nx = 0, nz = 0;
      if (m === dl) { nx = -1; car.pos.x = b.minX - CAR_COLLISION_R; }
      else if (m === dr) { nx = 1; car.pos.x = b.maxX + CAR_COLLISION_R; }
      else if (m === dd) { nz = -1; car.pos.z = b.minZ - CAR_COLLISION_R; }
      else { nz = 1; car.pos.z = b.maxZ + CAR_COLLISION_R; }
      const vn = car.vel.x * nx + car.vel.z * nz;
      if (vn < 0) { car.vel.x -= vn * nx; car.vel.z -= vn * nz; }
    }
  }
}

function stepPhysics(dt) {
  for (const k in IN) IN[k] = keyState[k] || btnState[k];
  _fwd.set(Math.sin(car.yaw), 0, Math.cos(car.yaw));
  _right.set(Math.cos(car.yaw), 0, -Math.sin(car.yaw));
  let vLong = car.vel.dot(_fwd);
  let vLat = car.vel.dot(_right);
  const speedRatio = clamp(Math.abs(vLong) / PHYS.maxSpeed, 0, 1);
  let accel = 0;
  if (IN.gas) accel += (PHYS.engineForce / PHYS.mass) * (1 - 0.85 * speedRatio);
  if (IN.brake) {
    if (vLong > 0.4) accel -= PHYS.brakeForce / PHYS.mass;
    else if (vLong < -0.4) accel += PHYS.brakeForce / PHYS.mass;
    else vLong = 0;
  }
  if (IN.reverse) {
    if (vLong > 0.4) accel -= PHYS.brakeForce / PHYS.mass;
    else {
      const rr = clamp(Math.abs(vLong) / PHYS.maxReverse, 0, 1);
      accel -= (PHYS.reverseForce / PHYS.mass) * (1 - 0.8 * rr);
    }
  }
  accel -= (PHYS.rollResist / PHYS.mass) * vLong;
  accel -= (PHYS.dragCoef / PHYS.mass) * vLong * Math.abs(vLong);
  vLong += accel * dt;
  vLong = clamp(vLong, -PHYS.maxReverse, PHYS.maxSpeed);
  const grip = PHYS.lateralGrip * (1 - 0.32 * speedRatio);
  vLat *= Math.exp(-grip * dt);
  if (Math.abs(vLat) < 0.002) vLat = 0;
  let steerInput = 0;
  if (IN.left) steerInput += 1;
  if (IN.right) steerInput -= 1;
  const steerAngle = steerInput * PHYS.maxSteer / (1 + Math.abs(vLong) * 0.32);
  const yawRate = (vLong / PHYS.wheelBase) * Math.tan(steerAngle);
  car.vel.copy(_fwd).multiplyScalar(vLong).addScaledVector(_right, vLat);
  car.vel.y = 0;
  car.yaw += clamp(yawRate, -3.0, 3.0) * dt;
  if (car.yaw > Math.PI) car.yaw -= Math.PI * 2;
  if (car.yaw < -Math.PI) car.yaw += Math.PI * 2;
  car.pos.x += car.vel.x * dt;
  car.pos.z += car.vel.z * dt;
  resolveFenceCollision();
  vLong = car.vel.dot(_fwd);
  const c = Math.cos(car.yaw), s = Math.sin(car.yaw);
  let hSum = 0;
  const wOffs = [[-WHEEL_X, WHEEL_Z], [WHEEL_X, WHEEL_Z], [-WHEEL_X, -WHEEL_Z], [WHEEL_X, -WHEEL_Z]];
  for (const [wx, wz] of wOffs) {
    const wxp = car.pos.x + wx * c + wz * s;
    const wzp = car.pos.z - wx * s + wz * c;
    hSum += terrainHeight(wxp, wzp);
  }
  const targetY = hSum * 0.25;
  car.pos.y += (targetY - car.pos.y) * Math.min(1, dt * 14);
  car.vLong = vLong;
  const spin = (vLong / WHEEL_R) * dt;
  for (const w of wheels) w.rotation.x += spin;
}

const _qTarget = new THREE.Quaternion();
const _mBasis = new THREE.Matrix4();
const _vF = new THREE.Vector3();
const _vR = new THREE.Vector3();

function updateCarVisual(dt) {
  carGroup.position.copy(car.pos);
  const n = terrainNormal(car.pos.x, car.pos.z);
  _vF.set(Math.sin(car.yaw), 0, Math.cos(car.yaw));
  _vF.projectOnPlane(n).normalize();
  _vR.crossVectors(n, _vF).normalize();
  _mBasis.makeBasis(_vR, n, _vF);
  _qTarget.setFromRotationMatrix(_mBasis);
  carGroup.quaternion.slerp(_qTarget, 1 - Math.exp(-14 * dt));
}

/* --- 目标选择 --- */
function pickRoadTarget(ai) {
  const cx = Math.round(ai.pos.x / NEAR_SIZE);
  const cz = Math.round(ai.pos.z / NEAR_SIZE);
  const fwdX = Math.sin(ai.yaw);
  const fwdZ = Math.cos(ai.yaw);
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const candidates = [];
  for (const [dx, dz] of dirs) {
    if (roadChunks.has(roadKey(cx + dx, cz + dz))) {
      candidates.push({ dx, dz, dot: dx * fwdX + dz * fwdZ });
    }
  }
  if (candidates.length === 0) {
    ai.mode = 'wander';
    pickWanderTarget(ai);
    return;
  }
  candidates.sort((a, b) => b.dot - a.dot);
  const pick = (Math.random() < 0.75) ? candidates[0] : candidates[Math.floor(Math.random() * candidates.length)];
  ai.target.set((cx + pick.dx) * NEAR_SIZE, 0, (cz + pick.dz) * NEAR_SIZE);
}

function pickWanderTarget(ai) {
  const angle = Math.random() * Math.PI * 2;
  const r = 15 + Math.random() * 25;
  ai.target.set(ai.pos.x + Math.cos(angle) * r, 0, ai.pos.z + Math.sin(angle) * r);
}

function respawnAICar(ai) {
  let x, z, tries = 0;
  do {
    const angle = Math.random() * Math.PI * 2;
    const r = 40 + Math.random() * 55;
    x = car.pos.x + Math.cos(angle) * r;
    z = car.pos.z + Math.sin(angle) * r;
    tries++;
  } while (tries < 8 && Math.hypot(x - car.pos.x, z - car.pos.z) < 25);
  ai.pos.set(x, terrainHeight(x, z), z);
  ai.vel.set(0, 0, 0);
  ai.yaw = Math.random() * Math.PI * 2;
  if (ai.type === 'combine') {
    ai.speed = 5 + Math.random() * 10;
    ai.mode = Math.random() < 0.5 ? 'road' : 'wander';
  } else {
    ai.speed = 10 + Math.random() * 30;
    ai.mode = Math.random() < 0.5 ? 'road' : 'wander';
  }
  ai.stunTimer = 0;
  if (ai.mode === 'road') pickRoadTarget(ai);
  else pickWanderTarget(ai);
}

function initAICars() {
  for (let i = 0; i < AI_CAR_COUNT; i++) {
    const isCombine = Math.random() < COMBINE_SPAWN_CHANCE;
    let group, wheelsArr, reel;
    if (isCombine) {
      const built = createCombineBody();
      group = built.group; wheelsArr = built.wheels; reel = built.reel;
    } else {
      const built = createAICarBody();
      group = built.group; wheelsArr = built.wheels; reel = null;
    }

    const chasing = !isCombine && Math.random() < CHASER_RATIO;

    const ai = {
      group, wheels: wheelsArr, reel,
      pos: new THREE.Vector3(),
      vel: new THREE.Vector3(),
      yaw: Math.random() * Math.PI * 2,
      speed: isCombine ? (5 + Math.random() * 10) : (10 + Math.random() * 30),
      mode: chasing ? 'chase' : (Math.random() < 0.5 ? 'road' : 'wander'),
      chasing,
      type: isCombine ? 'combine' : 'car',
      collisionR: isCombine ? COMBINE_COLLISION_R : AI_CAR_COLLISION_R,
      mass: isCombine ? COMBINE_MASS : AI_MASS,
      target: new THREE.Vector3(),
      stunTimer: 0,
    };

    const angle = Math.random() * Math.PI * 2;
    const r = 35 + Math.random() * 60;
    const x = car.pos.x + Math.cos(angle) * r;
    const z = car.pos.z + Math.sin(angle) * r;
    ai.pos.set(x, terrainHeight(x, z), z);

    if (ai.mode === 'chase') ai.target.copy(car.pos);
    else if (ai.mode === 'road') pickRoadTarget(ai);
    else pickWanderTarget(ai);

    ai.group.position.copy(ai.pos);
    ai.group.rotation.y = ai.yaw;
    scene.add(ai.group);
    aiCars.push(ai);
  }
}

/* --- 草收割 --- */
const HARVEST_RADIUS = 2.0;
const HARVEST_FWD_OFFSET = 1.2;
const _grassToRemove = [];

function harvestGrassNear(combine) {
  const fwdX = Math.sin(combine.yaw);
  const fwdZ = Math.cos(combine.yaw);
  const hx = combine.pos.x + fwdX * HARVEST_FWD_OFFSET;
  const hz = combine.pos.z + fwdZ * HARVEST_FWD_OFFSET;
  const r2 = HARVEST_RADIUS * HARVEST_RADIUS;
  const ccx = Math.floor(hx / NEAR_SIZE);
  const ccz = Math.floor(hz / NEAR_SIZE);
  for (let dz = -1; dz <= 1; dz++) {
    for (let dx = -1; dx <= 1; dx++) {
      const key = 'N' + (ccx + dx) + '|' + (ccz + dz);
      const chunk = chunks.get(key);
      if (!chunk) continue;
      const gg = chunk.userData.grassGroup;
      if (!gg) continue;
      _grassToRemove.length = 0;
      for (let i = 0; i < gg.children.length; i++) {
        const inst = gg.children[i];
        const ddx = inst.position.x - hx;
        const ddz = inst.position.z - hz;
        if (ddx * ddx + ddz * ddz < r2) {
          _grassToRemove.push(inst);
        }
      }
      for (const inst of _grassToRemove) gg.remove(inst);
    }
  }
}

function updateAICars(dt) {
  for (const ai of aiCars) {
    const isCombine = ai.type === 'combine';

    if (ai.stunTimer > 0) {
      ai.stunTimer -= dt;
      ai.pos.x += ai.vel.x * dt;
      ai.pos.z += ai.vel.z * dt;
      const damp = Math.exp(-1.8 * dt);
      ai.vel.x *= damp; ai.vel.z *= damp;
      const targetY = terrainHeight(ai.pos.x, ai.pos.z);
      ai.pos.y += (targetY - ai.pos.y) * Math.min(1, dt * 8);
      ai.group.position.copy(ai.pos);
      ai.group.rotation.y = ai.yaw;
      const spd = Math.hypot(ai.vel.x, ai.vel.z);
      for (const w of ai.wheels) w.rotation.x += (spd / WHEEL_R) * dt;
      if (isCombine) harvestGrassNear(ai);
      if (ai.stunTimer <= 0) {
        if (ai.chasing) ai.target.copy(car.pos);
        else if (ai.mode === 'road') pickRoadTarget(ai);
        else pickWanderTarget(ai);
      }
      continue;
    }

    if (ai.chasing) ai.target.set(car.pos.x, 0, car.pos.z);
    else {
      const dxT = ai.target.x - ai.pos.x;
      const dzT = ai.target.z - ai.pos.z;
      if (dxT * dxT + dzT * dzT < 9.0) {
        if (ai.mode === 'road') pickRoadTarget(ai);
        else pickWanderTarget(ai);
      }
    }

    const dx = ai.target.x - ai.pos.x;
    const dz = ai.target.z - ai.pos.z;
    const targetYaw = Math.atan2(dx, dz);
    let yawDiff = targetYaw - ai.yaw;
    yawDiff = Math.atan2(Math.sin(yawDiff), Math.cos(yawDiff));
    const turnRate = ai.chasing ? 2.6 : (isCombine ? 1.2 : 1.8);
    ai.yaw += clamp(yawDiff, -turnRate * dt, turnRate * dt);

    const turnFactor = 1 - Math.min(0.65, Math.abs(yawDiff) / Math.PI);
    const desiredSpeed = ai.speed * turnFactor;
    const desiredVx = Math.sin(ai.yaw) * desiredSpeed;
    const desiredVz = Math.cos(ai.yaw) * desiredSpeed;
    const accelLimit = (isCombine ? AI_BASE_ACCEL * 0.6 : AI_BASE_ACCEL) * dt;
    const ax = clamp(desiredVx - ai.vel.x, -accelLimit, accelLimit);
    const az = clamp(desiredVz - ai.vel.z, -accelLimit, accelLimit);
    ai.vel.x += ax; ai.vel.z += az;

    const vlen = Math.hypot(ai.vel.x, ai.vel.z);
    if (vlen > AI_MAX_VEL) {
      ai.vel.x = ai.vel.x / vlen * AI_MAX_VEL;
      ai.vel.z = ai.vel.z / vlen * AI_MAX_VEL;
    }

    ai.pos.x += ai.vel.x * dt;
    ai.pos.z += ai.vel.z * dt;

    const targetY = terrainHeight(ai.pos.x, ai.pos.z);
    ai.pos.y += (targetY - ai.pos.y) * Math.min(1, dt * 8);

    ai.group.position.copy(ai.pos);
    ai.group.rotation.y = ai.yaw;

    const spd = Math.hypot(ai.vel.x, ai.vel.z);
    for (const w of ai.wheels) w.rotation.x += (spd / WHEEL_R) * dt;

    if (isCombine) {
      if (ai.reel) ai.reel.rotation.x -= (3.6 + spd * 0.4) * dt;
      harvestGrassNear(ai);
    }

    const ddx = ai.pos.x - car.pos.x;
    const ddz = ai.pos.z - car.pos.z;
    if (ddx * ddx + ddz * ddz > 240 * 240) {
      respawnAICar(ai);
    }
  }
}

/* --- 玩家 ↔ AI 碰撞 --- */
function resolvePlayerAICollisions() {
  for (let i = 0; i < aiCars.length; i++) {
    const ai = aiCars[i];
    const aiR = ai.collisionR;
    const aiMass = ai.mass;

    const dx = ai.pos.x - car.pos.x;
    const dz = ai.pos.z - car.pos.z;
    const d2 = dx * dx + dz * dz;
    const minD = CAR_COLLISION_R + aiR;
    if (d2 >= minD * minD) continue;

    const d = Math.sqrt(d2);
    let nx, nz;
    if (d > 1e-6) { nx = dx / d; nz = dz / d; }
    else { nx = 1; nz = 0; }

    const pen = minD - d;
    const playerMass = PHYS.mass;
    const totalMass = playerMass + aiMass;
    const playerShare = aiMass / totalMass;
    const aiShare     = playerMass / totalMass;

    car.pos.x -= nx * pen * playerShare;
    car.pos.z -= nz * pen * playerShare;
    ai.pos.x  += nx * pen * aiShare;
    ai.pos.z  += nz * pen * aiShare;

    const rvx = ai.vel.x - car.vel.x;
    const rvz = ai.vel.z - car.vel.z;
    const rvn = rvx * nx + rvz * nz;

    if (rvn < 0) {
      const restitution = 0.85;
      const invMassSum = 1 / playerMass + 1 / aiMass;
      const j = -(1 + restitution) * rvn / invMassSum;

      car.vel.x -= (j / playerMass) * nx;
      car.vel.z -= (j / playerMass) * nz;
      ai.vel.x  += (j / aiMass) * nx;
      ai.vel.z  += (j / aiMass) * nz;

      const impact = Math.abs(rvn);
      if (impact > 3) {
        const boostScale = ai.type === 'combine' ? 0.25 : 0.65;
        const boost = Math.min(impact * boostScale, ai.type === 'combine' ? 14 : 32);
        ai.vel.x += nx * boost;
        ai.vel.z += nz * boost;
        ai.stunTimer = Math.max(ai.stunTimer, ai.type === 'combine' ? 0.45 : 0.85);
      }

      const playerKickScale = ai.type === 'combine' ? 0.30 : 0.15;
      const playerKick = Math.min(impact * playerKickScale, ai.type === 'combine' ? 10 : 6);
      car.vel.x -= nx * playerKick;
      car.vel.z -= nz * playerKick;
    }

    const aiSpeed = Math.hypot(ai.vel.x, ai.vel.z);
    if (aiSpeed > AI_MAX_VEL) {
      ai.vel.x = ai.vel.x / aiSpeed * AI_MAX_VEL;
      ai.vel.z = ai.vel.z / aiSpeed * AI_MAX_VEL;
    }
  }
}

initAICars();

/* ============================================================
   11. 相机
   ============================================================ */
const BASE_FOV = 52;
const MAX_FOV = 135;
let camYaw = Math.PI + car.yaw;
let camPitch = 0.40;
const CAM_DIST = 8.2;

let dragging = false, lastMX = 0, lastMY = 0;

function applyLookDelta(dxScreen, dyScreen) {
  let dx = dxScreen, dy = dyScreen;
  if (isPortrait) { const t = dx; dx = dy; dy = -t; }
  camYaw -= dx * 0.0052;
  camPitch = clamp(camPitch + dy * 0.0052, 0.04, 1.32);
}
function applyLookDeltaTouch(dxScreen, dyScreen) {
  let dx = dxScreen, dy = dyScreen;
  if (isPortrait) { const t = dx; dx = dy; dy = -t; }
  camYaw -= dx * 0.0062;
  camPitch = clamp(camPitch + dy * 0.0062, 0.04, 1.32);
}

renderer.domElement.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  dragging = true; lastMX = e.clientX; lastMY = e.clientY; e.preventDefault();
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastMX, dy = e.clientY - lastMY;
  lastMX = e.clientX; lastMY = e.clientY;
  applyLookDelta(dx, dy);
});
window.addEventListener('mouseup', () => { dragging = false; });
window.addEventListener('contextmenu', (e) => e.preventDefault());

let lookTouchId = null, lastTX = 0, lastTY = 0;
renderer.domElement.addEventListener('touchstart', (e) => {
  if (lookTouchId !== null) return;
  const t = e.changedTouches[0];
  lookTouchId = t.identifier;
  lastTX = t.clientX; lastTY = t.clientY;
  e.preventDefault();
}, { passive: false });
renderer.domElement.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches) {
    if (t.identifier !== lookTouchId) continue;
    const dx = t.clientX - lastTX, dy = t.clientY - lastTY;
    lastTX = t.clientX; lastTY = t.clientY;
    applyLookDeltaTouch(dx, dy);
  }
  e.preventDefault();
}, { passive: false });
function endLook(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === lookTouchId) lookTouchId = null;
  }
}
renderer.domElement.addEventListener('touchend', endLook, { passive: false });
renderer.domElement.addEventListener('touchcancel', endLook, { passive: false });

const _camQuat = new THREE.Quaternion();
const _camEuler = new THREE.Euler(0, 0, 0, 'YXZ');
const _camOffset = new THREE.Vector3();
const _camTarget = new THREE.Vector3();

function updateCamera(dt) {
  if (!dragging && lookTouchId === null) {
    const follow = clamp(Math.abs(car.vLong) / 6, 0, 1);
    if (follow > 0.01) {
      const desired = car.yaw + Math.PI;
      let diff = desired - camYaw;
      diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      camYaw += diff * (1 - Math.exp(-dt * 1.4)) * follow;
    }
  }
  _camEuler.set(-camPitch, camYaw, 0, 'YXZ');
  _camQuat.setFromEuler(_camEuler);
  _camOffset.set(0, 0, 1).applyQuaternion(_camQuat).multiplyScalar(CAM_DIST);
  _camTarget.copy(car.pos);
  _camTarget.y += 1.15;
  camera.position.copy(_camTarget).add(_camOffset);
  const minY = terrainHeight(camera.position.x, camera.position.z) + 0.7;
  if (camera.position.y < minY) camera.position.y = minY;
  camera.lookAt(_camTarget);
  const spd = Math.hypot(car.vel.x, car.vel.z);
  const ratio = clamp(spd / PHYS.maxSpeed, 0, 1);
  const targetFov = BASE_FOV + (MAX_FOV - BASE_FOV) * ratio;
  camera.fov += (targetFov - camera.fov) * (1 - Math.exp(-dt * 3.2));
  camera.updateProjectionMatrix();
}

/* ============================================================
   12. 粒子系统（烟雾）
   ============================================================ */
class ParticleSystem {
  constructor(max, color) {
    this.max = max; this.count = 0;
    this.pos = new Float32Array(max * 3);
    this.vel = new Float32Array(max * 3);
    this.size = new Float32Array(max);
    this.alpha = new Float32Array(max);
    this.life = new Float32Array(max);
    this.maxLife = new Float32Array(max);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aSize', new THREE.BufferAttribute(this.size, 1).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage));
    geo.setDrawRange(0, 0);
    const mat = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color(color) } },
      vertexShader: `
        attribute float aSize;
        attribute float aAlpha;
        varying float vAlpha;
        void main() {
          vAlpha = aAlpha;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * (400.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        varying float vAlpha;
        void main() {
          vec2 c = gl_PointCoord - vec2(0.5);
          float d = length(c);
          if (d > 0.5) discard;
          float edge = smoothstep(0.5, 0.42, d);
          gl_FragColor = vec4(uColor, vAlpha * edge);
        }
      `,
      transparent: true, depthWrite: false, blending: THREE.NormalBlending,
    });
    this.points = new THREE.Points(geo, mat);
    this.points.frustumCulled = false;
    this.geo = geo;
  }
  spawn(x, y, z, vx, vy, vz, size, life) {
    if (this.count >= this.max) return;
    const i = this.count++;
    const i3 = i * 3;
    this.pos[i3] = x; this.pos[i3 + 1] = y; this.pos[i3 + 2] = z;
    this.vel[i3] = vx; this.vel[i3 + 1] = vy; this.vel[i3 + 2] = vz;
    this.size[i] = size;
    this.alpha[i] = 1; this.life[i] = life; this.maxLife[i] = life;
  }
  update(dt) {
    for (let i = 0; i < this.count; i++) {
      this.life[i] -= dt;
      if (this.life[i] <= 0) {
        const last = --this.count;
        if (i !== last) {
          const i3 = i * 3, l3 = last * 3;
          this.pos[i3] = this.pos[l3];
          this.pos[i3 + 1] = this.pos[l3 + 1];
          this.pos[i3 + 2] = this.pos[l3 + 2];
          this.vel[i3] = this.vel[l3];
          this.vel[i3 + 1] = this.vel[l3 + 1];
          this.vel[i3 + 2] = this.vel[l3 + 2];
          this.size[i] = this.size[last];
          this.alpha[i] = this.alpha[last];
          this.life[i] = this.life[last];
          this.maxLife[i] = this.maxLife[last];
        }
        i--; continue;
      }
      const i3 = i * 3;
      this.pos[i3] += this.vel[i3] * dt;
      this.pos[i3 + 1] += this.vel[i3 + 1] * dt;
      this.pos[i3 + 2] += this.vel[i3 + 2] * dt;
      this.alpha[i] = Math.max(0, this.life[i] / this.maxLife[i]);
    }
    this.geo.setDrawRange(0, this.count);
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.aSize.needsUpdate = true;
    this.geo.attributes.aAlpha.needsUpdate = true;
  }
}

const smokeParticles = new ParticleSystem(600, 0x1b1b1b);
scene.add(smokeParticles.points);

const SMOKE_INTERVAL = 0.032;
let smokeTimer = 0;
const _discFwd = new THREE.Vector3();

function updateParticles(dt) {
  _discFwd.set(Math.sin(car.yaw), 0, Math.cos(car.yaw));
  if (IN.gas && Math.abs(car.vLong) > 0.4) {
    smokeTimer += dt;
    while (smokeTimer >= SMOKE_INTERVAL) {
      smokeTimer -= SMOKE_INTERVAL;
      const bx = car.pos.x - _discFwd.x * 0.9 + (Math.random() - 0.5) * 0.9;
      const bz = car.pos.z - _discFwd.z * 0.9 + (Math.random() - 0.5) * 0.9;
      const by = car.pos.y + 0.10;
      smokeParticles.spawn(bx, by, bz,
        (Math.random() - 0.5) * 0.7, 0.45 + Math.random() * 0.7, (Math.random() - 0.5) * 0.7,
        0.42 + Math.random() * 0.34, 1.1 + Math.random() * 0.7);
    }
  } else smokeTimer = 0;
  smokeParticles.update(dt);
}

/* ============================================================
   13. 滑块
   ============================================================ */
const compSlider = document.getElementById('compDistSlider');
const visSlider  = document.getElementById('visDistSlider');
const compVal    = document.getElementById('compDistVal');
const visVal     = document.getElementById('visDistVal');
const plantSlider = document.getElementById('plantDensitySlider');
const plantVal    = document.getElementById('plantDensityVal');

function applyRenderDistances() {
  const visMult = parseInt(visSlider.value, 10) / 100;
  camera.far = BASE_VISUAL_FAR * visMult;
  camera.updateProjectionMatrix();
  scene.fog.near = BASE_FOG_NEAR * visMult;
  scene.fog.far  = BASE_FOG_FAR  * visMult;
  grassCullDist = camera.far * 0.8;
  const compMult = parseInt(compSlider.value, 10) / 100;
  const newRadius = Math.max(1, Math.round(BASE_CHUNK_RADIUS * compMult));
  if (newRadius !== NEAR_RADIUS) { NEAR_RADIUS = newRadius; forceChunkRefresh = true; }
  compVal.textContent = compSlider.value + '%';
  visVal.textContent  = visSlider.value  + '%';
}
compSlider.addEventListener('input', applyRenderDistances);
visSlider.addEventListener('input', applyRenderDistances);
applyRenderDistances();

plantSlider.addEventListener('input', () => {
  plantDensityPct = parseInt(plantSlider.value, 10);
  plantVal.textContent = plantDensityPct + '%';
});
plantSlider.addEventListener('change', () => {
  plantDensityPct = parseInt(plantSlider.value, 10);
  plantVal.textContent = plantDensityPct + '%';
  forceChunkRefresh = true;
});

/* ============================================================
   14. 移动端按钮
   ============================================================ */
document.querySelectorAll('.btn').forEach((btn) => {
  const act = btn.dataset.act;
  if (!act) return;
  const press = (e) => {
    e.preventDefault();
    btnState[act] = true;
    btn.classList.add('pressed');
    if (btn.setPointerCapture && e.pointerId !== undefined) {
      try { btn.setPointerCapture(e.pointerId); } catch (_) {}
    }
  };
  const release = (e) => {
    if (e) e.preventDefault();
    btnState[act] = false;
    btn.classList.remove('pressed');
  };
  btn.addEventListener('pointerdown', press);
  btn.addEventListener('pointerup', release);
  btn.addEventListener('pointercancel', release);
  btn.addEventListener('pointerleave', release);
});
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (isTouch) document.body.classList.add('touch');

/* ============================================================
   15. HUD
   ============================================================ */
const spdNum = document.getElementById('spdNum');
const spdBar = document.getElementById('spdBar');
let smoothSpd = 0;
function updateHUD(dt) {
  const raw = Math.hypot(car.vel.x, car.vel.z);
  smoothSpd += (raw - smoothSpd) * Math.min(1, dt * 10);
  const shown = clamp(smoothSpd, 0, 30);
  spdNum.textContent = shown.toFixed(1);
  spdBar.style.width = (shown / 30 * 100).toFixed(1) + '%';
}

/* ============================================================
   16. 主循环
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  collectFenceColliders();
  stepPhysics(dt);
  updateCarVisual(dt);
  updateAICars(dt);
  resolvePlayerAICollisions();
  updateChunks(car.pos.x, car.pos.z);
  updateGrassVisibility();
  updateCamera(dt);
  updateParticles(dt);
  updateHUD(dt);

  skyUniforms.uTime.value = elapsed;
  skyUniforms.uCameraPos.value.copy(camera.position);
  skyMesh.position.copy(camera.position);
  skyMesh.scale.setScalar((camera.far * 0.9) / 50);

  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

updateChunks(car.pos.x, car.pos.z);
lastNCX = 1e9;

/* ============================================================
   17. 自适应
   ============================================================ */
function onResize() {
  let w, h;
  if (isPortrait) { w = window.innerHeight; h = window.innerWidth; }
  else { w = window.innerWidth; h = window.innerHeight; }
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));
