<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>废墟突围 / 水晶争夺战 - 第一人称3D游戏</title>
  <style>
    :root {
      --safe-bottom: env(safe-area-inset-bottom, 10px);
      --ui-bg: rgba(20, 20, 20, 0.92);
      --accent: #f0a030;
      --accent2: #4dc9f6;
      --danger: #e04040;
      --success: #50d870;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; overflow: hidden;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; width: 100vw; height: 100vh; height: 100dvh; position: fixed; top: 0; left: 0;
    }
    canvas#gameCanvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

    #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
    #overlay>* { pointer-events: auto; }

    #mainMenu {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;
      background: var(--ui-bg); border: 2px solid #555; border-radius: 20px; padding: 30px 28px;
      text-align: center; color: #fff; width: min(420px, 90vw); max-height: 85vh; overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7); display: flex; flex-direction: column; gap: 14px;
    }
    #mainMenu h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); letter-spacing: 2px; background: linear-gradient(135deg, #f0a030, #f6d060); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 4px; }
    #mainMenu .subtitle { color: #aaa; font-size: 0.85rem; margin-bottom: 6px; }
    .menu-btn {
      display: block; width: 100%; padding: 13px 20px; border: 2px solid #555; border-radius: 12px;
      background: rgba(40,40,40,0.85); color: #fff; font-size: 1.05rem; cursor: pointer; letter-spacing: 1px;
      transition: all 0.2s; font-family: inherit; text-align: center;
    }
    .menu-btn:hover, .menu-btn:active { border-color: var(--accent); background: rgba(60,50,30,0.9); color: var(--accent); box-shadow: 0 0 20px rgba(240,160,48,0.3); }
    .menu-btn.primary { border-color: var(--accent); background: rgba(240,140,30,0.2); font-weight: bold; font-size: 1.15rem; padding: 15px 20px; }
    .menu-btn.primary:hover { background: rgba(240,140,30,0.4); }
    .online-hint { color: #777; font-size: 0.8rem; letter-spacing: 1px; margin-top: 2px; font-style: italic; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 25;
      background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; pointer-events: auto;
    }
    .modal {
      background: var(--ui-bg); border: 2px solid #666; border-radius: 18px; padding: 22px 20px;
      color: #fff; width: min(640px, 94vw); max-height: 82vh; overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 12px;
    }
    .modal h2 { text-align: center; font-size: 1.3rem; letter-spacing: 1px; color: var(--accent); margin: 0; }
    .modal h3 { font-size: 1rem; color: #ccc; margin: 4px 0 2px; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .item-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 8px;
      max-height: 220px; overflow-y: auto; padding: 4px; background: rgba(0,0,0,0.25); border-radius: 8px;
    }
    .item-slot {
      background: rgba(50,50,50,0.8); border: 2px solid #555; border-radius: 10px; padding: 8px 4px;
      text-align: center; cursor: pointer; font-size: 0.75rem; color: #ddd; transition: all 0.15s;
      min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .item-slot.selected { border-color: var(--accent2); background: rgba(60,120,180,0.35); box-shadow: 0 0 12px rgba(77,201,246,0.4); color: #fff; }
    .item-slot:hover, .item-slot:active { border-color: #aaa; background: rgba(70,70,70,0.9); }
    .item-slot .icon { font-size: 1.4rem; }
    .item-slot .name { font-size: 0.7rem; line-height: 1.1; }
    .map-option { display: flex; gap: 10px; flex-wrap: wrap; }
    .map-card {
      flex: 1; min-width: 110px; background: rgba(40,40,40,0.8); border: 2px solid #555; border-radius: 12px;
      padding: 14px; text-align: center; cursor: pointer; transition: all 0.2s; color: #ccc;
    }
    .map-card.selected { border-color: var(--accent2); background: rgba(50,100,150,0.4); color: #fff; box-shadow: 0 0 16px rgba(77,201,246,0.35); }
    .map-card .map-icon { font-size: 2.5rem; display: block; margin-bottom: 4px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-row .menu-btn { flex: 1; min-width: 80px; font-size: 0.9rem; padding: 10px 14px; }
    .close-btn { position: sticky; top: 0; float: right; background: none; border: none; color: #aaa; font-size: 1.4rem; cursor: pointer; z-index: 2; padding: 2px 8px; line-height: 1; }
    .close-btn:hover { color: #fff; }

    .start-columns { display: flex; gap: 16px; flex-wrap: wrap; }
    .start-left { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 8px; }
    .start-right { flex: 1.2; min-width: 200px; display: flex; flex-direction: column; gap: 8px; }
    .carry-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px,1fr)); gap: 5px; min-height: 40px; }

    #crosshair {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 24px; height: 24px; z-index: 14; pointer-events: none; display: flex; align-items: center; justify-content: center;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.9); box-shadow: 0 0 6px rgba(0,0,0,0.6);
    }
    #crosshair::before { width: 2px; height: 20px; left: 11px; top: 2px; }
    #crosshair::after { width: 20px; height: 2px; left: 2px; top: 11px; }
    #crosshair.active::before, #crosshair.active::after { background: #ffcc00; box-shadow: 0 0 12px #ffaa00; }

    .bot-healthbar {
      position: fixed; z-index: 13; pointer-events: none; width: 50px; height: 6px;
      background: rgba(0,0,0,0.6); border-radius: 3px; transform: translate(-50%, -50%);
      border: 1px solid rgba(255,255,255,0.3); display: none;
    }
    .bot-healthbar .fill { height: 100%; width: 100%; background: #e04040; border-radius: 3px; transition: width 0.1s linear; }

    #hud {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 12; pointer-events: none;
      padding: 8px 12px; display: none; flex-direction: column; gap: 4px;
    }
    #hud.active { display: flex; }
    #hud>* { pointer-events: auto; }
    .hud-top { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 6px; }
    .hud-panel { background: rgba(0,0,0,0.7); border: 1px solid #444; border-radius: 8px; padding: 6px 10px; color: #fff; font-size: 0.8rem; white-space: nowrap; }
    .hud-panel .val { color: var(--accent); font-weight: bold; }
    .hud-crystal-bar { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; font-size: 0.7rem; }
    .hud-crystal-bar .crystal-entry { background: rgba(30,30,30,0.8); border-radius: 6px; padding: 3px 7px; border: 1px solid #555; display: flex; align-items: center; gap: 3px; }
    .hud-crystal-bar .crystal-entry.player-entry { border-color: var(--accent2); background: rgba(40,80,130,0.6); }
    .crystal-dot { width: 10px; height: 10px; border-radius: 50%; background: #a0d0ff; display: inline-block; box-shadow: 0 0 6px #6af; }

    #inventoryPanel {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 22;
      background: var(--ui-bg); border: 2px solid #666; border-radius: 16px; padding: 18px;
      color: #fff; width: min(380px, 90vw); max-height: 75vh; overflow-y: auto;
      display: none; flex-direction: column; gap: 10px;
    }
    #inventoryPanel.active { display: flex; }
    #inventoryPanel h3 { text-align: center; margin: 0; color: var(--accent); }
    .inv-main-hand { background: rgba(60,40,20,0.8); border: 3px dashed var(--accent); border-radius: 12px; padding: 12px; text-align: center; min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 1rem; cursor: pointer; }
    .inv-main-hand:hover { background: rgba(80,50,20,0.9); }
    .inv-main-hand .equipped-icon { font-size: 2rem; }

    #mobileControls {
      position: fixed; bottom: 20px; left: 0; width: 100%; z-index: 15; pointer-events: none;
      display: none; justify-content: space-between; padding: 0 16px; align-items: flex-end;
      bottom: calc(20px + var(--safe-bottom));
    }
    #mobileControls.active { display: flex; }
    #joystickZone { width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); position: relative; pointer-events: auto; touch-action: none; }
    #joystickThumb { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.35); position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; }
    .mobile-btn-cluster { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; align-items: center; }
    .mobile-action-btn { width: 60px; height: 60px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.12); color: #fff; font-size: 1.6rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .mobile-action-btn:active { background: rgba(255,255,255,0.35); border-color: #fff; }
    .mobile-action-btn.attack-btn { width: 72px; height: 72px; font-size: 2rem; border-color: rgba(255,100,80,0.6); background: rgba(200,60,40,0.3); }

    /* 桌面端悬浮攻击按钮 */
    #desktopAttackBtn {
      position: fixed; bottom: 30px; right: 30px; z-index: 16; pointer-events: auto;
      width: 72px; height: 72px; border-radius: 50%; border: 3px solid rgba(255,100,80,0.7);
      background: rgba(200,60,40,0.35); color: #fff; font-size: 2.2rem;
      display: none; align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 0 20px rgba(255,60,40,0.2);
      -webkit-tap-highlight-color: transparent;
    }
    #desktopAttackBtn:active { background: rgba(200,60,40,0.7); transform: scale(0.92); }
    #desktopAttackBtn.visible { display: flex; }

    @media (max-width: 600px) {
      .modal { width: 96vw; padding: 12px; }
      .start-columns { flex-direction: column; }
      .item-grid { grid-template-columns: repeat(auto-fill, minmax(55px,1fr)); max-height: 140px; }
      .item-slot { padding: 4px 2px; font-size: 0.6rem; min-height: 44px; }
      .item-slot .icon { font-size: 1rem; }
      .item-slot .name { font-size: 0.6rem; }
      #joystickZone { width: 100px; height: 100px; }
      #joystickThumb { width: 38px; height: 38px; }
      .mobile-action-btn { width: 48px; height: 48px; font-size: 1.2rem; }
      .mobile-action-btn.attack-btn { width: 56px; height: 56px; font-size: 1.4rem; }
      #mobileControls { padding: 0 8px; bottom: 12px; bottom: calc(12px + var(--safe-bottom)); }
      #desktopAttackBtn { display: none !important; }
    }
    @media (min-width: 601px) {
      #desktopAttackBtn.visible { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="overlay"></div>

  <div id="mainMenu">
    <h1>🏚️ 废墟之地</h1>
    <div class="subtitle">战术搜刮 · 第一人称射击</div>
    <button class="menu-btn primary" id="btnStart">🎮 开始游戏</button>
    <button class="menu-btn" id="btnHowToPlay">📖 游戏玩法</button>
    <button class="menu-btn" id="btnControls">🎯 操作说明</button>
    <button class="menu-btn" id="btnStorage">📦 仓库</button>
    <div class="online-hint">联机正在制作中……</div>
  </div>

  <div id="crosshair"></div>
  <div id="modalContainer"></div>

  <div id="hud">
    <div class="hud-top">
      <span class="hud-panel">❤️ <span class="val" id="hudHp">100</span></span>
      <span class="hud-panel">🗺️ <span class="val" id="hudMapName">-</span></span>
      <span class="hud-panel" id="hudTimerPanel" style="display:none;">⏱️ <span class="val" id="hudTimer">180</span>s</span>
      <span class="hud-panel">🎒 <span class="val" id="hudBagCount">0</span>件</span>
      <span class="hud-panel">🔫 主手: <span class="val" id="hudMainHand">空手</span></span>
    </div>
    <div class="hud-crystal-bar" id="hudCrystalBar" style="display:none;"></div>
    <div style="font-size:0.7rem;color:#aaa;pointer-events:none;" id="hudHint">按 E 交互 | Tab 背包 | 鼠标左键拖拽视角 · 空格攻击</div>
  </div>

  <div id="inventoryPanel">
    <h3>🎒 背包</h3>
    <div>🔫 主手武器：</div>
    <div class="inv-main-hand" id="invMainHandSlot"><span class="equipped-icon">✋</span> <span id="invMainHandName">空手</span></div>
    <div>📦 物品列表（点击装备到主手/使用补给）：</div>
    <div class="item-grid" id="invItemGrid"></div>
    <button class="menu-btn" id="btnCloseInv" style="margin-top:6px;">关闭背包</button>
  </div>

  <div id="mobileControls">
    <div id="joystickZone"><div id="joystickThumb"></div></div>
    <div class="mobile-btn-cluster">
      <button class="mobile-action-btn" id="btnInteractMob" title="交互">🤚</button>
      <button class="mobile-action-btn attack-btn" id="btnAttackMob" title="攻击/使用">⚔️</button>
      <button class="mobile-action-btn" id="btnBagMob" title="背包">🎒</button>
    </div>
  </div>

  <!-- 桌面端悬浮攻击按钮 -->
  <div id="desktopAttackBtn" title="攻击 (空格)">⚔️</div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    // [修改1] 移除 PointerLockControls 导入
    // import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

    const canvas = document.getElementById('gameCanvas');
    const mainMenu = document.getElementById('mainMenu');
    const modalContainer = document.getElementById('modalContainer');
    const crosshair = document.getElementById('crosshair');
    const hud = document.getElementById('hud');
    const hudHp = document.getElementById('hudHp');
    const hudMapName = document.getElementById('hudMapName');
    const hudTimerPanel = document.getElementById('hudTimerPanel');
    const hudTimer = document.getElementById('hudTimer');
    const hudBagCount = document.getElementById('hudBagCount');
    const hudMainHand = document.getElementById('hudMainHand');
    const hudCrystalBar = document.getElementById('hudCrystalBar');
    const hudHint = document.getElementById('hudHint');
    const inventoryPanel = document.getElementById('inventoryPanel');
    const invMainHandSlot = document.getElementById('invMainHandSlot');
    const invMainHandName = document.getElementById('invMainHandName');
    const invItemGrid = document.getElementById('invItemGrid');
    const mobileControls = document.getElementById('mobileControls');
    const joystickZone = document.getElementById('joystickZone');
    const joystickThumb = document.getElementById('joystickThumb');
    const desktopAttackBtn = document.getElementById('desktopAttackBtn');

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#87CEEB');
    scene.fog = new THREE.Fog('#a0c8e0', 40, 180);

    const camera = new THREE.PerspectiveCamera(78, window.innerWidth/window.innerHeight, 0.3, 200);
    camera.position.set(0,1.7,0);
    camera.lookAt(0,1.7,-10);
    camera.up.set(0,1,0);
    camera.rotation.order = 'YXZ';  // 与第二个文件一致

    const ambientLight = new THREE.AmbientLight('#d0e0f0', 1.4);
    scene.add(ambientLight);
    const sunLight = new THREE.DirectionalLight('#fff8e8', 4.5);
    sunLight.position.set(30,50,20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 1024; sunLight.shadow.mapSize.height = 1024;
    sunLight.shadow.camera.near = 0.5; sunLight.shadow.camera.far = 200;
    sunLight.shadow.camera.left = -70; sunLight.shadow.camera.right = 70;
    sunLight.shadow.camera.top = 70; sunLight.shadow.camera.bottom = -70;
    sunLight.shadow.bias = -0.00015;
    scene.add(sunLight);
    scene.add(new THREE.HemisphereLight('#aaddff', '#445533', 0.9));

    // [修改2] 移除 PointerLockControls，改用自定义拖拽控制
    // const controls = new PointerLockControls(camera, document.body);
    // controls.pointerSpeed = 0.5;
    // controls.maxPolarAngle = Math.PI * 0.85;

    const GAME_STATES = { MENU:'menu', PLAYING:'playing', ENDED:'ended' };
    let gameState = GAME_STATES.MENU;
    let selectedMap = 'ruins';
    let selectedCarryItems = [];
    let playerHP = 100, playerMaxHP = 100;
    let playerSpeed = 7, playerSpeedBoost = 0, playerSpeedBoostTimer = 0;
    let playerInventory = [], playerMainHand = null, playerCrystals = 0;
    let gameTime = 180, gameTimerInterval = null, gameEnded = false;
    let mapBuildings = [], mapBots = [], mapItems = [], mapCrystals = [], mapHelicopter = null, mapChests = [];
    let interactCooldown = 0, attackCooldown = 0, playerRespawnTimer = 0;
    const bullets = [];
    const BOT_COUNT_RUINS = 6, BOT_COUNT_CRYSTAL = 10;

    // ---- 视角拖拽状态 (类似第二个文件) ----
    let mouseLook = false;
    let lookLastX = 0, lookLastY = 0;
    let lookTouchId = null;
    const SENSITIVITY = 0.0025;  // 与第二个文件一致

    const ALL_ITEMS = {
      knife:{id:'knife',name:'匕首',type:'melee',icon:'🔪',damage:25,range:2.2,cooldown:0.4},
      bat:{id:'bat',name:'棒球棍',type:'melee',icon:'🏏',damage:32,range:2.6,cooldown:0.55},
      machete:{id:'machete',name:'砍刀',type:'melee',icon:'🔪',damage:40,range:2.4,cooldown:0.5},
      pistol:{id:'pistol',name:'手枪',type:'ranged',icon:'🔫',damage:30,range:50,cooldown:0.35,ammoType:'ammo_9mm'},
      rifle:{id:'rifle',name:'步枪',type:'ranged',icon:'🎯',damage:55,range:90,cooldown:0.18,ammoType:'ammo_556'},
      shotgun:{id:'shotgun',name:'霰弹枪',type:'ranged',icon:'💥',damage:70,range:18,cooldown:0.7,ammoType:'ammo_12g',spread:true},
      medkit:{id:'medkit',name:'医疗包',type:'supply',icon:'💊',healAmount:40,count:1},
      energy:{id:'energy',name:'能量饮料',type:'supply',icon:'🥤',speedBoost:3,boostDuration:15,count:1},
      armorPlate:{id:'armorPlate',name:'护甲板',type:'supply',icon:'🛡️',armorBonus:30,count:1},
      ammo_9mm:{id:'ammo_9mm',name:'9mm子弹',type:'ammo',icon:'🔸',count:12,ammoFor:'ammo_9mm'},
      ammo_556:{id:'ammo_556',name:'5.56子弹',type:'ammo',icon:'🔶',count:8,ammoFor:'ammo_556'},
      ammo_12g:{id:'ammo_12g',name:'12号霰弹',type:'ammo',icon:'💠',count:5,ammoFor:'ammo_12g'},
    };

    function getStorage(){ try{ const d=localStorage.getItem('ruins_game_storage'); return d?JSON.parse(d):{items:[]}; }catch(e){return{items:[]};} }
    function saveStorage(d){ try{localStorage.setItem('ruins_game_storage',JSON.stringify(d));}catch(e){} }
    function addToStorage(id,count=1){
      const s=getStorage(); const ex=s.items.find(i=>i.id===id);
      if(ex) ex.count=(ex.count||1)+count;
      else{ const def=ALL_ITEMS[id]; s.items.push({id,name:def?.name||id,type:def?.type||'misc',icon:def?.icon||'📦',count,damage:def?.damage,range:def?.range,cooldown:def?.cooldown,ammoType:def?.ammoType,healAmount:def?.healAmount,speedBoost:def?.speedBoost,boostDuration:def?.boostDuration,armorBonus:def?.armorBonus,ammoFor:def?.ammoFor,spread:def?.spread}); }
      saveStorage(s);
    }
    function removeFromStorage(id,count=1){
      const s=getStorage(); const idx=s.items.findIndex(i=>i.id===id);
      if(idx>=0){ s.items[idx].count=(s.items[idx].count||1)-count; if(s.items[idx].count<=0)s.items.splice(idx,1); saveStorage(s); }
    }

    function createGrassTexture(w=512,h=512){
      const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');
      const grad=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w*0.7); grad.addColorStop(0,'#6b9e3a'); grad.addColorStop(0.5,'#55822b'); grad.addColorStop(1,'#3f6b1e');
      ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
      const img=ctx.getImageData(0,0,w,h);const d=img.data;

    function checkBuildingCollision(px,pz,radius=0.45){

    function getInteractTarget(){
      const raycaster=new THREE.Raycaster(); raycaster.set(camera.position,camera.getWorldDirection(new THREE.Vector3())); raycaster.far=5;
      const targets=[];
      for(const b of mapBuildings) if(b.userData.innerChests) for(const c of b.userData.innerChests) if(!c.userData.searched) targets.push(c);
      for(const i of mapItems) if(!i.userData.pickedUp) targets.push(i);
      for(const c of mapChests) if(!c.userData.searched) targets.push(c);
      if(mapHelicopter) targets.push(mapHelicopter);
      for(const c of mapCrystals) if(!c.userData.collected) targets.push(c);
      const hits=raycaster.intersectObjects(targets,true);
      if(hits.length>0){ let obj=hits[0].object; while(obj){ if(obj.userData&&(obj.userData.isChest||obj.userData.isItem||obj.userData.isCrystal||obj.userData.isChestDrop||obj.userData.isHelicopter)) return obj; obj=obj.parent; } }
      return null;
    }

    // ---- 攻击逻辑（提取为函数） ----
    function performAttack() {
      if(!playerMainHand||attackCooldown>0)return;
      const item=playerMainHand; attackCooldown=item.cooldown||0.4;
      if(item.type==='melee'){
        const forward=camera.getWorldDirection(new THREE.Vector3()).normalize();
        for(const bot of mapBots){
          if(!bot.userData.alive)continue;
          const toBot=bot.position.clone().sub(camera.position); const dist=toBot.length();
          if(dist>item.range+0.8)continue; toBot.normalize(); const dot=forward.dot(toBot);
          if(dot>0.3&&dist<item.range+0.8){
            bot.userData.hp-=item.damage;
            bot.userData.knockback={dir:forward.clone(),speed:6+Math.random()*4};
            if(bot.userData.hp<=0) killBot(bot);
          }
        }
        showHitEffect();
      }else if(item.type==='ranged'){
        const ammoType=item.ammoType; const ammoIdx=playerInventory.findIndex(i=>i.id===ammoType&&i.type==='ammo');
        if(ammoIdx<0){ showFloatingText('没有弹药！','#ff6666'); attackCooldown=0; return; }
        playerInventory[ammoIdx].count--; if(playerInventory[ammoIdx].count<=0)playerInventory.splice(ammoIdx,1);
        const raycaster=new THREE.Raycaster(); raycaster.set(camera.position,camera.getWorldDirection(new THREE.Vector3())); raycaster.far=item.range;
        const botMeshes=mapBots.filter(b=>b.userData.alive).map(b=>b.children[0]||b);
        const hits=raycaster.intersectObjects(botMeshes,true);
        if(hits.length>0){ let hitBot=null; let obj=hits[0].object; while(obj&&!hitBot){ const pb=mapBots.find(b=>b===obj||b.children.includes(obj)); if(pb&&pb.userData.alive)hitBot=pb; obj=obj.parent; } if(hitBot){ hitBot.userData.hp-=item.damage; if(hitBot.userData.hp<=0)killBot(hitBot); } }
        if(item.spread){ for(let s=0;s<5;s++){ const sd=camera.getWorldDirection(new THREE.Vector3()).clone(); sd.x+=(Math.random()-0.5)*0.25; sd.y+=(Math.random()-0.5)*0.25; sd.z+=(Math.random()-0.5)*0.25; sd.normalize(); const sr=new THREE.Raycaster(); sr.set(camera.position,sd); sr.far=item.range; const si=sr.intersectObjects(botMeshes,true); if(si.length>0){ let hb=null; let o=si[0].object; while(o&&!hb){ const pb=mapBots.find(b=>b===o||b.children.includes(o)); if(pb&&pb.userData.alive)hb=pb; o=o.parent; } if(hb){ hb.userData.hp-=Math.floor(item.damage*0.4); if(hb.userData.hp<=0)killBot(hb); } } } }
        showMuzzleFlash();
      }
      updateHUD(); updateInventoryUI();
    }

      if(selectedMap==='crystal'&&bot.userData.crystals>0){ const cx=bot.position.x+(Math.random()-0.5)*3,cz=bot.position.z+(Math.random()-0.5)*3; const c=spawnCrystal(cx,cz); crystalGroup.add(c); mapCrystals.push(c); c.userData.bonusCrystals=bot.userData.crystals; bot.userData.crystals=0; }
      updateHUD();
    }

    function interact(){
      if(interactCooldown>0)return; interactCooldown=0.3;
      const target=getInteractTarget(); if(!target)return;
      if(target.userData?.isChest&&!target.userData.searched){ target.userData.searched=true; const loot=target.userData.items||generateChestLoot(); for(const it of loot) addItemToInventory(it); if(target.material?.color)target.material.color.set('#555'); showFloatingText('获得物品！','#ffcc00'); }
      else if(target.userData?.isChestDrop&&!target.userData.searched){ target.userData.searched=true; const loot=target.userData.items||generateChestLoot(); for(const it of loot) addItemToInventory(it); target.children[0].material.color.set('#555'); showFloatingText('获得物品！','#ffcc00'); }
      else if(target.userData?.isItem&&!target.userData.pickedUp){ target.userData.pickedUp=true; target.visible=false; addItemToInventory(target.userData.itemDef); showFloatingText('拾取: '+target.userData.itemDef.name,'#aaffaa'); }
      else if(target.userData?.isCrystal&&!target.userData.collected){ target.userData.collected=true; target.visible=false; playerCrystals+=target.userData.bonusCrystals||1; showFloatingText('获得水晶 x'+(target.userData.bonusCrystals||1)+'！','#7ec8f8'); }
      else if(target.userData?.isHelicopter) endGame('win_helicopter');
      updateHUD(); updateInventoryUI(); updateCrystalBarUI();
    }
    function addItemToInventory(itemDef){
      if(itemDef.type==='ammo'){ const ex=playerInventory.find(i=>i.id===itemDef.id&&i.type==='ammo'); if(ex){ex.count+=(itemDef.count||1);return;} }
      if(itemDef.type==='supply'){ const ex=playerInventory.find(i=>i.id===itemDef.id&&i.type==='supply'); if(ex){ex.count=(ex.count||1)+(itemDef.count||1);return;} }
      playerInventory.push({...itemDef,count:itemDef.count||1});
    }
    function useSupply(item){
      if(item.healAmount){ playerHP=Math.min(playerMaxHP,playerHP+item.healAmount); showFloatingText('生命恢复 +'+item.healAmount,'#50d870'); }
      if(item.speedBoost){ playerSpeedBoost=item.speedBoost; playerSpeedBoostTimer=item.boostDuration||15; showFloatingText('速度提升！','#f0a030'); }
      if(item.armorBonus){ playerMaxHP+=item.armorBonus; playerHP=Math.min(playerMaxHP,playerHP+item.armorBonus); showFloatingText('护甲 +'+item.armorBonus,'#aaaaff'); }
      item.count=(item.count||1)-1; if(item.count<=0){ const idx=playerInventory.indexOf(item); if(idx>=0)playerInventory.splice(idx,1); }
      updateHUD(); updateInventoryUI();
    }

    function endGame(reason){
      if(gameEnded)return; gameEnded=true; gameState=GAME_STATES.ENDED;
      if(gameTimerInterval)clearInterval(gameTimerInterval);
      // [修改] 不再使用 controls.unlock()
      const isWin = reason.startsWith('win');
      if(isWin){
        for(const item of playerInventory) addToStorage(item.id,item.count||1);
        if(playerMainHand) addToStorage(playerMainHand.id,1);
      } else {
        const toSave = playerInventory.filter(i=>!i.fromStorage);
        for(const item of toSave) addToStorage(item.id,item.count||1);
        if(playerMainHand && !playerMainHand.fromStorage) addToStorage(playerMainHand.id,1);
      }
      let msg=''; if(reason==='win_helicopter') msg='🚁 你成功登上了直升机！胜利！'; else if(reason==='win_crystal') msg='🏆 你持有最多水晶！胜利！'; else if(reason==='lose_crystal') msg='😞 水晶数量不足，失败……携带物品已丢失'; else if(reason==='died') msg='💀 你被击败了……携带物品已丢失';
      showFloatingText(msg,'#ffdd00'); setTimeout(()=>{alert(msg+'\n物品已保存到仓库。');resetToMenu();},600);
    }
    function resetToMenu(){
      gameState=GAME_STATES.MENU; gameEnded=false; if(gameTimerInterval)clearInterval(gameTimerInterval); gameTimerInterval=null;
      // [修改] 不再使用 controls.unlock()
      hud.classList.remove('active'); mobileControls.classList.remove('active'); inventoryPanel.classList.remove('active'); mainMenu.style.display='flex';
      desktopAttackBtn.classList.remove('visible');
      playerHP=playerMaxHP; playerInventory=[]; playerMainHand=null; playerCrystals=0; playerSpeedBoost=0; playerSpeedBoostTimer=0; gameTime=180;
      mapBuildings=[]; mapBots=[]; mapItems=[]; mapCrystals=[]; mapHelicopter=null; mapChests=[]; bullets.length=0;
      buildingGroup.clear(); botGroup.clear(); itemGroup.clear(); crystalGroup.clear(); chestGroup.clear(); helicopterGroup.clear(); bulletGroup.clear();
      camera.position.set(0,1.7,0); camera.lookAt(0,1.7,-10); camera.rotation.set(0,0,0); updateHUD(); updateInventoryUI(); modalContainer.innerHTML='';
      mouseLook = false; lookTouchId = null;

    function startGame(){

    function createBullet(origin,dir,speed=25){
      const geo=new THREE.SphereGeometry(0.15,4,4); const mat=new THREE.MeshBasicMaterial({color:'#ffaa00'});
      const mesh=new THREE.Mesh(geo,mat); mesh.position.copy(origin); bulletGroup.add(mesh);
      return {mesh,dir:dir.clone().normalize(),speed,life:1.5};
    }

    const botHealthBars=new Map();
    function updateBotHealthBar(bot){
      if(!bot.userData.alive)return; const id=bot.uuid; let bar=botHealthBars.get(id);
      if(!bar){ bar=document.createElement('div'); bar.className='bot-healthbar'; bar.innerHTML='<div class="fill"></div>'; document.body.appendChild(bar); botHealthBars.set(id,bar); }
      const pos=bot.position.clone(); pos.y+=2.2; const screenPos=pos.clone().project(camera);
      const x=(screenPos.x*0.5+0.5)*window.innerWidth, y=(-screenPos.y*0.5+0.5)*window.innerHeight;

    const clock=new THREE.Clock(); let lastCrystalBarUpdate=0;
    function gameLoop(delta){
      if(gameState!==GAME_STATES.PLAYING)return;
      const dt=Math.min(delta,0.2);
      if(attackCooldown>0)attackCooldown-=dt; if(interactCooldown>0)interactCooldown-=dt;
      if(playerSpeedBoostTimer>0){ playerSpeedBoostTimer-=dt; if(playerSpeedBoostTimer<=0)playerSpeedBoost=0; }
      const currentSpeed=playerSpeed+playerSpeedBoost;
      const moveDir=new THREE.Vector3();
      if(keys.w)moveDir.z-=1; if(keys.s)moveDir.z+=1; if(keys.a)moveDir.x-=1; if(keys.d)moveDir.x+=1;
      if(joystickActive){ moveDir.x+=joystickDir.x; moveDir.z-=joystickDir.y; }
      if(moveDir.length()>0){
        moveDir.normalize(); const forward=new THREE.Vector3(); camera.getWorldDirection(forward); forward.y=0; forward.normalize();
        const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();
        const moveVec=forward.clone().multiplyScalar(-moveDir.z).add(right.clone().multiplyScalar(moveDir.x)).normalize().multiplyScalar(currentSpeed*dt);
        const newX=camera.position.x+moveVec.x, newZ=camera.position.z+moveVec.z;
        if(!checkBuildingCollision(newX,newZ,0.5)){ camera.position.x=newX; camera.position.z=newZ; }
        else{ if(!checkBuildingCollision(newX,camera.position.z,0.5))camera.position.x=newX; if(!checkBuildingCollision(camera.position.x,newZ,0.5))camera.position.z=newZ; }
        camera.position.y=1.7;
      }
      camera.rotation.z=0;

      // ---- 人机更新 ----
      const playerPos = camera.position.clone();
      for(const bot of mapBots){
        if(!bot.userData.alive)continue; const bd=bot.userData; bd.attackCooldown-=dt; bd.wanderTimer-=dt;
        const botPos = bot.position.clone();
        const distToPlayer = botPos.distanceTo(playerPos);

        // [修改3] 人机攻击逻辑：优先级最高，只要进入半径5立即追击攻击
        if (distToPlayer < 5.0) {
          // 最高优先级：追击玩家
          bd.chaseTarget = playerPos.clone();
          bd.wanderTimer = 10; // 保持追击状态，防止切换到其他状态
          // 如果距离小于攻击范围，直接攻击
          if (distToPlayer < bd.attackRange && bd.attackCooldown <= 0 && playerHP > 0) {
            bd.attackCooldown = 1.2 + Math.random() * 1.5;
            if (bd.weaponType === 'ranged') {
              const origin = botPos.clone().add(new THREE.Vector3(0, 1.2, 0));
              const dir = playerPos.clone().add(new THREE.Vector3(0, 1.2, 0)).sub(origin).normalize();
              const bullet = createBullet(origin, dir, distToPlayer / 1.0);
              bullets.push({...bullet, targetPos: playerPos.clone(), damage: 5});
            } else {
              playerHP -= 8 + Math.random() * 6;
              updateHUD();
              if (playerHP <= 0) {
                playerHP = 0; updateHUD();
                if (selectedMap === 'crystal') { playerRespawnTimer = 2; showFloatingText('被击倒！即将复活...','#ff4444'); }
                else endGame('died');
              }
            }
          }
          // 追击移动（向玩家靠近）
          const dirToPlayer = playerPos.clone().sub(botPos).normalize();
          const newPos = botPos.clone().add(dirToPlayer.clone().multiplyScalar(bd.speed * dt * 1.1));
          if (!checkBuildingCollision(newPos.x, newPos.z, 0.5)) bot.position.copy(newPos);
          else {
            const side = new THREE.Vector3(-dirToPlayer.z, 0, dirToPlayer.x).multiplyScalar(bd.speed * dt * 0.7);
            const alt = botPos.clone().add(side);
            if (!checkBuildingCollision(alt.x, alt.z, 0.5)) bot.position.copy(alt);
          }
          bot.position.y = 0;
          continue; // 跳过其他行为
        }

        // ---- 以下为原有逻辑（追击水晶 / 漫游） ----
        if(bd.knockback){ const kb=bd.knockback; const move=kb.dir.clone().multiplyScalar(kb.speed*dt); const nx=bot.position.x+move.x,nz=bot.position.z+move.z; if(!checkBuildingCollision(nx,nz,0.5)){bot.position.x=nx;bot.position.z=nz;} kb.speed*=0.85; if(kb.speed<0.5)bd.knockback=null; }
        if(selectedMap==='crystal'){
          let nearestCrystal=null,nearestDist=20;
          for(const c of mapCrystals){ if(c.userData.collected)continue; const d=botPos.distanceTo(c.position); if(d<nearestDist){nearestDist=d;nearestCrystal=c;} }
          if(nearestCrystal){ bd.chaseTarget=nearestCrystal.position.clone(); bd.wanderTimer=0.5; }
        }
        if(bd.chaseTarget&&bd.wanderTimer>0){
          const dir=bd.chaseTarget.clone().sub(botPos).normalize(); const newPos=botPos.clone().add(dir.clone().multiplyScalar(bd.speed*dt));
          if(!checkBuildingCollision(newPos.x,newPos.z,0.5))bot.position.copy(newPos); else{ const side=new THREE.Vector3(-dir.z,0,dir.x).multiplyScalar(bd.speed*dt*0.7); const alt=botPos.clone().add(side); if(!checkBuildingCollision(alt.x,alt.z,0.5))bot.position.copy(alt); }
          bot.position.y=0;
          if(bd.chaseTarget&&bot.position.distanceTo(bd.chaseTarget)<1.5&&selectedMap==='crystal'){
            for(const c of mapCrystals){ if(!c.userData.collected&&c.position.distanceTo(bot.position)<2){ c.userData.collected=true; c.visible=false; bd.crystals+=c.userData.bonusCrystals||1; bd.chaseTarget=null; bd.wanderTimer=0; updateCrystalBarUI(); break; } }
          }
        }else if(bd.wanderTimer<=0){ bd.wanderTarget=new THREE.Vector3(botPos.x+(Math.random()-0.5)*25,0,botPos.z+(Math.random()-0.5)*25); bd.wanderTimer=3+Math.random()*6; bd.chaseTarget=null; }
        if(!bd.chaseTarget&&bd.wanderTimer>0){ const wdir=bd.wanderTarget.clone().sub(botPos).normalize(); const wpos=botPos.clone().add(wdir.multiplyScalar(bd.speed*dt*0.6)); if(!checkBuildingCollision(wpos.x,wpos.z,0.5))bot.position.copy(wpos); bot.position.y=0; }

        // 普通攻击（非追击状态，但仍在攻击范围内）
        if(distToPlayer<bd.attackRange&&bd.attackCooldown<=0&&playerHP>0&&!bd.knockback){
          bd.attackCooldown=1.2+Math.random()*1.5;
          if(bd.weaponType==='ranged'){
            const origin=botPos.clone().add(new THREE.Vector3(0,1.2,0));
            const dir=playerPos.clone().add(new THREE.Vector3(0,1.2,0)).sub(origin).normalize();
            const bullet=createBullet(origin,dir,distToPlayer/1.0);
            bullets.push({...bullet,targetPos:playerPos.clone(),damage:5});
          }else{
            playerHP-=5; updateHUD(); if(playerHP<=0){ playerHP=0; updateHUD(); if(selectedMap==='crystal'){ playerRespawnTimer=2; showFloatingText('被击倒！即将复活...','#ff4444'); }else endGame('died'); }
          }
        }
      }

      // 子弹更新
      for(let i=bullets.length-1;i>=0;i--){
        const b=bullets[i]; b.mesh.position.add(b.dir.clone().multiplyScalar(b.speed*dt)); b.life-=dt;
        if(b.life<=0||b.mesh.position.distanceTo(camera.position)<1.2){ playerHP-=b.damage; bulletGroup.remove(b.mesh); bullets.splice(i,1); updateHUD(); if(playerHP<=0){ playerHP=0; updateHUD(); if(selectedMap==='crystal'){ playerRespawnTimer=2; }else endGame('died'); } }
        else if(b.mesh.position.length()>120){ bulletGroup.remove(b.mesh); bullets.splice(i,1); }
      }

      if(playerRespawnTimer>0){ playerRespawnTimer-=dt; if(playerRespawnTimer<=0&&selectedMap==='crystal') respawnPlayer(); }
      if(selectedMap==='crystal'){ for(const c of mapCrystals){ if(c.userData.collected)continue; if(c.position.distanceTo(camera.position)<2){ c.userData.collected=true; c.visible=false; playerCrystals+=c.userData.bonusCrystals||1; updateCrystalBarUI(); } } }
      if(mapHelicopter?.userData.isHelicopter&&mapHelicopter.position.distanceTo(camera.position)<6&&selectedMap==='ruins') endGame('win_helicopter');
      if(mapHelicopter?.userData.rotorMesh) mapHelicopter.userData.rotorMesh.rotation.y+=dt*12;
      lastCrystalBarUpdate+=dt; if(lastCrystalBarUpdate>2&&selectedMap==='crystal'){lastCrystalBarUpdate=0;updateCrystalBarUI();}
      mapCrystals=mapCrystals.filter(c=>!c.userData.collected||c.visible); mapItems=mapItems.filter(i=>!i.userData.pickedUp||i.visible);
      for(const bot of mapBots){ if(bot.userData.alive) updateBotHealthBar(bot); else removeBotHealthBar(bot); }
      const target=getInteractTarget(); crosshair.classList.toggle('active',!!target);
      updateHUD();
    }

    const keys={w:false,a:false,s:false,d:false,e:false,tab:false}; let joystickActive=false,joystickDir={x:0,y:0},joystickTouchId=null;
    document.addEventListener('keydown',(e)=>{
      if(gameState!==GAME_STATES.PLAYING)return;
      switch(e.key.toLowerCase()){
        case'w':keys.w=true;break; case'a':keys.a=true;break; case's':keys.s=true;break; case'd':keys.d=true;break;
        case'e':keys.e=true;interact();break;
        case'tab':e.preventDefault();toggleInventory();break;
        case' ':e.preventDefault();performAttack();break;
      }
    });
    document.addEventListener('keyup',(e)=>{
      switch(e.key.toLowerCase()){
        case'w':keys.w=false;break; case'a':keys.a=false;break; case's':keys.s=false;break; case'd':keys.d=false;break;
        case'e':keys.e=false;break;
      }
    });

    // [修改4] 移除 pointerLockElement 检测，改用自定义鼠标拖拽视角
    // 攻击由 performAttack() 统一处理，空格键 + 按钮触发

    // ---- 移动端摇杆 ----
    joystickZone.addEventListener('touchstart',(e)=>{ e.preventDefault(); if(joystickTouchId===null&&e.changedTouches.length>0){ joystickTouchId=e.changedTouches[0].identifier; joystickActive=true; updateJoystick(e.changedTouches[0]); } },{passive:false});
    joystickZone.addEventListener('touchmove',(e)=>{ e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier===joystickTouchId)updateJoystick(t); } },{passive:false});
    joystickZone.addEventListener('touchend',(e)=>{ for(const t of e.changedTouches){ if(t.identifier===joystickTouchId){ joystickTouchId=null; joystickActive=false; joystickDir={x:0,y:0}; joystickThumb.style.transform='translate(-50%,-50%)'; } } });
    function updateJoystick(touch){ const rect=joystickZone.getBoundingClientRect(); const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2; const maxR=rect.width/2-20; let dx=touch.clientX-cx,dy=touch.clientY-cy; const dist=Math.sqrt(dx*dx+dy*dy); if(dist>maxR){dx*=maxR/dist;dy*=maxR/dist;} joystickThumb.style.transform=`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; joystickDir={x:dx/maxR,y:-dy/maxR}; }

    document.getElementById('btnInteractMob').addEventListener('pointerdown',(e)=>{e.preventDefault();if(gameState===GAME_STATES.PLAYING)interact();});
    document.getElementById('btnAttackMob').addEventListener('pointerdown',(e)=>{e.preventDefault();if(gameState===GAME_STATES.PLAYING)performAttack();});
    document.getElementById('btnBagMob').addEventListener('pointerdown',(e)=>{e.preventDefault();if(gameState===GAME_STATES.PLAYING)toggleInventory();});
    desktopAttackBtn.addEventListener('click',()=>{ if(gameState===GAME_STATES.PLAYING) performAttack(); });

    // ---- 视角控制（类似第二个文件） ----
    // 桌面端：鼠标拖拽
    canvas.addEventListener('mousedown', (e) => {
      if (gameState !== GAME_STATES.PLAYING) return;
      if (e.button === 0) {
        // 检查是否点击在UI按钮上
        const target = e.target;
        if (target.closest && (target.closest('.mobile-action-btn') || target.closest('#desktopAttackBtn') || target.closest('.menu-btn') || target.closest('#inventoryPanel'))) return;
        mouseLook = true;
        lookLastX = e.clientX;
        lookLastY = e.clientY;
        e.preventDefault();
      }
    });
    document.addEventListener('mousemove', (e) => {
      if (!mouseLook || gameState !== GAME_STATES.PLAYING) return;
      const dx = e.clientX - lookLastX;
      const dy = e.clientY - lookLastY;
      camera.rotation.y -= dx * SENSITIVITY;
      camera.rotation.x -= dy * SENSITIVITY;
      camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
      lookLastX = e.clientX;
      lookLastY = e.clientY;
    });
    document.addEventListener('mouseup', () => { mouseLook = false; });

    // 移动端：触摸滑动（右侧区域）
    document.addEventListener('touchstart', (e) => {
      if (gameState !== GAME_STATES.PLAYING) return;
      for (const t of e.changedTouches) {
        // 检查是否触摸在摇杆或按钮上
        const el = document.elementFromPoint(t.clientX, t.clientY);
        if (el && (el.closest('#joystickZone') || el.closest('.mobile-action-btn') || el.closest('#desktopAttackBtn'))) continue;
        if (lookTouchId === null) {
          lookTouchId = t.identifier;
          lookLastX = t.clientX;
          lookLastY = t.clientY;
        }
      }
    }, {passive: true});
    document.addEventListener('touchmove', (e) => {
      if (gameState !== GAME_STATES.PLAYING || lookTouchId === null) return;
      for (const t of e.changedTouches) {
        if (t.identifier === lookTouchId) {
          const dx = t.clientX - lookLastX;
          const dy = t.clientY - lookLastY;
          camera.rotation.y -= dx * SENSITIVITY;
          camera.rotation.x -= dy * SENSITIVITY;
          camera.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, camera.rotation.x));
          lookLastX = t.clientX;
          lookLastY = t.clientY;
          break;
        }
      }
    }, {passive: true});
    document.addEventListener('touchend', (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === lookTouchId) { lookTouchId = null; break; }
      }
    });

    function showStorageModal(){ const s=getStorage(); let h=''; if(s.items.length===0)h='<div style="color:#777;text-align:center;padding:20px;">仓库空空如也</div>'; else{ h='<div class="item-grid">'; for(const i of s.items)h+=`<div class="item-slot"><span class="icon">${i.icon||'📦'}</span><span class="name">${i.name} x${i.count||1}</span></div>`; h+='</div>'; } modalContainer.innerHTML=`<div class="modal-overlay" id="storageModalOverlay"><div class="modal"><button class="close-btn" id="closeStorageModal">✕</button><h2>📦 仓库</h2>${h}<button class="menu-btn" id="closeStorageBtn">关闭</button></div></div>`; const close=()=>{modalContainer.innerHTML='';}; document.getElementById('closeStorageModal').addEventListener('click',close); document.getElementById('closeStorageBtn').addEventListener('click',close); document.getElementById('storageModalOverlay').addEventListener('click',(e)=>{if(e.target.id==='storageModalOverlay')close();}); }

    function showStartModal(){
      const storage=getStorage(); selectedMap='ruins'; selectedCarryItems=[];
      let storageHtml=''; if(storage.items.length===0) storageHtml='<div style="color:#777;text-align:center;padding:8px;">仓库为空</div>';
      else{ storageHtml='<div class="item-grid" id="storageItemGrid">'; for(let i=0;i<storage.items.length;i++){ const it=storage.items[i]; storageHtml+=`<div class="item-slot" data-storage-idx="${i}"><span class="icon">${it.icon||'📦'}</span><span class="name">${it.name} x${it.count||1}</span></div>`; } storageHtml+='</div>'; }
      modalContainer.innerHTML=`
        <div class="modal-overlay" id="startModalOverlay">
          <div class="modal" style="max-height:90vh;">
            <button class="close-btn" id="closeStartModal">✕</button>
            <h2>🚀 准备出发</h2>
            <div class="start-columns">
              <div class="start-left">
                <h3>🗺️ 选择地图</h3>
                <div class="map-option">
                  <div class="map-card ${selectedMap==='ruins'?'selected':''}" id="mapCardRuins"><span class="map-icon">🏚️</span><b>废墟突围</b></div>
                  <div class="map-card ${selectedMap==='crystal'?'selected':''}" id="mapCardCrystal"><span class="map-icon">💎</span><b>水晶争夺战</b></div>
                </div>
                <h3>🎒 已选物品 (<span id="carryCount">0</span>/6)</h3>
                <div class="carry-preview-grid" id="carryPreview"></div>
              </div>
              <div class="start-right">
                <h3>📦 仓库物品 (点击选择)</h3>
                ${storageHtml}
              </div>
            </div>
            <div class="btn-row">
              <button class="menu-btn" id="btnConfirmStart">✅ 出发！</button>
              <button class="menu-btn" id="btnCancelStart">取消</button>
            </div>
          </div>
        </div>`;
      const close=()=>{modalContainer.innerHTML='';}; document.getElementById('closeStartModal').addEventListener('click',close); document.getElementById('btnCancelStart').addEventListener('click',close);
      document.getElementById('mapCardRuins').addEventListener('click',()=>{selectedMap='ruins';document.getElementById('mapCardRuins').classList.add('selected');document.getElementById('mapCardCrystal').classList.remove('selected');});
      document.getElementById('mapCardCrystal').addEventListener('click',()=>{selectedMap='crystal';document.getElementById('mapCardCrystal').classList.add('selected');document.getElementById('mapCardRuins').classList.remove('selected');});
      const updateCarryUI=()=>{ const prev=document.getElementById('carryPreview'); const cnt=document.getElementById('carryCount'); if(prev)prev.innerHTML=selectedCarryItems.map(i=>`<div class="item-slot selected" style="min-height:44px;"><span class="icon">${i.icon||'📦'}</span><span class="name">${i.name}</span></div>`).join(''); if(cnt)cnt.textContent=selectedCarryItems.length; };
      const grid=document.getElementById('storageItemGrid'); if(grid){ grid.addEventListener('click',(e)=>{ const slot=e.target.closest('.item-slot'); if(!slot||!slot.dataset.storageIdx)return; const idx=parseInt(slot.dataset.storageIdx); const item=storage.items[idx]; if(!item)return; const already=selectedCarryItems.findIndex(i=>i._storageIdx===idx); if(already>=0){selectedCarryItems.splice(already,1);slot.classList.remove('selected');}else if(selectedCarryItems.length<6){selectedCarryItems.push({...item,_storageIdx:idx,count:1});slot.classList.add('selected');} updateCarryUI(); }); }
      document.getElementById('btnConfirmStart').addEventListener('click',()=>{ for(const it of selectedCarryItems) removeFromStorage(it.id,1); selectedCarryItems=selectedCarryItems.map(({_storageIdx,...rest})=>rest); modalContainer.innerHTML=''; startGame(); });
    }

    window.addEventListener('resize',()=>{ renderer.setSize(window.innerWidth,window.innerHeight); camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); });
    function animate(){ requestAnimationFrame(animate); const delta=clock.getDelta(); if(gameState===GAME_STATES.PLAYING)gameLoop(delta); renderer.render(scene,camera); }
    function init(){
      mobileControls.classList.toggle('active',false); hud.classList.remove('active'); inventoryPanel.classList.remove('active');
      mainMenu.style.display='flex'; desktopAttackBtn.classList.remove('visible');
      updateHUD(); updateInventoryUI(); requestAnimationFrame(animate);
    }
    // [修改] 移除 canvas 点击锁定逻辑
    init();
  </script>
</body>
</html>
